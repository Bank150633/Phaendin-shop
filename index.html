<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | SHOPPING ONLINE</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 50px; padding-bottom: 60px; transition: 0.3s; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 12px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .logo-txt { color: var(--gold); font-weight: 600; font-size: 16px; letter-spacing: 1px; }

        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 15px auto 5px; padding: 0 12px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 10px 10px 10px 38px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 13px; outline: none; }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 14px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 32px; height: 32px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }

        /* Banner Style */
        .banner-box { padding: 10px; } 
        .bn-card { border: 2px solid var(--gold); border-radius: 20px; overflow: hidden; height: 210px; background: #000; position: relative; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 15px; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); }
        .bn-title { font-size: 18px; font-weight: 600; color: var(--gold); margin-bottom: 5px; text-shadow: 2px 2px 4px #000; }
        .bn-timer-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .bn-timer { display: flex; gap: 4px; }
        .timer-unit { background: #ff4b2b; color: #fff; padding: 3px 6px; border-radius: 5px; font-weight: bold; font-size: 12px; min-width: 28px; text-align: center; }
        
        /* Grid & Cards */
        .sec-title { padding: 15px 12px 5px; font-size: 14px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; overflow: hidden; cursor: pointer; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-container { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
        .badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #fff; text-transform: uppercase; }
        .bg-gold { background: var(--gold-grad); color: #000; }
        .bg-red { background: var(--red-grad); }

        .info { padding: 8px; flex-grow: 1; display: flex; flex-direction: column; gap: 3px; }
        .p-name { font-size: 12px; font-weight: 500; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-desc { font-size: 10px; color: var(--text-dim); line-height: 1.2; height: 24px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-size: 14px; font-weight: 700; margin-top: auto; display: flex; align-items: center; gap: 5px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 10px; }
        .new-price { color: #ff4b2b; }

        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 10px 0; font-weight: 700; font-size: 12px; cursor: pointer; text-transform: uppercase; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 350px; padding: 15px; max-height: 90vh; overflow-y: auto; }
        
        .opt-sel { width: 100%; padding: 8px; margin: 5px 0 12px; border-radius: 8px; background: #1a1a1a; color: var(--gold); border: 1px solid var(--gold); font-size: 12px; outline: none; }
        .input-slim { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 12px; outline: none; }

        .stepper-wrap { display: flex; align-items: center; justify-content: space-between; background: rgba(212,175,55,0.1); padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }
        .step-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }

        nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 18px; margin-bottom: 2px; }

        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
        #zoomContent img, #zoomContent video { max-width: 95vw; max-height: 85vh; border-radius: 10px; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo-txt">PHAENDIN STORE</div>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้าที่คุณต้องการ..." oninput="render()">
</div>

<div class="sec-title"><i class="fa-solid fa-fire"></i> สินค้าทั้งหมด</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:10px;">รายการสั่งซื้อ</h4>
        <div id="orderDetail" style="background:rgba(212,175,55,0.1); padding:10px; border-radius:10px; margin-bottom:12px; border:1px solid var(--gold);"></div>
        <form id="orderForm">
            <div id="optionBox"></div>
            
            <div class="stepper-wrap">
                <span style="font-size:12px; color:var(--gold);">จำนวนสินค้า</span>
                <div style="display:flex; align-items:center; gap:15px;">
                    <button type="button" class="step-btn" onclick="updateQty(-1)">-</button>
                    <span id="qtyDisplay" style="font-weight:bold;">1</span>
                    <button type="button" class="step-btn" onclick="updateQty(1)">+</button>
                </div>
            </div>

            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่งโดยละเอียด" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="text-align:center; margin: 10px 0; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;">
                <p style="font-size:11px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2 (แผ่นดิน)</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=0358567622" style="width:100px; margin-top:5px; border-radius:5px;">
            </div>
            
            <div style="border:1px dashed var(--gold); padding:10px; border-radius:10px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:11px; color:var(--gold);">📸 คลิกเพื่อแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:80px; margin:5px auto; border-radius:5px;">
            </div>
            
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:15px; border-radius:10px;">ยืนยันการสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:10px; font-size:12px;">[ กลับไปเลือกสินค้า ]</p>
        </form>
    </div>
</div>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center;">
        <h4 style="color:var(--gold); margin-bottom:15px;">ช่องทางการติดต่อ</h4>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:12px; border-radius:10px; text-decoration:none; margin-bottom:10px;"><i class="fa-solid fa-phone"></i> โทรติดต่อสอบถาม</a>
        <p onclick="closeModal('contactModal')" style="color:var(--text-dim); cursor:pointer; margin-top:10px;">[ ปิดหน้าต่าง ]</p>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;
    let selectedQty = 1;

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">${b[1]}</div>
                            <div class="bn-timer-wrap">
                                <div class="bn-timer">
                                    <span class="timer-unit" id="th">00</span> :
                                    <span class="timer-unit" id="tm">00</span> :
                                    <span class="timer-unit" id="ts">00</span>
                                </div>
                            </div>
                            <button class="buy-now" style="width:120px; border-radius:50px; padding:6px;" onclick="openOrder('${b[1]}','${b[6]||0}','${b[7]||0}','${b[8]||''}', ${b[9]||0}, 10)">สั่งเลย</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            db.sort(() => Math.random() - 0.5); // สุ่มลำดับสินค้า
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        document.getElementById('productGrid').innerHTML = filtered.map((p) => {
            let priceNormal = parseFloat(p[3] || 0);    
            let pricePromo = parseFloat(p[10] || 0);   
            let expiryDate = p[11] ? new Date(p[11]).getTime() : 0;
            let currentPrice = (pricePromo > 0 && expiryDate > Date.now()) ? pricePromo : priceNormal;

            return `
            <div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">
                        ${p[4] && p[4]!=='-' ? `<span class="badge bg-red">${p[4]}</span>` : ''}
                        ${p[5] && p[5]!=='-' ? `<span class="badge bg-gold">${p[5]}</span>` : ''}
                    </div>
                    ${renderMedia(p[1], true)}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-desc">${p[2]||''}</div>
                    <div class="p-price">
                        ${currentPrice < priceNormal ? `<span class="old-price">฿${priceNormal}</span>` : ''}
                        <span class="new-price">฿${currentPrice.toLocaleString()}</span>
                    </div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${currentPrice}','${p[8]||0}','${p[9]||''}', 0, ${p[12]||10})">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    // --- ส่วนแก้ไข: ฟังก์ชันดึงตัวเลือกไซส์/น้ำหนัก ---
    function openOrder(n, pNormal, s, optStr, discPercent, buyLimit) {
        selectedQty = 1; 
        activeP = { name: n, pNormal: parseFloat(pNormal), ship: parseFloat(s), disc: discPercent, optPrice: 0, optLabel: '', limit: buyLimit };
        
        const box = document.getElementById('optionBox');
        box.innerHTML = '';

        if(optStr && optStr !== '-' && optStr.trim() !== '') {
            let html = `<label style="font-size:11px; color:var(--gold);">เลือกตัวเลือก:</label><select id="pOpt" class="opt-sel" onchange="updatePrice()">`;
            let options = optStr.split(',');
            options.forEach(o => {
                let parts = o.includes(':') ? o.split(':') : o.split('=');
                let label = parts[0].trim();
                let price = parts[1] ? parseFloat(parts[1]) : activeP.pNormal;
                html += `<option value="${price}" data-label="${label}">${label} (฿${price.toLocaleString()})</option>`;
            });
            box.innerHTML = html + `</select>`;
        }

        updatePrice();
        openModal('orderModal');
    }

    function updatePrice() {
        const sel = document.getElementById('pOpt');
        let basePrice = activeP.pNormal;
        if(sel) {
            basePrice = parseFloat(sel.value);
            activeP.optLabel = ` (${sel.options[sel.selectedIndex].getAttribute('data-label')})`;
        }
        activeP.total = (basePrice * selectedQty) + activeP.ship;
        
        document.getElementById('orderDetail').innerHTML = `
            <div style="font-size:12px; font-weight:bold; color:var(--gold);">${activeP.name}${activeP.optLabel}</div>
            <div style="font-size:22px; text-align:center; color:#fff; margin:5px 0;">฿${activeP.total.toLocaleString()}</div>
            <p style="font-size:10px; text-align:center; color:var(--text-dim);">สินค้า ฿${basePrice.toLocaleString()} x ${selectedQty} + ค่าส่ง ฿${activeP.ship}</p>
        `;
        document.getElementById('qtyDisplay').innerText = selectedQty;
    }

    function updateQty(v) {
        let n = selectedQty + v;
        if(n >= 1 && n <= activeP.limit) { selectedQty = n; updatePrice(); }
    }

    function renderMedia(url, isMuted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)/i);
        return isVid ? `<video src="${url}" ${isMuted?'autoplay loop muted playsinline':'controls autoplay'}></video>` : `<img src="${url}">`;
    }

    function zoom(url) { document.getElementById('zoomContent').innerHTML = renderMedia(url, false); document.getElementById('zoomOverlay').style.display = 'flex'; }
    function closeZoom() { document.getElementById('zoomOverlay').style.display = 'none'; }
    function openModal(id) { document.getElementById(id).style.display='flex'; setTimeout(()=>document.getElementById(id).classList.add('show'),10); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); setTimeout(()=>document.getElementById(id).style.display='none', 300); }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิปเพื่อยืนยันการโอน!");
        
        btn.innerText = "กำลังบันทึกข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name}${activeP.optLabel} | จำนวน: ${selectedQty} | รวม: ฿${activeP.total}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("ส่งคำสั่งซื้อสำเร็จ! เราจะรีบดำเนินการส่งให้คุณ");
                location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง"); btn.disabled = false; btn.innerText = "ยืนยันการสั่งซื้อ"; }
        };
        reader.readAsDataURL(file);
    };

    async function checkShip() {
        const p = prompt("กรุณากรอกเบอร์โทรศัพท์ที่ใช้สั่งซื้อ:");
        if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const f = rows.find(r => r[0].trim() === p.trim());
        if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nเลขพัสดุ: ${f[3]}`);
        else alert("ไม่พบข้อมูลพัสดุสำหรับเบอร์นี้");
    }

    init();
</script>
</body>
</html>
