<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Phaendin Rental - ระบบเช่าและลงทะเบียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Phaendin Rental</h1>
            <button onclick="toggleForm()" class="bg-orange-500 px-4 py-2 rounded-lg font-bold text-sm hover:bg-orange-600 transition">
                ➕ ลงประกาศเช่า
            </button>
        </div>
    </nav>

    <div id="add-product-form" class="hidden container mx-auto px-4 mt-6">
        <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-orange-400">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">ลงประกาศสินค้าใหม่</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="newOwner" placeholder="👤 ชื่อผู้ประกาศ (ชื่อของคุณ)" class="p-3 border rounded-xl w-full md:col-span-2 border-blue-300 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none mb-2">
                <input type="text" id="newContact" placeholder="📞 เบอร์โทร หรือ Line ID ของคุณ" class="p-3 border rounded-xl w-full md:col-span-2 border-blue-300 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none mb-2">
                <input type="text" id="newName" placeholder="ชื่อสินค้า" class="p-3 border rounded-xl w-full focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="text" id="newCategory" placeholder="หมวดหมู่ (เช่น อุปกรณ์ช่าง, ไอที)" class="p-3 border rounded-xl w-full">
                <input type="number" id="newDeposit" placeholder="ค่าประกัน (บาท)" class="p-3 border rounded-xl w-full">
                <input type="number" id="newPrice" placeholder="ราคาเช่า/วัน (บาท)" class="p-3 border rounded-xl w-full">
                
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-1">📸 ถ่ายรูปสินค้า หรือ เลือกรูปภาพ</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment" 
                           class="p-3 border-2 border-dashed border-blue-300 rounded-xl w-full bg-blue-50">
                </div>
                
                <div class="flex flex-col gap-2 md:col-span-2">
                    <input type="text" id="newLocation" placeholder="พิกัด (ละติจูด, ลองจิจูด)" class="p-3 border rounded-xl w-full bg-gray-50" readonly>
                    <button type="button" onclick="getCurrentLocation()" class="bg-green-600 text-white py-2 rounded-xl font-bold hover:bg-green-700 transition flex items-center justify-center gap-2">
                        📍 กดเพื่อดึงพิกัดที่อยู่ปัจจุบัน
                    </button>
                </div>
            </div>
            <div class="mt-6 flex gap-4">
                <button onclick="submitProduct(event)" id="submitBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-blue-700">ยืนยันลงประกาศ</button>
                <button onclick="toggleForm()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold text-lg hover:bg-gray-300">ยกเลิก</button>
            </div>
        </div>
    </div>

    <header class="bg-white py-8 border-b mt-4">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-3xl font-bold text-gray-800">ค้นหาสินค้าให้เช่า</h2>
            <p class="text-gray-500 mt-2">ประหยัดกว่าซื้อใหม่ แบ่งปันของใช้ในชุมชน</p>
        </div>
    </header>

    <div class="container mx-auto px-4 mt-6 text-center">
        <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="🔍 ค้นหาสินค้าที่ต้องการ..." 
               class="p-3 border rounded-xl w-full md:w-1/2 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div class="container mx-auto px-4 py-8">
        <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-10">
                <p class="text-gray-400 animate-pulse">กำลังดึงข้อมูล...</p>
            </div>
        </div>
    </div>
<script>
    // 1. ตรวจสอบ API_URL: เช็คให้ชัวร์ว่าตรงกับที่ Deploy ล่าสุด
    const API_URL = "https://script.google.com/macros/s/AKfycbwYqJnYJQskv0ANOSPI9uMcMUkeFNYYf44pZ6BpehGvZ1JFdQ9X_jBeMNUVJe9dfAL9Fg/exec";

    function toggleForm() {
        const form = document.getElementById('add-product-form');
        form.classList.toggle('hidden');
    }

    function getCurrentLocation() {
        if (navigator.geolocation) {
            alert("กำลังขอตำแหน่งปัจจุบัน...");
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                // ปรับรูปแบบลิงก์ให้ถูกต้องตามมาตรฐาน Google Maps
                document.getElementById('newLocation').value = `https://www.google.com/maps?q=${lat},${lng}`;
                alert("ปักหมุดสำเร็จ!");
            }, function(error) {
                alert("ดึงพิกัดล้มเหลว: กรุณาเปิด GPS");
            });
        }
    }

    // ฟังก์ชันสำหรับอ่านไฟล์รูปภาพ (แยกออกมาเพื่อไม่ให้โค้ดพันกัน)
    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ฟังก์ชันส่งข้อมูล (แก้ไขใหม่ให้ปุ่มทำงานได้จริง)
    async function submitProduct(event) {
        if (event) event.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const fileInput = document.getElementById('imageInput');
        const file = fileInput.files[0];
        
        // ดึงค่าจากฟอร์ม
        const owner = document.getElementById('newOwner').value.trim();
        const contact = document.getElementById('newContact').value.trim();
        const name = document.getElementById('newName').value.trim();
        const category = document.getElementById('newCategory').value.trim();
        const deposit = document.getElementById('newDeposit').value.trim();
        const price = document.getElementById('newPrice').value.trim();
        const location = document.getElementById('newLocation').value.trim();

        // 1. เช็คความพร้อมของข้อมูล
        if (!owner || !contact || !name || !file) {
            alert("⚠️ กรุณากรอกข้อมูลสำคัญ (ชื่อ, ติดต่อ, สินค้า) และถ่ายรูปด้วยครับ");
            return;
        }

        // 2. เริ่มการทำงานของปุ่ม
        btn.innerText = "⏳ กำลังอัปโหลด...";
        btn.disabled = true;

        try {
            // 3. แปลงรูปภาพเป็น Base64
            const base64Image = await readFileAsDataURL(file);
            
            const data = {
                owner: owner,
                contact: contact,
                name: name,
                category: category,
                deposit: deposit,
                price: price,
                location: location,
                imageFile: base64Image
            };

            // 4. ส่งข้อมูลไป Google Script
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(data)
            });

            // 5. แจ้งผล
            alert("✅ ลงประกาศสำเร็จ!");
            window.location.reload(); 

        } catch (error) {
            console.error("Error:", error);
            alert("❌ เกิดข้อผิดพลาด: " + error.message);
            btn.innerText = "ยืนยันลงประกาศ";
            btn.disabled = false;
        }
    }

    // ดึงข้อมูลมาโชว์ (เหมือนเดิมแต่เพิ่มการจัดการ error)
    async function fetchProducts() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            renderProducts(data);
        } catch (e) {
            console.log("Fetch error:", e);
            document.getElementById('product-container').innerHTML = "<p class='text-gray-400 text-center py-10'>ไม่พบข้อมูลสินค้า</p>";
        }
    }

    function renderProducts(products) {
        const container = document.getElementById('product-container');
        container.innerHTML = ""; 
        if (!products || products.length === 0) {
            container.innerHTML = "<p class='text-gray-400 text-center py-10'>ไม่มีสินค้าในขณะนี้</p>";
            return;
        }
        products.forEach(item => {
            container.innerHTML += `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                    <img src="${item[5] || 'https://via.placeholder.com/400'}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-lg">${item[1]}</h3>
                        <p class="text-blue-600 font-bold text-xl">${item[4]} <span class="text-sm">บาท/วัน</span></p>
                        <p class="text-xs text-gray-500 mt-2">👤 เจ้าของ: ${item[8]}</p>
                    </div>
                </div>`;
        });
    }

    fetchProducts();
</script>
          
</body>
</html>
