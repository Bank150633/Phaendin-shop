<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; }

        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        .badge-blink { animation: blink 1s infinite; box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); }

        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        .banner-container { padding: 0 12px 10px; }
        
        .banner-slide { position: relative; width: 100%; height: 140px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img, .banner-slide video { width: 100%; height: 100%; object-fit: contain; opacity: 1; }
        .banner-text { position: absolute; bottom: 10px; left: 15px; font-size: 14px; font-weight: 600; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; }

        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        main { margin-top: 320px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }

        /* ปรับปรุงสินค้าแนะนำแบบที่ 2 */
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
        .rec-card { min-width: 130px; border-radius: 12px; overflow: hidden; border: 1px solid #333; background: #111; position: relative; cursor: pointer; transition: transform 0.2s; }
        .rec-card:active { transform: scale(0.95); }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { position: absolute; bottom: 8px; right: 8px; background: var(--gold); color: #000; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 50px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); z-index: 5; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; height: 20px; overflow: hidden; margin-bottom: 4px; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
        .description { font-size: 10px; color: #777; height: auto; min-height: 32px; margin-bottom: 10px; line-height: 1.4; display: block; }
        .description a { color: var(--gold); text-decoration: underline; font-weight: 600; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-top: auto; padding-bottom: 10px; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .price-old { color: #555; font-size: 11px; text-decoration: line-through; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; border: none; }

        .float-pay-btn { position: fixed; bottom: 85px; right: 15px; background: var(--green); color: #fff; padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
        .nav-link { color: #777; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; }
        .nav-link.active { color: var(--gold); }
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 10px; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 360px; padding: 15px; text-align: center; max-height: 95vh; display: flex; flex-direction: column; overflow-y: auto; }
        .summary-box { background: #000; padding: 12px; border-radius: 10px; margin: 10px 0; text-align: left; font-size: 14px; }
        .confirm-btn { display: block; background: var(--green); color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 5px; }
        .modal-body img, .modal-body video { max-width: 90%; max-height: 80vh; border-radius: 10px; }
        .opt-select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; background: #222; color: #fff; border: 1px solid #444; font-family: 'Kanit'; font-size: 13px; }
        .qty-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #1a1a1a; padding: 8px 12px; border-radius: 8px; }
        .qty-btn { width: 30px; height: 30px; background: var(--pill); color: var(--gold); border: 1px solid #444; border-radius: 5px; font-weight: bold; }
        .cancel-link { display: inline-block; padding: 10px; color: #777; font-size: 13px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide" id="bannerContent"></div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดข้อมูล...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<a href="javascript:void(0)" onclick="openOrder('แจ้งโอนเงินทั่วไป', 0, 0, '', 99)" class="float-pay-btn">
    <i class="fa-solid fa-receipt"></i> แจ้งโอนเงิน
</a>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-book"></i><span>วิธีสั่งซื้อ</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-truck"></i><span>เช็คพัสดุ</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-headset"></i><span>ติดต่อเรา</span></a>
</nav>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody" class="modal-body"></div></div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold)">สรุปยอดสั่งซื้อ</h3>
        <div id="orderSummary" class="summary-box"></div>
        <a href="#" id="finalOrderBtn" target="_blank" class="confirm-btn">ยืนยันยอดและส่งสลิป</a>
        <span class="cancel-link" onclick="document.getElementById('orderModal').style.display='none'">กลับไปหน้าเลือกสินค้า</span>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], curCat = 'all';
    let currentData = { name: '', basePrice: 0, ship: 0, qty: 1, options: '', maxLimit: 99 };

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    function getMedia(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }

    function openMedia(url) { document.getElementById('modalBody').innerHTML = getMedia(url); document.getElementById('mediaModal').style.display = 'flex'; }

    function openOrder(name, price, ship, options, limit) {
        currentData = { name, basePrice: parseFloat(price)||0, ship: parseFloat(ship)||0, qty: 1, options, maxLimit: parseInt(limit) || 99 };
        updateOrderUI();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function updateOrderUI() {
        let optHTML = "";
        if(currentData.options && currentData.options !== "-") {
            const optArray = currentData.options.split(",");
            optHTML = `<div style="margin-bottom: 12px; text-align:left;"><label style="font-size: 11px; color: var(--gold);">เลือกตัวเลือก:</label>
                <select class="opt-select" id="selectedOpt" onchange="calculateTotal()">
                ${optArray.map(o => { const [n,p] = o.split(":"); const pr = p ? p.trim() : currentData.basePrice; return `<option value="${pr}" data-name="${n.trim()}">${n.trim()} (฿${pr})</option>`; }).join('')}
                </select></div>`;
        }
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align: center; margin-bottom: 15px;">
                <p style="color: #aaa; font-size: 11px; margin-bottom: 5px;">ช่องทางชำระเงิน (PromptPay)</p>
                <b style="color: var(--gold); font-size: 15px;">ธนาคารกสิกรไทย</b><br>
                <b style="font-size: 18px; letter-spacing: 1px;">xxx-x-x6762-x</b><br>
                <p style="font-size: 13px; margin-top: 5px;">ชื่อบัญชี: นาย วัชระ ชันสิน</p>
                <img src="https://i.ibb.co/fVLb9p6B/004999092296200-20260224-144608.jpg" style="width: 140px; height: auto; margin: 15px auto; border-radius: 8px; border: 4px solid #fff; display: block;">
            </div>
            ${optHTML}
            <div class="qty-row"><span>จำนวน:</span><div><button class="qty-btn" onclick="changeQty(-1)">-</button><span id="displayQty" style="margin: 0 15px; font-weight: bold;">1</span><button class="qty-btn" onclick="changeQty(1)">+</button></div></div>
            <div id="totalBox" style="background: #1a1a1a; padding: 10px; border-radius: 8px; border-left: 4px solid var(--gold);"></div>`;
        calculateTotal();
    }

    function changeQty(n) { 
        currentData.qty = Math.max(1, Math.min(currentData.maxLimit, currentData.qty + n)); 
        document.getElementById('displayQty').innerText = currentData.qty; 
        calculateTotal(); 
    }

    function calculateTotal() {
        const optEl = document.getElementById('selectedOpt');
        const pUnit = optEl ? parseFloat(optEl.value) : currentData.basePrice;
        const oName = optEl ? optEl.options[optEl.selectedIndex].getAttribute('data-name') : '';
        const totalP = pUnit * currentData.qty;
        const finalT = totalP + currentData.ship;

        document.getElementById('totalBox').innerHTML = `
            <b style="color: #888; font-size: 11px;">รายการ:</b> <span style="font-size: 13px;">${currentData.name} ${oName}</span><br>
            <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px;"><span>ยอดสินค้า:</span> <span>฿${totalP.toLocaleString()}</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px;"><span>ค่าจัดส่ง:</span> <span>${currentData.ship === 0 ? 'ส่งฟรี' : '฿'+currentData.ship}</span></div>
            <hr style="border:0; border-top:1px solid #333; margin:8px 0;">
            <div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; color: var(--gold);"><span>ยอดรวม:</span> <span>฿${finalT.toLocaleString()}</span></div>`;
        
        const formURL = "https://docs.google.com/forms/d/e/1FAIpQLScbfnx4Vgo4skn8irT-1c6GOG9wWBnWmafEy9kZjZ5eBUrjPw/viewform";
        const entryID = "entry.1525913489";
        const detail = `📦 รายการสั่งซื้อ: ${currentData.name} ${oName}\n🔢 จำนวน: ${currentData.qty} ชิ้น\n💰 ยอดรวมทั้งหมด: ฿${finalT.toLocaleString()}`;
        document.getElementById('finalOrderBtn').href = `${formURL}?usp=pp_url&${entryID}=${encodeURIComponent(detail)}`;
    }

    async function init() {
        try {
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const linesB = textB.split(/\r?\n/).filter(l => l.trim() !== "");
            if(linesB.length > 1) {
                const b = linesB[1].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                if(b[0]) {
                    const bannerDiv = document.getElementById('bannerContent');
                    const isVid = b[0].toLowerCase().match(/\.(mp4|webm|mov)$/);
                    bannerDiv.innerHTML = isVid ? 
                        `<video src="${b[0]}" autoplay loop muted playsinline></video><div class="banner-text">${b[1]||''}</div>` : 
                        `<img src="${b[0]}"><div class="banner-text">${b[1]||''}</div>`;
                }
            }
            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            let raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            const shuffled = shuffle([...raw]);
            dbRec = shuffled.filter(p => p[5] && p[5].includes("แนะนำ")).slice(0, 8);
            dbAll = shuffled.filter(p => !dbRec.some(r => r[0] === p[0]));
            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { document.getElementById('status').innerText = "โหลดข้อมูลไม่สำเร็จ"; console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();
        const itemHTML = (p, isRec = false) => {
            const time = p[7] ? new Date(p[7]).getTime() : 0;
            const expired = time > 0 && time < now;
            const price = (expired && p[4]) ? p[4] : p[3];
            const old = (expired || !p[4]) ? null : p[4];
            const status = p[5] || "";
            const ship = parseFloat(p[8]) || 0;
            const opts = p[9] || "";
            const limit = p[10] || 99;
            
            let promoBadge = "";
            if (status.includes("1แถม1")) {
                promoBadge += `<div class="badge-blink" style="position: absolute; top: 6px; right: 6px; background: #ffea00; color: #000; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; border: 1px solid #000;">1 แถม 1</div>`;
            }
            if (ship === 0) {
                const topPos = status.includes("1แถม1") ? "32px" : "6px"; 
                promoBadge += `<div class="badge-blink" style="position: absolute; top: ${topPos}; right: 6px; background: #28a745; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10;">ส่งฟรี</div>`;
            }

            // แก้ไขส่วนสินค้าแนะนำให้กดได้ทั้งใบและสวยขึ้น
            if(isRec) return `
                <div class="rec-card" onclick="openOrder('${p[0]}','${price}','${ship}','${opts}', '${limit}')">
                    <div class="rec-media">
                        ${promoBadge}
                        ${getMedia(p[1])}
                    </div>
                    <div class="rec-price">฿${price}</div>
                </div>`;
            
            return `<div class="card"><div class="media" onclick="openMedia('${p[1]}')">${time > now ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}${promoBadge}${getMedia(p[1])}</div><div class="info"><div class="title">${p[0]}</div><div class="description">${p[2]||''}</div><div class="price-row"><div class="price">฿${price}</div>${old ? `<div class="price-old">฿${old}</div>` : ''}</div><button class="buy-btn" onclick="openOrder('${p[0]}','${price}','${ship}','${opts}', '${limit}')">สั่งซื้อ</button></div></div>`;
        };

        if(dbRec.length > 0 && q === "") { 
            document.getElementById('rec-area').style.display = 'block'; 
            document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join(''); 
        } else { 
            document.getElementById('rec-area').style.display = 'none'; 
        }
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat));
        document.getElementById('main-list').innerHTML = filt.map(p => itemHTML(p)).join('');
        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const dist = new Date(el.dataset.time).getTime() - now;
            if (dist < 0) { el.remove(); } else {
                const h = Math.floor(dist / 3600000), m = Math.floor((dist % 3600000) / 60000), s = Math.floor((dist % 60000) / 1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    init();
    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
</script>
</body>
</html>
