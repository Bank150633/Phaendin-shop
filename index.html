<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phaendin Rent Pro | แผ่นดินเช่า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-morphism { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .active-push:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-up { animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e6e6e6 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-[#F1F5F9] min-h-screen pb-24 overflow-x-hidden text-slate-900">

    <!-- Auth Screen -->
    <div id="authScreen" class="fixed inset-0 z-[5000] bg-blue-600 flex flex-col items-center justify-center p-8 transition-opacity duration-500">
        <div class="mb-10 text-white text-center">
            <div class="w-24 h-24 bg-white/20 rounded-3xl flex items-center justify-center mx-auto mb-4 backdrop-blur-xl border border-white/30">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <h1 class="text-4xl font-bold tracking-tight mb-2">PHAENDIN</h1>
            <p class="text-blue-100 opacity-90">ระบบเช่าของออนไลน์ที่ง่ายที่สุด</p>
        </div>
        <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-8 shadow-2xl shadow-blue-900/40">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">ระบุชื่อเล่นเพื่อเริ่มต้น</label>
            <input type="text" id="usernameInput" placeholder="พิมพ์ชื่อของคุณ..." class="w-full p-5 bg-slate-50 rounded-2xl mb-6 text-center text-xl font-bold border-2 border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all">
            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-2xl font-bold text-lg active-push shadow-lg shadow-blue-200 transition-all">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- App Header -->
    <header class="sticky top-0 z-[100] glass-morphism border-b border-slate-200 px-4 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <span class="font-bold text-xl tracking-tight">Phaendin Rent</span>
            </div>
            <div id="userDisplay" class="bg-white px-4 py-2 rounded-full text-xs font-bold border border-slate-200 shadow-sm flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span id="userNameText">...</span>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-4xl mx-auto p-4">
        <!-- Search & Filter -->
        <div class="mb-8 space-y-4">
            <div class="relative">
                <input type="text" id="searchBar" oninput="handleSearch()" placeholder="ค้นหาของที่ต้องการ..." class="w-full p-5 pl-14 bg-white rounded-3xl shadow-sm border border-slate-200 outline-none focus:ring-4 focus:ring-blue-500/10 transition-all">
                <svg class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="catList"></div>
        </div>

        <!-- Grid -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-5">
            <!-- Loading Skeletons -->
            <div class="loading-shimmer h-72 rounded-[2rem]"></div>
            <div class="loading-shimmer h-72 rounded-[2rem]"></div>
            <div class="loading-shimmer h-72 rounded-[2rem]"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-slate-400">
            <div class="bg-slate-100 p-8 rounded-full mb-4">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </div>
            <p class="font-semibold text-lg">ไม่พบรายการที่คุณค้นหา</p>
            <button onclick="resetFilters()" class="text-blue-600 font-bold mt-2 hover:underline">แสดงรายการทั้งหมด</button>
        </div>
    </main>

    <!-- FAB -->
    <button onclick="toggleAddModal(true)" class="fixed bottom-8 right-8 w-16 h-16 bg-blue-600 text-white rounded-[1.5rem] shadow-2xl shadow-blue-500/40 flex items-center justify-center active-push z-[500] ring-4 ring-white">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Modal -->
    <div id="modalOverlay" class="fixed inset-0 z-[6000] bg-slate-900/60 backdrop-blur-sm hidden items-end sm:items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 animate-up overflow-y-auto max-h-[90vh] shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-slate-800">ลงรายการของเช่า</h2>
                <button onclick="toggleAddModal(false)" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-red-50 hover:text-red-500 transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-2">ชื่อสินค้า *</label>
                    <input type="text" id="fName" placeholder="สว่านไฟฟ้า, กล้อง Sony, ฯลฯ" class="w-full p-4 bg-slate-50 rounded-2xl border border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all font-semibold">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-2">ราคา/วัน (฿) *</label>
                        <input type="number" id="fPrice" placeholder="0" class="w-full p-4 bg-slate-50 rounded-2xl border border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all font-semibold">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase block mb-2">หมวดหมู่</label>
                        <select id="fCat" class="w-full p-4 bg-slate-50 rounded-2xl border border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all font-semibold">
                            <option>ทั่วไป</option><option>ไอที</option><option>ช่าง</option><option>กล้อง</option><option>แค้มป์</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-2">ติดต่อ (LINE/โทร) *</label>
                    <input type="text" id="fContact" placeholder="089xxxxxxx" class="w-full p-4 bg-slate-50 rounded-2xl border border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all font-semibold">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-2 text-blue-600">ลิงก์รูปภาพ (ถ้ามี)</label>
                    <input type="url" id="fImg" placeholder="https://..." class="w-full p-4 bg-slate-50 rounded-2xl border border-transparent focus:border-blue-500 focus:bg-white outline-none transition-all text-sm">
                </div>
                <button onclick="publishItem()" id="saveBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg active-push shadow-xl shadow-blue-100 mt-4 flex items-center justify-center gap-2">
                    ยืนยันการโพสต์
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Global Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'phaendin-rent-v1';

        let state = {
            user: localStorage.getItem('pdr_name'),
            items: [],
            filter: 'ทั้งหมด',
            search: ''
        };

        const categories = ['ทั้งหมด', 'ทั่วไป', 'ไอที', 'ช่าง', 'กล้อง', 'แค้มป์'];

        // --- AUTH ---
        window.handleLogin = () => {
            const input = document.getElementById('usernameInput').value.trim();
            if(!input) return;
            localStorage.setItem('pdr_name', input);
            location.reload();
        };

        async function bootstrap() {
            if(!state.user) return;
            
            document.getElementById('userNameText').innerText = state.user;
            document.getElementById('authScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('authScreen').classList.add('hidden'), 500);

            // Connect Firebase
            try {
                await signInAnonymously(auth);
                listenToData();
                renderFilters();
            } catch (err) {
                console.error("Firebase Auth Fail", err);
            }
        }

        // --- DATA SYNC ---
        function listenToData() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'listings');
            onSnapshot(q, (snap) => {
                state.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                refreshUI();
            }, (err) => console.error("Sync Error", err));
        }

        // --- UI RENDERING ---
        function refreshUI() {
            const grid = document.getElementById('productGrid');
            const empty = document.getElementById('emptyState');
            
            let filtered = state.items.filter(i => {
                const matchCat = state.filter === 'ทั้งหมด' || i.category === state.filter;
                const matchSearch = i.name.toLowerCase().includes(state.search.toLowerCase());
                return matchCat && matchSearch;
            });

            // Sort newest first
            filtered.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            if(filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            empty.classList.add('hidden');

            grid.innerHTML = filtered.map(i => `
                <div class="bg-white rounded-[2rem] overflow-hidden shadow-sm border border-slate-100 animate-up">
                    <div class="aspect-square bg-slate-100 relative overflow-hidden">
                        <img src="${i.img || 'https://images.unsplash.com/photo-1574634534894-89d7576c8259?auto=format&fit=crop&w=400'}" class="w-full h-full object-cover">
                        <div class="absolute bottom-3 left-3 bg-blue-600/90 text-white text-[10px] px-3 py-1 rounded-full font-bold backdrop-blur-md">
                            ${i.category}
                        </div>
                        ${i.owner === state.user ? `
                            <button onclick="removeItem('${i.id}')" class="absolute top-3 right-3 bg-white/90 text-red-500 p-2.5 rounded-2xl shadow-sm hover:bg-red-500 hover:text-white transition-all">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        ` : ''}
                    </div>
                    <div class="p-4 space-y-1">
                        <h3 class="font-bold text-slate-800 truncate">${i.name}</h3>
                        <div class="flex items-baseline gap-1">
                            <span class="text-blue-600 font-black text-xl">฿${Number(i.price).toLocaleString()}</span>
                            <span class="text-[10px] text-slate-400 font-bold uppercase">/วัน</span>
                        </div>
                        <a href="tel:${i.contact}" class="block w-full bg-slate-900 text-white text-center py-3.5 rounded-2xl text-xs font-bold mt-4 active-push shadow-lg">ติดต่อเช่า</a>
                        <div class="pt-2 text-[8px] text-slate-300 font-medium flex justify-between uppercase">
                            <span>เจ้าของ: ${i.owner}</span>
                            <span>#${i.id.slice(-4)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderFilters() {
            const list = document.getElementById('catList');
            list.innerHTML = categories.map(c => `
                <button onclick="updateFilter('${c}')" class="px-6 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all border ${state.filter === c ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-200' : 'bg-white text-slate-400 border-slate-200'}">
                    ${c}
                </button>
            `).join('');
        }

        // --- ACTIONS ---
        window.updateFilter = (c) => {
            state.filter = c;
            renderFilters();
            refreshUI();
        };

        window.handleSearch = () => {
            state.search = document.getElementById('searchBar').value;
            refreshUI();
        };

        window.toggleAddModal = (s) => {
            const m = document.getElementById('modalOverlay');
            if(s) { m.classList.remove('hidden'); m.classList.add('flex'); }
            else { m.classList.add('hidden'); m.classList.remove('flex'); }
        };

        window.publishItem = async () => {
            const name = document.getElementById('fName').value.trim();
            const price = document.getElementById('fPrice').value;
            const contact = document.getElementById('fContact').value.trim();
            const img = document.getElementById('fImg').value.trim();
            const cat = document.getElementById('fCat').value;

            if(!name || !price || !contact) return alert("ข้อมูลไม่ครบ!");

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "กำลังโพสต์...";

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'listings'), {
                    name, price, contact, img, category: cat, owner: state.user, createdAt: serverTimestamp()
                });
                toggleAddModal(false);
                // Clear
                document.getElementById('fName').value = '';
                document.getElementById('fPrice').value = '';
                document.getElementById('fContact').value = '';
                document.getElementById('fImg').value = '';
            } catch (err) { alert(err.message); }
            finally { btn.disabled = false; btn.innerText = "ยืนยันการโพสต์"; }
        };

        window.removeItem = async (id) => {
            if(confirm("ลบรายการนี้?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', id));
            }
        };

        window.resetFilters = () => {
            state.filter = 'ทั้งหมด';
            state.search = '';
            document.getElementById('searchBar').value = '';
            renderFilters();
            refreshUI();
        };

        // Start
        bootstrap();

    </script>
</body>
</html>
