<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }

        /* --- Header & Search --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { display: flex; align-items: center; justify-content: center; padding: 15px 0 10px; }
        .logo-img { height: 40px; border-radius: 4px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { position: relative; width: 100%; height: 130px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .banner-text { position: absolute; bottom: 15px; left: 15px; color: #fff; font-size: 16px; font-weight: 600; text-shadow: 2px 2px 4px #000; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 10px; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 12px; color: #aaa; padding: 6px 20px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        /* --- Main Content --- */
        main { margin-top: 320px; padding-bottom: 100px; }
        header.shrunk + main { margin-top: 150px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 20px 15px 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Recommended --- */
        .rec-list { display: flex; gap: 12px; overflow-x: auto; padding: 0 12px 5px; scrollbar-width: none; }
        .rec-card { min-width: 120px; width: 120px; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #222; background: #111; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; cursor: pointer; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { position: absolute; bottom: 0; width: 100%; background: rgba(212, 175, 55, 0.95); color: #000; font-size: 12px; font-weight: bold; text-align: center; padding: 6px 0; }

        /* --- Grid & Product Cards --- */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 1px solid #222; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; background: #000; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 8px; left: 8px; background: var(--red); color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: bold; z-index: 10; }
        .info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .desc-box { font-size: 11px; color: #888; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 10px; line-height: 1.4; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; margin-top: auto; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .price-old { color: #555; font-size: 12px; text-decoration: line-through; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer; }

        /* --- Modals --- */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; }
        .modal-inner { position: relative; width: 100%; max-width: 500px; text-align: center; }
        .modal-content { width: 100%; border-radius: 15px; max-height: 80vh; object-fit: contain; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 380px; padding: 25px; position: relative; }
        .order-summary-box { background: #000; padding: 15px; border-radius: 12px; margin: 15px 0; border-left: 4px solid var(--gold); color: #fff; text-align: left; }
        .confirm-btn { display: block; width: 100%; background: var(--green); color: #fff; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; text-align: center; font-size: 16px; margin-top: 10px; }
        .float-btn { position: fixed; bottom: 25px; left: 20px; background: var(--green); color: white; padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: 600; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide">
            <img src="https://i.ibb.co/v6Y0mF7X/banner1.jpg" id="bannerImg">
            <div class="banner-text" id="bannerTxt">✨ PHAENDIN STORE OFFICIAL</div>
        </div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาสินค้าที่ต้องการ..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:50px; color:#666;">กำลังดึงข้อมูลจากระบบ...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 รายการสินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<div id="imgModal" class="modal" onclick="closeModal('imgModal')"><div class="modal-inner" id="modalBody"></div></div>
<div id="orderModal" class="modal">
    <div class="order-card">
        <h2 style="color: var(--gold); margin-bottom:10px;">🛒 สรุปยอดโอน</h2>
        <div id="orderSummary" class="order-summary-box"></div>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" class="confirm-btn">💰 แจ้งโอนเงินคลิกที่นี่</a>
        <p onclick="closeModal('orderModal')" style="margin-top:15px; color:#555; cursor:pointer; font-size:13px;">ปิดหน้าต่าง</p>
    </div>
</div>

<a href="javascript:void(0)" onclick="document.getElementById('orderModal').style.display='flex'" class="float-btn">💳 แจ้งโอนเงิน</a>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PRODUCT_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANNER_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRecommended = [], cur = 'all';

    function getMediaHTML(url, isModal = false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        const s = isModal ? 'class="modal-content"' : '';
        return isVid ? `<video src="${url}" autoplay loop muted playsinline ${s}></video>` : `<img src="${url}" loading="lazy" ${s}>`;
    }

    function openImg(url) { document.getElementById('modalBody').innerHTML = getMediaHTML(url, true); document.getElementById('imgModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openOrder(name, price, shipping) {
        const p = parseFloat(price) || 0;
        const s = parseFloat(shipping) || 0;
        const total = p + s;
        const shipText = s === 0 ? "<span style='color:var(--green)'>ส่งฟรี!</span>" : `฿${s}`;

        document.getElementById('orderSummary').innerHTML = `
            <div style="margin-bottom:8px;"><b>สินค้า:</b> ${name}</div>
            <div style="display:flex; justify-content:space-between;"><span>ราคา:</span> <span>฿${p}</span></div>
            <div style="display:flex; justify-content:space-between;"><span>ค่าจัดส่ง:</span> <span>${shipText}</span></div>
            <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b>ยอดสุทธิ:</b> <b style="color:var(--gold); font-size:22px;">฿${total}</b>
            </div>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function shuffle(array) {
        let a = [...array];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    async function load() {
        try {
            // 1. Load Banner
            const resB = await fetch(BANNER_URL);
            const textB = await resB.text();
            const bData = textB.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
            if(bData[0]) {
                if(bData[0][0]) document.getElementById('bannerImg').src = bData[0][0];
                if(bData[0][1]) document.getElementById('bannerTxt').innerText = bData[0][1];
            }

            // 2. Load Products
            const resP = await fetch(PRODUCT_URL);
            const textP = await resP.text();
            let raw = textP.split(/\r?\n/).slice(1).map(row => 
                row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())
            ).filter(x => x[0] && x[1]);
            
            dbAll = shuffle(raw);
            dbRecommended = shuffle(raw.filter(p => p[5] && p[5].includes("แนะนำ")));

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { document.getElementById('status').innerText = "เชื่อมต่อข้อมูลล้มเหลว"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        
        // Render Recommended
        const recArea = document.getElementById('rec-area');
        if(dbRecommended.length > 0 && q === "") {
            recArea.style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRecommended.map(p => `
                <div class="rec-card">
                    <div class="rec-media" onclick="openImg('${p[1]}')">${getMediaHTML(p[1])}</div>
                    <div class="rec-price" onclick="openOrder('${p[0]}','${p[3]}','${p[8]}')">฿${p[3]}</div>
                </div>
            `).join('');
        } else { recArea.style.display = 'none'; }

        // Render All
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (cur === 'all' || p[6] === cur));
        document.getElementById('main-list').innerHTML = filt.map((p, i) => {
            const hasT = p[7] && p[7].length > 5;
            return `
            <div class="card">
                <div class="media" onclick="openImg('${p[1]}')">
                    ${hasT ? `<div class="timer-badge" id="t-${i}" data-time="${p[7]}">00:00:00</div>` : ''}
                    ${getMediaHTML(p[1])}
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="desc-box">${p[2] || 'รายละเอียดสินค้า'}</div>
                    <div class="price-row">
                        <div class="price">฿${p[3]}</div>
                        ${p[4] ? `<div class="price-old">฿${p[4]}</div>` : ''}
                    </div>
                    <div class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]}')">สั่งซื้อ</div>
                </div>
            </div>`;
        }).join('');

        const categories = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = categories.map(c => `
            <span class="cat-item ${cur === c[0] ? 'active' : ''}" onclick="setCat('${c[0]}')">${c[1]}</span>
        `).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const target = new Date(el.getAttribute('data-time')).getTime();
            const dist = target - now;
            if (dist < 0) { el.innerHTML = "จบโปรโมชั่น"; el.style.background = "#444"; }
            else {
                const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    function setCat(c) { cur = c; render(); }
    load();
    window.onscroll = () => { const h = document.getElementById("mainHeader"); window.scrollY > 50 ? h.classList.add("shrunk") : h.classList.remove("shrunk"); };
</script>
</body>
</html>
