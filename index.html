<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaendin Rent | ระบบเช่าของออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .item-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .item-card:hover { transform: translateY(-5px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20 text-slate-900">

    <!-- Auth Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-blue-600 z-[300] hidden items-center justify-center p-6 text-white text-center overflow-y-auto">
        <div class="max-w-sm w-full space-y-6 py-10 animate-fade-in">
            <div class="bg-white p-4 rounded-3xl inline-block shadow-2xl mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            
            <div id="authContent">
                <h1 id="authTitle" class="text-3xl font-bold mb-2">เข้าสู่ระบบ</h1>
                <p id="authDesc" class="text-blue-100 opacity-80 mb-6 text-sm">ระบุตัวตนเพื่อจัดการประกาศของคุณ</p>
                
                <div class="space-y-4">
                    <div class="text-left">
                        <label class="block text-[10px] uppercase font-bold text-blue-200 mb-1 ml-4">ชื่อผู้ใช้</label>
                        <input type="text" id="authUserName" placeholder="ชื่อเล่นภาษาอังกฤษ/ไทย" class="w-full px-6 py-4 rounded-2xl bg-white/20 border border-white/30 text-white placeholder:text-blue-200 outline-none focus:bg-white/30 transition-all text-lg font-bold">
                    </div>
                    
                    <div class="text-left">
                        <label class="block text-[10px] uppercase font-bold text-blue-200 mb-1 ml-4">รหัสผ่าน 4 ตัว</label>
                        <input type="password" id="authUserPass" placeholder="••••" maxlength="4" class="w-full px-6 py-4 rounded-2xl bg-white/20 border border-white/30 text-white placeholder:text-blue-200 outline-none focus:bg-white/30 transition-all text-xl font-bold text-center tracking-[0.5em]">
                    </div>

                    <div id="hintContainer" class="hidden text-left animate-fade-in">
                        <label class="block text-[10px] uppercase font-bold text-blue-200 mb-1 ml-4">คำใบ้รหัสผ่าน</label>
                        <input type="text" id="authUserHint" placeholder="เช่น วันเกิดน้องหมา" class="w-full px-6 py-3 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-blue-300 outline-none text-sm">
                    </div>

                    <button id="authMainBtn" onclick="processAuth()" class="w-full bg-white text-blue-600 py-4 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
                        <span id="authBtnText">เข้าใช้งาน</span>
                        <div id="authSpinner" class="loading-spinner hidden" style="border-top-color: #2563eb;"></div>
                    </button>
                    
                    <p id="showHint" class="hidden text-yellow-300 text-xs mt-2 italic"></p>
                </div>

                <div class="mt-8 pt-6 border-t border-white/10">
                    <p id="switchText" class="text-sm text-blue-100">ยังไม่เคยใช้งานใช่ไหม?</p>
                    <button onclick="toggleAuthMode()" id="switchBtn" class="mt-2 text-white font-bold underline underline-offset-4">สมัครสมาชิกใหม่</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Phaendin Rent</h1>
                    <span id="currentUserDisplay" class="text-[10px] text-blue-200">เข้าใช้งานแบบบุคคลทั่วไป</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAddModal()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 px-5 py-2 rounded-full font-bold transition-all transform active:scale-95 shadow-md text-sm">
                    ลงของเช่า
                </button>
                <button onclick="logout()" class="p-2 text-blue-200 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Search and Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="ค้นหาสินค้า..." class="w-full pl-6 pr-4 py-3 rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterByCategory('ทั้งหมด')" class="cat-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap">ทั้งหมด</button>
                <button onclick="filterByCategory('อุปกรณ์ไอที')" class="cat-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap border shadow-sm">อุปกรณ์ไอที</button>
                <button onclick="filterByCategory('แคมป์ปิ้ง')" class="cat-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap border shadow-sm">แคมป์ปิ้ง</button>
                <button onclick="filterByCategory('เครื่องมือช่าง')" class="cat-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap border shadow-sm">เครื่องมือช่าง</button>
            </div>
        </div>

        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Items injected here -->
        </div>

        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
            <h3 class="text-xl font-bold text-slate-400">ยังไม่มีสินค้าในขณะนี้</h3>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
                <h2 id="modalTitle" class="text-xl font-bold">ลงของเช่า</h2>
                <button onclick="toggleModal(false)" class="text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <form id="rentForm" onsubmit="handleForm(event)" class="p-6 space-y-4">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ชื่อสินค้า *</label>
                    <input type="text" id="itemName" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">ราคา/วัน *</label>
                        <input type="number" id="itemPrice" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">หมวดหมู่</label>
                        <select id="itemCategory" class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="อุปกรณ์ไอที">อุปกรณ์ไอที</option>
                            <option value="แคมป์ปิ้ง">แคมป์ปิ้ง</option>
                            <option value="เครื่องมือช่าง">เครื่องมือช่าง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">รูปภาพ (URL)</label>
                    <input type="url" id="itemImage" placeholder="https://..." class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">LINE ID หรือเบอร์ติดต่อ *</label>
                    <input type="text" id="itemContact" required class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg active:scale-95 transition-all">
                    บันทึกประกาศ
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Alert -->
    <div id="customAlert" class="fixed inset-0 bg-black/50 z-[400] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center">
            <h3 id="alertTitle" class="text-xl font-bold mb-2"></h3>
            <p id="alertMsg" class="text-slate-500 mb-6"></p>
            <button onclick="closeAlert()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'phaendin-rent-v1';

        let items = [];
        let userAccount = null;
        let authMode = 'login';
        let currentCategory = 'ทั้งหมด';

        // Initialize App
        window.onload = async () => {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const localUser = localStorage.getItem('phaendin_user');
                    if (localUser) {
                        userAccount = JSON.parse(localUser);
                        document.getElementById('currentUserDisplay').innerText = `สวัสดีคุณ ${userAccount.username}`;
                        document.getElementById('loginOverlay').classList.add('hidden');
                    } else {
                        document.getElementById('loginOverlay').classList.remove('hidden');
                        document.getElementById('loginOverlay').classList.add('flex');
                    }
                    startSync();
                }
            });
        };

        // Real-time Data Sync
        function startSync() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'items');
            onSnapshot(q, (snapshot) => {
                items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderItems();
            }, (err) => console.error("Sync error:", err));
        }

        // Global assignments for HTML onclicks
        window.toggleAuthMode = () => {
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('authTitle').innerText = authMode === 'login' ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
            document.getElementById('authBtnText').innerText = authMode === 'login' ? 'เข้าใช้งาน' : 'ลงทะเบียน';
            document.getElementById('switchBtn').innerText = authMode === 'login' ? 'สมัครสมาชิกใหม่' : 'มีบัญชีแล้ว? เข้าสู่ระบบ';
            document.getElementById('hintContainer').classList.toggle('hidden', authMode === 'login');
        };

        window.processAuth = async () => {
            const user = document.getElementById('authUserName').value.trim();
            const pass = document.getElementById('authUserPass').value.trim();
            const hint = document.getElementById('authUserHint').value.trim();

            if (!user || pass.length !== 4) {
                showAlert("ผิดพลาด", "กรุณาระบุชื่อและรหัสผ่าน 4 หลัก");
                return;
            }

            document.getElementById('authSpinner').classList.remove('hidden');
            
            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.toLowerCase());
                const userSnap = await getDoc(userRef);

                if (authMode === 'register') {
                    if (userSnap.exists()) {
                        showAlert("ชื่อนี้ถูกใช้แล้ว", "กรุณาใช้ชื่ออื่น");
                    } else {
                        const userData = { username: user, passcode: pass, hint: hint || "ไม่ได้ตั้งไว้" };
                        await setDoc(userRef, userData);
                        completeLogin(userData);
                    }
                } else {
                    if (userSnap.exists() && userSnap.data().passcode === pass) {
                        completeLogin(userSnap.data());
                    } else if (userSnap.exists()) {
                        document.getElementById('showHint').innerText = `คำใบ้: ${userSnap.data().hint}`;
                        document.getElementById('showHint').classList.remove('hidden');
                        showAlert("รหัสไม่ถูกต้อง", "ลองดูคำใบ้สีเหลืองด้านล่างนะครับ");
                    } else {
                        showAlert("ไม่พบผู้ใช้", "กรุณาสมัครสมาชิกใหม่");
                    }
                }
            } catch (e) {
                showAlert("Error", "เกิดข้อผิดพลาดในการเชื่อมต่อ");
            } finally {
                document.getElementById('authSpinner').classList.add('hidden');
            }
        };

        function completeLogin(data) {
            userAccount = data;
            localStorage.setItem('phaendin_user', JSON.stringify(data));
            document.getElementById('currentUserDisplay').innerText = `สวัสดีคุณ ${data.username}`;
            document.getElementById('loginOverlay').classList.add('hidden');
            renderItems();
        }

        window.logout = () => {
            if (confirm("ออกจากระบบ?")) {
                localStorage.removeItem('phaendin_user');
                location.reload();
            }
        };

        window.handleForm = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editItemId').value;
            const data = {
                name: document.getElementById('itemName').value,
                price: document.getElementById('itemPrice').value,
                category: document.getElementById('itemCategory').value,
                image: document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1581244276891-6bc6127498f1?q=80&w=500',
                contact: document.getElementById('itemContact').value,
                owner: userAccount.username,
                timestamp: Date.now()
            };

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "กำลังบันทึก...";

            try {
                if (id) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', id), data);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'items'), data);
                }
                toggleModal(false);
                showAlert("สำเร็จ", "ประกาศของคุณออนไลน์แล้ว");
            } catch (err) {
                showAlert("Error", "ไม่สามารถบันทึกข้อมูลได้");
            } finally {
                btn.disabled = false;
                btn.innerText = "บันทึกประกาศ";
            }
        };

        window.deleteItem = async (id) => {
            if (confirm("ยืนยันการลบประกาศนี้?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', id));
            }
        };

        window.openEditModal = (id) => {
            const item = items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('modalTitle').innerText = "แก้ไขประกาศ";
            document.getElementById('editItemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('itemImage').value = item.image;
            document.getElementById('itemContact').value = item.contact;
            toggleModal(true);
        };

        window.renderItems = () => {
            const grid = document.getElementById('itemsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(i => {
                const matchSearch = i.name.toLowerCase().includes(search);
                const matchCat = currentCategory === 'ทั้งหมด' || i.category === currentCategory;
                return matchSearch && matchCat;
            });

            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
            grid.innerHTML = filtered.sort((a,b) => b.timestamp - a.timestamp).map(i => `
                <div class="item-card bg-white rounded-3xl overflow-hidden shadow-sm border group">
                    <div class="h-40 relative bg-slate-100">
                        <img src="${i.image}" class="w-full h-full object-cover">
                        ${userAccount && i.owner === userAccount.username ? `
                            <div class="absolute top-2 right-2 flex gap-1">
                                <button onclick="openEditModal('${i.id}')" class="p-2 bg-white/90 rounded-full shadow hover:bg-white text-blue-600">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                </button>
                                <button onclick="deleteItem('${i.id}')" class="p-2 bg-white/90 rounded-full shadow hover:bg-white text-red-500">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                            </div>
                        ` : ''}
                        <div class="absolute bottom-2 left-2">
                             <span class="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-lg shadow">${i.category}</span>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold line-clamp-1">${i.name}</h3>
                            <span class="text-blue-600 font-bold">฿${i.price}</span>
                        </div>
                        <div class="flex items-center justify-between mt-4 pt-3 border-t">
                            <span class="text-[10px] text-slate-400">โดยคุณ ${i.owner}</span>
                            <a href="https://line.me/ti/p/~${i.contact}" target="_blank" class="bg-green-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-green-600">ติดต่อเช่า</a>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.filterByCategory = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const active = btn.innerText === cat;
                btn.className = `cat-btn px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap border transition-all ${active ? 'bg-blue-600 text-white border-transparent' : 'bg-white text-slate-600 shadow-sm'}`;
            });
            renderItems();
        };

        // UI Helpers
        window.toggleModal = (show) => {
            document.getElementById('modal').classList.toggle('hidden', !show);
            document.getElementById('modal').classList.toggle('flex', show);
            if(!show) {
                document.getElementById('rentForm').reset();
                document.getElementById('editItemId').value = "";
                document.getElementById('modalTitle').innerText = "ลงของเช่า";
            }
        };
        window.openAddModal = () => toggleModal(true);
        window.showAlert = (title, msg) => {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
            document.getElementById('customAlert').classList.add('flex');
        };
        window.closeAlert = () => document.getElementById('customAlert').classList.add('hidden');

    </script>
</body>
</html>
