<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaendin Store - ยืนยันการสั่งซื้อ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --dark: #1a1a1a; }
        body { font-family: 'Kanit', sans-serif; background: var(--dark); color: white; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #222; padding: 20px; border-radius: 15px; border: 1px solid var(--gold); }
        h2 { color: var(--gold); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .form-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background: var(--gold); border: none; border-radius: 8px; color: black; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .btn-submit:disabled { background: #555; cursor: not-allowed; }
        .summary-box { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--gold); }
        .file-label { display: block; background: #444; padding: 10px; border: 1px dashed var(--gold); text-align: center; border-radius: 8px; cursor: pointer; margin-top: 5px; }
        #preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-cart-shopping"></i> สรุปรายการสั่งซื้อ</h2>
    
    <div id="orderSummary" class="summary-box">
        กำลังโหลดรายการสินค้า...
    </div>

    <form id="checkoutForm">
        <div class="form-group">
            <label>ชื่อ-นามสกุล *</label>
            <input type="text" id="customer_name" class="form-input" placeholder="ระบุชื่อผู้รับ" required>
        </div>
        <div class="form-group">
            <label>เบอร์โทรศัพท์ *</label>
            <input type="tel" id="customer_phone" class="form-input" placeholder="08xxxxxxxx" required>
        </div>
        <div class="form-group">
            <label>ที่อยู่จัดส่ง *</label>
            <textarea id="customer_address" class="form-input" rows="3" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล..." required></textarea>
        </div>

        <div class="form-group">
            <label style="color: var(--gold);">แนบรูปหลักฐานการโอนเงิน (สลิป) *</label>
            <label class="file-label" for="customer_slip">
                <i class="fa-solid fa-image"></i> คลิกเพื่อเลือกรูปสลิป
            </label>
            <input type="file" id="customer_slip" accept="image/*" style="display: none;" required onchange="previewImage(this)">
            <img id="preview">
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">💰 ยืนยันสั่งซื้อและส่งสลิป</button>
    </form>
</div>

<script>
    // ข้อมูลจำลอง (ในหน้างานจริง ค่านี้จะมาจากหน้าที่แล้ว)
    const currentData = {
        finalDetail: "สินค้าชุด A (390.-) จำนวน 1 ชุด",
        totalPrice: "390"
    };

    document.getElementById('orderSummary').innerHTML = `
        <p style="margin:0; font-size:14px;">${currentData.finalDetail}</p>
        <p style="margin:5px 0 0 0; font-weight:bold; color:var(--gold); font-size:18px;">ยอดโอน: ${currentData.totalPrice} บาท</p>
    `;

    function previewImage(input) {
        const preview = document.getElementById('preview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileInput = document.getElementById('customer_slip');
        
        if (fileInput.files.length === 0) {
            alert("กรุณาแนบรูปสลิปก่อนยืนยันครับ");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังอัปโหลดข้อมูล...';

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = async function() {
            const base64Data = reader.result.split(',')[1];
            const payload = {
                detail: currentData.finalDetail,
                name: document.getElementById('customer_name').value,
                phone: document.getElementById('customer_phone').value,
                address: document.getElementById('customer_address').value,
                file: base64Data,
                mimeType: file.type
            };

            try {
                // ส่งไปยัง Google Apps Script ของคุณโดยตรง
                const response = await fetch("https://script.google.com/macros/s/AKfycby9zFSAz_wsry9cwCV3dGg3AeLZN0ClWIoqw_uOxpFIFHUtA4v7TOoiUEla0i6R1XPwuA/exec", {
                    method: "POST",
                    body: new URLSearchParams(payload)
                });
                
                const result = await response.text();
                
                if (result === "Success") {
                    alert("✅ สั่งซื้อสำเร็จ! ข้อมูลและรูปสลิปส่งถึงเราเรียบร้อยแล้วครับ");
                    location.reload(); 
                } else {
                    throw new Error(result);
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
                btn.disabled = false;
                btn.innerHTML = '💰 ยืนยันสั่งซื้อและส่งสลิป';
            }
        };
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
