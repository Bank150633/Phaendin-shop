<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | ALL-IN-ONE STORE</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --royal-blue: #00247D; --thai-red: #ED1C24; --gold: #D4AF37; 
            --dark-bg: #050A14; --glass: rgba(255, 255, 255, 0.98);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--dark-bg); color: #fff; padding-bottom: 100px; }

        /* [1] Header & Branding */
        header { 
            background: var(--royal-blue); padding: 15px; border-bottom: 3px solid var(--gold);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .logo-box img { height: 40px; filter: drop-shadow(0 0 5px gold); }

        /* [2] Promotions Banner */
        .promo-slider { margin: 15px; border-radius: 20px; overflow: hidden; border: 2px solid var(--gold); position: relative; height: 180px; }
        .promo-slider img { width: 100%; height: 100%; object-fit: cover; }
        .promo-tag { position: absolute; top: 10px; left: 10px; background: var(--thai-red); padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: 700; animation: pulse 2s infinite; }

        /* [3] Order Status Quick View (Section ใหม่) */
        .status-card { background: var(--glass); margin: 0 15px 15px; padding: 15px; border-radius: 15px; color: #333; display: flex; align-items: center; gap: 15px; }
        .status-icon { width: 45px; height: 45px; background: #eef2ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--royal-blue); font-size: 20px; }

        /* [4] Categories & Product Grid */
        .cat-bar { display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; }
        .cat-pill { background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 50px; white-space: nowrap; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .cat-pill.active { background: var(--gold); color: #000; font-weight: 700; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .item-card { background: #fff; border-radius: 18px; overflow: hidden; color: #333; position: relative; }
        .item-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .item-info { padding: 10px; }
        .item-name { font-size: 13px; font-weight: 600; height: 38px; overflow: hidden; }
        .item-price { color: var(--thai-red); font-size: 16px; font-weight: 800; margin-top: 5px; }
        .add-cart-btn { background: var(--royal-blue); color: white; border: none; width: 100%; padding: 8px; border-radius: 10px; margin-top: 8px; font-size: 12px; cursor: pointer; }

        /* [5] Fast Checkout Bar (แถบสรุปยอดด้านล่าง) */
        .bottom-checkout { 
            position: fixed; bottom: 85px; left: 15px; right: 15px; background: var(--thai-red); 
            border-radius: 50px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 25px rgba(237, 28, 36, 0.4); z-index: 500;
            display: none; /* จะแสดงเมื่อมีของในตะกร้า */
        }

        /* Nav Bar */
        nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; padding: 10px 0; border-top: 3px solid var(--gold); }
        .nav-item { flex: 1; text-align: center; color: #888; font-size: 10px; text-decoration: none; }
        .nav-item.active { color: var(--royal-blue); font-weight: 700; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" alt="Phaendin">
    </div>
    <div style="text-align: right;">
        <i class="fa-solid fa-circle-user" style="font-size: 24px; color: var(--gold);"></i>
    </div>
</header>

<div class="promo-slider">
    <span class="promo-tag">โปรเด็ดวันนี้!</span>
    <img src="https://via.placeholder.com/600x200/00247D/ffffff?text=Phaendin+Store+Promotion" alt="Banner">
</div>

<div class="status-card" onclick="alert('กำลังพัฒนาระบบติดตามพัสดุ')">
    <div class="status-icon"><i class="fa-solid fa-truck-ramp-box"></i></div>
    <div style="flex: 1;">
        <div style="font-size: 11px; color: #888;">ออเดอร์ล่าสุดของคุณ</div>
        <div style="font-size: 13px; font-weight: 600;">กำลังเตรียมจัดส่ง (2 รายการ)</div>
    </div>
    <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #ccc;"></i>
</div>

<div class="cat-bar">
    <div class="cat-pill active">ทั้งหมด</div>
    <div class="cat-pill">น้ำพริก/ของดอง</div>
    <div class="cat-pill">ต้นไม้/พรรณไม้</div>
    <div class="cat-pill">ปุ๋ย/อุปกรณ์</div>
</div>

<div class="product-grid" id="productGrid">
    <div class="item-card">
        <img src="https://via.placeholder.com/300" class="item-img">
        <div class="item-info">
            <div class="item-name">น้ำพริกเห็ดหอม คุณเพ็ญศรี (500g)</div>
            <div class="item-price">฿150</div>
            <button class="add-cart-btn" onclick="updateCart(150)">เพิ่มลงตะกร้า</button>
        </div>
    </div>
    <div class="item-card">
        <img src="https://via.placeholder.com/300" class="item-img">
        <div class="item-info">
            <div class="item-name">ผลไม้ดองรวมรส (ถุงใหญ่)</div>
            <div class="item-price">฿120</div>
            <button class="add-cart-btn" onclick="updateCart(120)">เพิ่มลงตะกร้า</button>
        </div>
    </div>
</div>

<div class="bottom-checkout" id="quickCart" onclick="location.href='#cart'">
    <div style="color: white;">
        <span id="cartQty">0</span> รายการ | <b id="cartTotal">฿0</b>
    </div>
    <div style="font-weight: 700; color: #fff; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 20px;">
        ชำระเงิน <i class="fa-solid fa-arrow-right"></i>
    </div>
</div>

<nav>
    <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i>หน้าแรก</a>
    <a href="#" class="nav-item"><i class="fa-solid fa-list-check"></i>สถานะ</a>
    <a href="#" class="nav-item"><i class="fa-solid fa-cart-shopping"></i>ตะกร้า</a>
    <a href="#" class="nav-item"><i class="fa-solid fa-headset"></i>ช่วยลูกค้า</a>
</nav>

<script>
    let total = 0;
    let qty = 0;

    function updateCart(price) {
        total += price;
        qty += 1;
        
        document.getElementById('quickCart').style.display = 'flex';
        document.getElementById('cartQty').innerText = qty;
        document.getElementById('cartTotal').innerText = '฿' + total.toLocaleString();
        
        // เอฟเฟกต์สั่นเบาๆ เมื่อกด
        if(window.navigator.vibrate) window.navigator.vibrate(30);
    }
</script>

</body>
</html>
