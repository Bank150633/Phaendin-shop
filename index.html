<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | PREMIUM STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --gold: #D4AF37; --gold-btn: #eec24b; --bg: #050505; --card: #1a1a1a; --text: #FFFFFF; --border: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 100px; }

        /* Banner & Search (เหมือนเดิม) */
        .banner { width: 100%; height: 200px; position: relative; overflow: hidden; background: #000; }
        .banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .banner-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 20px; background: linear-gradient(to top, var(--bg), transparent); }
        .bn-tag { color: var(--gold); font-weight: 600; font-size: 1.1rem; }
        
        .search-box { padding: 15px; }
        .search-wrap { background: #111; border: 1px solid var(--border); border-radius: 25px; padding: 10px 15px; display: flex; align-items: center; }
        .search-wrap input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 10px; }

        /* Grid & Card */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 10px; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        
        /* แก้ไข: เพิ่ม cursor: pointer ให้รู้ว่ากดดูรูปได้ */
        .media-box { width: 100%; aspect-ratio: 1/1; background: #000; cursor: pointer; position: relative; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        .zoom-icon { position: absolute; top: 5px; right: 5px; color: rgba(255,255,255,0.5); font-size: 0.7rem; }

        .card-info { padding: 8px 5px; text-align: center; flex-grow: 1; }
        .p-name { font-size: 0.75rem; color: #ddd; height: 2.2em; overflow: hidden; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { color: #fff; font-weight: 600; font-size: 1rem; margin-bottom: 8px; display: block; }
        .buy-btn { background: var(--gold-btn); color: #000; border: none; padding: 10px 0; width: 100%; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

        /* ระบบขยายรูป (Image Viewer) */
        #viewerModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; }
        #viewerImg { max-width: 95%; max-height: 80%; border-radius: 10px; border: 2px solid var(--gold); }
        .close-viewer { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; }

        /* ระบบสั่งซื้อ (เหมือนเดิม) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; border: 1px solid var(--gold); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; }

        /* ช่องทางติดต่อเรา (Contact Hub) */
        .contact-section { padding: 20px 15px; text-align: center; border-top: 1px solid var(--border); margin-top: 20px; }
        .contact-title { color: var(--gold); font-size: 0.9rem; margin-bottom: 15px; letter-spacing: 1px; }
        .contact-grid { display: flex; justify-content: center; gap: 15px; }
        .contact-item { 
            display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; font-size: 0.65rem; 
            background: #111; padding: 12px; border-radius: 15px; border: 1px solid var(--border); width: 75px;
        }
        .contact-item i { font-size: 1.4rem; margin-bottom: 5px; }
        .contact-item.line i { color: #06C755; }
        .contact-item.fb i { color: #1877F2; }
        .contact-item.phone i { color: var(--gold); }

        footer { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 1px solid #222; padding: 12px 0; z-index: 100; }
        .nav-item { flex: 1; text-align: center; color: #888; font-size: 0.7rem; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="banner">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1470&auto=format&fit=crop">
        <div class="banner-overlay">
            <div class="bn-tag">EXCLUSIVE COLLECTION</div>
            <p style="font-size: 0.8rem; color: #ccc;">สัมผัสความหรูหราที่เหนือระดับ</p>
        </div>
    </div>

    <div class="search-box">
        <div class="search-wrap">
            <i class="fa-solid fa-search" style="color:var(--gold)"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาสินค้า..." oninput="render()">
        </div>
    </div>

    <div class="grid" id="productGrid"></div>

    <div class="contact-section">
        <div class="contact-title">CONTACT US</div>
        <div class="contact-grid">
            <a href="https://line.me/ti/p/ID_LINE_คุณ" class="contact-item line">
                <i class="fa-brands fa-line"></i> LINE
            </a>
            <a href="https://m.me/ชื่อเพจคุณ" class="contact-item fb">
                <i class="fa-brands fa-facebook-messenger"></i> Messenger
            </a>
            <a href="tel:08XXXXXXXX" class="contact-item phone">
                <i class="fa-solid fa-phone"></i> โทรเลย
            </a>
        </div>
    </div>

    <div id="viewerModal" onclick="this.style.display='none'">
        <span class="close-viewer">&times;</span>
        <img id="viewerImg" src="">
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="mTitle" style="color:var(--gold)">สั่งซื้อ</h3>
            <div id="optContainer"></div>
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล">
            <input type="tel" id="cPhone" placeholder="เบอร์โทร">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" rows="3"></textarea>
            <button class="buy-btn" onclick="alert('รับข้อมูลแล้ว!')" style="border-radius:10px; margin-top:10px;">ยืนยันสั่งซื้อ</button>
            <p onclick="document.getElementById('orderModal').style.display='none'" style="text-align:center; margin-top:15px; font-size:0.8rem; color:#888;">ยกเลิก</p>
        </div>
    </div>

    <footer>
        <div class="nav-item active"><i class="fa-solid fa-house"></i>หน้าแรก</div>
        <div class="nav-item"><i class="fa-solid fa-truck"></i>พัสดุ</div>
        <div class="nav-item"><i class="fa-solid fa-star"></i>รีวิว</div>
    </footer>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    let db = [];

    async function init() {
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Product`);
            const text = await res.text();
            const rows = text.split('\n').slice(1);
            db = rows.map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(r => r[0] !== "");
            render();
        } catch (e) { console.error(e); }
    }

    function viewImage(url) {
        if(/\.(mp4|webm|mov)$/i.test(url)) return; // ไม่ขยายถ้าเป็นวิดีโอ
        document.getElementById('viewerImg').src = url;
        document.getElementById('viewerModal').style.display = 'flex';
    }

    function renderMedia(url) {
        if (!url) return '<img src="https://via.placeholder.com/300">';
        const isVid = /\.(mp4|webm|mov)$/i.test(url);
        if (isVid) return `<video src="${url}" autoplay loop muted playsinline></video>`;
        return `<i class="fa-solid fa-magnifying-glass-plus zoom-icon"></i><img src="${url}" onclick="viewImage('${url}')">`;
    }

    function render() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('productGrid');
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        grid.innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media-box" onclick="viewImage('${p[1]}')">${renderMedia(p[1])}</div>
                <div class="card-info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${p[3]}</div>
                </div>
                <button class="buy-btn" onclick="openOrder('${p[0]}', '${p[3]}', '${p[10]}')">สั่งซื้อ</button>
            </div>
        `).join('');
    }

    function openOrder(name, price, opts) {
        document.getElementById('mTitle').innerText = name;
        const optCont = document.getElementById('optContainer');
        optCont.innerHTML = "";
        if (opts && opts !== "-") {
            let html = '<select id="pOpt"><option value="">เลือกตัวเลือก</option>';
            opts.split(',').forEach(o => html += `<option value="${o}">${o}</option>`);
            html += '</select>';
            optCont.innerHTML = html;
        }
        document.getElementById('orderModal').style.display = 'flex';
    }

    init();
</script>
</body>
</html>
