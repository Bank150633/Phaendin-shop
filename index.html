<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:'Kanit',sans-serif;

    background:#f5f7fb;

    color:#172033;
}


/* ==================================================
   HEADER
================================================== */

.top-stripe{

    height:5px;

    background:linear-gradient(
        to right,
        #d71920 0%,
        #d71920 33.33%,
        #ffffff 33.33%,
        #ffffff 66.66%,
        #123c8c 66.66%,
        #123c8c 100%
    );
}


.header{

    position:sticky;

    top:0;

    z-index:50;

    background:#ffffff;

    border-bottom:1px solid #e5e7eb;

    box-shadow:0 3px 15px rgba(0,0,0,.07);
}


.header-inner{

    max-width:1200px;

    margin:auto;

    padding:10px 14px;

    display:flex;

    align-items:center;

    gap:12px;
}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:8px;

    min-width:max-content;
}

.logo-mark{

    width:40px;

    height:40px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#ffffff;

    font-size:19px;

    background:
        linear-gradient(
            135deg,
            #d71920 0%,
            #d71920 42%,
            #ffffff 42%,
            #ffffff 58%,
            #123c8c 58%,
            #123c8c 100%
        );

    box-shadow:0 4px 10px rgba(18,60,140,.18);
}


.logo-text{

    line-height:1.05;
}

.logo-title{

    font-size:18px;

    font-weight:700;

    color:#123c8c;
}

.logo-sub{

    font-size:9px;

    color:#d71920;

    letter-spacing:.5px;
}


/* SEARCH */

.search-box{

    flex:1;

    position:relative;
}

.search-box input{

    width:100%;

    height:40px;

    border:1px solid #dce1ea;

    border-radius:22px;

    padding:0 42px 0 16px;

    outline:none;

    background:#f8fafc;

    font-family:'Kanit';

    font-size:13px;

    transition:.2s;
}

.search-box input:focus{

    border-color:#123c8c;

    background:#ffffff;

    box-shadow:0 0 0 3px rgba(18,60,140,.08);
}

.search-icon{

    position:absolute;

    right:16px;

    top:50%;

    transform:translateY(-50%);

    color:#123c8c;
}


/* ==================================================
   HERO
================================================== */

.hero{

    background:
        linear-gradient(
            135deg,
            #d71920 0%,
            #d71920 42%,
            #ffffff 42%,
            #ffffff 58%,
            #123c8c 58%,
            #123c8c 100%
        );

    padding:18px 14px;

    position:relative;

    overflow:hidden;
}

.hero::after{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(255,255,255,.10);

    pointer-events:none;
}

.hero-inner{

    max-width:1200px;

    margin:auto;

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.hero-title{

    color:#ffffff;

    font-size:23px;

    font-weight:700;

    margin:0 0 2px;

    text-shadow:0 2px 5px rgba(0,0,0,.18);
}

.hero-desc{

    color:#ffffff;

    font-size:12px;

    margin:0;

    opacity:.95;
}


.random-btn{

    border:0;

    background:#ffffff;

    color:#d71920;

    border-radius:25px;

    padding:9px 15px;

    font-family:'Kanit';

    font-size:12px;

    font-weight:600;

    white-space:nowrap;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.16);

    transition:.2s;
}

.random-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 20px rgba(0,0,0,.22);
}

.random-btn:active{

    transform:scale(.96);
}


/* ==================================================
   CONTAINER
================================================== */

.container-main{

    max-width:1200px;

    margin:auto;

    padding:14px;
}


/* ==================================================
   CATEGORY
================================================== */

.category-wrap{

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding:2px 0 10px;

    scrollbar-width:none;
}

.category-wrap::-webkit-scrollbar{

    display:none;
}

.category-btn{

    border:1px solid #dce2ec;

    background:#ffffff;

    color:#4b5563;

    border-radius:20px;

    padding:6px 13px;

    font-family:'Kanit';

    font-size:11px;

    white-space:nowrap;

    cursor:pointer;

    transition:.2s;
}

.category-btn:hover{

    border-color:#123c8c;

    color:#123c8c;
}

.category-btn.active{

    background:#123c8c;

    color:#ffffff;

    border-color:#123c8c;

    box-shadow:0 3px 8px rgba(18,60,140,.2);
}


/* ==================================================
   SECTION TITLE
================================================== */

.section-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:7px 0 10px;
}

.section-title{

    margin:0;

    font-size:17px;

    font-weight:600;

    color:#172033;

    display:flex;

    align-items:center;

    gap:8px;
}

.section-title i{

    color:#d71920;
}

.product-count{

    font-size:10px;

    color:#64748b;
}


/* ==================================================
   RANDOM
================================================== */

.random-section{

    display:none;

    margin-bottom:16px;
}

.random-section.show{

    display:block;
}

.random-grid{

    display:grid;

    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:8px;
}

.random-card{

    background:#ffffff;

    border-radius:12px;

    overflow:hidden;

    border:1px solid #e4e8ef;

    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.random-image{

    width:100%;

    height:105px;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.random-image img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:block;
}

.random-info{

    padding:7px;
}

.random-title{

    font-size:10px;

    font-weight:500;

    color:#172033;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:2px;
}

.random-province{

    font-size:9px;

    color:#123c8c;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:4px;
}

.random-price{

    font-size:12px;

    font-weight:700;

    color:#d71920;
}


/* ==================================================
   PRODUCT GRID
================================================== */

.product-grid{

    display:grid;

    grid-template-columns:repeat(2,minmax(0,1fr));

    gap:10px;
}


/* ==================================================
   PRODUCT CARD
================================================== */

.product-card{

    background:#ffffff;

    border:1px solid #e5e9f0;

    border-radius:13px;

    overflow:hidden;

    box-shadow:0 3px 12px rgba(0,0,0,.05);

    transition:.2s;

    min-width:0;
}

.product-card:hover{

    transform:translateY(-2px);

    box-shadow:0 7px 20px rgba(0,0,0,.09);

    border-color:#cfd8e8;
}


/* ==================================================
   IMAGE
================================================== */

.product-media{

    position:relative;

    width:100%;

    height:145px;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border-bottom:1px solid #eef1f5;
}

.product-media img{

    width:100%;

    height:100%;

    object-fit:contain;

    object-position:center;

    display:block;

    padding:5px;

    background:#ffffff;

    transition:transform .25s ease;
}

.product-card:hover .product-media img{

    transform:scale(1.025);
}


/* BADGE */

.product-badge{

    position:absolute;

    top:7px;

    left:7px;

    z-index:2;

    background:#d71920;

    color:#ffffff;

    font-size:9px;

    font-weight:500;

    padding:3px 7px;

    border-radius:10px;

    box-shadow:0 2px 5px rgba(0,0,0,.15);
}


/* ==================================================
   PRODUCT BODY
================================================== */

.product-body{

    padding:8px 9px 9px;
}

.product-title{

    font-size:12px;

    font-weight:500;

    color:#172033;

    line-height:1.35;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin:0 0 3px;
}


/* PROVINCE */

.product-province{

    display:flex;

    align-items:center;

    gap:4px;

    color:#123c8c;

    font-size:10px;

    line-height:1.2;

    margin-bottom:5px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.product-province i{

    color:#d71920;

    font-size:9px;

    flex:none;
}


/* TAG */

.product-tags{

    display:flex;

    gap:4px;

    overflow:hidden;

    margin-bottom:5px;
}

.product-tag{

    background:#eef3fb;

    color:#123c8c;

    border-radius:8px;

    padding:2px 5px;

    font-size:8px;

    white-space:nowrap;
}


/* ==================================================
   PRICE
================================================== */

.price-row{

    display:flex;

    align-items:baseline;

    gap:5px;

    margin-bottom:7px;

.sale-price{

    font-size:16px;

.original-price{

.product-buttons.single{

.btn{

.btn-own{

.btn-soon{

/* ==================================================

.loading{

}

.loading i{

    color:#123c8c;

    font-size:25px;

    margin-bottom:10px;

.loading p{

/* ==================================================
   EMPTY

.empty{

}

.empty i{

    margin-bottom:10px;
}

.empty p{

/* ==================================================
   FOOTER
================================================== */

.footer{

    margin-top:30px;

    background:#ffffff;

    border-top:1px solid #e5e7eb;
}

.footer-inner{

    max-width:1200px;

    margin:auto;

    padding:20px 14px;

}

.footer-logo{

    color:#123c8c;

.footer-text{

.footer-line{

}

</style>

<script>


/* ==================================================
   API
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxqXpc-Q_2TPzyVnfFaInoGldXl-s8Du6XKfcic3lYKUBXy-FkyQaXGtNcbjTSWOUJI/exec";


/* ==================================================
   GLOBAL
================================================== */

let allProducts = [];

let currentCategory = "ทั้งหมด";

let previousRandomIds = [];


/* ==================================================
   SAFE TEXT
================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==================================================
   NUMBER
================================================== */

function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "";
    }

    const number =
        Number(
            String(value)
                .replace(/,/g,"")
                .replace(/[^\d.-]/g,"")
        );

    if(Number.isNaN(number)){
        return escapeHTML(value);
    }

    return number.toLocaleString("th-TH");
}


/* ==================================================
   GET VALUE
   รองรับหัวตารางหลายแบบ
================================================== */

function getValue(item, keys){

    for(const key of keys){

        if(
            item &&
            item[key] !== undefined &&
            item[key] !== null &&
            String(item[key]).trim() !== ""
        ){

            return String(item[key]).trim();
        }

    }

    return "";
}


/* ==================================================
   PROVINCE
================================================== */

function getProvince(item){

    return getValue(item,[
        "province",
        "Province",
        "จังหวัด",
        "จังหวัด ",
        "provinceName",
        "location"
    ]);
}


/* ==================================================
   NORMALIZE
================================================== */

function normalizeProduct(item){

    return {

        id:getValue(item,[
            "id",
            "ID"
        ]),

        title:getValue(item,[
            "title",
            "Title",
            "ชื่อสินค้า",
            "สินค้า"
        ]),

        category:getValue(item,[
            "category",
            "Category",
            "หมวดหมู่",
            "ประเภท"
        ]),

        province:getProvince(item),

        description:getValue(item,[
            "description",
            "Description",
            "รายละเอียด"
        ]),

        salePrice:getValue(item,[
            "salePrice",
            "ราคาขาย",
            "price",
            "Price"
        ]),

        originalPrice:getValue(item,[
            "originalPrice",
            "ราคาเดิม"
        ]),

        image:getValue(item,[
            "image",
            "Image",
            "รูป",
            "รูปภาพ",
            "imageUrl"
        ]),

        affiliateUrl:getValue(item,[
            "affiliateUrl",
            "AffiliateUrl",
            "ลิงก์",
            "ลิงก์สินค้า"
        ]),

        ownUrl:getValue(item,[
            "ownUrl",
            "OwnUrl",
            "ซื้อกับเรา",
            "ลิงก์ซื้อกับเรา"
        ]),

        tags:getValue(item,[
            "tags",
            "Tags",
            "แท็ก"
        ])

    };

}


/* ==================================================
   IMAGE
================================================== */

function createImage(url,title){

    const safeTitle =
        escapeHTML(title || "สินค้า");

    if(!url){

        return `
            <div
                style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#f8fafc;
                color:#cbd5e1;
                font-size:30px;
                "
            >
                <i class="fas fa-image"></i>
            </div>
        `;
    }

    return `
        <img
            src="${escapeHTML(url)}"
            alt="${safeTitle}"
            loading="lazy"
            onerror="
                this.style.display='none';
                this.parentElement.innerHTML=
                '<i class=&quot;fas fa-image&quot; style=&quot;font-size:30px;color:#cbd5e1&quot;></i>';
            "
        >
    `;
}


/* ==================================================
   TAGS
================================================== */

function createTags(tags){

    if(!tags){
        return "";
    }

    const list =
        String(tags)
        .split(",")
        .map(x => x.trim())
        .filter(Boolean)
        .slice(0,3);

    if(!list.length){
        return "";
    }

    return `
        <div class="product-tags">

            ${list.map(tag => `
                <span class="product-tag">
                    ${escapeHTML(tag)}
                </span>
            `).join("")}

        </div>
    `;
}


/* ==================================================
   BUTTONS
================================================== */

function createButtons(item){

    const external =
        item.affiliateUrl;

    const own =
        item.ownUrl;


    if(external && own){

        return `
            <div class="product-buttons">

                <a
                    class="btn btn-external"
                    href="${escapeHTML(external)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fas fa-external-link-alt"></i>
                    ดูสินค้า
                </a>

                <a
                    class="btn btn-own"
                    href="${escapeHTML(own)}"
                >
                    <i class="fas fa-cart-shopping"></i>
                    ซื้อกับเรา
                </a>

            </div>
        `;
    }


    if(own){

        return `
            <div class="product-buttons single">

                <a
                    class="btn btn-own"
                    href="${escapeHTML(own)}"
                >
                    <i class="fas fa-cart-shopping"></i>
                    ซื้อกับเรา
                </a>

            </div>
        `;
    }


    if(external){

        return `
            <div class="product-buttons single">

                <a
                    class="btn btn-external"
                    href="${escapeHTML(external)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fas fa-external-link-alt"></i>
                    ดูสินค้า
                </a>

            </div>
        `;
    }


    return `
        <div class="product-buttons single">

            <div class="btn btn-soon">
                <i class="fas fa-clock"></i>
                เร็วๆ นี้
            </div>

        </div>
    `;

}


/* ==================================================
   PRODUCT CARD
================================================== */

function createProductCard(item){

    const province =
        item.province || "ทั่วไทย";

    const title =
        item.title || "สินค้า";

    const salePrice =
        formatPrice(item.salePrice);

    const originalPrice =
        formatPrice(item.originalPrice);


    return `

        <article class="product-card">


            <div class="product-media">

                ${
                    item.salePrice &&
                    item.originalPrice &&
                    Number(
                        String(item.originalPrice)
                        .replace(/,/g,"")
                    ) >
                    Number(
                        String(item.salePrice)
                        .replace(/,/g,"")
                    )

                    ?

                    `<div class="product-badge">
                        ราคาพิเศษ
                    </div>`

                    :

                    ""
                }


                ${createImage(
                    item.image,
                    title
                )}

            </div>



            <div class="product-body">


                <h3 class="product-title"
                    title="${escapeHTML(title)}">

                    ${escapeHTML(title)}

                </h3>



                <div
                    class="product-province"
                    title="${escapeHTML(province)}"
                >

                    <i class="fas fa-location-dot"></i>

                    <span>
                        ${escapeHTML(province)}
                    </span>

                </div>



                ${createTags(item.tags)}



                <div class="price-row">

                    ${
                        salePrice

                        ?

                        `
                        <span class="sale-price">

                            ${salePrice}

                            <span class="baht">
                                บาท
                            </span>

                        </span>
                        `

                        :

                        `
                        <span class="sale-price">
                            ติดต่อร้าน
                        </span>
                        `
                    }


                    ${
                        originalPrice

                        ?

                        `
                        <span class="original-price">
                            ${originalPrice}
                        </span>
                        `

                        :

                        ""
                    }

                </div>



                ${createButtons(item)}


            </div>

        </article>

    `;

}


/* ==================================================
   RANDOM CARD
================================================== */

function createRandomCard(item){

    return `

        <article class="random-card">


            <div class="random-image">

                ${createImage(
                    item.image,
                    item.title
                )}

            </div>


            <div class="random-info">

                </div>

                    )}"

/* ==================================================
   FILTER PRODUCTS
================================================== */

function getFilteredProducts(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    return allProducts.filter(item => {


        const matchCategory =
            currentCategory === "ทั้งหมด" ||

            String(item.category)
            .trim()
            .toLowerCase() ===
            currentCategory
            .trim()
            .toLowerCase();


        if(!matchCategory){
            return false;
        }


        if(!keyword){
            return true;
        }


        const searchText = [

            item.title,

            item.category,

            item.province,

            item.description,

            item.tags

        ]
        .join(" ")
        .toLowerCase();


        return searchText.includes(keyword);

    });

}


/* ==================================================
   RENDER PRODUCTS
================================================== */

function renderProducts(){

    const grid =
        document.getElementById(
            "productGrid"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const count =
        document.getElementById(
            "productCount"
        );


    const products =
        getFilteredProducts();


    grid.innerHTML = "";


    count.textContent =
        `${products.length} สินค้า`;


    if(!products.length){

        empty.style.display =
            "block";

        return;
    }


    empty.style.display =
        "none";


    grid.innerHTML =
        products
        .map(createProductCard)
        .join("");

}


/* ==================================================
   CATEGORY
================================================== */

function selectCategory(button){

    document
        .querySelectorAll(".category-btn")
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add("active");


    currentCategory =
        button.dataset.category;


    renderProducts();


    document
        .getElementById("randomSection")
        .classList.remove("show");

}


/* ==================================================
   RANDOM PRODUCTS
================================================== */

function showRandomProducts(){

    if(!allProducts.length){
        return;
    }


    let pool =
        [...allProducts];


    /*
       พยายามไม่ให้ซ้ำกับรอบก่อน
    */

    const newPool =
        pool.filter(item =>
            !previousRandomIds.includes(
                String(item.id)
            )
        );


    if(newPool.length >= 3){

        pool = newPool;

    }


    /*
       สุ่ม
    */

    pool.sort(
        () => Math.random() - .5
    );


    const selected =
        pool.slice(0,3);


    previousRandomIds =
        selected.map(item =>
            String(item.id)
        );


    const grid =
        document.getElementById(
            "randomGrid"
        );


    grid.innerHTML =
        selected
        .map(createRandomCard)
        .join("");


    document
        .getElementById(
            "randomCount"
        )
        .textContent =
        `${selected.length} ชิ้น`;


    document
        .getElementById(
            "randomSection"
        )
        .classList.add("show");


    document
        .getElementById(
            "randomSection"
        )
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

}


/* ==================================================
   LOAD PRODUCTS
================================================== */

async function loadProducts(){

    const loading =
        document.getElementById(
            "loading"
        );


    try{

        loading.style.display =
            "block";


        const response =
            await fetch(API_URL);


        if(!response.ok){

            throw new Error(
                "API Error"
            );

        }


        const data =
            await response.json();


        /*
          รองรับทั้ง

          [
             {...},
             {...}
          ]

          และ

          {
             data:[...]
          }
        */

        const rawProducts =
            Array.isArray(data)

            ?

            data

            :

            Array.isArray(data.data)

            ?

            data.data

            :

            [];


        allProducts =
            rawProducts
            .map(normalizeProduct)
            .filter(item =>
                item.title
            );


        loading.style.display =
            "none";


        renderProducts();


    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        loading.innerHTML = `

            <i class="fas fa-triangle-exclamation"></i>

            <p>
                โหลดสินค้าไม่สำเร็จ
            </p>

            <p style="
                font-size:10px;
                margin-top:5px;
                color:#94a3b8;
            ">
                กรุณาตรวจสอบ Google Apps Script
            </p>

        `;

    }

}


/* ==================================================
   SEARCH
================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        renderProducts
    );


/* ==================================================
   START
================================================== */

loadProducts();


</script>
