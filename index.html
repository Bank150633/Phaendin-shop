<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; --gold-light: #F5D76E; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; --card: rgba(255, 255, 255, 0.04); --pill: rgba(255, 255, 255, 0.08); 
            --red: #ff4d4d; --green: #28a745; --footer-h: 65px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* --- Header & Layout --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.15); transition: 0.3s; }
        .logo-row { text-align: center; padding: 8px 0; }
        .logo-img { height: 28px; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3)); }
        
        .banner-container { padding: 0 10px 10px; }
        .banner-slide { 
            height: 140px; display: flex; background: #000; border: 1px solid var(--gold); 
            border-radius: 15px; overflow: hidden; position: relative; cursor: pointer;
        }
        .banner-left { width: 40%; border-right: 1px solid rgba(212, 175, 55, 0.1); }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .banner-right { width: 60%; padding: 12px; display: flex; flex-direction: column; justify-content: center; background: #0a0a0a; }
        .banner-title { color: var(--gold); font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
        .banner-timer { display: flex; gap: 4px; align-items: center; }
        .time-box { background: var(--gold-grad); color: #000; padding: 2px 6px; border-radius: 5px; font-weight: 700; font-size: 12px; min-width: 25px; text-align: center; }
        .flash-tag { position: absolute; top: 0; left: 0; background: var(--red); color: #fff; padding: 2px 8px; font-size: 9px; font-weight: bold; border-bottom-right-radius: 10px; z-index: 2; }

        .nav-container { padding: 0 10px 10px; }
        #search { width: 100%; padding: 10px 15px; border-radius: 12px; border: 1px solid #333; background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 8px; outline: none; font-size: 13px; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .cat-item { font-size: 11px; color: #999; padding: 5px 14px; border-radius: 10px; background: var(--pill); white-space: nowrap; transition: 0.2s; border: 1px solid transparent; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; }

        /* --- Main Content (Small Grid) --- */
        main { margin-top: 310px; transition: 0.3s; }
        header.shrunk .banner-container { display: none; }
        header.shrunk + main { margin-top: 135px; }

        .section-label { font-size: 13px; color: var(--gold); padding: 15px 10px 8px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 10px 10px; scrollbar-width: none; }
        .rec-card { min-width: 140px; border-radius: 15px; overflow: hidden; background: var(--card); border: 1px solid rgba(255,255,255,0.05); position: relative; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid rgba(255,255,255,0.03); overflow: hidden; display: flex; flex-direction: column; }
        
        .media, .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; cursor: zoom-in; overflow: hidden; }
        .media img, .media video, .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 12px; font-weight: 400; margin-bottom: 4px; color: #eee; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
        .price { color: var(--gold-light); font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 600; padding: 8px; border-radius: 10px; border: none; font-size: 12px; cursor: pointer; }

        /* --- Nav Bottom --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--footer-h); background: rgba(10,10,10,0.98); backdrop-filter: blur(15px); border-top: 1px solid rgba(212, 175, 55, 0.2); display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
        .nav-link { color: #777; text-decoration: none; font-size: 10px; text-align: center; flex: 1; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 18px; margin-bottom: 4px; display: block; }

        /* --- Modal --- */
        .modal { display: none; position: fixed; z-index: 5000; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 15px; }
        .order-card { background: #0a0a0a; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 360px; padding: 20px; text-align: center; max-height: 90vh; overflow-y: auto; }
        .form-input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 10px; font-family: 'Kanit'; font-size: 13px; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:80px 0; color:#444; font-size: 12px;">กำลังเตรียมความหรูหรา...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;"><i class="fa-solid fa-box-open"></i> สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i>หน้าหลัก</a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck-fast"></i>พัสดุ</a>
    <a href="https://www.facebook.com/share/1BNoZAqd7W/" target="_blank" class="nav-link"><i class="fa-brands fa-facebook-messenger"></i>ติดต่อเรา</a>
</nav>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); font-size:16px; margin-bottom:15px;">ยืนยันคำสั่งซื้อ</h3>
        <div id="orderSummary" style="background:#000; padding:12px; border-radius:12px; margin-bottom:15px; text-align:left; font-size:13px;"></div>
        <form id="orderForm">
            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล *" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์ *" required>
            <textarea id="custAddress" class="form-input" rows="3" placeholder="ที่อยู่จัดส่ง *" required></textarea>
            <div style="border: 1.5px dashed var(--gold); padding: 12px; border-radius: 12px; margin-bottom:10px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <span id="upTxt" style="color:var(--gold); font-size:11px;">📸 แตะแนบสลิปโอนเงิน</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:10px; margin-top:10px;">
            </div>
            <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
            <button type="submit" id="btnSubmit" class="buy-btn" style="font-size:16px; padding: 12px;">ยืนยันการโอนเงิน</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:#555; font-size:11px; cursor:pointer;">ยกเลิกรายการ</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], dbRec = [], curCat = 'all';
    let currentData = { name: '', basePrice: 0, ship: 0 };
    let bannerEndTime = null;

    function getMedia(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }

    async function init() {
        try {
            // Load Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const textB = await resB.text();
            const b = textB.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b && b[0]) {
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide">
                        <div class="banner-left">${getMedia(b[0])}<div class="flash-tag">FLASH SALE</div></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]}</div>
                            <div class="banner-timer">
                                <div class="time-box" id="bh">00</div>:<div class="time-box" id="bm">00</div>:<div class="time-box" id="bs">00</div>
                            </div>
                        </div>
                    </div>`;
                setInterval(updateTimer, 1000);
            }

            // Load Products
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`);
            const textP = await resP.text();
            let raw = textP.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^with code]*"$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
            
            dbRec = raw.filter(p => p[5] && p[5].includes("แนะนำ")).slice(0, 6);
            dbAll = raw.filter(p => !dbRec.some(r => r[0] === p[0]));

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'flex';
            if(dbRec.length > 0) document.getElementById('rec-area').style.display = 'block';
            render();
        } catch(e) { document.getElementById('status').innerText = "โหลดข้อมูลล้มเหลว"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const itemHTML = (p, isRec) => `
            <div class="${isRec ? 'rec-card' : 'card'}">
                <div class="${isRec ? 'rec-media' : 'media'}">${getMedia(p[1])}</div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}')">สั่งซื้อ</button>
                </div>
            </div>`;

        document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join('');
        document.getElementById('main-list').innerHTML = dbAll
            .filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat))
            .map(p => itemHTML(p, false)).join('');
        
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimer() {
        if (!bannerEndTime) return;
        const diff = bannerEndTime - new Date().getTime();
        if (diff > 0) {
            document.getElementById('bh').innerText = Math.floor(diff/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        }
    }

    function openOrder(name, price, ship) {
        currentData = { name, basePrice: parseFloat(price), ship: parseFloat(ship) };
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align:center; margin-bottom:10px; border-bottom:1px solid #222; padding-bottom:10px;">
                <b style="color:var(--gold);">กสิกรไทย: 035-8-56762-2</b><br><small>นาย วัชระ ชันสิน</small>
            </div>
            <b>สินค้า:</b> ${name}<br>
            <b>ยอดโอนสุทธิ:</b> <span style="color:var(--gold); font-size:16px;">฿${(currentData.basePrice + currentData.ship).toLocaleString()}</span>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewSlip(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result;
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileInput = document.getElementById('slipFile');
        if(!fileInput.files[0]) return alert("กรุณาแนบสลิปครับ");
        
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async function() {
            const base64 = reader.result.split(',')[1];
            const payload = { 
                productDetail: currentData.name,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: base64, mimeType: fileInput.files[0].type
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
                alert("✅ แจ้งโอนสำเร็จ! ทีมงานจะดำเนินการส่งของให้เร็วที่สุด"); location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด กรุณาลองใหม่"); btn.disabled = false; }
        };
        reader.readAsDataURL(fileInput.files[0]);
    };

    async function checkTracking() {
        const phone = prompt("กรอกเบอร์โทรศัพท์ที่สั่งซื้อ:");
        if (!phone) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const text = await res.text();
            const rows = text.split('\n').slice(1).map(r => r.split(','));
            const found = rows.find(r => r[0].replace(/"/g,'') === phone);
            if(found) alert(`คุณ: ${found[1].replace(/"/g,'')}\nขนส่ง: ${found[2].replace(/"/g,'')}\nเลขพัสดุ: ${found[3].replace(/"/g,'')}`);
            else alert("ไม่พบข้อมูลพัสดุจากเบอร์โทรนี้");
        } catch(e) { alert("ผิดพลาดในการเชื่อมต่อ"); }
    }

    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
    init();
</script>
</body>
</html>
