<!-- ==================================================

<script>


/* ==================================================
   GOOGLE SHEETS API
================================================== */

const SHEET_API_URL =

"https://script.google.com/macros/s/AKfycbxqXpc-Q_2TPzyVnfFaInoGldXl-s8Du6XKfcic3lYKUBXy-FkyQaXGtNcbjTSWOUJI/exec";



/* ==================================================
   DATA
================================================== */

let products = [];

let currentCategory = "ทั้งหมด";



/* ==================================================
   CATEGORY
================================================== */

const categories = [

    "ทั้งหมด",

    "น้ำพริก",

    "ขนม",

    "ของฝาก",

    "อาหารแห้ง",

    "อาหารทะเล",

    "อาหารท้องถิ่น",

    "เครื่องปรุง",

    "เครื่องดื่ม",

    "อื่นๆ"

];



/* ==================================================
   START
================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        renderCategories();

        fetchProductsFromSheet();

    }

);



/* ==================================================
   LOAD GOOGLE SHEETS
================================================== */

function fetchProductsFromSheet() {


    const grid =

        document.getElementById(

            "productGrid"

        );


    grid.innerHTML = `

        <div class="col-span-full
                    loading-box
                    flex
                    flex-col
                    items-center
                    justify-center
                    text-gray-400">

            <i class="fa-solid
                      fa-spinner
                      fa-spin
                      text-thaiBlue
                      text-2xl
                      mb-2">
            </i>

            <p class="text-xs">

                กำลังโหลดของกิน...

            </p>

        </div>

    `;


    fetch(SHEET_API_URL)


    .then(response => {


        if (!response.ok) {

            throw new Error(

                "โหลดข้อมูลไม่สำเร็จ"

            );

        }


        return response.json();

    })


    .then(data => {


        products =

            Array.isArray(data)

            ? data

            : [];


        products =

            shuffleProducts(products);


        renderProducts(products);

    })


    .catch(error => {


        console.error(error);


        grid.innerHTML = `

            <div class="col-span-full
                        text-center
                        py-14
                        text-thaiRed">

                <i class="fa-solid
                          fa-triangle-exclamation
                          text-2xl
                          mb-2">
                </i>

                <p class="font-bold
                          text-sm">

                    โหลดข้อมูลไม่สำเร็จ

                </p>

                <p class="text-[10px]
                          text-gray-400
                          mt-1">

                    ตรวจสอบ Google Sheets Web App

                </p>

            </div>

        `;

    });

}



/* ==================================================
   SHUFFLE
================================================== */

function shuffleProducts(items) {


    const shuffled = [...items];


    for (

        let i = shuffled.length - 1;

        i > 0;

        i--

    ) {


        const j =

            Math.floor(

                Math.random() * (i + 1)

            );


        [

            shuffled[i],

            shuffled[j]

        ] = [

            shuffled[j],

            shuffled[i]

        ];

    }


    return shuffled;

}



/* ==================================================
   CATEGORY BUTTONS
================================================== */

function renderCategories() {


    const container =

        document.getElementById(

            "categoryContainer"

        );


    container.innerHTML =

        categories.map(

            cat => `

                <button

                    onclick="setCategory('${cat}')"

                    class="category-button
                           whitespace-nowrap
                           px-3
                           py-1.5
                           rounded-full
                           text-[11px]
                           border

                           ${
                               currentCategory === cat

                               ?

                               "bg-thaiRed text-white border-thaiRed"

                               :

                               "bg-white text-gray-600 border-gray-200 hover:border-thaiBlue hover:text-thaiBlue"

                           }"

                >

                    ${cat}

                </button>

            `

        ).join("");

}



/* ==================================================
   RENDER PRODUCTS
================================================== */

function renderProducts(items) {


    const grid =

        document.getElementById(

            "productGrid"

        );


    const notFound =

        document.getElementById(

            "notFound"

        );


    const count =

        document.getElementById(

            "productCount"

        );



    /* EMPTY */

    if (

        !items ||

        items.length === 0

    ) {


        grid.innerHTML = "";

        notFound.classList.remove(

            "hidden"

        );

        count.innerText = "";

        return;

    }


    notFound.classList.add(

        "hidden"

    );


    count.innerText =

        `${items.length} รายการ`;



    /* ==================================================
       CARDS
    ================================================== */

    grid.innerHTML =

        items.map(item => {


            /* ==================================================
               DATA
            ================================================== */

            const title =

                item.title ||

                "ของกินอร่อย";


            const province =

                item.province ||

                "ประเทศไทย";


            const image =

                item.image ||

                "https://placehold.co/600x600?text=FOOD";


            const affiliateUrl =

                item.affiliateUrl ||

                "#";



            /* ==================================================
               PRICE
            ================================================== */

            const salePrice =

                Number(

                    item.salePrice || 0

                );


            const originalPrice =

                Number(

                    item.originalPrice || 0

                );



            /* ==================================================
               TAGS
            ================================================== */

            const tags =

                item.tags

                ?

                String(item.tags)

                    .split(",")

                    .map(tag => {


                        tag = tag.trim();


                        if (!tag) {

                            return "";

                        }


                        let color =

                            "bg-gray-700 text-white";


                        if (

                            tag === "ส่งฟรี"

                        ) {

                            color =

                                "bg-thaiBlue text-white";

                        }


                        else if (

                            tag === "ขายดี"

                        ) {

                            color =

                                "bg-orange-500 text-white";

                        }


                        else if (

                            tag === "Flash Sale"

                        ) {

                            color =

                                "bg-yellow-400 text-black";

                        }


                        else if (

                            tag.includes("ลด")

                        ) {

                            color =

                                "bg-thaiRed text-white";

                        }


                        else if (

                            tag === "Official Store"

                        ) {

                            color =

                                "bg-purple-600 text-white";

                        }


                        return `

                            <span class="product-tag ${color}">

                                ${tag}

                            </span>

                        `;

                    })

                    .filter(

                        tag => tag !== ""

                    )

                    .slice(0, 2)

                    .join("")

                :

                "";



            /* ==================================================
               CARD
            ================================================== */

            return `

                <div class="product-card
                            bg-white
                            rounded-xl
                            overflow-hidden
                            border
                            border-gray-100
                            shadow-sm">


                    <!-- =========================
                         IMAGE
                    ========================= -->

                    <div class="image-box">


                        <img

                            src="${image}"

                            alt="${title}"

                            loading="lazy"

                            onerror="this.src='https://placehold.co/600x600?text=FOOD'"

                            class="product-image"

                        >


                    </div>



                    <!-- =========================
                         CONTENT
                    ========================= -->

                    <div class="product-content">


                        <!-- TITLE -->

                        <h3

                            class="product-title
                                   text-xs
                                   sm:text-sm
                                   font-semibold
                                   text-gray-800"

                            title="${title}"

                        >

                            ${title}

                        </h3>



                        <!-- =========================
                             TAGS
                        ========================= -->

                        ${
                            tags

                            ?

                            `

                            <div class="tag-area">

                                ${tags}

                            </div>

                            `

                            :

                            `

                            <div class="tag-area"></div>

                            `

                        }



                        <!-- =========================
                             PROVINCE
                        ========================= -->

                        <div

                            class="product-province
                                   flex
                                   items-center
                                   gap-1
                                   mt-0.5
                                   text-[9px]
                                   sm:text-[10px]
                                   text-thaiBlue"

                        >


                            <i class="fa-solid
                                      fa-location-dot">
                            </i>


                            <span class="truncate">

                                ${province}

                            </span>


                        </div>



                        <!-- =========================
                             PRICE
                        ========================= -->

                        <div class="mt-0.5">


                            <div class="flex
                                        items-baseline
                                        gap-1.5
                                        flex-wrap">


                                <span

                                    class="text-base
                                           sm:text-lg
                                           font-black
                                           text-thaiRed"

                                >

                                    ฿${salePrice.toLocaleString()}

                                </span>



                                ${
                                    originalPrice > 0

                                    ?

                                    `

                                    <span

                                        class="text-[9px]
                                               sm:text-[10px]
                                               text-gray-400
                                               line-through"

                                    >

                                        ฿${originalPrice.toLocaleString()}

                                    </span>

                                    `

                                    :

                                    ""

                                }


                            </div>


                        </div>



                        <!-- =========================
                             BUY BUTTON
                        ========================= -->

                        <a

                            href="${affiliateUrl}"

                            target="_blank"

                            rel="noopener noreferrer"

                            class="buy-button
                                   mt-1
                                   w-full
                                   text-white
                                   py-1
                                   rounded-lg
                                   text-[10px]
                                   sm:text-xs
                                   font-medium
                                   flex
                                   items-center
                                   justify-center
                                   gap-1"

                        >


                            <i class="fa-solid
                                      fa-cart-shopping">
                            </i>


                            ดูสินค้า


                        </a>


                    </div>


                </div>

            `;

        }).join("");

}



/* ==================================================
   CATEGORY FILTER
================================================== */

function setCategory(cat) {


    currentCategory = cat;


    renderCategories();


    filterProducts();

}



/* ==================================================
   SEARCH
================================================== */

function filterProducts() {


    const input =

        document.getElementById(

            "searchInput"

        );


    const searchText =

        input.value

            .toLowerCase()

            .trim();



    const filtered =

        products.filter(p => {


            const title =

                String(

                    p.title || ""

                ).toLowerCase();


            const category =

                String(

                    p.category || ""

                ).toLowerCase();


            const province =

                String(

                    p.province || ""

                ).toLowerCase();


            const description =

                String(

                    p.description || ""

                ).toLowerCase();



            const matchesCategory =

                currentCategory === "ทั้งหมด"

                ||

                p.category === currentCategory;



            const matchesSearch =

                title.includes(searchText)

                ||

                category.includes(searchText)

                ||

                province.includes(searchText)

                ||

                description.includes(searchText);



            return (

                matchesCategory &&

                matchesSearch

            );

        });



    renderProducts(filtered);

}



/* ==================================================
   RESET + RANDOM
================================================== */

function resetAndRandom() {


    const searchInput =

        document.getElementById(

            "searchInput"

        );


    searchInput.value = "";


    currentCategory =

        "ทั้งหมด";


    renderCategories();


    products =

        shuffleProducts(products);


    renderProducts(products);


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


</script>
