<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAMPHON - สยามผ่อนสบาย ผ่อนง่าย ได้ของไว</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background-color: #f6f9fc;
            color: #2b3a4a;
        }

        /* ------------------ HEADER & NAVIGATION ------------------ */
        .top-banner-bar {
            background-color: #EE4D2D;
            color: white;
            text-align: center;
            font-size: 0.8rem;
            padding: 6px 0;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .main-header {
            background-color: #0B2545;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(11, 37, 69, 0.15);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #FFFFFF;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .brand-logo span {
            color: #EE4D2D;
        }
        .search-container {
            flex: 0 1 600px;
            display: flex;
            position: relative;
        }
        .search-container input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 8px 0 0 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        .search-container input:focus {
            border-color: #EE4D2D;
        }
        .search-container button {
            background-color: #EE4D2D;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-container button:hover {
            background-color: #d73f21;
        }
        .badge-thai {
            background-color: #FFFFFF;
            color: #0B2545;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid #EE4D2D;
        }

        /* ------------------ BODY CONTAINER ------------------ */
        .wrapper {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* ------------------ HERO BANNER ------------------ */
        .hero-banner {
            background: linear-gradient(135deg, #0B2545 0%, #134074 100%);
            color: white;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(11, 37, 69, 0.1);
        }
        .hero-content h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        .hero-content p {
            color: #8da9c4;
            font-size: 1.1rem;
            max-width: 600px;
        }
        .hero-flag-decor {
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 250px;
            height: 250px;
            background: rgba(238, 77, 45, 0.15);
            border-radius: 50%;
        }

        /* ------------------ SMART CALCULATOR ------------------ */
        .intelligent-calculator {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            margin-bottom: 35px;
            border-left: 6px solid #0B2545;
        }
        .calc-header {
            font-size: 1.4rem;
            color: #0B2545;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .calc-grid { grid-template-columns: 1fr; }
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #4a5568;
        }
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background-color: #fff;
            font-size: 1rem;
            color: #2d3748;
            outline: none;
        }
        .input-group select:focus {
            border-color: #0B2545;
        }

        /* ผลลัพธ์ตารางการผ่อนแบบละเอียด */
        .advanced-result {
            margin-top: 25px;
            background: #EEF4F8;
            padding: 20px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .summary-headline {
            display: flex;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 2px solid #cbd5e0;
            margin-bottom: 15px;
        }
        .summary-headline div span {
            display: block;
            font-size: 0.85rem;
            color: #718096;
        }
        .summary-headline div strong {
            font-size: 1.3rem;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 6px;
            overflow: hidden;
        }
        .schedule-table th, .schedule-table td {
            padding: 12px 15px;
            text-align: left;
            font-size: 0.9rem;
        }
        .schedule-table th {
            background-color: #0B2545;
            color: white;
        }
        .schedule-table tr:nth-child(even) {
            background-color: #f7fafc;
        }

        /* ------------------ PRODUCT SECTIONS ------------------ */
        .tab-header {
            background-color: #FFFFFF;
            display: flex;
            border-radius: 8px 8px 0 0;
            border-bottom: 3px solid #0B2545;
            overflow: hidden;
        }
        .tab-item {
            padding: 15px 25px;
            font-weight: bold;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-item.active {
            background-color: #0B2545;
            color: white;
        }
        
        .grid-shopee {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
            margin-bottom: 50px;
        }
        .card-shopee {
            background: #FFFFFF;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
            position: relative;
        }
        .card-shopee:hover {
            transform: translateY(-4px);
            border-color: #EE4D2D;
            box-shadow: 0 6px 20px rgba(238, 77, 45, 0.15);
        }
        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* สัดส่วน 1:1 จัตุรัสแบบ Shopee */
            background-color: #f7fafc;
        }
        .image-wrapper img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        .hot-tag {
            position: absolute;
            top: 10px; left: 10px;
            background: #EE4D2D;
            color: white;
            font-size: 0.7rem;
            padding: 3px 8px;
            font-weight: bold;
            border-radius: 3px;
            z-index: 10;
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .item-name {
            font-size: 0.9rem;
            color: #2d3748;
            font-weight: 500;
            line-height: 1.5;
            height: 42px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 12px;
        }
        .item-pricing {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }
        .item-price-full {
            font-size: 1.3rem;
            color: #EE4D2D;
            font-weight: 800;
        }
        .item-installment-hint {
            font-size: 0.75rem;
            color: #718096;
            background: #fff5f5;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #fed7d7;
        }
        .btn-action-line {
            display: block;
            text-align: center;
            background-color: #EE4D2D;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-action-line:hover {
            background-color: #d73f21;
        }

        /* ------------------ FOOTER ------------------ */
        .footer-premium {
