<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #0A0A0A; --card: rgba(255, 255, 255, 0.03); --text: #FFFFFF; --text-dim: #999999;
            --input-bg: #1A1A1A; --promo-red: #E74C3C; --promo-green: #2ECC71;
        }
        body.light-mode {
            --bg: #F5F5F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; overflow-x: hidden; transition: 0.3s; }

        /* Floating Theme Toggle */
        .theme-btn { position: fixed; top: 15px; right: 15px; z-index: 2001; background: var(--gold-grad); border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Header & Nav */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 1000; padding: 12px; border-bottom: 1px solid rgba(212,175,55,0.15); }
        .logo { height: 28px; display: block; margin: 0 auto 12px; filter: drop-shadow(0 0 5px rgba(212,175,55,0.5)); }
        .search-wrap { position: relative; width: 100%; }
        #search { width: 100%; padding: 10px 18px 10px 40px; border-radius: 25px; border: 1px solid rgba(128,128,128,0.2); background: rgba(255,255,255,0.08); color: var(--text); font-size: 13px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; }

        /* Banner */
        .banner-box { margin: 105px 12px 18px; border: 1.5px solid var(--gold); border-radius: 18px; overflow: hidden; display: flex; height: 140px; background: #000; box-shadow: 0 5px 15px rgba(212,175,55,0.1); }
        .bn-img { width: 42%; cursor: zoom-in; position: relative; border-right: 1px solid rgba(212,175,55,0.15); }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { width: 58%; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .bn-title { font-size: 15px; font-weight: 600; color: var(--gold); margin-bottom: 6px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .bn-timer { display: flex; gap: 5px; margin-bottom: 12px; font-size: 11px; font-weight: 700; }
        .t-unit { background: var(--gold-grad); color: #000; padding: 2px 6px; border-radius: 5px; }
        .bn-btn { background: var(--promo-red); color: #fff; border: none; padding: 6px 16px; border-radius: 20px; font-size: 10px; font-weight: 700; animation: pulse 1.5s infinite; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; border: 1px solid rgba(128,128,128,0.08); display: flex; flex-direction: column; transition: 0.3s; }
        .card:active { transform: scale(0.98); }
        .media-wrap { width: 100%; aspect-ratio: 1/1; cursor: zoom-in; background: #000; position: relative; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        
        /* Badge Stack - แยกส่วนชัดเจน */
        .badge-container { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 10; pointer-events: none; }
        .badge { font-size: 9px; padding: 3px 10px; border-radius: 6px; font-weight: 700; color: #000; background: var(--gold-grad); box-shadow: 0 3px 6px rgba(0,0,0,0.3); letter-spacing: 0.3px; }
        .badge.green { background: var(--promo-green); color: #fff; }

        .info { padding: 12px; text-align: left; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-name { font-size: 13px; font-weight: 500; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; height: 34px; }
        .p-price { color: var(--gold); font-size: 17px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.5px; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 9px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .buy-now:active { opacity: 0.8; }

        /* Zoom & Video Fix - รับประกันเสียงดับ */
        #zoomOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; padding: 20px; }
        #zoomOverlay.show { display: flex; opacity: 1; }
        #zoomContent { position: relative; display: flex; align-items: center; justify-content: center; }
        #zoomContent img, #zoomContent video { max-width: 100%; max-height: 80vh; border: 2px solid var(--gold); border-radius: 12px; box-shadow: 0 0 25px rgba(212,175,55,0.3); }
        .close-zoom { position: absolute; top: -40px; right: 0; color: #fff; font-size: 24px; cursor: pointer; }

        /* Compact Modal - กะทัดรัด ไม่ล้นจอ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1.5px solid var(--gold); border-radius: 22px; width: 100%; max-width: 330px; padding: 18px; text-align: center; position: relative; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid rgba(128,128,128,0.25); color: var(--text); padding: 9px 15px; border-radius: 12px; margin-bottom: 9px; font-size: 13px; transition: 0.2s; }
        .form-control:focus { border-color: var(--gold); }
        .sum-box { background: rgba(212,175,55,0.08); padding: 12px; border-radius: 12px; text-align: left; margin-bottom: 12px; font-size: 12px; border-left: 4px solid var(--gold); }
        .sum-box b { font-size: 13px; color: var(--gold); }
        .qr-small { width: 120px; margin: 8px auto; padding: 8px; background: #fff; border-radius: 10px; border: 2px solid var(--gold); }
        .qr-small img { width: 100%; display: block; }
        
        /* Bottom Nav */
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid rgba(212,175,55,0.15); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); text-decoration: none; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .nav-tab.active { color: var(--gold); font-weight: 500; }
        .nav-tab i { font-size: 20px; margin-bottom: 3px; }

        /* Animations */
        @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231,76,60,0.7); } 50% { transform: scale(1.04); box-shadow: 0 0 10px 2px rgba(231,76,60,0.3); } }
        
        /* Loading */
        #status { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--text-dim); font-size: 14px; gap: 15px; grid-column: span 2; }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(212,175,55,0.1); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body id="body">

<button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>

<header>
    <img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo">
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาสินค้าหรูที่คุณต้องการ..." oninput="render()">
    </div>
</header>

<div class="banner-box" id="banner"></div>

<main class="grid" id="productGrid">
    <div id="status">
        <div class="spinner"></div>
        กำลังโหลดคอลเลกชันสุดพิเศษ...
    </div>
</main>

<div id="zoomOverlay" onclick="closeZoom()">
    <div id="zoomContent"></div>
    <i class="fa-solid fa-times close-zoom"></i>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h3 style="color:var(--gold); font-size:17px; margin-bottom:12px; font-weight:600;">ยืนยันการสั่งซื้อ</h3>
        <div class="sum-box">
            <b>ธ.กสิกรไทย: 035-8-56762-2 (วัชระ ชันสิน)</b>
            <div id="sumDetail" style="margin-top:6px; line-height:1.5;"></div>
            <div id="sumTotal" style="font-weight:700; color:var(--gold); font-size:16px; margin-top:3px; border-top:1px solid rgba(212,175,55,0.1); padding-top:3px;"></div>
        </div>
        <form id="orderForm">
            <div id="variantArea" style="display:none; text-align:left; margin-bottom:5px;">
                <label style="font-size:11px; color:var(--gold); margin-left:5px;">เลือกตัวเลือกสินค้า:</label>
                <select id="vSelect" class="form-control" onchange="calcPrice()"></select>
            </div>
            <input type="text" id="cName" class="form-control" placeholder="ชื่อ-นามสกุล ผู้รับ" required>
            <input type="tel" id="cPhone" class="form-input form-control" placeholder="เบอร์โทรศัพท์" required pattern="[0-9]{10}" title="กรุณาใส่เบอร์โทร 10 หลัก">
            <input type="text" id="cAddr" class="form-control" placeholder="ที่อยู่จัดส่ง (บ้านเลขที่, ซอย, ถนน, ตำบล, อำเภอ, จังหวัด, รหัสไปรษณีย์)" required>
            
            <div class="qr-small"><img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png" style="width:100%"></div>
            
            <div style="border:1.5px dashed rgba(212,175,55,0.5); padding:10px; border-radius:12px; margin-bottom:12px; cursor:pointer; background:rgba(212,175,55,0.03);" onclick="document.getElementById('fileIn').click()">
                <span id="upStatus" style="font-size:12px; color:var(--gold); font-weight:500;"><i class="fa-solid fa-camera" style="margin-right:5px;"></i> แตะแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" accept="image/*" onchange="handleFile(this)">
                <img id="preview" style="display:none; width:100%; border-radius:10px; margin-top:8px; border:1px solid var(--gold);">
            </div>
            <button type="submit" id="submitBtn" class="buy-now">ยืนยันคำสั่งซื้อ</button>
        </form>
        <p onclick="closeModal()" style="font-size:12px; color:var(--text-dim); margin-top:15px; cursor:pointer; text-decoration:underline;">[ ยกเลิกรายการ ]</p>
    </div>
</div>

<nav>
    <a href="#" class="nav-tab active"><i class="fa-solid fa-gem"></i>หน้าแรก</a>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-box-open"></i>เช็คพัสดุ</div>
    <div class="nav-tab" onclick="window.location.href='tel:0944159031'"><i class="fa-solid fa-comment-dots"></i>ติดต่อสอบถาม</div>
</nav>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;

    // --- Core System ---
    async function init() {
        try {
            // Load Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const bArr = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^**]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(bArr && bArr[0]) {
                bannerEnd = new Date(bArr[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-img" onclick="zoom('${bArr[0]}')">${renderMedia(bArr[0])}</div>
                    <div class="bn-txt">
                        <div class="bn-title">${bArr[1]}</div>
                        <div class="bn-timer">
                            ⏱️ <span class="t-unit" id="th">00</span>:<span class="t-unit" id="tm">00</span>:<span class="t-unit" id="ts">00</span>
                        </div>
                        <button class="bn-btn" onclick="openOrder('${bArr[1].replace(/'/g, "\\'")}',0,0,'')">สั่งซื้อด่วน!</button>
                    </div>`;
                if(!isNaN(bannerEnd)) setInterval(tick, 1000);
            } else {
                document.getElementById('banner').style.display = 'none';
                document.getElementById('productGrid').style.marginTop = '90px';
            }

            // Load Products
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1]);
            render();
        } catch(e) { 
            console.error(e); 
            document.getElementById('status').innerText = "❌ ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่";
        }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        let list = db.filter(p => p[0].toLowerCase().includes(q));
        // Shuffle only on main page without search
        if(!q) list = list.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('productGrid');
        if(list.length === 0) {
            grid.innerHTML = '<div id="status">ไม่พบสินค้าที่ค้นหา</div>';
            return;
        }

        grid.innerHTML = list.map(p => {
            // ป้ายโปรโมชั่นแยกส่วน (คอลัมน์ K)
            const badges = p[10] ? p[10].split(',').map(tag => {
                const cleanTag = tag.trim();
                const isGreen = cleanTag.includes('ส่งฟรี') || cleanTag.includes('Free');
                return `<span class="badge ${isGreen ? 'green' : ''}">${cleanTag}</span>`;
            }).join('') : '';

            return `
            <div class="card">
                <div class="badge-container">${badges}</div>
                <div class="media-wrap" onclick="zoom('${p[1]}')">${renderMedia(p[1])}</div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[3].replace(/,/g,'')).toLocaleString()}</div>
                    <button class="buy-now" onclick="openOrder('${p[0].replace(/'/g, "\\'")}', '${p[3]}', '${p[8]||0}', '${p[9].replace(/'/g, "\\'")||''}')">สั่งซื้อ</button>
                </div>
            </div>`;
        }).join('');
    }

    function renderMedia(url, controls=false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        // หน้าแรก mute ไว้ป้องกันเบราว์เซอร์บล็อก, ใน Zoom เปิดเสียง
        return isVid ? `<video src="${url}" ${controls ? 'controls muted="false"' : 'autoplay loop muted'} playsinline class="main-vid"></video>` : `<img src="${url}" loading="lazy">`;
    }

    // --- ZOOM & VIDEO FIX - แก้เสียงไม่ปิดเด็ดขาด ---
    function zoom(url) {
        const overlay = document.getElementById('zoomOverlay');
        const content = document.getElementById('zoomContent');
        content.innerHTML = renderMedia(url, true);
        overlay.classList.add('show');
        
        // ถ้าเป็นวิดีโอ ให้เปิดเสียงและเล่น
        const vid = content.querySelector('video');
        if(vid) {
            vid.muted = false;
            vid.volume = 1.0;
            vid.play().catch(e => console.log("Autoplay blocked"));
        }
    }

    function closeZoom() {
        const overlay = document.getElementById('zoomOverlay');
        const content = document.getElementById('zoomContent');
        
        // ค้นหาวิดีโอและทำลายทิ้งทันที เสียงดับแน่นอน
        const vid = content.querySelector('video');
        if(vid) {
            vid.pause();
            vid.src = ""; // ตัดการทำงานวิดีโอ
            vid.load();
        }
        
        overlay.classList.remove('show');
        setTimeout(() => { if(!overlay.classList.contains('show')) content.innerHTML = ""; }, 300); // ล้าง HTML ทิ้งหลัง Animation จบ
    }

    // --- ORDER SYSTEM - Compact & Correct Price ---
    function openOrder(n, p, s, v) {
        // ซ่อมราคา: ดึงราคาฐานและค่าส่ง
        activeP = { n, baseP: parseFloat(p.toString().replace(/,/g,'')), ship: parseFloat(s)||0 };
        const area = document.getElementById('variantArea');
        const sel = document.getElementById('vSelect');
        
        if(v && v.includes(':')) {
            area.style.display = 'block';
            sel.innerHTML = v.split(',').map(i => {
                const pair = i.split(':');
                if(pair.length !== 2) return '';
                const opt = pair[0].trim();
                const pr = parseFloat(pair[1].replace(/,/g,''));
                // ใน Option เก็บราคาเต็มไว้เลย
                return `<option value="${pr}">${opt} (฿${pr.toLocaleString()})</option>`;
            }).join('');
        } else {
            area.style.display = 'none';
            // ถ้าไม่มีตัวเลือก ใช้ราคาฐานเป็นราคาเต็ม
            sel.innerHTML = `<option value="${activeP.baseP}">ปกติ</option>`;
        }
        
        calcPrice(); // คำนวณครั้งแรก
        document.getElementById('orderModal').classList.add('show');
    }

    function calcPrice() {
        // ซ่อมราคา: ราคาตัวเลือก (ซึ่งเป็นราคาเต็ม) + ค่าส่ง
        const selectedPrice = parseFloat(document.getElementById('vSelect').value);
        const total = selectedPrice + activeP.ship;
        
        document.getElementById('sumDetail').innerHTML = `📦 <b>สินค้า:</b> ${activeP.n}<br>🚚 <b>ค่าส่ง:</b> ฿${activeP.ship.toLocaleString()}`;
        document.getElementById('sumTotal').innerText = `💰 ยอดรวมที่ต้องโอน: ฿${total.toLocaleString()}`;
    }

    function handleFile(input) {
        if(input.files[0]) {
            const upStatus = document.getElementById('upStatus');
            const preview = document.getElementById('preview');
            if(input.files[0].size > 5 * 1024 * 1024) {
                alert("ไฟล์รูปภาพใหญ่เกินไป (จำกัด 5MB)");
                input.value = "";
                return;
            }
            const r = new FileReader();
            r.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                upStatus.style.display = 'none';
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        
        if(!file) {
            alert("⚠️ กรุณาแนบสลิปโอนเงินเพื่อยืนยันออเดอร์ครับ");
            return;
        }

        btn.innerText = "⏳ กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const sel = document.getElementById('vSelect');
            const data = {
                productDetail: `${activeP.n} [${sel.options[sel.selectedIndex].text}]`,
                customerName: document.getElementById('cName').value.trim(),
                customerPhone: document.getElementById('cPhone').value.trim(),
                customerAddress: document.getElementById('cAddr').value.trim(),
                file: reader.result.split(',')[1],
                mimeType: file.type
            };
            try {
                // ส่งแบบ no-cors เพราะ Apps Script ไม่รองรับ CORS แบบ POST ปกติ
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("🎉 สั่งซื้อสำเร็จ! เจ้าหน้าที่จะรีบตรวจสอบและจัดส่งครับ");
                location.reload();
            } catch(err) { 
                alert("❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง หรือติดต่อเจ้าหน้าที่"); 
                btn.disabled = false; 
                btn.innerText = "ยืนยันคำสั่งซื้อ";
            }
        };
        reader.readAsDataURL(file);
    };

    // --- Utils ---
    function tick() {
        if(!bannerEnd || isNaN(bannerEnd)) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').id = 'ts'; // Fix ID mismatch if any
            const tsElem = document.getElementById('ts');
            if(tsElem) tsElem.innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        } else {
            document.getElementById('banner').style.display = 'none';
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        document.querySelector('.theme-btn').innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        localStorage.setItem('phaendin_theme', isLight ? 'light' : 'dark');
    }
    // Load saved theme
    if(localStorage.getItem('phaendin_theme') === 'light') toggleTheme();

    function closeModal() { document.getElementById('orderModal').classList.remove('show'); }

    async function checkShip() {
        const p = prompt("🔍 ระบุเบอร์โทรศัพท์ 10 หลัก ที่ใช้สั่งซื้อ:"); 
        if(!p || p.length < 9) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const text = await res.text();
            const rows = text.split('\n').slice(1).map(r => r.split(','));
            const cleanP = p.replace(/-/g, '').trim();
            const f = rows.find(r => r[0].replace(/"/g,'').replace(/-/g, '').trim() === cleanP);
            
            if(f) {
                alert(`📋 ข้อมูลพัสดุของคุณ ${f[1].replace(/"/g,'')}\n------------------------\n📦 สถานะ: ${f[2].replace(/"/g,'')}\n🔢 เลขพัสดุ: ${f[3].replace(/"/g,'')}`);
            } else {
                alert("❌ ไม่พบข้อมูลการจัดส่งสำหรับเบอร์โทรนี้ กรุณาตรวจสอบเบอร์อีกครั้ง หรือติดต่อเจ้าหน้าที่");
            }
        } catch(e) { alert("ล้มเหลวในการเชื่อมต่อข้อมูล"); }
    }

    // Auto mute videos when not in view (Battery saving & No noise)
    window.addEventListener('scroll', () => {
        const videos = document.querySelectorAll('.main-vid');
        videos.forEach(vid => {
            const rect = vid.getBoundingClientRect();
            if(rect.top >= 0 && rect.bottom <= window.innerHeight) {
                // Vid in view - do nothing, keep muted autoplay
            } else {
                // Vid out of view - ensure muted (browser usually does this anyway)
                vid.muted = true;
            }
        });
    });

    init();
</script>
</body>
