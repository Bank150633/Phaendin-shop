<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaendin Rent | ระบบเช่าของส่วนบุคคล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .item-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .item-card:hover { transform: translateY(-5px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .user-chip:active { scale: 0.95; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <!-- Auth Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-blue-600 z-[300] hidden items-center justify-center p-6 text-white text-center overflow-y-auto">
        <div class="max-w-sm w-full space-y-6 py-10 animate-fade-in">
            <div class="bg-white p-4 rounded-3xl inline-block shadow-2xl mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            
            <div id="authContent">
                <h1 id="authTitle" class="text-3xl font-bold mb-2">เข้าสู่ระบบ</h1>
                <p id="authDesc" class="text-blue-100 opacity-80 mb-6 text-sm">เลือกบัญชีของคุณหรือพิมพ์ชื่อเพื่อเข้าใช้งาน</p>
                
                <!-- Quick User Switcher (If users exist) -->
                <div id="quickUsers" class="flex flex-wrap justify-center gap-3 mb-8 hidden">
                    <!-- JS will inject user chips here -->
                </div>

                <div class="space-y-4">
                    <div class="text-left">
                        <label class="block text-[10px] uppercase font-bold text-blue-200 mb-1 ml-4">ชื่อเล่น / ชื่อผู้ใช้</label>
                        <input type="text" id="authUserName" placeholder="พิมพ์ชื่อของคุณ" class="w-full px-6 py-4 rounded-2xl bg-white/20 border border-white/30 text-white placeholder:text-blue-200 outline-none focus:bg-white/30 transition-all text-lg font-bold">
                    </div>
                    
                    <div class="text-left">
                        <label class="block text-[10px] uppercase font-bold text-blue-200 mb-1 ml-4">รหัสผ่าน 4 ตัว</label>
                        <div class="relative">
                            <input type="password" id="authUserPass" placeholder="••••" maxlength="4" class="w-full px-6 py-4 rounded-2xl bg-white/20 border border-white/30 text-white placeholder:text-blue-200 outline-none focus:bg-white/30 transition-all text-xl font-bold text-center tracking-[0.5em]">
                            <button onclick="togglePassVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Hint Field (Only visible in Register mode) -->
                    <div id="hintContainer" class="hidden text-left animate-fade-in">
                        <label class="block text-[10px] uppercase font-bold text-blue-200 mb-1 ml-4">คำใบ้รหัสผ่าน (กันลืม)</label>
                        <input type="text" id="authUserHint" placeholder="เช่น วันเกิดน้องแมว" class="w-full px-6 py-2 rounded-xl bg-white/10 border border-white/20 text-white placeholder:text-blue-300 outline-none text-sm">
                    </div>

                    <button id="authMainBtn" onclick="processAuth()" class="w-full bg-white text-blue-600 py-4 rounded-2xl font-black text-xl shadow-xl active:scale-95 transition-all">ตกลง</button>
                    
                    <!-- Hint Display (Only visible when wrong pass) -->
                    <p id="showHint" class="hidden text-yellow-300 text-xs mt-2 italic"></p>
                </div>

                <div class="mt-8 pt-6 border-t border-white/10">
                    <p id="switchText" class="text-sm text-blue-100">ยังไม่เคยใช้งานใช่ไหม?</p>
                    <button onclick="toggleAuthMode()" id="switchBtn" class="mt-2 text-white font-bold underline underline-offset-4 decoration-2">สมัครสมาชิกใหม่</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1.5 rounded-lg shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight leading-none">Phaendin Rent</h1>
                    <span id="currentUserDisplay" class="text-[10px] text-blue-200 font-medium"></span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAddModal()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 px-5 py-2 rounded-full font-bold transition-all transform active:scale-95 shadow-md flex items-center gap-2 text-sm md:text-base">
                    ลงของเช่า
                </button>
                <button onclick="logout()" class="p-2 text-blue-200 hover:text-white" title="ออกจากระบบ">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Search and Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="ค้นหาสินค้า หรือสถานที่..." class="w-full pl-10 pr-4 py-3 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterByCategory('ทั้งหมด')" class="category-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-transparent">ทั้งหมด</button>
                <button onclick="filterByCategory('อุปกรณ์ไอที')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">อุปกรณ์ไอที</button>
                <button onclick="filterByCategory('แคมป์ปิ้ง')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">แคมป์ปิ้ง</button>
                <button onclick="filterByCategory('เครื่องมือช่าง')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">เครื่องมือช่าง</button>
                <button onclick="filterByCategory('อื่นๆ')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">อื่นๆ</button>
            </div>
        </div>

        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
            <h3 class="text-xl font-bold text-slate-500">ไม่พบรายการเช่า</h3>
            <p class="text-slate-400 mt-2">ลองค้นหาใหม่หรือเป็นคนแรกที่ลงประกาศสินค้า!</p>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-modal">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
                <h2 id="modalTitle" class="text-xl font-bold">ลงของเช่า</h2>
                <button onclick="toggleModal(false)" class="text-white hover:rotate-90 transition-all p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l18 18" /></svg>
                </button>
            </div>
            <form id="rentForm" onsubmit="handleForm(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto no-scrollbar">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ชื่อสินค้า *</label>
                    <input type="text" id="itemName" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ราคา (บาท/วัน) *</label>
                        <input type="number" id="itemPrice" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">หมวดหมู่</label>
                        <select id="itemCategory" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="ทั่วไป">ทั่วไป</option>
                            <option value="อุปกรณ์ไอที">อุปกรณ์ไอที</option>
                            <option value="แคมป์ปิ้ง">แคมป์ปิ้ง</option>
                            <option value="เครื่องมือช่าง">เครื่องมือช่าง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">สถานที่ *</label>
                    <input type="text" id="itemLoc" required placeholder="เช่น ลาดพร้าว กทม." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">รูปภาพ (URL)</label>
                    <input type="url" id="itemImage" placeholder="https://..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">เบอร์ติดต่อ/LINE *</label>
                    <input type="text" id="itemContact" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">รายละเอียด</label>
                    <textarea id="itemDesc" rows="2" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 active:scale-95 transition-all">
                    บันทึกข้อมูล
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Alert -->
    <div id="customAlert" class="fixed inset-0 bg-black/50 z-[400] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center animate-modal">
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2"></h3>
            <p id="alertMsg" class="text-slate-500 mb-6"></p>
            <button onclick="closeAlert()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold transition-all">รับทราบ</button>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('phaendin_rent_items')) || [];
        let userAccount = JSON.parse(localStorage.getItem('phaendin_user_account')) || null;
        let registeredUsers = JSON.parse(localStorage.getItem('phaendin_registered_users')) || [];
        let currentCategory = 'ทั้งหมด';
        let isEditing = false;
        let authMode = 'login'; 

        window.onload = function() {
            checkUser();
            renderItems();
        };

        function checkUser() {
            if (!userAccount) {
                document.getElementById('loginOverlay').classList.remove('hidden');
                document.getElementById('loginOverlay').classList.add('flex');
                updateAuthUI();
                renderQuickUsers();
            } else {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('currentUserDisplay').innerText = `สวัสดีคุณ ${userAccount.username}`;
            }
        }

        function renderQuickUsers() {
            const container = document.getElementById('quickUsers');
            if (registeredUsers.length > 0 && authMode === 'login') {
                container.classList.remove('hidden');
                container.innerHTML = registeredUsers.map(u => `
                    <button onclick="selectUser('${u.username}')" class="user-chip bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-2xl flex items-center gap-2 transition-all group">
                        <div class="w-8 h-8 rounded-full bg-yellow-400 flex items-center justify-center text-blue-900 font-bold text-sm">
                            ${u.username.charAt(0).toUpperCase()}
                        </div>
                        <span class="font-bold text-sm">${u.username}</span>
                    </button>
                `).join('');
            } else {
                container.classList.add('hidden');
            }
        }

        function selectUser(name) {
            document.getElementById('authUserName').value = name;
            document.getElementById('authUserPass').focus();
            document.getElementById('showHint').classList.add('hidden');
        }

        function updateAuthUI() {
            const title = document.getElementById('authTitle');
            const desc = document.getElementById('authDesc');
            const mainBtn = document.getElementById('authMainBtn');
            const switchBtn = document.getElementById('switchBtn');
            const hintField = document.getElementById('hintContainer');

            if (authMode === 'login') {
                title.innerText = 'เข้าสู่ระบบ';
                desc.innerText = 'เลือกบัญชีที่เคยใช้ หรือพิมพ์ชื่อใหม่';
                mainBtn.innerText = 'เข้าใช้งาน';
                switchBtn.innerText = 'สมัครสมาชิกใหม่';
                hintField.classList.add('hidden');
            } else {
                title.innerText = 'สมัครสมาชิก';
                desc.innerText = 'ระบุชื่อและรหัสผ่านเพื่อจองพื้นที่ของคุณ';
                mainBtn.innerText = 'ลงทะเบียนเดี๋ยวนี้';
                switchBtn.innerText = 'มีบัญชีแล้ว? เข้าสู่ระบบ';
                hintField.classList.remove('hidden');
            }
            renderQuickUsers();
        }

        function toggleAuthMode() {
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('showHint').classList.add('hidden');
            updateAuthUI();
        }

        function togglePassVisibility() {
            const passInput = document.getElementById('authUserPass');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 014.115-5.115M9.9 9.9a3 3 0 114.2 4.2M12 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-1.378 2.875M12 12V12" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />';
            } else {
                passInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }

        function pr'customAlert'
            const user = document.getElementById('authUserName').value.trim();
            const pass = document.getElementById('authUserPass').value.trim();
            const hint = document.getElementById('authUserHint').value.trim();
            
            if (!user || pass.length !== 4) {
                showAlert("ข้อมูลไม่ครบ", "กรุณาระบุชื่อและรหัสผ่าน 4 หลัก");
                return;
            }

            if (authMode === 'register') {
                const exists = registeredUsers.find(u => u.username.toLowerCase() === user.toLowerCase());
                if (exists) {
                    showAlert("ชื่อนี้มีคนใช้แล้ว", "ลองเข้าสู่ระบบ หรือใช้ชื่ออื่นดูนะครับ");
                    return;
                }
                const newUser = { username: user, passcode: pass, hint: hint || "ไม่ได้ตั้งคำใบ้ไว้" };
                registeredUsers.push(newUser);
                localStorage.setItem('phaendin_registered_users', JSON.stringify(registeredUsers));
                userAccount = newUser;
                localStorage.setItem('phaendin_user_account', JSON.stringify(userAccount));
                checkUser();
            } else {
                const foundUser = registeredUsers.find(u => u.username.toLowerCase() === user.toLowerCase());
                if (foundUser) {
                    if (foundUser.passcode === pass) {
                        userAccount = foundUser;
                        localStorage.setItem('phaendin_user_account', JSON.stringify(userAccount));
                        checkUser();
                    } else {
                        const hintDisplay = document.getElementById('showHint');
                        hintDisplay.innerText = `คำใบ้ของคุณคือ: ${foundUser.hint}`;
                        hintDisplay.classList.remove('hidden');
                        showAlert("รหัสผ่านไม่ถูกต้อง", "ลองใช้คำใบ้ช่วยเตือนความจำนะครับ");
                    }
                } else {
                    showAlert("ไม่พบชื่อนี้", "กรุณาสมัครสมาชิกใหม่ก่อนเข้าใช้งาน");
                }
            }
            renderItems();
        }

        function logout() {
            if (confirm('ออกจากระบบ? ข้อมูลประกาศของคุณยังคงอยู่ และสามารถเข้าจัดการได้อีกเมื่อล็อกอิน')) {
                localStorage.removeItem('phaendin_user_account');
                location.reload();
            }
        }

        function showAlert(title, msg) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('customAlert').classList.remove('hidden');
            document.getElementById('customAle'customAlert'rt').classList.add('flex');
        }

        function closeAlert() {
            document.getElementById('customAlert').classList.add('hidden');
        }

        function toggleModal(show) {
            document.getElementById('modal').classList.toggle('hidden', !show);
            if (show) document.getElementById('modal').classList.add('flex');
            else document.getElementById('rentForm').reset();
        }

        function openAddModal() {
            isEditing = false;
            document.getElementById('modalTitle').innerText = 'ลงของเช่าใหม่';
            toggleModal(true);
        }

        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item || item.ownerId !== userAccount.username) return;

            isEditing = true;
            document.getElementById('modalTitle').innerText = 'แก้ไขประกาศของคุณ';
            document.getElementById('editItemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('itemLoc').value = item.loc;
            document.getElementById('itemImage').value = item.image;
            document.getElementById('itemDesc').value = item.desc;
            document.getElementById('itemContact').value = item.contact;
            toggleModal(true);
        }

        function handleForm(e) {
            e.preventDefault();
            const id = document.getElementById('editItemId').value;
            const itemData = {
                name: document.getElementById('itemName').value,
                price: document.getElementById('itemPrice').value,
                category: document.getElementById('itemCategory').value,
                loc: document.getElementById('itemLoc').value,
                image: document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1581244276891-6bc6127498f1?auto=format&fit=crop&q=80&w=500',
                desc: document.getElementById('itemDesc').value,
                contact: document.getElementById('itemContact').value,
                ownerId: userAccount.username
            };

            if (isEditing) {
                const idx = items.findIndex(i => i.id == id);
                if (idx !== -1 && items[idx].ownerId === userAccount.username) items[idx] = { ...items[idx], ...itemData };
            } else {
                items.unshift({ id: Date.now(), ...itemData });
            }

            localStorage.setItem('phaendin_rent_items', JSON.stringify(items));
            toggleModal(false);
            renderItems();
            showAlert("สำเร็จ", "ข้อมูลถูกบันทึกเรียบร้อย");
        }

        function deleteItem(id) {
            if (confirm('ยืนยันการลบประกาศนี้?')) {
                items = items.filter(i => i.id !== id || i.ownerId !== userAccount.username);
                localStorage.setItem('phaendin_rent_items', JSON.stringify(items));
                renderItems();
            }
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                const isActive = btn.textContent === cat;
                btn.className = `category-btn px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border transition-all ${isActive ? 'bg-blue-600 text-white border-transparent' : 'bg-white text-slate-600 border-slate-100 hover:bg-slate-50'}`;
            });
            renderItems();
        }

        function renderItems() {
            if (!userAccount) return;
            const grid = document.getElementById('itemsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item => {
                const text = (item.name + item.desc + item.loc).toLowerCase();
                return text.includes(search) && (currentCategory === 'ทั้งหมด' || item.category === currentCategory);
            });

            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
            grid.innerHTML = filtered.map(item => {
                const isOwner = item.ownerId === userAccount.username;
                return `
                <div class="item-card bg-white rounded-[2rem] overflow-hidden shadow-sm hover:shadow-xl border border-slate-100 flex flex-col group relative">
                    ${isOwner ? `
                    <div class="absolute top-3 right-3 z-10 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-all">
                         <button onclick="openEditModal(${item.id})" class="p-2 bg-white text-blue-600 rounded-full shadow-lg hover:bg-blue-600 hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                        </button>
                        <button onclick="deleteItem(${item.id})" class="p-2 bg-white text-red-500 rounded-full shadow-lg hover:bg-red-500 hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>` : ''}
                    <div class="h-44 bg-slate-100 relative">
                        <img src="${item.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                        <div class="absolute bottom-3 left-3 flex gap-1">
                            <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg text-[10px] font-bold shadow-md">${item.category}</span>
                            <span class="bg-black/50 backdrop-blur text-white px-2 py-0.5 rounded-lg text-[10px]">${item.loc}</span>
                        </div>
                    </div>
                    <div class="p-5 flex-grow">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-slate-800 line-clamp-1">${item.name}</h3>
                            <span class="text-blue-600 font-bold">฿${item.price}</span>
                        </div>
                        <p class="text-slate-400 text-[11px] mb-3 line-clamp-2 h-8 leading-relaxed italic">${item.desc || '-'}</p>
                        <div class="flex items-center justify-between border-t pt-4">
                            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">โดย ${item.ownerId}</span>
                            <button onclick="window.open('https://line.me/ti/p/~${item.contact}')" class="bg-green-500 text-white px-4 py-1.5 rounded-xl text-[10px] font-bold shadow-md hover:bg-green-600 active:scale-95 transition-all">ติดต่อเช่า</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
