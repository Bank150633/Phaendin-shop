<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }

        /* --- Header & Navigation --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .logo-img { height: 35px; border-radius: 4px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { position: relative; width: 100%; height: 120px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .banner-text { position: absolute; bottom: 10px; left: 15px; color: #fff; font-size: 14px; font-weight: 600; text-shadow: 2px 2px 4px #000; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        /* --- Content Layout --- */
        main { margin-top: 300px; padding-bottom: 120px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 12px; color: var(--gold); padding: 15px 15px 8px; font-weight: 600; letter-spacing: 1px; }

        /* --- Recommended (Slider) --- */
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 5px; scrollbar-width: none; }
        .rec-card { min-width: 110px; width: 110px; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #222; background: #111; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { position: absolute; bottom: 0; width: 100%; background: rgba(212, 175, 55, 0.95); color: #000; font-size: 11px; font-weight: bold; text-align: center; padding: 5px 0; }

        /* --- Product Grid --- */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 1px solid #222; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; background: #000; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 6px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 3px; }
        .desc-box { font-size: 10px; color: #777; height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 8px; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 10px; margin-top: auto; }
        .price { color: var(--gold); font-size: 17px; font-weight: 700; }
        .price-old { color: #555; font-size: 11px; text-decoration: line-through; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 8px; border-radius: 8px; cursor: pointer; }

        /* --- Footer Button --- */
        .footer-btn { position: fixed; bottom: 20px; left: 5%; width: 90%; background: var(--green); color: white; padding: 14px; border-radius: 50px; text-align: center; text-decoration: none; font-weight: bold; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }

        /* --- Modals --- */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 350px; padding: 20px; text-align: center; }
        .summary-box { background: #000; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: left; border-left: 3px solid var(--gold); font-size: 14px; }
        .confirm-link { display: block; background: var(--green); color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .modal-content { max-width: 100%; max-height: 80vh; border-radius: 8px; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide">
            <img src="https://via.placeholder.com/1200x400/111/D4AF37?text=Loading..." id="bannerImg">
            <div class="banner-text" id="bannerTxt">กำลังโหลดโปรโมชั่น...</div>
        </div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังดึงข้อมูล...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<a href="javascript:void(0)" onclick="document.getElementById('orderModal').style.display='flex'" class="footer-btn">💳 แจ้งโอนเงิน / ยืนยันคำสั่งซื้อ</a>

<div id="imgModal" class="modal" onclick="this.style.display='none'"><div id="modalBody"></div></div>
<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold)">สรุปยอดชำระ</h3>
        <div id="orderSummary" class="summary-box"></div>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" class="confirm-link">ยืนยันและส่งสลิป</a>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:12px; color:#555; font-size:12px; cursor:pointer;">ปิดหน้าต่าง</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRecommended = [], cur = 'all';

    function getMediaHTML(url, isModal = false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        const s = isModal ? 'class="modal-content"' : '';
        return isVid ? `<video src="${url}" autoplay loop muted playsinline ${s}></video>` : `<img src="${url}" loading="lazy" ${s}>`;
    }

    function openImg(url) { document.getElementById('modalBody').innerHTML = getMediaHTML(url, true); document.getElementById('imgModal').style.display = 'flex'; }

    function openOrder(name, price, ship) {
        const p = parseFloat(price) || 0;
        const s = parseFloat(ship) || 0;
        const total = p + s;
        document.getElementById('orderSummary').innerHTML = `
            <b>สินค้า:</b> ${name}<br>
            <b>ราคา:</b> ฿${p}<br>
            <b>ค่าส่ง:</b> ${s === 0 ? '<span style="color:var(--green)">ส่งฟรี</span>' : '฿'+s}<br>
            <hr style="border:0; border-top:1px solid #222; margin:8px 0;">
            <b>ยอดที่ต้องโอน: <span style="color:var(--gold); font-size:20px;">฿${total}</span></b>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    async function load() {
        try {
            // 1. Banner
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const bData = textB.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
            if(bData[0]) {
                document.getElementById('bannerImg').src = bData[0][0] || 'https://via.placeholder.com/1200x400/111/D4AF37?text=PHAENDIN+STORE';
                document.getElementById('bannerTxt').innerText = bData[0][1] || '✨ PHAENDIN STORE OFFICIAL';
            }

            // 2. Products
            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            let raw = textP.split(/\r?\n/).slice(1).map(row => 
                row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())
            ).filter(x => x[0] && x[1]);
            
            dbAll = raw; // ไม่ Shuffle เพื่อให้คุณเช็คข้อมูลได้ง่าย
            dbRecommended = raw.filter(p => p[5] && p[5].includes("แนะนำ"));

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { document.getElementById('status').innerText = "เชื่อมต่อล้มเหลว กรุณารีเฟรชหน้าเว็บ"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();

        const renderItem = (p, i, isRec = false) => {
            const target = p[7] ? new Date(p[7]).getTime() : 0;
            const isExpired = target > 0 && target - now < 0;
            
            // LOGIC: ถ้าหมดเวลา ใช้ราคาเต็ม (E) ถ้ายังไม่หมด ใช้ราคาลด (D)
            let finalPrice = (isExpired && p[4]) ? p[4] : p[3];
            let oldPrice = (isExpired) ? null : p[4];

            if(isRec) {
                return `<div class="rec-card">
                    <div class="rec-media" onclick="openImg('${p[1]}')">${getMediaHTML(p[1])}</div>
                    <div class="rec-price" onclick="openOrder('${p[0]}','${finalPrice}','${p[8]}')">฿${finalPrice}</div>
                </div>`;
            }

            return `<div class="card">
                <div class="media" onclick="openImg('${p[1]}')">
                    ${p[7] && p[7].length > 5 ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}
                    ${getMediaHTML(p[1])}
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="desc-box">${p[2] || 'รายละเอียดสินค้า'}</div>
                    <div class="price-row">
                        <div class="price">฿${finalPrice}</div>
                        ${oldPrice ? `<div class="price-old">฿${oldPrice}</div>` : ''}
                    </div>
                    <div class="buy-btn" onclick="openOrder('${p[0]}','${finalPrice}','${p[8]}')">สั่งซื้อ</div>
                </div>
            </div>`;
        };

        // Render Recommended
        if(dbRecommended.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRecommended.map((p, i) => renderItem(p, i, true)).join('');
        } else { document.getElementById('rec-area').style.display = 'none'; }

        // Render All
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (cur === 'all' || p[6] === cur));
        document.getElementById('main-list').innerHTML = filt.map((p, i) => renderItem(p, i)).join('');

        // Render Categories
        const categories = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = categories.map(c => `
            <span class="cat-item ${cur === c[0] ? 'active' : ''}" onclick="cur='${c[0]}';render()">${c[1]}</span>
        `).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        let needRefresh = false;
        document.querySelectorAll('.timer-badge').forEach(el => {
            const target = new Date(el.getAttribute('data-time')).getTime();
            const dist = target - now;
            if (dist < 0) {
                if(el.innerHTML !== "จบโปรโมชั่น") { el.innerHTML = "จบโปรโมชั่น"; el.style.background = "#444"; needRefresh = true; }
            } else {
                const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
        if(needRefresh) render(); // สลับราคาขายทันทีเมื่อหมดเวลา
    }

    load();
    window.onscroll = () => { const h = document.getElementById("mainHeader"); window.scrollY > 40 ? h.classList.add("shrunk") : h.classList.remove("shrunk"); };
</script>
</body>
</html>
