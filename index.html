<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHAENDIN SHOP PRO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:sans-serif;
background:#0b0b0b;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#111;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-weight:bold;
color:#00eaff;
font-size:18px;
}

.search{
width:100%;
padding:10px;
border:none;
border-radius:8px;
margin:10px 0;
}

.container{
padding:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:12px;
}

.card{
background:#181818;
border-radius:10px;
overflow:hidden;
position:relative;
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.name{
padding:6px;
font-size:14px;
}

.price{
padding:6px;
color:#00eaff;
font-weight:bold;
}

.btn{
background:#00eaff;
border:none;
padding:8px;
border-radius:8px;
width:90%;
margin:10px auto;
display:block;
cursor:pointer;
}

.badge{
position:absolute;
top:6px;
left:6px;
background:red;
font-size:11px;
padding:3px 6px;
border-radius:6px;
}

.viewer{
font-size:11px;
color:#aaa;
padding-left:6px;
}

.fav{
position:absolute;
top:6px;
right:6px;
cursor:pointer;
}

.cart-btn{
position:fixed;
bottom:20px;
right:20px;
background:#00eaff;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
color:black;
z-index:999;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
}

.modal-box{
background:#111;
padding:20px;
border-radius:10px;
width:90%;
max-width:400px;
}

input,select{
width:100%;
padding:10px;
border:none;
border-radius:6px;
margin-top:6px;
}

body.light{
background:#f2f2f2;
color:black;
}

.banner{
background:linear-gradient(45deg,#00eaff,#0077ff);
padding:15px;
text-align:center;
font-weight:bold;
}

.countdown{
font-size:13px;
}

</style>
</head>

<body>

<header>
<div class="logo">PHAENDIN SHOP</div>
<i class="fa fa-moon" onclick="toggleTheme()"></i>
</header>

<div class="banner">
FLASH SALE 🔥
<div class="countdown" id="countdown"></div>
</div>

<div class="container">

<input id="search" class="search" placeholder="ค้นหาสินค้า">

<div id="products" class="grid"></div>

</div>

<div class="cart-btn" onclick="openCart()">
<i class="fa fa-shopping-cart"></i>
</div>

<div class="modal" id="cartModal">
<div class="modal-box">

<h3>ตะกร้าสินค้า</h3>

<div id="cartItems"></div>

<hr>

รวม <span id="total">0</span> บาท

<button class="btn" onclick="checkout()">สั่งซื้อ</button>

<button class="btn" onclick="closeCart()">ปิด</button>

</div>
</div>

<div class="modal" id="orderModal">
<div class="modal-box">

<h3>กรอกข้อมูลจัดส่ง</h3>

<input id="name" placeholder="ชื่อผู้รับ">

<input id="phone" placeholder="เบอร์โทร">

<input id="address" placeholder="ที่อยู่">

<select id="province">
<option>กรุงเทพ</option>
<option>เชียงใหม่</option>
<option>ขอนแก่น</option>
<option>ชลบุรี</option>
</select>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=promptpay" width="100%">

<input type="file" id="slip">

<button class="btn" onclick="submitOrder()">ส่งคำสั่งซื้อ</button>

</div>
</div>

<script>

let products=[
{id:1,name:"เสื้อยืด PHAENDIN",price:199,img:"https://picsum.photos/300?1"},
{id:2,name:"รองเท้าผ้าใบ",price:590,img:"https://picsum.photos/300?2"},
{id:3,name:"หมวกแฟชั่น",price:150,img:"https://picsum.photos/300?3"},
{id:4,name:"กระเป๋าแฟชั่น",price:390,img:"https://picsum.photos/300?4"},
{id:5,name:"เสื้อฮู้ด PHAENDIN",price:690,img:"https://picsum.photos/300?5"}
]

let cart=[]

let favorites=JSON.parse(localStorage.getItem("fav")||"[]")

function viewers(){
return Math.floor(Math.random()*80)+20
}

function render(list=products){

const grid=document.getElementById("products")
grid.innerHTML=""

list.forEach(p=>{

let sold=Math.floor(Math.random()*500)

grid.innerHTML+=`

<div class="card">

${sold>300?'<div class="badge">ขายดี</div>':''}

<div class="fav" onclick="toggleFav('${p.name}')">

<i class="fa-solid fa-heart" style="color:${favorites.includes(p.name)?'red':'#aaa'}"></i>

</div>

<img src="${p.img}" loading="lazy">

<div class="name">${p.name}</div>

<div class="price">${p.price} บาท</div>

<div class="viewer">👁️ ${viewers()} คนกำลังดู</div>

<button class="btn" onclick="addCart(${p.id})">ใส่ตะกร้า</button>

</div>

`

})

}

render()

function toggleFav(name){

if(favorites.includes(name)){
favorites=favorites.filter(x=>x!==name)
}else{
favorites.push(name)
}

localStorage.setItem("fav",JSON.stringify(favorites))

render()

}

function addCart(id){

const p=products.find(x=>x.id==id)

cart.push(p)

updateCart()

}

function updateCart(){

const box=document.getElementById("cartItems")

box.innerHTML=""

let total=0

cart.forEach(c=>{

total+=c.price

box.innerHTML+=`<div>${c.name} - ${c.price}</div>`

})

document.getElementById("total").innerText=total

}

function openCart(){

document.getElementById("cartModal").style.display="flex"

updateCart()

}

function closeCart(){

document.getElementById("cartModal").style.display="none"

}

function checkout(){

document.getElementById("orderModal").style.display="flex"

}

function submitOrder(){

alert("ส่งคำสั่งซื้อเรียบร้อย")

cart=[]

closeCart()

document.getElementById("orderModal").style.display="none"

}

document.getElementById("search").addEventListener("input",e=>{

const q=e.target.value.toLowerCase()

const filtered=products.filter(p=>p.name.toLowerCase().includes(q))

render(filtered)

})

function toggleTheme(){

document.body.classList.toggle("light")

}

let end=new Date().getTime()+3600000

setInterval(()=>{

let now=new Date().getTime()

let d=end-now

let m=Math.floor(d/60000)

let s=Math.floor((d%60000)/1000)

document.getElementById("countdown").innerText="หมดเวลาใน "+m+" : "+s

},1000)

</script>

</body>
</html>
