<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS เดิมของคุณทั้งหมด --- */
        :root { 
            --gold: #D4AF37; --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode { --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 55px; transition: 0.3s; overflow-x: hidden; }
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 5px 10px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; height: 50px; }
        .logo-img { height: 45px; width: auto; }
        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 13px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .banner-box { padding: 8px; margin-top: 5px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; height: 220px; background: #000; position: relative; }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%); z-index: 2; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; }
        .bn-title { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.2; }
        .bn-timer-wrap { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .bn-timer { display: flex; gap: 4px; align-items: center; }
        .timer-unit { color: #ff4b2b; font-weight: 700; font-size: 13px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: contain; }
        .p-timer-badge { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 65, 108, 0.9); color: #fff; font-size: 8.5px; text-align: center; padding: 2px 0; font-weight: bold; z-index: 6; }
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 3px; z-index: 5; }
        .badge { font-size: 7px; padding: 2px 5px; border-radius: 3px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .bg-gold { background: var(--gold-grad); color: #000; }
        .bg-red { background: var(--red-grad); }
        .province-badge { position: absolute; top: 4px; right: 4px; background: var(--gold-grad); color: #000; font-size: 7.5px; padding: 2px 5px; border-radius: 4px; font-weight: 700; z-index: 10; }
        .info { padding: 4px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .p-name { font-size: 10px; font-weight: 500; color: var(--gold); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .p-desc { font-size: 8px; color: var(--text-dim); text-align: center; line-height: 1.1; height: 18px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-size: 12px; font-weight: 700; color: #fff; margin-top: auto; display: flex; gap: 4px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 9px; }
        .new-price { color: #ff4b2b; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 6px 0; font-weight: 700; font-size: 10px; cursor: pointer; text-transform: uppercase; position: relative; overflow: hidden; }
        .buy-now::after { content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255, 255, 255, 0.4); transform: rotate(30deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }
        
        /* Modal Style แก้ไขให้เป็น Stepper ตามรูป 1205.jpg */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 5px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 320px; padding: 10px; max-height: 95vh; overflow-y: auto; }
        .opt-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; margin-bottom: 6px; border: 1px solid rgba(212,175,55,0.1); }
        .stepper { display: flex; align-items: center; gap: 10px; }
        .step-btn { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
        .input-slim { width: 100%; padding: 6px; margin-bottom: 4px; border-radius: 6px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 11px; outline: none; }
        nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 8px; }
        .nav-tab.active { color: var(--gold); }
        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
        .copy-badge { cursor: pointer; background: rgba(212,175,55,0.2); padding: 2px 6px; border-radius: 4px; color: var(--gold); font-size: 10px; }
    </style>
</head>
<body class="dark-mode">

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img">
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
</div>

<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:8px; font-size:13px;">ยืนยันการสั่งซื้อ</h4>
        <div id="orderDetail" style="background:rgba(212,175,55,0.08); padding:8px; border-radius:10px; margin-bottom:8px; border:1px solid rgba(212,175,55,0.3);"></div>
        
        <div id="multiOptionBox"></div>

        <form id="orderForm">
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:45px;"></textarea>
            
            <div style="text-align:center; margin: 5px 0; background:rgba(255,255,255,0.03); padding:8px; border-radius:10px; border:1px solid rgba(212,175,55,0.1);">
                <p style="font-size:10px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2</p>
                <p style="font-size:12px; color:#fff;">0358567622 <span class="copy-badge" onclick="copyToClipboard('0358567622')">คัดลอก</span></p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:70px; margin-top:5px; border-radius:6px;">
            </div>
            
            <div style="border:1px dashed var(--gold); padding:6px; border-radius:8px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:9px; color:var(--gold);">📸 คลิกแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:60px; margin:5px auto; border-radius:4px;">
            </div>
            
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:8px; border-radius:8px; padding: 10px 0;">ยืนยันสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:6px; font-size:10px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;

    async function init() {
        try {
            // ดึง Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const bRaw = await resB.text();
            const b = bRaw.split('\n')[1]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-badges">${[b[3], b[4], b[5]].filter(t => t && t !== '-').map(t => `<span class="badge ${t.includes('โปร')?'bg-red':'bg-gold'}">${t}</span>`).join('')}</div>
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">🔥 ${b[1]}</div>
                            <div class="bn-timer-wrap"><div class="bn-timer"><span class="timer-unit" id="th">00</span><span class="timer-sep">:</span><span class="timer-unit" id="tm">00</span><span class="timer-sep">:</span><span class="timer-unit" id="ts">00</span></div></div>
                            <button class="buy-now" style="width:100px; border-radius:50px;" onclick="handleBannerClick('${b[1]}')">รับสิทธิ์ด่วน</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            // ดึงสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const pRaw = await resP.text();
            db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
            setInterval(updateProductTimers, 1000);
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();
        document.getElementById('productGrid').innerHTML = db.filter(p => p[0].toLowerCase().includes(query)).map((p, idx) => {
            let pNormal = parseFloat(p[3]||0), pPromo = parseFloat(p[10]||0), exp = p[11]?new Date(p[11]).getTime():0;
            let curPrice = (pPromo > 0 && exp > now) ? pPromo : pNormal;
            let disc = curPrice < pNormal ? Math.round((pNormal-curPrice)/pNormal*100) : 0;

            return `
            <div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">
                        ${disc > 0 ? `<span class="badge bg-red">ลด ${disc}%</span>` : ''}
                        ${[p[4],p[5],p[6],p[7]].filter(t => t && t !== '-' && !t.includes('%')).map(t => `<span class="badge bg-gold">${t}</span>`).join('')}
                    </div>
                    ${p[13] ? `<div class="province-badge">${p[13]}</div>` : ''}
                    ${renderMedia(p[1], true)}
                    ${(pPromo > 0 && exp > now) ? `<div class="p-timer-badge" data-expire="${p[11]}">⏳ 00:00:00</div>` : ''}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-desc">${p[2]||''}</div>
                    <div class="p-price">
                        ${curPrice < pNormal ? `<span class="old-price">฿${pNormal.toLocaleString()}</span>` : ''}
                        <span class="${curPrice < pNormal ? 'new-price' : ''}">฿${curPrice.toLocaleString()}</span>
                    </div>
                </div>
                <button class="buy-now" onclick="openMultiOrder(${db.indexOf(p)})">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function openMultiOrder(idx) {
        const p = db[idx];
        const now = new Date().getTime();
        let pNormal = parseFloat(p[3]||0), pPromo = parseFloat(p[10]||0), exp = p[11]?new Date(p[11]).getTime():0;
        let curPrice = (pPromo > 0 && exp > now) ? pPromo : pNormal;
        
        activeP = { 
            name: p[0], 
            ship: parseFloat(p[8] || 0), 
            limit: parseInt(p[12]||10), 
            img: p[1], 
            items: [] 
        };
        
        let optStr = p[9];
        let options = (optStr && optStr !== '-') ? optStr.split(',') : [`${p[0]}:${curPrice}`];
        const box = document.getElementById('multiOptionBox');
        box.innerHTML = '';
        
        options.forEach((opt, i) => {
            let pts = opt.includes(':') ? opt.split(':') : opt.split('=');
            let label = pts[0].trim();
            let price = pts[1] ? parseFloat(pts[1]) : curPrice;
            activeP.items.push({ label, price, qty: i === 0 ? 1 : 0 });

            box.innerHTML += `
                <div class="opt-row">
                    <div>
                        <div style="font-size:11px; color:#fff;">${label}</div>
                        <div style="font-size:10px; color:var(--gold);">฿${price.toLocaleString()}</div>
                    </div>
                    <div class="stepper">
                        <button type="button" class="step-btn" onclick="updateMQty(${i}, -1)">-</button>
                        <span id="mqty_${i}" style="min-width:20px; text-align:center;">${activeP.items[i].qty}</span>
                        <button type="button" class="step-btn" onclick="updateMQty(${i}, 1)">+</button>
                    </div>
                </div>`;
        });
        calculateTotal();
        openModal('orderModal');
    }

    function updateMQty(i, v) {
        let totalCurrentQty = activeP.items.reduce((s, item) => s + item.qty, 0);
        let newQty = activeP.items[i].qty + v;
        if(newQty >= 0 && (v < 0 || totalCurrentQty < activeP.limit)) {
            activeP.items[i].qty = newQty;
            document.getElementById(`mqty_${i}`).innerText = newQty;
            calculateTotal();
        }
    }

    function calculateTotal() {
        let itemSum = activeP.items.reduce((s, i) => s + (i.qty * i.price), 0);
        let totalQty = activeP.items.reduce((s, i) => s + i.qty, 0);
        let grand = totalQty > 0 ? itemSum + activeP.ship : 0;
        activeP.finalSum = grand; activeP.finalQty = totalQty;

        document.getElementById('orderDetail').innerHTML = `
            <div style="display:flex; gap:10px; align-items:center;">
                <img src="${activeP.img}" style="width:50px; height:50px; border-radius:5px; object-fit:cover;">
                <div style="flex:1;">
                    <div style="font-size:11px; color:var(--gold); font-weight:600;">${activeP.name}</div>
                    <div style="font-size:9px; color:var(--text-dim);">ค่าส่ง ฿${activeP.ship} | จำกัด ${activeP.limit} ชิ้น</div>
                </div>
            </div>
            <div style="text-align:center; font-size:18px; font-weight:800; color:#fff; border-top:1px dashed #444; margin-top:8px; padding-top:5px;">
                ยอดสุทธิ: ฿${grand.toLocaleString()}
            </div>`;
    }

    function handleBannerClick(name) {
        let idx = db.findIndex(p => p[0] === name);
        if(idx !== -1) openMultiOrder(idx);
    }

    function updateProductTimers() {
        document.querySelectorAll('.p-timer-badge').forEach(el => {
            let d = new Date(el.dataset.expire).getTime() - Date.now();
            if(d>0) {
                let h=Math.floor(d/3600000).toString().padStart(2,'0'), m=Math.floor((d%3600000)/60000).toString().padStart(2,'0'), s=Math.floor((d%60000)/1000).toString().padStart(2,'0');
                el.innerText = `⏳ ${h}:${m}:${s}`;
            } else { el.style.display='none'; }
        });
    }

    function renderMedia(u, m) { return u.match(/\.(mp4|webm|mov)$/i) ? `<video src="${u}" ${m?'autoplay loop muted playsinline':'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${u}" style="width:100%; height:100%; object-fit:contain;">`; }
    function zoom(u) { document.getElementById('zoomContent').innerHTML = renderMedia(u, false); document.getElementById('zoomOverlay').style.display='flex'; }
    function closeZoom() { document.getElementById('zoomOverlay').style.display='none'; }
    function openModal(id) { let m=document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { let m=document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none',300); }
    function copyToClipboard(t) { navigator.clipboard.writeText(t); alert("คัดลอกแล้ว"); }
    function handleFile(i) { if(i.files[0]) { let r=new FileReader(); r.onload=e=>{document.getElementById('preview').src=e.target.result; document.getElementById('preview').style.display='block'; document.getElementById('upTxt').style.display='none';}; r.readAsDataURL(i.files[0]); } }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function tick() { if(!bannerEnd) return; let d=bannerEnd-Date.now(); if(d>0) { document.getElementById('th').innerText=Math.floor(d/3600000).toString().padStart(2,'0'); document.getElementById('tm').innerText=Math.floor((d%3600000)/60000).toString().padStart(2,'0'); document.getElementById('ts').innerText=Math.floor((d%60000)/1000).toString().padStart(2,'0'); } }
    
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        if(activeP.finalQty === 0) return alert("เลือกสินค้าก่อนครับ");
        let btn = document.getElementById('submitBtn'), file = document.getElementById('fileIn').files[0];
        if(!file) return alert("แนบสลิปด้วยครับ");
        btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        let r = new FileReader();
        r.onload = async () => {
            let items = activeP.items.filter(i=>i.qty>0).map(i=>`${i.label}(${i.qty})`).join(', ');
            let data = {
                productDetail: `${activeP.name}: ${items} | รวม ฿${activeP.finalSum}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: r.result.split(',')[1]
            };
            await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
            alert("สั่งซื้อสำเร็จ!"); location.reload();
        };
        r.readAsDataURL(file);
    };

    init();
</script>
</body>
</html>
