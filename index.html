<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 180px; } 

        /* Header & Banner */
        header { position: fixed; top: 0; width: 100%; background: #000; z-index: 2000; border-bottom: 1px solid #222; }
        .logo-row { display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .logo-img { height: 32px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { width: 100%; height: 140px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Search & Categories (ที่เคยหายไป) */
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 8px; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 12px; color: #aaa; padding: 6px 16px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        /* Content Layout */
        main { margin-top: 300px; }
        .section-label { font-size: 14px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }

        /* Recommended Section (ที่เคยหายไป) */
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
        .rec-card { min-width: 130px; border-radius: 12px; overflow: hidden; border: 1px solid #222; background: #111; }
        .rec-media { width: 100%; aspect-ratio: 1/1; cursor: pointer; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { background: var(--gold); color: #000; font-size: 13px; font-weight: bold; text-align: center; padding: 8px 0; }

        /* Grid Cards */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 1px solid #222; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; background: #000; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; }
        
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; margin-bottom: 8px; height: 38px; overflow: hidden; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-top: auto; padding-bottom: 8px; }
        .price { color: var(--gold); font-size: 17px; font-weight: 700; }
        .price-old { color: #555; font-size: 11px; text-decoration: line-through; }
        
        /* ปุ่มสั่งซื้อ (ที่เคยหายไป) */
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; border: none; }

        /* Footer (ปุ่มแจ้งโอน) */
        .footer-fixed { position: fixed; bottom: 25px; left: 5%; width: 90%; background: var(--green); color: white; padding: 16px; border-radius: 50px; text-align: center; font-weight: bold; z-index: 3000; box-shadow: 0 8px 25px rgba(0,0,0,0.7); cursor: pointer; font-size: 16px; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-body { max-width: 90%; max-height: 80vh; }
        .modal-body img, .modal-body video { width: 100%; height: auto; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide"><img id="bannerImg" src="" onerror="this.style.display='none'"></div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<div class="footer-fixed" onclick="window.open('https://forms.gle/RnbG77r84NixsEaLA', '_blank')">
    💰 แจ้งโอนเงิน / ยืนยันคำสั่งซื้อ
</div>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody" class="modal-body"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], cur = 'all';

    function createMedia(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }

    function openMedia(url) {
        document.getElementById('modalBody').innerHTML = createMedia(url);
        document.getElementById('mediaModal').style.display = 'flex';
    }

    async function loadData() {
        try {
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const bLines = textB.split(/\r?\n/).slice(1);
            if(bLines[0]) {
                const bUrl = bLines[0].split(',')[0].replace(/"/g,'');
                document.getElementById('bannerImg').src = bUrl;
            }

            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            const raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            dbAll = raw;
            dbRec = raw.filter(p => p[5] === 'แนะนำ');
            
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();

        const getPrice = (p) => {
            const target = p[7] ? new Date(p[7]).getTime() : 0;
            const expired = target > 0 && target < now;
            return {
                sale: (expired || !p[4]) ? p[3] : p[4],
                old: (!expired && p[4]) ? p[3] : null
            };
        };

        // สินค้าแนะนำ
        if(dbRec.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRec.map(p => {
                const pd = getPrice(p);
                return `<div class="rec-card">
                    <div class="rec-media" onclick="openMedia('${p[1]}')">${createMedia(p[1])}</div>
                    <div class="rec-price">฿${pd.sale}</div>
                </div>`;
            }).join('');
        } else { document.getElementById('rec-area').style.display = 'none'; }

        // สินค้าทั้งหมด
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (cur === 'all' || p[6] === cur));
        document.getElementById('main-list').innerHTML = filt.map(p => {
            const pd = getPrice(p);
            return `<div class="card">
                <div class="media" onclick="openMedia('${p[1]}')">
                    ${p[7] ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}
                    ${createMedia(p[1])}
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price-row">
                        <span class="price">฿${pd.sale}</span>
                        ${pd.old ? `<span class="price-old">฿${pd.old}</span>` : ''}
                    </div>
                    <div class="buy-btn" onclick="openMedia('${p[1]}')">รายละเอียด</div>
                </div>
            </div>`;
        }).join('');

        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${cur === c[0] ? 'active' : ''}" onclick="cur='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const dist = new Date(el.dataset.time).getTime() - now;
            if (dist < 0) { el.innerHTML = "จบโปรโมชั่น"; el.style.background = "#444"; }
            else {
                const h = String(Math.floor(dist / 3600000)).padStart(2, '0');
                const m = String(Math.floor((dist % 3600000) / 60000)).padStart(2, '0');
                const s = String(Math.floor((dist % 60000) / 1000)).padStart(2, '0');
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    loadData();
</script>
</body>
</html>
