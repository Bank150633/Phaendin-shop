<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | PREMIUM 3-COL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 50px; padding-bottom: 65px; transition: 0.3s; overflow-x: hidden; }

        /* Header - Slim & Clean */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 8px 12px; border-bottom: 1px solid rgba(212,175,55,0.3); }
        .search-wrap { position: relative; max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
        #search { flex-grow: 1; padding: 6px 12px 6px 35px; border-radius: 20px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 11px; outline: none; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 12px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 26px; height: 26px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; flex-shrink: 0; }

        /* Banner ใหม่ - Minimalist Wide (แก้จุดที่ขัดตา) */
        .banner-box { padding: 0; margin-bottom: 5px; }
        .bn-card { 
            position: relative; width: 100%; height: 130px; background: #000; overflow: hidden; border: none; 
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; opacity: 0.65; }
        .bn-txt { 
            position: absolute; inset: 0; padding: 15px; display: flex; flex-direction: column; 
            justify-content: center; align-items: flex-start;
            background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%);
        }
        .bn-title { font-size: 15px; font-weight: 600; color: var(--gold); margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .bn-timer { 
            display: flex; gap: 4px; font-size: 10px; color: #fff; background: rgba(212, 175, 55, 0.2);
            padding: 3px 10px; border-radius: 20px; backdrop-filter: blur(5px); border: 0.5px solid rgba(212, 175, 55, 0.3);
        }
        .bn-btn { margin-top: 10px; background: var(--gold-grad); border: none; padding: 5px 15px; font-size: 10px; font-weight: 700; border-radius: 4px; color: #000; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-transform: uppercase; }

        /* Grid - 3 คอลัมน์ (เห็นสินค้าเยอะๆ) */
        .sec-title { padding: 12px 12px 2px; font-size: 12px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
        
        /* Card สินค้า - ปรับสัดส่วนให้เพรียว */
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: contain; }
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 2px; z-index: 2; }
        .badge { font-size: 7px; padding: 1px 4px; border-radius: 3px; font-weight: 700; color: #000; background: var(--gold-grad); }

        /* Info - จัดเรียงระเบียบใหม่ */
        .info { padding: 6px 4px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .p-name { font-size: 10px; font-weight: 500; color: var(--gold); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-desc { font-size: 8.5px; color: var(--text-dim); text-align: center; line-height: 1.2; height: 21px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .p-price { font-size: 13px; font-weight: 700; color: #fff; margin-top: auto; }
        
        /* ปุ่มสั่งซื้อ Metallic Shine */
        .buy-now { 
            width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 8px 0; 
            font-weight: 700; font-size: 10px; cursor: pointer; border-radius: 0 0 10px 10px;
            text-transform: uppercase; position: relative; overflow: hidden;
        }
        .buy-now::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.4); transform: rotate(30deg); animation: shine 4s infinite;
        }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }

        /* Modals & Form */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 16px; width: 100%; max-width: 310px; padding: 18px; max-height: 90vh; overflow-y: auto; }
        .opt-sel { width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 8px; background: #1a1a1a; color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.4); font-size: 12px; outline: none; }
        .input-slim { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 12px; outline: none; }

        /* Nav Bar - Bottom */
        nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 9px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 16px; margin-bottom: 2px; }

        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<header>
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
    </div>
</header>

<div class="banner-box" id="banner"></div>

<div class="sec-title"><i class="fa-solid fa-fire-flame-curved"></i> สินค้าแนะนำ</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center;">
        <h3 style="color:var(--gold); margin-bottom:20px; font-size:16px;">ช่องทางการติดต่อ</h3>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:12px; border-radius:10px; text-decoration:none; margin-bottom:10px; font-size:14px;"><i class="fa-solid fa-phone"></i> โทรสายด่วน</a>
        <a href="https://line.me/ti/p/YOUR_ID" style="display:block; background:#06c755; color:#fff; padding:12px; border-radius:10px; text-decoration:none; margin-bottom:10px; font-size:14px;"><i class="fa-brands fa-line"></i> Line Official</a>
        <p onclick="closeModal('contactModal')" style="color:var(--text-dim); cursor:pointer; margin-top:15px; font-size:12px;">[ ปิดหน้าต่าง ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:10px; font-size:15px;">สรุปการสั่งซื้อ</h4>
        <div id="orderDetail" style="font-size:11px; background:rgba(212,175,55,0.08); padding:10px; border-radius:10px; margin-bottom:15px; border-left: 4px solid var(--gold); color:#fff;"></div>
        <form id="orderForm">
            <div id="optionBox"></div>
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="text-align:center; margin: 10px 0;">
                <p style="font-size:10px; color:var(--gold);">โอนที่: กสิกร 035-8-56762-2</p>
                <img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png" style="width:110px; border:2px solid var(--gold); border-radius:10px; margin-top:5px; background:#fff; padding:2px;">
            </div>

            <div style="border:2px dashed var(--gold); padding:12px; border-radius:10px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:11px; color:var(--gold)">📸 แนบสลิปการโอน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:100%; margin-top:8px; border-radius:8px;">
            </div>
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:15px; border-radius:10px; height:45px;">ยืนยันสั่งซื้อสินค้า</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:12px; font-size:12px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;

    // ระบบสุ่มสินค้า (Shuffle) - ห้ามลบ
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">${b[1]}</div>
                            <div class="bn-timer">⏳ <span id="th">00</span>:<span id="tm">00</span>:<span id="ts">00</span></div>
                            <button class="bn-btn" onclick="openOrder('${b[1]}',0,0,'')">รับสิทธิ์ด่วน</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            // โหลดรายการสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            const rawData = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            db = shuffle(rawData); 
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">${p[10]?p[10].split(',').map(t=>`<span class="badge">${t.trim()}</span>`).join(''):''}</div>
                    ${renderMedia(p[1], true)}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-desc">${p[2] || ''}</div>
                    <div class="p-price">฿${parseFloat(p[3]).toLocaleString()}</div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
            </div>`).join('');
    }

    function renderMedia(url, isMuted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)$/i);
        return isVid ? `<video src="${url}" ${isMuted ? 'autoplay loop muted playsinline' : 'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
    }

    function openOrder(n, p, s, optStr) {
        stopAllVideos();
        activeP = { name: n, basePrice: parseFloat(p), ship: parseFloat(s), currentPrice: parseFloat(p), optText: '' };
        const box = document.getElementById('optionBox');
        box.innerHTML = '';
        if(optStr && optStr !== '-') {
            let html = `<label style="font-size:10px; color:var(--gold); display:block; margin-bottom:5px;">เลือกตัวเลือก:</label><select id="pOpt" class="opt-sel" onchange="updatePrice()">`;
            optStr.split(',').forEach(o => {
                const parts = o.trim().split('=');
                html += `<option value="${parts[1]||p}" data-label="${parts[0]}">${parts[0]} (฿${parseFloat(parts[1]||p).toLocaleString()})</option>`;
            });
            box.innerHTML = html + `</select>`;
        }
        updatePrice();
        openModal('orderModal');
    }

    function updatePrice() {
        const sel = document.getElementById('pOpt');
        if(sel) {
            activeP.currentPrice = parseFloat(sel.value);
            activeP.optText = ` [${sel.options[sel.selectedIndex].getAttribute('data-label')}]`;
        }
        document.getElementById('orderDetail').innerHTML = `📦 ${activeP.name}${activeP.optText}<br>💰 ยอดโอน: ฿${(activeP.currentPrice + activeP.ship).toLocaleString()} (รวมส่ง)`;
    }

    function zoom(url) { stopAllVideos(); document.getElementById('zoomContent').innerHTML = renderMedia(url, false); document.getElementById('zoomOverlay').style.display = 'flex'; }
    function stopAllVideos() { document.querySelectorAll('video').forEach(v => { v.pause(); v.src = ""; v.load(); }); }
    function closeZoom() { stopAllVideos(); document.getElementById('zoomOverlay').style.display = 'none'; document.getElementById('zoomContent').innerHTML = ''; render(); }
    function openModal(id) { stopAllVideos(); const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); stopAllVideos(); setTimeout(()=> { m.style.display='none'; render(); }, 300); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name}${activeP.optText} ยอด: ${activeP.currentPrice + activeP.ship}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ! ขอบคุณที่ไว้วางใจเรา"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    
    // ระบบเช็คพัสดุ - ห้ามลบ
    async function checkShip() {
        const p = prompt("ระบุเบอร์โทรศัพท์ที่ใช้สั่งซื้อ:"); if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const f = rows.find(r => r[0] === p);
        if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nเลขพัสดุ: ${f[3]}`);
        else alert("ไม่พบข้อมูลพัสดุสำหรับเบอร์นี้");
    }
    init();
</script>
</body>
</html>
