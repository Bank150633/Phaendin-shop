<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 120px; }
        
        /* Layout */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; outline: none; font-family: 'Kanit'; }
        
        main { margin-top: 130px; padding: 0 12px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 0 8px; font-weight: 600; }
        
        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .media { width: 100%; aspect-ratio: 1/1; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .buy-btn { background: var(--gold); color: #000; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 12px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 15px; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 400px; padding: 20px; overflow-y: auto; max-height: 90vh; text-align: center; }
        .form-input { width: 100%; padding: 12px; border-radius: 8px; background: #1a1a1a; border: 1px solid #333; color: #fff; margin-bottom: 12px; font-family: 'Kanit'; }
        .confirm-btn { width: 100%; background: var(--green); color: #fff; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .confirm-btn:disabled { background: #444; }
        .upload-box { border: 1px dashed var(--gold); padding: 15px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; }
        #preview-slip { width: 100%; max-height: 200px; object-fit: contain; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="nav-container"><input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()"></div>
</header>

<main>
    <div id="status" style="text-align:center; padding:50px 0;">กำลังโหลด...</div>
    <div class="section-label">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:15px;">ยืนยันการสั่งซื้อ</h3>
        <div id="summary" style="background:#000; padding:12px; border-radius:8px; text-align:left; font-size:13px; margin-bottom:15px;"></div>
        
        <p style="font-size:12px; color:#aaa; margin-bottom:10px;">โอนเงินมาที่: กสิกรไทย xxx-x-x6762-x (วัชระ ชันสิน)</p>

        <form id="orderForm">
            <input type="text" id="c_name" class="form-input" placeholder="ชื่อ-นามสกุลผู้รับ" required>
            <input type="tel" id="c_phone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="c_address" class="form-input" rows="2" placeholder="ที่อยู่จัดส่ง" required></textarea>
            
            <div class="upload-box" onclick="document.getElementById('file_input').click()">
                <i class="fa-solid fa-image"></i> คลิกแนบรูปสลิปโอนเงิน
                <img id="preview-slip">
            </div>
            <input type="file" id="file_input" accept="image/*" style="display:none" onchange="previewFile(this)">
            
            <button type="submit" id="submitBtn" class="confirm-btn">ส่งข้อมูลและสลิป</button>
            <p onclick="document.getElementById('orderModal').style.display='none'" style="color:#777; font-size:13px; margin-top:15px; cursor:pointer;">ยกเลิก</p>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const APPS_URL = "https://script.google.com/macros/s/AKfycby9zFSAz_wsry9cwCV3dGg3AeLZN0ClWIoqw_uOxpFIFHUtA4v7TOoiUEla0i6R1XPwuA/exec";

    let dbAll = [];
    let curOrder = {};

    async function init() {
        try {
            const res = await fetch(PROD_URL);
            const text = await res.text();
            // ดึงเฉพาะสินค้าที่อยู่ในแผ่นงานแรก
            dbAll = text.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            document.getElementById('status').style.display = 'none';
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q));
        document.getElementById('main-list').innerHTML = filt.map(p => `
            <div class="card">
                <div class="media"><img src="${p[1]}"></div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}', '${p[3]}')">สั่งซื้อ</button>
                </div>
            </div>
        `).join('');
    }

    function openOrder(name, price) {
        curOrder = { name, price };
        document.getElementById('summary').innerHTML = `<b>รายการ:</b> ${name}<br><b>ราคา:</b> ฿${price}`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewFile(input) {
        const prev = document.getElementById('preview-slip');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; }
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const fileIn = document.getElementById('file_input');
        
        if (fileIn.files.length === 0) return alert("กรุณาแนบสลิปด้วยครับ");

        btn.disabled = true;
        btn.innerText = "กำลังอัปโหลด...";

        const file = fileIn.files[0];
        const reader = new FileReader();
        reader.onload = async function() {
            const payload = {
                detail: `สินค้า: ${curOrder.name} | ราคา: ${curOrder.price}`,
                name: document.getElementById('c_name').value,
                phone: document.getElementById('c_phone').value,
                address: document.getElementById('c_address').value,
                file: reader.result.split(',')[1],
                mimeType: file.type
            };

            try {
                const res = await fetch(APPS_URL, { method: "POST", body: new URLSearchParams(payload) });
                if (await res.text() === "Success") {
                    alert("✅ สั่งซื้อสำเร็จ! ข้อมูลบันทึกที่หน้า Orders แล้ว");
                    location.reload();
                }
            } catch (err) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    });

    init();
</script>
</body>
</html>
