<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; --gold-light: #F5D76E; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; --card: rgba(255, 255, 255, 0.05); --pill: rgba(255, 255, 255, 0.08); 
            --footer-h: 65px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        /* --- Header & Banner --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.1); transition: 0.3s; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 26px; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4)); }
        
        .banner-container { padding: 0 12px 12px; }
        .banner-slide { height: 140px; display: flex; background: #000; border: 1.5px solid var(--gold); border-radius: 15px; overflow: hidden; position: relative; }
        .banner-left { width: 40%; border-right: 1px solid rgba(212, 175, 55, 0.15); }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        
        .banner-right { width: 60%; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .banner-title { color: var(--gold); font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 10px; }
        .banner-timer { display: flex; gap: 5px; align-items: center; margin-bottom: 12px; }
        .time-box { background: var(--gold-grad); color: #000; padding: 3px 6px; border-radius: 5px; font-weight: 700; font-size: 12px; min-width: 25px; text-align: center; }
        
        /* ปุ่มบนแบนเนอร์ */
        .banner-btn { background: var(--gold-grad); color: #000; border: none; padding: 6px 16px; border-radius: 25px; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: 0.2s; }
        .banner-btn:active { transform: scale(0.95); }

        /* --- Navigation --- */
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px 15px; border-radius: 12px; border: 1px solid #333; background: rgba(255,255,255,0.07); color: #fff; margin-bottom: 10px; outline: none; font-size: 13px; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 18px; border-radius: 25px; background: var(--pill); white-space: nowrap; border: 1px solid transparent; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; border-color: var(--gold); }

        /* --- Main Content --- */
        main { margin-top: 310px; transition: 0.3s; }
        header.shrunk .banner-container { display: none; }
        header.shrunk + main { margin-top: 140px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; }
        
        .media { width: 100%; aspect-ratio: 1/1; background: #000; cursor: zoom-in; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .desc { font-size: 10px; color: #888; height: 28px; overflow: hidden; line-height: 1.4; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price { color: var(--gold-light); font-size: 17px; font-weight: 700; margin-bottom: 10px; }
        
        /* ปุ่มสั่งซื้อพร้อมไอคอน */
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 700; padding: 10px; border-radius: 12px; border: none; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .buy-btn:active { transform: scale(0.97); opacity: 0.9; }

        /* --- Zoom Media (Fix Center & Voice) --- */
        #mediaZoom { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; padding: 20px; }
        #zoomBox { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #zoomBox img, #zoomBox video { max-width: 100%; max-height: 85vh; border-radius: 10px; object-fit: contain; }

        /* --- Footer --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; display: flex; border-top: 1.5px solid rgba(212, 175, 55, 0.2); z-index: 2000; padding-bottom: 5px; }
        .nav-link { color: #666; text-decoration: none; font-size: 11px; text-align: center; flex: 1; padding-top: 12px; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 20px; margin-bottom: 4px; display: block; }

        /* --- Modal --- */
        .modal { display: none; position: fixed; z-index: 5000; inset: 0; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #0d0d0d; border: 1.5px solid var(--gold); border-radius: 20px; width: 100%; max-width: 360px; padding: 25px; text-align: center; }
        .form-input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 12px; font-family: 'Kanit'; font-size: 13px; outline: none; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาสินค้าที่ต้องการ..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:120px 0; color:#444; font-size: 13px;">กำลังรวบรวมความหรูหรา...</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i>หน้าหลัก</a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck-fast"></i>พัสดุ</a>
    <a href="javascript:void(0)" onclick="document.getElementById('contactModal').style.display='flex'" class="nav-link"><i class="fa-solid fa-comment-dots"></i>ติดต่อเรา</a>
</nav>

<div id="mediaZoom" onclick="closeZoom()"><div id="zoomBox"></div></div>

<div id="contactModal" class="modal" onclick="this.style.display='none'">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h4 style="color:var(--gold); margin-bottom:15px; font-size: 16px;">เลือกช่องทางติดต่อ</h4>
        <div style="display: grid; gap: 12px;">
            <a href="https://m.me/YOUR_PAGE_ID" target="_blank" style="text-decoration:none; color:#fff; background:#161616; padding:15px; border-radius:12px; display:flex; align-items:center; gap:12px; border:1px solid #222;">
                <i class="fa-brands fa-facebook-messenger" style="color:#0084ff; font-size:24px;"></i> Messenger
            </a>
            <a href="https://line.me/ti/p/YOUR_LINE_ID" target="_blank" style="text-decoration:none; color:#fff; background:#161616; padding:15px; border-radius:12px; display:flex; align-items:center; gap:12px; border:1px solid #222;">
                <i class="fa-brands fa-line" style="color:#06c755; font-size:24px;"></i> Line Official
            </a>
            <a href="tel:09XXXXXXXX" style="text-decoration:none; color:#fff; background:#161616; padding:15px; border-radius:12px; display:flex; align-items:center; gap:12px; border:1px solid #222;">
                <i class="fa-solid fa-phone" style="color:var(--gold); font-size:22px;"></i> สายด่วน
            </a>
        </div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); margin-bottom:12px;">รายละเอียดการโอนเงิน</h4>
        <div id="orderSummary" style="background:#000; padding:15px; border-radius:12px; margin-bottom:15px; text-align:left; font-size:13px; line-height: 1.6;"></div>
        <form id="orderForm">
            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="custAddress" class="form-input" rows="2" placeholder="ที่อยู่จัดส่งพัสดุ" required></textarea>
            <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
            <div style="border: 2px dashed var(--gold); padding: 15px; border-radius: 12px; margin-bottom:15px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <span id="upTxt" style="color:var(--gold); font-size:12px;">📸 แตะเพื่อแนบสลิปโอนเงิน</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:10px; margin-top:10px;">
            </div>
            <button type="submit" id="btnSubmit" class="buy-btn">แจ้งชำระเงินเรียบร้อย</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:18px; color:#666; font-size:11px; cursor:pointer;">ยกเลิกรายการ</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], curCat = 'all';
    let currentData = {};
    let bannerEndTime = null;

    // ระบบสุ่มสินค้าแบบ PR Shuffle
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function getMedia(url, isZoom = false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        if(isVid) {
            // หน้าขยาย (Zoom) จะมีเสียงและมีปุ่มควบคุม
            return `<video src="${url}" autoplay loop ${isZoom ? 'controls' : 'muted'} playsinline></video>`;
        }
        return `<img src="${url}" loading="lazy">`;
    }

    function zoom(url) {
        document.getElementById('zoomBox').innerHTML = getMedia(url, true);
        document.getElementById('mediaZoom').style.display = 'flex';
    }

    // ฟังก์ชันปิดพร้อมหยุดเสียงวิดีโอเด็ดขาด
    function closeZoom() {
        const zoomBox = document.getElementById('zoomBox');
        const v = zoomBox.querySelector('video');
        if(v) { v.pause(); v.src = ""; v.load(); }
        document.getElementById('mediaZoom').style.display = 'none';
        zoomBox.innerHTML = "";
    }

    async function init() {
        try {
            // Load Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const textB = await resB.text();
            const b = textB.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b && b[0]) {
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide">
                        <div class="banner-left" onclick="zoom('${b[0]}')">${getMedia(b[0])}</div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]}</div>
                            <div class="banner-timer">
                                <div class="time-box" id="bh">00</div>:<div class="time-box" id="bm">00</div>:<div class="time-box" id="bs">00</div>
                            </div>
                            <button class="banner-btn" onclick="openOrder('${b[1]}','0','0')">
                                ช้อปเลย <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>`;
                setInterval(updateTimer, 1000);
            }

            // Load Products
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const textP = await resP.text();
            dbAll = textP.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));

            document.getElementById('status').style.display = 'none';
            render();
        } catch(e) { document.getElementById('status').innerText = "ข้อมูลขัดข้อง กรุณาลองใหม่"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        let filtered = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat));
        
        // สุ่มลำดับสินค้า PR
        filtered = shuffle(filtered);

        document.getElementById('main-list').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media" onclick="zoom('${p[1]}')">${getMedia(p[1])}</div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="desc">${p[2]||'รายละเอียดสินค้าแนะนำ'}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}')">
                        <i class="fa-solid fa-cart-shopping"></i> สั่งซื้อ
                    </button>
                </div>
            </div>`).join('');
        
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimer() {
        if (!bannerEndTime) return;
        const d = bannerEndTime - new Date().getTime();
        if (d > 0) {
            document.getElementById('bh').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }

    function openOrder(n, p, s) {
        currentData = { n, p: parseFloat(p.toString().replace(/,/g,'')), s: parseFloat(s) };
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align:center; margin-bottom:12px; border-bottom:1px solid #222; padding-bottom:10px;">
                <b style="color:var(--gold); font-size:14px;">ธ.กสิกรไทย: 035-8-56762-2</b><br>
                <span style="font-size:12px;">ชื่อบัญชี: วัชระ ชันสิน</span>
            </div>
            <b>📦 สินค้า:</b> ${n}<br>
            <b>💰 ยอดที่ต้องโอน:</b> <span style="color:var(--gold); font-size:16px;">฿${(currentData.p + currentData.s).toLocaleString()}</span>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewSlip(f) {
        if (f.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result;
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            r.readAsDataURL(f.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btnSubmit');
        const f = document.getElementById('slipFile');
        if(!f.files[0]) return alert("กรุณาแนบสลิปเพื่อยืนยัน");
        b.innerText = "กำลังบันทึกข้อมูล..."; b.disabled = true;
        const r = new FileReader();
        r.onload = async function() {
            const payload = { 
                productDetail: currentData.n,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: r.result.split(',')[1], mimeType: f.files[0].type
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
                alert("✅ แจ้งชำระเงินเรียบร้อยแล้ว!"); location.reload();
            } catch(err) { alert("ล้มเหลว กรุณาลองอีกครั้ง"); b.disabled = false; }
        };
        r.readAsDataURL(f.files[0]);
    };

    async function checkTracking() {
        const ph = prompt("ป้อนเบอร์โทรศัพท์ที่ใช้สั่งซื้อ:");
        if (!ph) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const t = await res.text();
            const found = t.split('\n').slice(1).map(r => r.split(',')).find(r => r[0].replace(/"/g,'') === ph);
            if(found) alert(`คุณ: ${found[1]}\nสถานะ: ${found[2]}\nเลขพัสดุ: ${found[3]}`); else alert("ไม่พบข้อมูลพัสดุของคุณ");
        } catch(e) { alert("การเชื่อมต่อขัดข้อง"); }
    }

    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
    init();
</script>
</body>
</html>
