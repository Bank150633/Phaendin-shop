<style>


body {

.hide-scrollbar::-webkit-scrollbar {

.hide-scrollbar {

            #003DA5 60%,

            #FFFFFF 60%,
            #FFFFFF 80%,

}

        );

}

</style>

<body class="bg-soft text-gray-800 min-h-screen flex flex-col">

<div>

PHAENDIN

<p class="text-[10px]
          sm:text-xs
          text-gray-400">

     class="flex
            gap-2

            hide-scrollbar

<!-- PRODUCT TITLE -->

<div class="flex
            items-center
            justify-between

           text-lg
           text-thaiBlue">

<div id="notFound"

     class="hidden

<div class="text-6xl mb-4">

🍜

</div>


<h3 class="text-xl
           font-bold
           text-gray-600">

ยังไม่มีของกินที่ค้นหา

</h3>

          text-gray-400
          mt-1">

</p>

</div>

<!-- ==================================================
     FOOTER
================================================== -->

<footer class="bg-thaiBlue
               text-white
               mt-10">


<div class="container
            mx-auto
            px-4
            py-9
            text-center">


<div class="text-xl
            font-black">

PHAENDIN

<span class="text-red-300">

FOOD

</span>

</div>


<p class="text-blue-100
          text-xs
          mt-2">

🇹🇭 รวมของอร่อยจากทั่วไทย

</p>


<p class="text-blue-200/60
          text-[10px]
          mt-5">

© 2026 PHAENDIN FOOD

</p>


</div>

</footer>



<script>


/*
==================================================
GOOGLE SHEETS
==================================================
*/

const SHEET_API_URL =

"https://script.google.com/macros/s/AKfycbxqXpc-Q_2TPzyVnfFaInoGldXl-s8Du6XKfcic3lYKUBXy-FkyQaXGtNcbjTSWOUJI/exec";



/*
==================================================
ตัวแปร
==================================================
*/

let products = [];

let currentCategory = "ทั้งหมด";



/*
==================================================
หมวดของกิน
==================================================
*/

const categories = [

"ทั้งหมด",

"น้ำพริก",

"ขนม",

"ของฝาก",

"อาหารแห้ง",

"อาหารทะเล",

"อาหารท้องถิ่น",

"เครื่องปรุง",

"เครื่องดื่ม",

"อื่นๆ"

];



/*
==================================================
เริ่มต้น
==================================================
*/

document.addEventListener(

"DOMContentLoaded",

function() {

    renderCategories();

    fetchProductsFromSheet();

}

);



/*
==================================================
โหลด Google Sheets
==================================================
*/

function fetchProductsFromSheet() {


const grid =

document.getElementById(
    "productGrid"
);


grid.innerHTML = `

<div class="col-span-full
            text-center
            py-16
            text-gray-400">

<i class="fa-solid
          fa-spinner
          fa-spin
          text-thaiBlue
          text-3xl
          mb-3">

</i>

<p>

กำลังโหลดของกิน...

</p>

</div>

`;


fetch(SHEET_API_URL)


.then(

response => response.json()

)


.then(

data => {


products =

Array.isArray(data)

? data

: [];


products =

shuffleProducts(products);


renderProducts(products);


}

)


.catch(

error => {


console.error(error);


grid.innerHTML = `

<div class="col-span-full
            text-center
            py-16
            text-thaiRed">

<i class="fa-solid
          fa-triangle-exclamation
          text-3xl
          mb-3">

</i>

<p>

ไม่สามารถโหลดข้อมูลได้

</p>

<p class="text-xs
          text-gray-400
          mt-2">

กรุณาตรวจสอบ Google Sheets

</p>

</div>

`;

}

);

}



/*
==================================================
สุ่มสินค้า
==================================================
*/

function shuffleProducts(items) {


const shuffled = [...items];


for (

let i = shuffled.length - 1;

i > 0;

i--

) {


const j =

Math.floor(

Math.random() *

(i + 1)

);


[

shuffled[i],

shuffled[j]

] = [

shuffled[j],

shuffled[i]

];

}


return shuffled;

}



/*
==================================================
CATEGORY
==================================================
*/

function renderCategories() {


const container =

document.getElementById(

"categoryContainer"

);


container.innerHTML =

categories.map(

cat => `

<button

onclick="setCategory('${cat}')"

class="whitespace-nowrap
       px-4
       py-2
       rounded-full
       text-sm
       font-medium
       border
       transition

       ${
           currentCategory === cat

           ?

           "bg-thaiRed text-white border-thaiRed shadow"

           :

           "bg-white text-gray-600 border-gray-200 hover:border-thaiBlue hover:text-thaiBlue"

       }">

${cat}

</button>

`

).join("");

}



/*
==================================================
PRODUCT
==================================================
*/

function renderProducts(items) {


const grid =

document.getElementById(

"productGrid"

);


const notFound =

document.getElementById(

"notFound"

);


const count =

document.getElementById(

"productCount"

);



if (

!items ||

items.length === 0

) {


grid.innerHTML = "";


notFound.classList.remove(

"hidden"

);


count.innerText = "";


return;

}


notFound.classList.add(

"hidden"

);


count.innerText =

`${items.length} รายการ`;



grid.innerHTML =

items.map(

item => {


/*
========================================
TAGS
========================================
*/

const tags = item.tags

?

item.tags

.split(",")

.map(

tag => {


tag = tag.trim();


let color =

"bg-gray-700 text-white";


if (

tag === "ส่งฟรี"

)

color =

"bg-thaiBlue text-white";


else if (

tag === "ขายดี"

)

color =

"bg-orange-500 text-white";


else if (

tag === "Flash Sale"

)

color =

"bg-yellow-400 text-black";


else if (

tag.includes("ลด")

)

color =

"bg-thaiRed text-white";


else if (

tag === "Official Store"

)

color =

"bg-purple-600 text-white";


return `

<span class="${color}
             text-[10px]
             px-2
             py-1
             rounded-full">

${tag}

</span>

`;

}

)

.join("")

:

"";



/*
========================================
IMAGE
========================================
*/

const image =

item.image ||

"https://placehold.co/600x600?text=PHAENDIN+FOOD";



/*
========================================
PRICE
========================================
*/

const salePrice =

Number(

item.salePrice || 0

);


const originalPrice =

Number(

item.originalPrice || 0

);



/*
========================================
CARD
========================================
*/

return `

<div class="product-card
            bg-white
            rounded-2xl
            overflow-hidden
            border
            border-gray-100
            shadow-sm
            group">


<!-- IMAGE -->

<div class="relative
            overflow-hidden
            bg-gray-100">


<img

src="${image}"

alt="${item.title || 'ของกิน'}"

loading="lazy"

class="w-full
       h-40
       sm:h-52
       object-cover
       group-hover:scale-105
       transition
       duration-500">


<!-- TAG -->

<div class="absolute
            top-2
            left-2
            flex
            flex-wrap
            gap-1">

${tags}

</div>


</div>



<!-- CONTENT -->

<div class="p-3 sm:p-4">


<h3 class="text-sm
           font-medium
           text-gray-800
           line-clamp-2
           min-h-[40px]
           group-hover:text-thaiRed
           transition">

${item.title || "ของกิน"}

</h3>



<!-- CATEGORY -->

${
item.category

?

`

<div class="mt-2">

<span class="text-[10px]
             text-thaiBlue
             bg-blue-50
             px-2
             py-1
             rounded-full">

${item.category}

</span>

</div>

`

:

""

}



<!-- PRICE -->

<div class="mt-3">

<div class="flex
            items-baseline
            gap-2
            flex-wrap">


<span class="text-xl
             sm:text-2xl
             font-black
             text-thaiRed">

฿${salePrice.toLocaleString()}

</span>


${
originalPrice > 0

?

`

<span class="text-xs
             text-gray-400
             line-through">

฿${originalPrice.toLocaleString()}

</span>

`

:

""

}

</div>

</div>



<!-- BUY -->

<a

href="${item.affiliateUrl || '#'}"

target="_blank"

rel="noopener noreferrer"

class="buy-button
       mt-3
       w-full
       text-white
       py-2.5
       rounded-xl
       font-medium
       text-xs
       sm:text-sm
       flex
       items-center
       justify-center
       gap-2
       shadow-sm">


<i class="fa-solid
          fa-cart-shopping">

</i>


ดูของกิน / สั่งซื้อ


</a>


</div>


</div>

`;

}

)

.join("");

}



/*
==================================================
CATEGORY FILTER
==================================================
*/

function setCategory(cat) {


currentCategory = cat;


renderCategories();


filterProducts();

}



/*
==================================================
SEARCH
==================================================
*/

function filterProducts() {


const searchInput =

document.getElementById(

"searchInput"

);


const searchText =

searchInput.value

.toLowerCase()

.trim();



const filtered =

products.filter(

p => {


const title =

String(

p.title || ""

)

.toLowerCase();


const category =

String(

p.category || ""

)

.toLowerCase();


const matchesCategory =

currentCategory ===

"ทั้งหมด"

||

p.category ===

currentCategory;


const matchesSearch =

title.includes(

searchText

)

||

category.includes(

searchText

);


return (

matchesCategory &&

matchesSearch

);

}

);


renderProducts(

filtered

);

}



/*
==================================================
RESET + RANDOM
==================================================
*/

function resetAndRandom() {


/*
ล้างค้นหา
*/

document.getElementById(

"searchInput"

).value = "";



/*
กลับทั้งหมด
*/

currentCategory =

"ทั้งหมด";


renderCategories();



/*
สุ่มใหม่
*/

products =

shuffleProducts(

products

);



/*
แสดงใหม่
*/

renderProducts(

products

);



/*
กลับบนสุด
*/

window.scrollTo({

top: 0,

behavior: "smooth"

});

}


</script>
