<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | THE ULTIMATE CURATED SELECTION</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* -----------------------------------------------------------
           1. THEME SETUP (DARK MODE ONLY - NO LIGHT MODE)
        ----------------------------------------------------------- */
        :root {
            --gold: #D4AF37;
            --gold-light: #F5D76E;
            --gold-dark: #B8860B;
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --bg: #0A0A0A;
            --card-bg: #141414;
            --input-bg: #1F1F1F;
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --red-promo: #FF416C;
            --red-grad: linear-gradient(145deg, #ff416c, #ff4b2b);
            --header-h: 60px;
            --nav-h: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            padding-top: var(--header-h); 
            padding-bottom: var(--nav-h);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* -----------------------------------------------------------
           2. HEADER & SEARCH
        ----------------------------------------------------------- */
        header {
            position: fixed; top: 0; width: 100%; height: var(--header-h);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .logo-img { height: 45px; width: auto; transition: 0.3s; }

        .search-container {
            padding: 15px 10px 5px;
            max-width: 600px; margin: 0 auto;
        }
        .search-inner {
            position: relative;
            display: flex; align-items: center;
        }
        #searchField {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            background: var(--input-bg);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        #searchField:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }
        .search-icon { position: absolute; left: 15px; color: var(--gold); font-size: 16px; }

        /* -----------------------------------------------------------
           3. BANNER SLIDER & PROMO
        ----------------------------------------------------------- */
        .banner-area { padding: 10px; }
        .promo-card {
            background: #000;
            border-radius: 20px;
            border: 2px solid var(--gold);
            height: 230px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .promo-media { width: 100%; height: 100%; position: relative; }
        .promo-media img, .promo-media video { width: 100%; height: 100%; object-fit: cover; }
        .promo-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
        }
        .promo-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 5px; }
        .countdown-timer {
            display: flex; gap: 10px; align-items: center;
            background: rgba(255,255,255,0.1); width: fit-content;
            padding: 5px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
        }
        .time-box { text-align: center; }
        .time-val { color: var(--red-promo); font-weight: 800; font-size: 16px; display: block; }
        .time-lab { font-size: 8px; text-transform: uppercase; color: #ccc; }

        /* -----------------------------------------------------------
           4. PRODUCT GRID & CARD (แก้ราคาดีดที่นี่)
        ----------------------------------------------------------- */
        .section-header {
            padding: 20px 15px 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-header h2 { font-size: 16px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 8px;
        }

        .p-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }

        .p-img-box {
            width: 100%;
            aspect-ratio: 1/1;
            position: relative;
            background: #000;
        }
        .p-img-box img, .p-img-box video { width: 100%; height: 100%; object-fit: cover; }
        
        .p-badge-top {
            position: absolute; top: 6px; left: 6px;
            display: flex; flex-direction: column; gap: 4px; z-index: 10;
        }
        .tag { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 700; color: #fff; }
        .tag-gold { background: var(--gold-grad); color: #000; }
        .tag-red { background: var(--red-grad); }

        .province-tag {
            position: absolute; top: 6px; right: 6px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            color: var(--gold-light); font-size: 9px; padding: 2px 7px;
            border-radius: 20px; border: 0.5px solid var(--gold); z-index: 10;
        }

        /* ส่วนจัดระเบียบราคาไม่ให้ดีด */
        .p-info {
            padding: 10px 6px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        .p-name {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            height: 38px; /* บังคับความสูง 2 บรรทัด */
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 5px;
        }
        .p-desc {
            font-size: 10px;
            color: var(--text-dim);
            height: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }
        .p-price-row {
            margin-top: auto; /* ดันลงล่างสุดของกล่องข้อมูล */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .price-current { font-size: 17px; font-weight: 700; color: var(--gold); }
        .price-old { font-size: 10px; color: #666; text-decoration: line-through; }

        .btn-buy {
            width: 100%;
            background: var(--gold-grad);
            border: none;
            padding: 8px 0;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* -----------------------------------------------------------
           5. MODAL SYSTEM (CART & ORDER)
        ----------------------------------------------------------- */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); z-index: 9999;
            align-items: center; justify-content: center; padding: 10px;
        }
        .modal-content {
            background: #111;
            width: 100%; max-width: 400px;
            border: 1px solid var(--gold);
            border-radius: 25px;
            padding: 25px;
            max-height: 90vh; overflow-y: auto;
            position: relative;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 20px; color: #666; }

        .order-summary {
            background: #1a1a1a; padding: 15px; border-radius: 15px;
            margin-bottom: 20px; border: 1px dashed rgba(212,175,55,0.3);
        }
        .qty-control {
            display: flex; align-items: center; gap: 15px; background: #000;
            padding: 5px 15px; border-radius: 50px; border: 1px solid #333;
        }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--gold-grad); font-weight: bold; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11px; color: var(--gold); margin-bottom: 5px; margin-left: 5px; }
        .custom-input {
            width: 100%; background: #000; border: 1px solid #333;
            padding: 12px; border-radius: 12px; color: #fff; font-size: 14px;
        }

        /* -----------------------------------------------------------
           6. NAVIGATION BAR
        ----------------------------------------------------------- */
        nav.bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: var(--nav-h);
            background: #111; border-top: 1px solid rgba(212,175,55,0.3);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-dim); text-decoration: none; font-size: 10px;
        }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 20px; margin-bottom: 2px; }

        /* -----------------------------------------------------------
           7. UTILITIES
        ----------------------------------------------------------- */
        .copy-box {
            background: #000; padding: 10px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333; margin: 10px 0;
        }
        .btn-copy { background: var(--gold-grad); padding: 4px 10px; border-radius: 6px; color: #000; font-size: 10px; font-weight: bold; }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .p-card { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img">
</header>

<div id="mainContent">
    <div class="search-container">
        <div class="search-inner">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchField" placeholder="ค้นหาสิ่งที่ต้องการ..." oninput="handleSearch()">
        </div>
    </div>

    <div class="banner-area" id="bannerContainer">
        </div>

    <div class="section-header">
        <h2><i class="fa-solid fa-star"></i> CURATED ITEMS</h2>
    </div>

    <div class="product-grid" id="productGrid">
        </div>
</div>

<div class="modal-overlay" id="orderModal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()"><i class="fa-solid fa-times"></i></span>
        <h3 style="color:var(--gold); text-align:center; margin-bottom:15px;">ยืนยันคำสั่งซื้อ</h3>
        
        <div id="modalProductInfo" class="order-summary">
            </div>

        <div class="input-group">
            <label>ชื่อ-นามสกุล ผู้รับ</label>
            <input type="text" id="custName" class="custom-input" placeholder="ระบุชื่อจริง">
        </div>
        <div class="input-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="custPhone" class="custom-input" placeholder="08x-xxx-xxxx">
        </div>
        <div class="input-group">
            <label>ที่อยู่จัดส่งโดยละเอียด</label>
            <textarea id="custAddr" class="custom-input" rows="3" placeholder="บ้านเลขที่, ตำบล, อำเภอ, จังหวัด..."></textarea>
        </div>

        <div class="copy-box">
            <span style="font-size:12px; color:#fff;">🏦 กสิกรไทย: <b>035-8-56762-2</b></span>
            <span class="btn-copy" onclick="copyAcc()">คัดลอก</span>
        </div>

        <div style="margin: 15px 0; text-align: center;">
            <p style="font-size:11px; color:var(--text-dim); margin-bottom:10px;">แนบหลักฐานการโอนเงิน (สลิป)</p>
            <input type="file" id="slipFile" accept="image/*" style="font-size:11px; color:var(--gold);">
        </div>

        <button class="btn-buy" id="submitBtn" onclick="processOrder()" style="border-radius:15px; padding:15px; font-size:16px;">
            <i class="fa-solid fa-shield-check"></i> ยืนยันและส่งสลิป
        </button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-item active"><i class="fa-solid fa-house-chimney"></i>หน้าแรก</a>
    <a href="tel:0944159031" class="nav-item"><i class="fa-solid fa-headset"></i>ติดต่อ</a>
    <a href="javascript:void(0)" onclick="openTracking()" class="nav-item"><i class="fa-solid fa-truck-fast"></i>พัสดุ</a>
</nav>

<script>
    /* -----------------------------------------------------------
       JS LOGIC - FULL FEATURED
    ----------------------------------------------------------- */
    const CONFIG = {
        SHEET_ID: '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y',
        SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec'
    };

    let PRODUCTS_DATA = [];
    let SELECTED_ITEM = null;
    let BANNER_DATA = null;

    async function fetchData() {
        try {
            // Load Products
            const pRes = await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/export?format=csv&gid=0`);
            const pText = await pRes.text();
            PRODUCTS_DATA = parseCSV(pText).slice(1).filter(r => r[0]);

            // Load Banner
            const bRes = await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const bText = await bRes.text();
            BANNER_DATA = parseCSV(bText)[1];

            renderBanner();
            renderProducts(PRODUCTS_DATA);
        } catch (e) { console.error("Data Load Error", e); }
    }

    function parseCSV(text) {
        return text.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
    }

    function renderBanner() {
        if(!BANNER_DATA) return;
        const container = document.getElementById('bannerContainer');
        container.innerHTML = `
            <div class="promo-card">
                <div class="promo-media">
                    ${BANNER_DATA[0].includes('mp4') ? `<video src="${BANNER_DATA[0]}" autoplay loop muted></video>` : `<img src="${BANNER_DATA[0]}">`}
                </div>
                <div class="promo-overlay">
                    <div class="promo-title">${BANNER_DATA[1]}</div>
                    <div class="countdown-timer" id="mainTimer">
                        <div class="time-box"><span class="time-val" id="hr">00</span><span class="time-lab">Hr</span></div>
                        <div class="time-box"><span class="time-val" id="mn">00</span><span class="time-lab">Min</span></div>
                        <div class="time-box"><span class="time-val" id="sc">00</span><span class="time-lab">Sec</span></div>
                    </div>
                </div>
            </div>
        `;
        startTimer(BANNER_DATA[2]);
    }

    function renderProducts(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = data.map((p, i) => {
            const price = parseFloat(p[3]);
            const promoPrice = p[10] ? parseFloat(p[10]) : null;
            return `
                <div class="p-card">
                    <div class="p-img-box">
                        <div class="province-tag">${p[13] || 'คัดพิเศษ'}</div>
                        <div class="p-badge-top">
                            ${promoPrice ? '<span class="tag tag-red">ลดราคา</span>' : ''}
                            <span class="tag tag-gold">${p[4] || 'Premium'}</span>
                        </div>
                        <img src="${p[1]}" loading="lazy">
                    </div>
                    <div class="p-info">
                        <div class="p-name">${p[0]}</div>
                        <div class="p-desc">${p[2] || ''}</div>
                        <div class="p-price-row">
                            ${promoPrice ? `<span class="price-old">฿${price}</span>` : ''}
                            <span class="price-current">฿${(promoPrice || price).toLocaleString()}</span>
                        </div>
                    </div>
                    <button class="btn-buy" onclick="openOrder(${i})">สั่งซื้อเลย</button>
                </div>
            `;
        }).join('');
    }

    function openOrder(index) {
        SELECTED_ITEM = PRODUCTS_DATA[index];
        const modalInfo = document.getElementById('modalProductInfo');
        modalInfo.innerHTML = `
            <p style="text-align:center; font-weight:bold; color:var(--gold);">${SELECTED_ITEM[0]}</p>
            <p style="text-align:center; font-size:12px; color:#aaa;">ราคาชิ้นละ ฿${parseFloat(SELECTED_ITEM[3]).toLocaleString()}</p>
            <div style="display:flex; justify-content:center; margin-top:10px;">
                <div class="qty-control">
                    <button class="qty-btn" onclick="updateModalQty(-1)">-</button>
                    <span id="modalQty">1</span>
                    <button class="qty-btn" onclick="updateModalQty(1)">+</button>
                </div>
            </div>
            <p id="totalPrice" style="text-align:center; margin-top:10px; font-size:18px; font-weight:bold;">ยอดรวม: ฿${parseFloat(SELECTED_ITEM[3]).toLocaleString()}</p>
        `;
        SELECTED_ITEM.currentQty = 1;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function updateModalQty(change) {
        let q = SELECTED_ITEM.currentQty + change;
        if(q < 1) return;
        SELECTED_ITEM.currentQty = q;
        document.getElementById('modalQty').innerText = q;
        document.getElementById('totalPrice').innerText = `ยอดรวม: ฿${(q * parseFloat(SELECTED_ITEM[3])).toLocaleString()}`;
    }

    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    function copyAcc() {
        navigator.clipboard.writeText('0358567622');
        alert("คัดลอกเลขบัญชีแล้ว");
    }

    async function processOrder() {
        const btn = document.getElementById('submitBtn');
        const fileIn = document.getElementById('slipFile');
        
        if(!fileIn.files[0]) return alert("กรุณาแนบสลิปโอนเงิน");
        
        btn.disabled = true;
        btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> กำลังส่งข้อมูล...";

        const reader = new FileReader();
        reader.onload = async () => {
            const payload = {
                productDetail: `${SELECTED_ITEM[0]} จำนวน ${SELECTED_ITEM.currentQty}`,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddr').value,
                file: reader.result.split(',')[1]
            };

            try {
                await fetch(CONFIG.SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams(payload),
                    mode: 'no-cors'
                });
                alert("การสั่งซื้อสำเร็จ! เราจะรีบดำเนินการจัดส่งให้ครับ");
                location.reload();
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
                btn.disabled = false;
                btn.innerText = "ลองอีกครั้ง";
            }
        };
        reader.readAsDataURL(fileIn.files[0]);
    }

    function startTimer(target) {
        const end = new Date(target).getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = end - now;
            if(diff < 0) return;
            document.getElementById('hr').innerText = Math.floor(diff / 3600000).toString().padStart(2, '0');
            document.getElementById('mn').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            document.getElementById('sc').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        }, 1000);
    }

    function handleSearch() {
        const q = document.getElementById('searchField').value.toLowerCase();
        const filtered = PRODUCTS_DATA.filter(p => p[0].toLowerCase().includes(q));
        renderProducts(filtered);
    }

    init();
    async function init() { await fetchData(); }
</script>
</body>
</html>
