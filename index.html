<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-light: #F5D76E;
            --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; 
            --card: rgba(255, 255, 255, 0.03); 
            --pill: rgba(255, 255, 255, 0.1); 
            --red: #ff4d4d; 
            --green: #28a745; 
            --footer-h: 70px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 120px; overflow-x: hidden; }

        /* --- Header --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.2); transition: 0.4s; }
        .logo-row { text-align: center; padding: 12px 0; }
        .logo-img { height: 38px; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4)); }
        
        /* --- Banner --- */
        .banner-container { padding: 0 15px 15px; transition: 0.3s; }
        .banner-slide { 
            height: 185px; display: flex; background: #000; border: 1.5px solid var(--gold); 
            border-radius: 25px; overflow: hidden; position: relative; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .banner-left { width: 45%; background: #000; border-right: 1px solid rgba(212, 175, 55, 0.2); }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .flash-tag { position: absolute; top: 0; left: 0; background: var(--red); color: #fff; padding: 4px 12px; font-size: 10px; font-weight: bold; border-bottom-right-radius: 15px; z-index: 5; }
        .banner-right { width: 55%; padding: 15px; display: flex; flex-direction: column; justify-content: center; }
        .banner-title { color: var(--gold); font-size: 19px; font-weight: 800; line-height: 1.2; margin-bottom: 5px; }
        .banner-timer { display: flex; gap: 5px; align-items: center; margin-bottom: 10px; }
        .time-box { background: var(--gold-grad); color: #000; padding: 4px 8px; border-radius: 8px; font-weight: 800; font-size: 14px; min-width: 32px; text-align: center; }
        .shop-now-btn { background: #fff; color: #000; padding: 8px 16px; border-radius: 50px; font-size: 11px; font-weight: 800; align-self: flex-start; }

        .nav-container { padding: 0 15px 12px; }
        #search { width: 100%; padding: 12px 20px; border-radius: 50px; border: 1px solid #333; background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 10px; outline: none; }
        .cat-bar { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 12px; color: #888; padding: 7px 20px; border-radius: 50px; background: var(--pill); white-space: nowrap; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; }

        /* --- Main Content --- */
        main { margin-top: 365px; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        header.shrunk + main { margin-top: 155px; }

        .section-label { font-size: 15px; color: var(--gold); padding: 20px 15px 10px; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 15px; }
        .card { background: var(--card); border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; }
        .media { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: contain; }
        
        .info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #fff; }
        /* คำอธิบายสินค้าดึงกลับมาแล้ว */
        .description { font-size: 10px; color: #777; height: 32px; overflow: hidden; line-height: 1.4; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price { color: var(--gold-light); font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 800; padding: 12px; border-radius: 15px; border: none; font-size: 12px; cursor: pointer; }

        /* --- Footer & Contact Buttons --- */
        .float-contact-btn { position: fixed; bottom: 90px; right: 20px; background: var(--gold-grad); color: #000; padding: 12px 25px; border-radius: 50px; font-weight: 800; font-size: 14px; z-index: 2000; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-h); background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.2); display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
        .nav-link { color: #666; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 5px; }
        .nav-link.active { color: var(--gold); }

        /* --- Modals --- */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; padding: 20px; }
        .order-card { background: #0a0a0a; border: 1.5px solid var(--gold); border-radius: 30px; width: 100%; max-width: 400px; padding: 25px; text-align: center; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); }
        .form-input, .opt-select { width: 100%; padding: 12px; background: #151515; border: 1px solid #333; border-radius: 12px; color: #fff; margin-top: 5px; margin-bottom: 12px; font-family: 'Kanit'; }
        
        /* ปุ่มติดต่อใน Modal */
        .contact-choice { display: flex; align-items: center; gap: 15px; background: #151515; padding: 15px; border-radius: 15px; margin-bottom: 12px; text-decoration: none; color: #fff; border: 1px solid #333; }
        .choice-icon { font-size: 24px; width: 30px; }
        .fa-line { color: #06C755; } .fa-facebook-messenger { color: #0084FF; } .fa-phone { color: #28a745; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดข้อมูล...</div>
    <div id="main-label" class="section-label" style="display:none;">📦 คอลเลกชันสินค้า PHAENDIN</div>
    <div class="grid" id="main-list"></div>
</main>

<button onclick="openContactModal()" class="float-contact-btn">
    <i class="fa-solid fa-headset"></i> ปรึกษาเรา
</button>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck-fast"></i><span>ติดตามพัสดุ</span></a>
    <a href="javascript:void(0)" onclick="openCouponModal()" class="nav-link"><i class="fa-solid fa-ticket"></i><span>ส่วนลด</span></a>
</nav>

<div id="contactChoiceModal" class="modal" onclick="if(event.target===this) this.style.display='none'">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:20px;">เลือกช่องทางติดต่อ</h3>
        
        <a href="https://m.me/yourfb" target="_blank" class="contact-choice">
            <i class="fa-brands fa-facebook-messenger choice-icon"></i>
            <div style="text-align:left;"><b>Messenger</b><br><span style="font-size:11px; color:#777;">ทักแชททางเฟซบุ๊ก</span></div>
        </a>

        <a href="https://line.me/ti/p/yourid" target="_blank" class="contact-choice">
            <i class="fa-brands fa-line choice-icon"></i>
            <div style="text-align:left;"><b>LINE Official</b><br><span style="font-size:11px; color:#777;">สอบถาม/สั่งซื้อทางไลน์</span></div>
        </a>

        <a href="tel:088XXXXXXX" class="contact-choice">
            <i class="fa-solid fa-phone choice-icon"></i>
            <div style="text-align:left;"><b>โทรศัพท์</b><br><span style="font-size:11px; color:#777;">088-XXX-XXXX</span></div>
        </a>

        <p style="margin-top:10px; color:#555; font-size:12px; cursor:pointer;" onclick="document.getElementById('contactChoiceModal').style.display='none'">[ ปิดหน้าต่าง ]</p>
    </div>
</div>

<div id="couponModal" class="modal">
    <div class="order-card" style="max-width: 340px;">
        <h3 style="color:var(--gold); margin-bottom:15px;"><i class="fa-solid fa-gift"></i> คูปองพิเศษ</h3>
        <div id="couponList"></div>
        <button onclick="document.getElementById('couponModal').style.display='none'" style="background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">[ ปิดหน้าต่าง ]</button>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:15px;">ยืนยันคำสั่งซื้อ</h3>
        <form id="orderForm">
            <div id="orderSummary" style="background:#000; padding:15px; border-radius:15px; margin-bottom:15px; text-align:left;"></div>
            <div style="text-align:left; padding: 12px; background: #151515; border-radius: 15px; margin-bottom: 15px; border: 1px solid #222;">
                <label style="font-size:11px; color:var(--gold); display:block; margin-bottom:5px;">ส่วนลด (Code)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="couponInput" class="form-input" placeholder="ระบุโค้ด..." style="margin:0; flex:1;">
                    <button type="button" onclick="applyManualCoupon()" style="background:var(--gold); color:#000; border:none; padding:0 15px; border-radius:10px; font-weight:bold;">ใช้</button>
                </div>
                <div id="couponMessage" style="font-size: 11px; margin-top: 5px;"></div>
            </div>
            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล *" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์ *" required>
            <textarea id="custAddress" class="form-input" rows="3" placeholder="ที่อยู่จัดส่ง *" required></textarea>
            <div style="border:2px dashed var(--gold); padding:15px; border-radius:15px; margin-top:10px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <span id="uploadText" style="font-size:12px; color:var(--gold);">📸 แตะเพื่อแนบสลิปโอนเงิน</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:10px; margin-top:10px;">
            </div>
            <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
            <button type="submit" id="btnSubmit" style="width:100%; background:var(--gold-grad); color:#000; padding:16px; border-radius:15px; font-weight:800; font-size:17px; border:none; margin-top:20px;">💰 ยืนยันแจ้งโอนเงิน</button>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;
    const COUP_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Coupon`;
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], dbCoupons = [], curCat = 'all', currentData = {}, bannerEndTime = null, appliedCoupon = null;

    function openContactModal() { document.getElementById('contactChoiceModal').style.display = 'flex'; }
    function openCouponModal() { document.getElementById('couponModal').style.display = 'flex'; }
    function copyAcc() { navigator.clipboard.writeText("0358567622"); alert("คัดลอกเลขบัญชีแล้ว!"); }

    async function init() {
        try {
            // โหลดคูปอง
            const resC = await fetch(COUP_URL), textC = await resC.text();
            dbCoupons = textC.split(/\r?\n/).slice(1).map(r => {
                const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                return { code: c[0], type: c[1], value: parseFloat(c[2])||0, min: parseFloat(c[3])||0, expire: c[5], status: c[7] };
            }).filter(x => x.status === 'ON');
            renderCoupons();

            // โหลด Banner
            const resB = await fetch(BANN_URL), textB = await resB.text();
            const lb = textB.split(/\r?\n/).slice(1);
            if(lb.length > 0) {
                const b = lb[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide" onclick="bannerGoToProduct('${b[3]}')">
                        <div class="banner-left">${b[0].match(/\.(mp4|webm)$/) ? `<video src="${b[0]}" autoplay loop muted playsinline></video>` : `<img src="${b[0]}">`}<div class="flash-tag">FLASH SALE</div></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]||'ดีลพิเศษ'}</div>
                            <div class="banner-timer">
                                <div class="time-box" id="bh">00</div>: <div class="time-box" id="bm">00</div>: <div class="time-box" id="bs">00</div>
                            </div>
                            <div class="shop-now-btn">ช้อปตอนนี้ <i class="fa-solid fa-chevron-right"></i></div>
                        </div>
                    </div>`;
                if(bannerEndTime) setInterval(updateBannerTimer, 1000);
            }

            // โหลดสินค้า
            const resP = await fetch(PROD_URL), textP = await resP.text();
            dbAll = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
        } catch(e) { document.getElementById('status').innerText = "เชื่อมต่อล้มเหลว"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        document.getElementById('main-list').innerHTML = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat)).map(p => `
            <div class="card">
                <div class="media">${p[1].match(/\.(mp4|webm)$/) ? `<video src="${p[1]}" autoplay loop muted playsinline></video>` : `<img src="${p[1]}">`}</div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="description">${p[2]||''}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]}','${p[10]}')">สั่งซื้อ</button>
                </div>
            </div>
        `).join('');
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function openOrder(name, price, ship, opts, limit) {
        currentData = { name, basePrice: parseFloat(price), ship: parseFloat(ship), qty: 1, opts, limit: parseInt(limit)||99 };
        appliedCoupon = null;
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align: center; margin-bottom: 15px;">
                <b style="color:var(--gold);">ธ.กสิกรไทย: 035-8-56762-2</b> <button type="button" onclick="copyAcc()" style="background:var(--gold); border:none; padding:2px 5px; border-radius:5px; font-size:9px; font-weight:bold;">คัดลอก</button><br>
                <span style="font-size:11px; color:#777;">ชื่อบัญชี: นาย วัชระ ชันสิน</span>
                <img src="https://i.ibb.co/fVLb9p6B/004999092296200-20260224-144608.jpg" style="width: 100px; display:block; margin:10px auto; border-radius:10px;">
            </div>
            <div style="font-size:13px; color:#fff;">สินค้า: ${name}</div>
            <div id="totalBox" style="margin-top:10px; color:var(--gold); font-weight:bold; font-size:16px;"></div>
        `;
        calculateTotal();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function calculateTotal() {
        let total = (currentData.basePrice * currentData.qty) + currentData.ship;
        if(appliedCoupon) { total -= appliedCoupon.discount; }
        document.getElementById('totalBox').innerText = `ยอดโอนสุทธิ: ฿${total.toLocaleString()}`;
    }

    function applyManualCoupon() {
        const code = document.getElementById('couponInput').value.trim().toUpperCase();
        const promo = dbCoupons.find(c => c.code === code);
        const msg = document.getElementById('couponMessage');
        const baseTotal = currentData.basePrice * currentData.qty;
        
        if(promo && baseTotal >= promo.min) {
            let disc = promo.type === '%' ? (baseTotal * promo.value / 100) : promo.value;
            appliedCoupon = { code: promo.code, discount: disc };
            msg.innerHTML = `<span style="color:var(--green);">ใช้โค้ดสำเร็จ ลด ฿${disc}</span>`;
            calculateTotal();
        } else {
            msg.innerHTML = `<span style="color:var(--red);">โค้ดไม่ถูกต้องหรือยอดไม่ถึง</span>`;
            appliedCoupon = null;
            calculateTotal();
        }
    }

    function renderCoupons() {
        document.getElementById('couponList').innerHTML = dbCoupons.map(c => `
            <div style="background:#151515; padding:10px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                <div style="text-align:left;"><b style="color:var(--gold);">${c.code}</b><br><span style="font-size:10px;color:#666;">ลด ${c.value}${c.type} (ขั้นต่ำ ฿${c.min})</span></div>
                <button onclick="document.getElementById('couponInput').value='${c.code}'; applyManualCoupon(); document.getElementById('couponModal').style.display='none';" style="background:var(--gold); border:none; padding:5px 10px; border-radius:5px; font-weight:bold; font-size:11px;">ใช้</button>
            </div>
        `).join('');
    }

    function previewSlip(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result; 
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const file = document.getElementById('slipFile').files[0];
        if(!file) return alert("กรุณาแนบสลิปครับ");
        btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const payload = {
                productDetail: `${currentData.name}${appliedCoupon ? ' [โค้ด:'+appliedCoupon.code+']' : ''}`,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: reader.result.split(',')[1],
                mimeType: file.type
            };
            await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
            alert("แจ้งโอนสำเร็จ!"); location.reload();
        };
        reader.readAsDataURL(file);
    };

    function updateBannerTimer() {
        const diff = bannerEndTime - new Date().getTime();
        if(diff > 0) {
            document.getElementById('bh').innerText = Math.floor(diff/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        }
    }

    function bannerGoToProduct(name) {
        const p = dbAll.find(x => x[0] === name);
        if(p) openOrder(p[0], p[3], p[8]||0, p[9], p[10]);
    }

    async function checkTracking() {
        const phone = prompt("กรอกเบอร์โทรศัพท์:");
        if (!phone) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
        const found = rows.find(r => r[0] === phone);
        if (found) alert(`คุณ: ${found[1]}\nขนส่ง: ${found[2]}\nเลขพัสดุ: ${found[3]}`);
        else alert("ไม่พบข้อมูล");
    }

    init();
    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
</script>
</body>
