<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-light: #F5D76E;
            --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; 
            --card: rgba(255, 255, 255, 0.03); 
            --pill: rgba(255, 255, 255, 0.1); 
            --red: #ff4d4d; 
            --green: #28a745; 
            --footer-h: 70px; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; overflow-x: hidden; }
        
        /* สไตล์ใหม่: กระจกฝ้าและความโค้งมน */
        .glass { background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.1); }
        .gold-glow { box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
        
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.2); transition: 0.4s; }
        .logo-row { text-align: center; padding: 15px 0; }
        .logo-img { height: 40px; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5)); }
        
        .banner-container { padding: 0 15px 15px; }
        .banner-slide { 
            height: 180px; display: flex; 
            background: #000; 
            border: 1px solid var(--gold); 
            border-radius: 25px; overflow: hidden; 
            position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.1);
        }
        
        .banner-left { width: 45%; background: #000; }
        .banner-right { 
            width: 55%; padding: 20px; display: flex; flex-direction: column; justify-content: center;
            background: linear-gradient(45deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0.8) 100%);
        }
        .banner-title { color: var(--gold); font-size: 20px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .time-box { background: var(--gold-grad); color: #000; padding: 5px 8px; border-radius: 8px; font-weight: 800; }
        
        .shop-now-btn { background: #fff; color: #000; padding: 8px 18px; border-radius: 50px; font-size: 11px; font-weight: 800; margin-top: 10px; box-shadow: 0 4px 10px rgba(255,255,255,0.2); }

        #search { 
            width: 100%; padding: 12px 20px; border-radius: 50px; border: 1px solid #333; 
            background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 12px; outline: none; transition: 0.3s;
        }
        #search:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .cat-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .cat-item { font-size: 12px; color: #888; padding: 8px 22px; border-radius: 50px; background: var(--pill); border: 1px solid transparent; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        
        main { margin-top: 360px; transition: 0.4s; }
        header.shrunk .banner-container { height: 0; opacity: 0; padding: 0; overflow: hidden; }
        header.shrunk + main { margin-top: 160px; }
        
        .section-label { font-size: 15px; color: var(--gold); padding: 20px 15px 10px; font-weight: 600; letter-spacing: 1px; }
        
        /* ปรับการ์ดสินค้า */
        .card, .rec-card { 
            background: var(--card); border-radius: 22px; border: 1px solid rgba(255,255,255,0.05); 
            overflow: hidden; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .card:active, .rec-card:active { transform: scale(0.97); border-color: var(--gold); }
        
        .media, .rec-media { background: #000; border-radius: 20px; margin: 8px; overflow: hidden; }
        
        .price { color: var(--gold-light); font-size: 20px; font-weight: 800; margin: 5px 0; }
        
        .buy-btn { 
            width: 100%; background: var(--gold-grad); color: #000; font-weight: 800; 
            padding: 12px; border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        /* ปุ่มติดต่อเราใหม่ */
        .float-pay-btn { 
            position: fixed; bottom: 90px; right: 20px; 
            background: var(--gold-grad); color: #000; 
            padding: 12px 25px; border-radius: 50px; font-weight: 800; 
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); z-index: 2000;
        }

        .bottom-nav { 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(212, 175, 55, 0.2); height: var(--footer-h);
        }
        
        /* สไตล์ Modal ใหม่ */
        .order-card { 
            background: #0a0a0a; border: 1px solid var(--gold); border-radius: 30px; 
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        .form-input, .opt-select { border-radius: 12px; background: #151515; border: 1px solid #333; }
        .confirm-btn { background: var(--gold-grad); color: #000; border-radius: 15px; height: 55px; }

    </style>
</head>
