<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; }

        @keyframes blink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        .badge-blink { animation: blink 1s infinite; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { height: 165px; display: flex; border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; cursor: pointer; }
        .banner-left { width: 45%; background: #000; position: relative; }
        .banner-left img { width: 100%; height: 100%; object-fit: cover; }
        .banner-right { width: 55%; padding: 12px; display: flex; flex-direction: column; justify-content: center; }
        .banner-title { color: var(--gold); font-size: 18px; font-weight: 800; }

        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        main { margin-top: 340px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }

        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
        .rec-card { min-width: 145px; border-radius: 12px; border: 1px solid #333; background: #111; overflow: hidden; }
        .rec-media { width: 100%; aspect-ratio: 1/1; position: relative; cursor: pointer; }
        .rec-media img { width: 100%; height: 100%; object-fit: cover; }
        .rec-price-tag { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: var(--gold); font-size: 13px; font-weight: 800; padding: 5px; text-align: center; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; overflow: hidden; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .media img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 10px; }
        .title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; padding: 10px; border-radius: 8px; border: none; font-weight: bold; margin-top: 8px; }

        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 15px; }
        #modalBody img { max-width: 100%; border-radius: 10px; }
        
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 380px; padding: 20px; text-align: center; }
        .form-input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 10px; font-family: 'Kanit'; }
        .confirm-btn { width: 100%; background: var(--green); color: #fff; padding: 15px; border-radius: 10px; border: none; font-weight: bold; }

        .float-pay-btn { position: fixed; bottom: 85px; right: 15px; background: var(--green); color: #fff; padding: 12px 18px; border-radius: 50px; z-index: 2000; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดข้อมูล...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<a href="javascript:void(0)" onclick="openOrder('แจ้งโอนเงินทั่วไป', 0)" class="float-pay-btn">
    <i class="fa-solid fa-receipt"></i> แจ้งโอนเงิน
</a>

<nav class="bottom-nav">
    <a href="#" class="nav-link"><i class="fa-solid fa-house"></i><div style="font-size:10px;">หน้าหลัก</div></a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck"></i><div style="font-size:10px;">เช็คพัสดุ</div></a>
    <a href="https://m.me/PhaendinStore" target="_blank" class="nav-link"><i class="fa-solid fa-headset"></i><div style="font-size:10px;">ติดต่อเรา</div></a>
</nav>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody"></div></div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:10px;">แจ้งรายละเอียดการโอน</h3>
        <div id="orderInfo" style="text-align:left; background:#000; padding:10px; border-radius:10px; font-size:13px; margin-bottom:15px; border-left:3px solid var(--gold);"></div>
        <form id="orderForm">
            <input type="text" id="c_name" class="form-input" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="c_phone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="c_address" class="form-input" rows="2" placeholder="ที่อยู่จัดส่ง" required></textarea>
            <div style="border:1px dashed var(--gold); padding:10px; border-radius:10px; margin-bottom:15px; cursor:pointer;" onclick="document.getElementById('slip_input').click()">
                <p id="file_text" style="font-size:12px; color:var(--gold);">📸 คลิกแนบรูปสลิป</p>
                <img id="slip_preview" style="display:none; width:100%; margin-top:10px; border-radius:5px;">
            </div>
            <input type="file" id="slip_input" accept="image/*" style="display:none;" onchange="previewFile(this)">
            <button type="submit" id="submitBtn" class="confirm-btn">ยืนยันการแจ้งโอน</button>
            <p onclick="document.getElementById('orderModal').style.display='none'" style="color:#555; margin-top:15px; cursor:pointer; font-size:13px;">ยกเลิก</p>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'เอา_URL_ที่ก๊อปมา_มาวางตรงนี้'; 

    let dbAll = [], dbRec = [], curCat = 'all', currentProduct = "";

    async function init() {
        const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`);
        const textP = await resP.text();
        let raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
        dbRec = raw.filter(p => p[5] && p[5].includes("แนะนำ")).slice(0, 8);
        dbAll = raw.filter(p => !dbRec.some(r => r[0] === p[0]));

        const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
        const textB = await resB.text();
        const linesB = textB.split(/\r?\n/).slice(1);
        if(linesB.length > 0) {
            const b = linesB[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            document.getElementById('bannerContent').innerHTML = `
                <div class="banner-slide" onclick="bannerGoToProduct('${b[3]||''}')">
                    <div class="banner-left"><img src="${b[0]}"></div>
                    <div class="banner-right"><div class="banner-title">${b[1]}</div><div style="font-size:11px;color:#aaa;">โปรโมชั่นพิเศษวันนี้</div></div>
                </div>`;
        }
        document.getElementById('status').style.display = 'none';
        document.getElementById('main-label').style.display = 'block';
        render();
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const itemHTML = (p, isRec) => `
            <div class="${isRec?'rec-card':'card'}">
                <div class="${isRec?'rec-media':'media'}" onclick="openMedia('${p[1]}')">
                    <img src="${p[1]}">${isRec?`<div class="rec-price-tag">฿${p[3]}</div>`:''}
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    ${isRec?'':`<div class="price">฿${p[3]}</div>`}
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}')">สั่งซื้อ</button>
                </div>
            </div>`;
        
        if(dbRec.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join('');
        }
        document.getElementById('main-list').innerHTML = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat)).map(p => itemHTML(p, false)).join('');
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function openMedia(url) {
        document.getElementById('modalBody').innerHTML = `<img src="${url}">`;
        document.getElementById('mediaModal').style.display = 'flex';
    }

    function openOrder(name, price) {
        currentProduct = name + (price > 0 ? " (฿" + price + ")" : "");
        document.getElementById('orderInfo').innerHTML = `<b>รายการ:</b> ${currentProduct}`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function bannerGoToProduct(name) {
        if(!name) return;
        const p = [...dbRec, ...dbAll].find(i => i[0] === name);
        if(p) openOrder(p[0], p[3]);
    }

    function previewFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('slip_preview').src = e.target.result;
                document.getElementById('slip_preview').style.display = 'block';
                document.getElementById('file_text').innerText = "เลือกสลิปแล้ว ✅";
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const fileIn = document.getElementById('slip_input');
        if(!fileIn.files[0]) return alert("กรุณาแนบสลิปครับ");
        btn.disabled = true; btn.innerText = "กำลังส่งข้อมูล...";
        const reader = new FileReader();
        reader.onload = async function() {
            const payload = { productDetail: currentProduct, customerName: document.getElementById('c_name').value, customerPhone: document.getElementById('c_phone').value, customerAddress: document.getElementById('c_address').value, file: reader.result.split(',')[1], mimeType: fileIn.files[0].type };
            try {
                await fetch(APPS_URL, { method: "POST", body: new URLSearchParams(payload) });
                alert("สำเร็จ! กำลังพาไป Messenger");
                window.location.href = "https://m.me/PhaendinStore";
            } catch(err) { alert("พลาด! ลองใหม่ครับ"); btn.disabled = false; }
        };
        reader.readAsDataURL(fileIn.files[0]);
    });

    init();
</script>
</body>
</html>
