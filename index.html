<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; }

        /* Animation */
        @keyframes blink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        .badge-blink { animation: blink 1s infinite; box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); }

        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { 
            height: 165px; display: flex; 
            background: linear-gradient(135deg, #000 0%, #151515 100%);
            border: 2px solid var(--gold); border-radius: 15px;
            overflow: hidden; position: relative;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); cursor: pointer;
        }
        .banner-left { width: 45%; position: relative; overflow: hidden; background: #000; }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .flash-tag { position: absolute; top: 0; left: 0; background: var(--red); color: #fff; padding: 2px 10px; font-size: 10px; font-weight: bold; z-index: 5; border-bottom-right-radius: 10px; }

        .banner-right { 
            width: 55%; padding: 12px; display: flex; flex-direction: column; justify-content: center;
        }
        .banner-title { color: var(--gold); font-size: 18px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
        .banner-sub { font-size: 11px; color: #aaa; margin-bottom: 8px; }
        .banner-timer { display: flex; gap: 4px; margin-bottom: 12px; align-items: center; }
        .time-box { background: var(--gold); color: #000; padding: 4px 6px; border-radius: 4px; font-weight: 800; font-size: 13px; min-width: 28px; text-align: center; }
        .shop-now-btn { background: #fff; color: #000; padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; align-self: flex-start; }

        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        main { margin-top: 340px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }

        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
        .rec-card { min-width: 145px; border-radius: 12px; overflow: hidden; border: 1px solid #333; background: #111; position: relative; transition: 0.2s; display: flex; flex-direction: column; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; cursor: pointer; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price-tag { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: var(--gold); font-size: 13px; font-weight: 800; padding: 5px; text-align: center; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; }
        
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; height: 20px; overflow: hidden; margin-bottom: 4px; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
        .description { font-size: 10px; color: #777; height: auto; min-height: 32px; margin-bottom: 10px; line-height: 1.4; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-top: auto; padding-bottom: 10px; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .price-old { color: #555; font-size: 11px; text-decoration: line-through; }
        
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .float-pay-btn { position: fixed; bottom: 85px; right: 15px; background: var(--green); color: #fff; padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
        .nav-link { color: #777; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; }
        .nav-link.active { color: var(--gold); }
        
        /* Modal - แก้ไขให้มีฟอร์มในตัว */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 10px; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 380px; padding: 20px; text-align: center; max-height: 90vh; overflow-y: auto; }
        .form-input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 10px; font-family: 'Kanit'; }
        .confirm-btn { width: 100%; background: var(--green); color: #fff; padding: 14px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        .confirm-btn:disabled { background: #444; }
        .slip-area { border: 1px dashed var(--gold); padding: 15px; border-radius: 10px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดข้อมูล...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<a href="javascript:void(0)" onclick="openOrder('แจ้งโอนเงินทั่วไป', 0, 0, '', 99)" class="float-pay-btn">
    <i class="fa-solid fa-receipt"></i> แจ้งโอนเงิน
</a>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck"></i><span>เช็คพัสดุ</span></a>
    <a href="https://m.me/PhaendinStore" target="_blank" class="nav-link"><i class="fa-solid fa-headset"></i><span>ติดต่อเรา</span></a>
</nav>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:10px;">แจ้งรายละเอียดการโอน</h3>
        <div id="orderInfo" style="text-align:left; background:#000; padding:10px; border-radius:10px; font-size:13px; margin-bottom:15px; border-left:3px solid var(--gold);"></div>
        
        <div style="font-size:12px; margin-bottom:15px;">
            <p>กสิกรไทย: <b>035-8-56762-2</b></p>
            <p>นาย วัชระ ชันสิน</p>
            <img src="https://i.ibb.co/fVLb9p6B/004999092296200-20260224-144608.jpg" style="width:100px; margin-top:5px; border-radius:5px;">
        </div>

        <form id="orderForm">
            <input type="text" id="c_name" class="form-input" placeholder="ชื่อ-นามสกุล ผู้รับ" required>
            <input type="tel" id="c_phone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="c_address" class="form-input" rows="2" placeholder="ที่อยู่จัดส่งโดยละเอียด" required></textarea>
            
            <div class="slip-area" onclick="document.getElementById('slip_input').click()">
                <p id="file_text" style="font-size:12px; color:var(--gold);">📸 คลิกเพื่อแนบรูปสลิป</p>
                <img id="slip_preview" style="display:none; width:100%; margin-top:10px; border-radius:5px;">
            </div>
            <input type="file" id="slip_input" accept="image/*" style="display:none;" onchange="previewFile(this)">
            
            <button type="submit" id="submitBtn" class="confirm-btn">💰 ยืนยันแจ้งโอนเงิน</button>
            <p onclick="document.getElementById('orderModal').style.display='none'" style="color:#555; margin-top:15px; cursor:pointer; font-size:13px;">ยกเลิก</p>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'ใส่_URL_แอปเว็บ_ที่ได้จาก_Apps_Script_ตรงนี้'; // *** สำคัญมาก ***

    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], curCat = 'all', currentProduct = "";

    async function init() {
        try {
            const resP = await fetch(PROD_URL), textP = await resP.text();
            // กรองเฉพาะแถวที่มีลิงก์รูป (http) เพื่อไม่ให้ข้อมูลออเดอร์ลูกค้ามาโชว์หน้าเว็บ
            let raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
            dbRec = raw.filter(p => p[5] && p[5].includes("แนะนำ")).slice(0, 8);
            dbAll = raw.filter(p => !dbRec.some(r => r[0] === p[0]));

            const resB = await fetch(BANN_URL), textB = await resB.text();
            const linesB = textB.split(/\r?\n/).slice(1).filter(l => l.trim() !== "");
            if(linesB.length > 0) {
                const b = linesB[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide">
                        <div class="banner-left"><img src="${b[0]}"><div class="flash-tag">FLASH SALE</div></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]||'ดีลพิเศษ'}</div>
                            <div class="banner-sub">ช้อปสินค้าคุณภาพที่นี่ที่เดียว</div>
                            <div class="shop-now-btn">เลื่อนชมสินค้าเลย <i class="fa-solid fa-chevron-down"></i></div>
                        </div>
                    </div>`;
            }
            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
        } catch(e) { document.getElementById('status').innerText = "โหลดข้อมูลล้มเหลว"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const itemHTML = (p, isRec = false) => {
            const price = p[3], ship = parseFloat(p[8])||0;
            let badge = p[5].includes("1แถม1") ? `<div class="badge-blink" style="position:absolute;top:6px;right:6px;background:#ffea00;color:#000;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:bold;z-index:10;border:1px solid #000;">1 แถม 1</div>` : "";
            if (ship === 0) badge += `<div class="badge-blink" style="position:absolute;top:${badge? '32px':'6px'};right:6px;background:#28a745;color:#fff;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:bold;z-index:10;">ส่งฟรี</div>`;

            if(isRec) return `<div class="rec-card"><div class="rec-media">${badge}<img src="${p[1]}"><div class="rec-price-tag">฿${price}</div></div><div class="rec-btn-area"><button class="buy-btn" onclick="openOrder('${p[0]}','${price}')">สั่งซื้อ</button></div></div>`;
            return `<div class="card"><div class="media">${badge}<img src="${p[1]}"></div><div class="info"><div class="title">${p[0]}</div><div class="description">${p[2]||''}</div><div class="price">฿${price}</div><button class="buy-btn" onclick="openOrder('${p[0]}','${price}')">สั่งซื้อสินค้า</button></div></div>`;
        };
        if(dbRec.length > 0 && q === "") { 
            document.getElementById('rec-area').style.display = 'block'; 
            document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join(''); 
        } else { document.getElementById('rec-area').style.display = 'none'; }
        document.getElementById('main-list').innerHTML = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat)).map(p => itemHTML(p)).join('');
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function openOrder(name, price) {
        currentProduct = name + (price > 0 ? " (฿" + price + ")" : "");
        document.getElementById('orderInfo').innerHTML = `<b>รายการ:</b> ${currentProduct}`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('slip_preview').src = e.target.result;
                document.getElementById('slip_preview').style.display = 'block';
                document.getElementById('file_text').innerText = "เลือกสลิปแล้ว ✅";
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const fileIn = document.getElementById('slip_input');
        if(!fileIn.files[0]) return alert("กรุณาแนบสลิปก่อนครับ");

        btn.disabled = true;
        btn.innerText = "กำลังส่งข้อมูล...";

        const reader = new FileReader();
        reader.onload = async function() {
            const payload = {
                productDetail: currentProduct,
                customerName: document.getElementById('c_name').value,
                customerPhone: document.getElementById('c_phone').value,
                customerAddress: document.getElementById('c_address').value,
                file: reader.result.split(',')[1],
                mimeType: fileIn.files[0].type
            };

            try {
                await fetch(APPS_URL, { method: "POST", body: new URLSearchParams(payload) });
                alert("ส่งข้อมูลแจ้งโอนสำเร็จ! ระบบกำลังพาไปแจ้งแอดมินทาง Messenger");
                window.location.href = "https://m.me/PhaendinStore";
            } catch(err) { alert("เกิดข้อผิดพลาด กรุณาลองใหม่"); btn.disabled = false; }
        };
        reader.readAsDataURL(fileIn.files[0]);
    });

    async function checkTracking() {
        const phone = prompt("กรอกเบอร์โทรที่ใช้สั่งซื้อ:");
        if (!phone) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
            const found = rows.find(r => r[0] === phone);
            if (found) alert(`📦 พัสดุคุณ ${found[1]}\nขนส่ง: ${found[2]}\nเลขพัสดุ: ${found[3]}`);
            else alert("ไม่พบข้อมูล");
        } catch (e) { alert("เชื่อมต่อผิดพลาด"); }
    }

    init();
</script>
</body>
</html>
