<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }

        /* --- Header --- */
        header { 
            position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.98); 
            z-index: 1000; border-bottom: 1px solid #222; padding-bottom: 10px; transition: 0.4s;
        }
        header.shrunk .banner-container { display: none; }
        .logo-row { display: flex; align-items: center; justify-content: center; padding: 15px 0 10px; }
        .logo-img { height: 45px; border-radius: 4px; }
        .banner-container { padding: 0 12px; margin-bottom: 12px; }
        .banner-slide { position: relative; width: 100%; height: 120px; background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .banner-text { position: absolute; bottom: 12px; left: 15px; color: var(--gold); font-size: 14px; font-weight: 600; text-shadow: 1px 1px 3px #000; }

        .nav-container { padding: 0 12px; }
        #search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 10px; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
        .cat-item { font-size: 11px; color: #aaa; padding: 6px 18px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        /* --- Content --- */
        main { margin-top: 310px; padding-bottom: 20px; }
        header.shrunk + main { margin-top: 150px; }
        .section-label { font-size: 12px; color: var(--gold); padding: 15px 15px 8px; font-weight: 600; text-transform: uppercase; }

        /* --- Recommended Area --- */
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 15px; scrollbar-width: none; }
        .rec-card { min-width: 100px; width: 100px; position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #222; background: #111; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; cursor: pointer; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { position: absolute; bottom: 0; width: 100%; background: rgba(212, 175, 55, 0.95); color: #000; font-size: 10px; font-weight: bold; text-align: center; padding: 4px 0; }

        /* --- Card & Grid --- */
        .timer-badge { position: absolute; top: 8px; left: 8px; background: var(--red); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 5px; font-weight: bold; z-index: 10; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px 20px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 1px solid #222; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; background: #000; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 12px; flex: 1; }
        .title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; }

        /* --- Footer & Modals --- */
        footer { background: #080808; padding: 40px 20px 100px; border-top: 1px solid #222; text-align: center; }
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-inner { position: relative; width: 90%; max-width: 500px; }
        .modal-content { width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 16px; width: 90%; max-width: 400px; padding: 25px; text-align: center; position: relative; }
        .order-summary-box { background: #000; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid var(--gold); color: #fff; font-size: 14px; text-align: left; }
        .confirm-btn { display: block; width: 100%; background: #28a745; color: #fff; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        .float-btn { position: fixed; bottom: 25px; left: 20px; background: #28a745; color: white; padding: 12px 22px; border-radius: 50px; text-decoration: none; font-weight: 600; z-index: 2000; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide">
            <img src="https://i.ibb.co/v6Y0mF7X/banner1.jpg">
            <div class="banner-text">✨ PHAENDIN STORE OFFICIAL</div>
        </div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหา..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:50px;">กำลังสุ่มสินค้า...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<footer>
    <div style="color:#888; font-size:14px; margin-bottom:10px;">PHAENDIN STORE</div>
    <div style="display:flex; justify-content:center; gap:10px;">
        <a href="https://line.me/R/ti/p/@yourid" style="color:var(--gold); text-decoration:none; font-size:12px; border:1px solid #333; padding:5px 15px; border-radius:5px;">LINE OA</a>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" style="color:var(--gold); text-decoration:none; font-size:12px; border:1px solid #333; padding:5px 15px; border-radius:5px;">แจ้งโอน</a>
    </div>
</footer>

<div id="imgModal" class="modal" onclick="closeModal('imgModal')"><div class="modal-inner" id="modalBody"></div></div>
<div id="orderModal" class="modal">
    <div class="order-card">
        <h2 style="color: var(--gold);">🛒 ยืนยันคำสั่งซื้อ</h2>
        <div id="orderSummary" class="order-summary-box"></div>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" class="confirm-btn">แจ้งโอนเงิน</a>
        <p onclick="closeModal('orderModal')" style="margin-top:15px; color:#555; cursor:pointer;">ปิดหน้าต่าง</p>
    </div>
</div>

<a href="javascript:void(0)" onclick="document.getElementById('orderModal').style.display='flex'" class="float-btn">💰 แจ้งโอนเงิน</a>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    let db = [], cur = 'all';

    function getMediaHTML(url, isModal = false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        const s = isModal ? 'class="modal-content"' : '';
        return isVid ? `<video src="${url}" autoplay loop muted playsinline ${s}></video>` : `<img src="${url}" loading="lazy" ${s}>`;
    }

    function openImg(url) { document.getElementById('modalBody').innerHTML = getMediaHTML(url, true); document.getElementById('imgModal').style.display = 'flex'; }
    function openOrder(n, p) { document.getElementById('orderSummary').innerText = `สินค้า: ${n}\nราคา: ฿${p}`; document.getElementById('orderModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // ฟังก์ชันสุ่มอาเรย์ (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    async function load() {
        try {
            const r = await fetch(URL);
            const t = await r.text();
            let rawData = t.split(/\r?\n/).slice(1).map(row => 
                row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())
            ).filter(x => x[0] && x[1]);
            
            // --- สุ่มลำดับข้อมูลทั้งหมดก่อนแสดงผล ---
            db = shuffle(rawData);

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลด"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        
        // สินค้าแนะนำ (ยังใช้ตัวกรอง "แนะนำ" แต่ลำดับจะสุ่มตาม db ที่ shuffle แล้ว)
        const recs = db.filter(p => p[5] && p[5].includes("แนะนำ"));
        document.getElementById('rec-area').style.display = (recs.length > 0 && q==="") ? 'block' : 'none';
        document.getElementById('rec-list').innerHTML = recs.map(p => `
            <div class="rec-card">
                <div class="rec-media" onclick="openImg('${p[1]}')">${getMediaHTML(p[1])}</div>
                <div class="rec-price" onclick="openOrder('${p[0]}','${p[3]}')">฿${p[3]}</div>
            </div>
        `).join('');

        // สินค้าทั้งหมด (สุ่มกระจาย)
        const filt = db.filter(p => p[0].toLowerCase().includes(q) && (cur === 'all' || p[6] === cur));
        document.getElementById('main-list').innerHTML = filt.map((p, i) => {
            const hasT = p[7] && p[7].length > 5;
            return `
            <div class="card">
                <div class="media" onclick="openImg('${p[1]}')">
                    ${hasT ? `<div class="timer-badge" id="t-${i}" data-time="${p[7]}">00:00:00</div>` : ''}
                    ${getMediaHTML(p[1])}
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price">฿${p[3]}</div>
                    <div class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}')">สั่งซื้อ</div>
                </div>
            </div>`;
        }).join('');

        const categories = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = categories.map(c => `
            <span class="cat-item ${cur === c[0] ? 'active' : ''}" onclick="setCat('${c[0]}')">${c[1]}</span>
        `).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const target = new Date(el.getAttribute('data-time')).getTime();
            const dist = target - now;
            if (dist < 0) { el.innerHTML = "จบโปรโมชั่น"; el.style.background = "#444"; }
            else {
                const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((dist % (1000 * 60)) / 1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    function setCat(c) { cur = c; render(); }
    load();
    window.onscroll = () => { const h = document.getElementById("mainHeader"); window.scrollY > 50 ? h.classList.add("shrunk") : h.classList.remove("shrunk"); };
</script>
</body>
</html>
