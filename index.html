<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phaendin Rent | แผ่นดินเช่าของ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-scale:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        .item-card { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-900">

    <!-- ล็อคอิน (แสดงครั้งแรก) -->
    <div id="loginOverlay" class="fixed inset-0 z-[1000] bg-blue-600 flex items-center justify-center p-6 transition-all duration-500">
        <div class="bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 0012 3a10.003 10.003 0 007.139 17.441l.054.09m-3.44 2.04A10.003 10.003 0 0112 21c-1.491 0-2.884-.326-4.139-.912M12 11V9m0 2v2m0-2h2m-2 0H8" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">ยินดีต้อนรับ</h2>
            <p class="text-slate-500 text-sm mb-6">กรุณาใส่ชื่อเล่นเพื่อเริ่มใช้งาน</p>
            <input type="text" id="userInput" placeholder="ชื่อเล่นของคุณ" class="w-full p-4 bg-slate-100 rounded-2xl mb-4 text-center font-bold outline-none focus:ring-2 focus:ring-blue-500 border-none text-lg">
            <button onclick="startApp()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold active-scale shadow-lg text-lg">ตกลง</button>
        </div>
    </div>

    <!-- แถบด้านบน -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
            </div>
            <span class="font-bold text-xl tracking-tight">Phaendin Rent</span>
        </div>
        <div id="displayUser" class="text-xs font-bold bg-blue-50 text-blue-600 px-4 py-2 rounded-full border border-blue-100">...</div>
    </nav>

    <!-- รายการสินค้า -->
    <main class="p-4 max-w-4xl mx-auto">
        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6">
            <button onclick="filterItems('ทั้งหมด')" class="cat-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md">ทั้งหมด</button>
            <button onclick="filterItems('ไอที')" class="cat-btn bg-white text-slate-500 border px-5 py-2 rounded-full text-sm font-bold">ไอที</button>
            <button onclick="filterItems('แคมป์')" class="cat-btn bg-white text-slate-500 border px-5 py-2 rounded-full text-sm font-bold">แคมป์</button>
            <button onclick="filterItems('ช่าง')" class="cat-btn bg-white text-slate-500 border px-5 py-2 rounded-full text-sm font-bold">ช่าง</button>
        </div>

        <div id="productGrid" class="grid grid-cols-2 gap-4">
            <!-- สินค้าจะแสดงที่นี่ -->
        </div>

        <div id="emptyState" class="hidden text-center py-32">
            <div class="text-slate-300 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0l-8 4-8-4" />
                </svg>
            </div>
            <p class="text-slate-400 font-medium">ยังไม่มีสินค้าในหมวดนี้</p>
        </div>
    </main>

    <!-- ปุ่มเพิ่มของ (+) -->
    <button onclick="openForm()" class="fixed bottom-8 right-8 w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-2xl flex items-center justify-center active-scale z-50 border-4 border-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- หน้าต่างเพิ่มของ -->
    <div id="formModal" class="fixed inset-0 z-[100] bg-black/60 hidden items-end justify-center transition-all duration-300">
        <div class="bg-white w-full rounded-t-[2.5rem] p-8 animate-slide-up shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold">ลงประกาศใหม่</h3>
                <button onclick="closeForm()" class="bg-slate-100 p-2 rounded-full text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div class="space-y-4">
                <input type="text" id="pName" placeholder="ชื่อสินค้า" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-3">
                    <input type="number" id="pPrice" placeholder="ราคา/วัน" class="w-1/2 p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="pCat" class="w-1/2 p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="ไอที">ไอที</option>
                        <option value="แคมป์">แคมป์</option>
                        <option value="ช่าง">ช่าง</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <input type="text" id="pContact" placeholder="LINE ID หรือเบอร์โทร" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                <input type="url" id="pImg" placeholder="ลิงก์รูปภาพ (เว้นว่างได้)" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="saveToCloud()" id="btnSave" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg active-scale shadow-lg">ยืนยันประกาศ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'phaendin-rent-v4';

        let userName = "";
        let currentFilter = "ทั้งหมด";

        // เริ่มต้นแอป
        window.onload = () => {
            const saved = localStorage.getItem('p_user_name');
            if(saved) {
                userName = saved;
                initApp();
            }
        };

        window.startApp = () => {
            const input = document.getElementById('userInput').value.trim();
            if(!input) return alert("กรุณาใส่ชื่อของคุณก่อนครับ");
            userName = input;
            localStorage.setItem('p_user_name', userName);
            initApp();
        };

        async function initApp() {
            document.getElementById('loginOverlay').style.opacity = '0';
            setTimeout(() => document.getElementById('loginOverlay').classList.add('hidden'), 500);
            document.getElementById('displayUser').innerText = "คุณ " + userName;
            
            await signInAnonymously(auth);
            
            // ดึงข้อมูล Real-time
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'items');
            onSnapshot(q, (snapshot) => {
                const data = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                render(data);
            });
        }

        function render(items) {
            const grid = document.getElementById('productGrid');
            const filtered = items.filter(i => currentFilter === "ทั้งหมด" || i.category === currentFilter)
                                 .sort((a,b) => b.time - a.time);
            
            document.getElementById('emptyState').classList.toggle('hidden', filtered.length > 0);
            
            grid.innerHTML = filtered.map(i => `
                <div class="item-card bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm relative">
                    <img src="${i.img || 'https://via.placeholder.com/300?text=No+Image'}" class="w-full h-36 object-cover bg-slate-50">
                    <div class="p-4">
                        <div class="text-[10px] text-blue-600 font-bold mb-1">${i.category}</div>
                        <h3 class="font-bold text-sm truncate mb-2">${i.name}</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-blue-600 font-bold">฿${i.price}</span>
                            <span class="text-[9px] text-slate-400">/วัน</span>
                        </div>
                        <div class="mt-4 flex gap-1">
                            <a href="tel:${i.contact}" class="flex-1 bg-slate-900 text-white text-[10px] py-2 rounded-xl font-bold text-center active-scale">ติดต่อ</a>
                            ${i.owner === userName ? `
                                <button onclick="removeItem('${i.id}')" class="bg-red-50 text-red-500 p-2 rounded-xl active-scale">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                            ` : ''}
                        </div>
                        <div class="mt-2 text-[8px] text-slate-300 text-right">โดย: ${i.owner}</div>
                    </div>
                </div>
            `).join('');
        }

        window.filterItems = (cat) => {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText === cat) {
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                    btn.classList.remove('bg-white', 'text-slate-500', 'border');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
                    btn.classList.add('bg-white', 'text-slate-500', 'border');
                }
            });
            // เรียกข้อมูลที่มีอยู่มาเรนเดอร์ใหม่ (ไม่ต้องไปดึงจาก Cloud ใหม่)
            initApp(); 
        };

        window.openForm = () => {
            document.getElementById('formModal').classList.remove('hidden');
            document.getElementById('formModal').classList.add('flex');
        };
        window.closeForm = () => {
            document.getElementById('formModal').classList.add('hidden');
        };

        window.saveToCloud = async () => {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const cat = document.getElementById('pCat').value;
            const contact = document.getElementById('pContact').value;
            const img = document.getElementById('pImg').value;

            if(!name || !price || !contact) return alert("กรอกข้อมูลสำคัญให้ครบครับ");

            document.getElementById('btnSave').innerText = "กำลังบันทึก...";
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'items'), {
                    name, price, category: cat, contact, img, owner: userName, time: Date.now()
                });
                closeForm();
                document.getElementById('pName').value = "";
                document.getElementById('pPrice').value = "";
                document.getElementById('pContact').value = "";
                document.getElementById('pImg').value = "";
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการบันทึก");
            } finally {
                document.getElementById('btnSave').innerText = "ยืนยันประกาศ";
            }
        };

        window.removeItem = async (id) => {
            if(confirm("ลบประกาศนี้ใช่ไหม?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', id));
            }
        };
    </script>
</body>
</html>
