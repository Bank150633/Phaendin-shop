<script>


/* ==================================================
   GOOGLE SHEET API
================================================== */

const SHEET_API_URL =
"https://script.google.com/macros/s/AKfycbxqXpc-Q_2TPzyVnfFaInoGldXl-s8Du6XKfcic3lYKUBXy-FkyQaXGtNcbjTSWOUJI/exec";



/* ==================================================
   VARIABLES
================================================== */

let allProducts = [];

let filteredProducts = [];

let currentCategory = "ทั้งหมด";

let lastRandomIds = [];



/* ==================================================
   DOM
================================================== */

const productsGrid =
    document.getElementById("productsGrid");

const randomGrid =
    document.getElementById("randomGrid");

const randomButton =
    document.getElementById("randomButton");

const randomStatus =
    document.getElementById("randomStatus");

const searchInput =
    document.getElementById("searchInput");

const clearSearch =
    document.getElementById("clearSearch");

const loadingBox =
    document.getElementById("loadingBox");

const emptyBox =
    document.getElementById("emptyBox");

const productsTitle =
    document.getElementById("productsTitle");



/* ==================================================
   LOAD PRODUCTS
================================================== */

async function loadProducts() {

    try {

        loadingBox.style.display = "block";

        productsGrid.innerHTML = "";

        const response =
            await fetch(SHEET_API_URL, {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "ไม่สามารถเชื่อมต่อ Google Sheet ได้"
            );

        }


        const data =
            await response.json();


        /*
         * รองรับทั้งกรณี API ส่ง array ตรง ๆ
         * และกรณีส่ง {data:[...]}
         */

        if (Array.isArray(data)) {

            allProducts = data;

        } else if (
            data &&
            Array.isArray(data.data)
        ) {

            allProducts = data.data;

        } else {

            allProducts = [];

        }


        /*
         * ทำความสะอาดข้อมูล
         */

        allProducts =
            allProducts
            .filter(item => item)
            .map(normalizeProduct);


        /*
         * สุ่มลำดับสินค้าเริ่มต้น
         */

        allProducts =
            shuffleArray(allProducts);


        filteredProducts =
            [...allProducts];


        loadingBox.style.display = "none";


        renderProducts();


        /*
         * ยังไม่สุ่มจนกว่าผู้ใช้กดปุ่ม
         */

        randomGrid.innerHTML = "";

        randomStatus.textContent =
            `${allProducts.length} รายการ`;


    } catch (error) {

        console.error(error);

        loadingBox.style.display = "none";

        productsGrid.innerHTML = "";

        emptyBox.style.display = "block";

        emptyBox.innerHTML = `

            <i class="fas fa-triangle-exclamation"></i>

            <p>
                โหลดสินค้าไม่สำเร็จ
            </p>

            <small>
                กรุณาตรวจสอบ Google Sheet API
            </small>

        `;

    }

}



/* ==================================================
   NORMALIZE PRODUCT
================================================== */

function normalizeProduct(item) {

    return {

        id:
            String(
                item.id ??
                Math.random()
            ),

        title:
            String(
                item.title ??
                "สินค้าไม่มีชื่อ"
            ),

        category:
            String(
                item.category ??
                "อื่นๆ"
            ),

        province:
            String(
                item.province ??
                ""
            ),

        description:
            String(
                item.description ??
                ""
            ),

        salePrice:
            String(
                item.salePrice ??
                ""
            ),

        originalPrice:
            String(
                item.originalPrice ??
                ""
            ),

        image:
            String(
                item.image ??
                ""
            ),

        affiliateUrl:
            String(
                item.affiliateUrl ??
                ""
            ),

        /*
         * สำคัญ
         * ช่องใหม่สำหรับขายเอง
         */

        ownUrl:
            String(
                item.ownUrl ??
                ""
            ),

        tags:
            String(
                item.tags ??
                ""
            )

    };

}



/* ==================================================
   SHUFFLE
================================================== */

function shuffleArray(array) {

    const result =
        [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;

}



/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* ==================================================
   FORMAT PRICE
================================================== */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {

        return "";

    }


    const number =
        Number(
            String(price)
            .replace(/,/g, "")
            .replace(/[^\d.-]/g, "")
        );


    if (
        Number.isNaN(number)
    ) {

        return escapeHTML(price);

    }


    return number.toLocaleString("th-TH");

}



/* ==================================================
   TAG HTML
================================================== */

function createTags(tags) {

    if (!tags) {

        return "";

    }


    const list =
        String(tags)
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean)
        .slice(0, 2);


    if (!list.length) {

        return "";

    }


    return `

        <div class="tags">

            ${list.map(tag => `

                <span class="tag">

                    ${escapeHTML(tag)}

                </span>

            `).join("")}

        </div>

    `;

}



/* ==================================================
   IMAGE HTML
================================================== */

function createImage(image, title) {

    if (!image) {

        return `

            <div class="image-placeholder">

                <i class="fas fa-image"></i>

            </div>

        `;

    }


    return `

        <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(title)}"
            loading="lazy"
            onerror="
                this.style.display='none';
                this.parentElement.innerHTML='<div class=&quot;image-placeholder&quot;><i class=&quot;fas fa-image&quot;></i></div>';
            "
        >

    `;

}



/* ==================================================
   BUTTON HTML
================================================== */

function createButtons(item) {

    const affiliateUrl =
        String(item.affiliateUrl || "").trim();

    const ownUrl =
        String(item.ownUrl || "").trim();


    /*
     * ถ้ามีทั้ง 2 ลิงก์
     */

    if (
        affiliateUrl &&
        ownUrl
    ) {

        return `

            <div class="product-buttons">

                <a
                    href="${escapeHTML(affiliateUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="buy-button external-button"
                >

                    <i class="fas fa-store"></i>

                    ดูสินค้า

                </a>


                <a
                    href="${escapeHTML(ownUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="buy-button own-button"
                >

                    <i class="fas fa-shopping-cart"></i>

                    ซื้อกับเรา

                </a>

            </div>

        `;

    }


    /*
     * ถ้ามีเฉพาะซื้อกับเรา
     */

    if (
        ownUrl &&
        !affiliateUrl
    ) {

        return `

            <a
                href="${escapeHTML(ownUrl)}"
                target="_blank"
                rel="noopener noreferrer"
                class="buy-button own-button"
            >

                <i class="fas fa-shopping-cart"></i>

                ซื้อกับเรา

            </a>

        `;

    }


    /*
     * ถ้ามีเฉพาะลิงก์ภายนอก
     */

    if (
        affiliateUrl
    ) {

        return `

            <a
                href="${escapeHTML(affiliateUrl)}"
                target="_blank"
                rel="noopener noreferrer"
                class="buy-button external-button"
            >

                <i class="fas fa-store"></i>

                ดูสินค้า

            </a>

        `;

    }


    /*
     * ไม่มีลิงก์เลย
     */

    return `

        <button
            type="button"
            class="buy-button"
            style="
                background:#e5e7eb;
                color:#6b7280;
                cursor:not-allowed;
            "
            disabled
        >

            <i class="fas fa-clock"></i>

            เร็วๆ นี้

        </button>

    `;

}



/* ==================================================
   PRODUCT CARD
================================================== */

function createProductCard(
    item,
    random = false
) {

    const salePrice =
        formatPrice(item.salePrice);

    const originalPrice =
        formatPrice(item.originalPrice);


    return `

        <article
            class="product-card ${random ? "random-card" : ""}"
        >


            <!-- IMAGE -->

            <div class="product-image">

                ${createImage(
                    item.image,
                    item.title
                )}

            </div>


            <!-- CONTENT -->

            <div class="product-content">


                <!-- TITLE -->

                <h3 class="product-title">

                    ${escapeHTML(
                        item.title
                    )}

                </h3>


                <!-- PROVINCE -->

                ${
                    item.province
                    ?
                    `
                    <div class="product-province">

                        <i class="fas fa-location-dot"></i>

                        ${escapeHTML(
                            item.province
                        )}

                    </div>
                    `
                    :
                    ""
                }


                <!-- TAGS -->

                ${createTags(
                    item.tags
                )}


                <!-- PRICE -->

                ${
                    salePrice
                    ?
                    `
                    <div class="price-row">

                        <span class="sale-price">

                            ฿${salePrice}

                        </span>


                        ${
                            originalPrice
                            ?
                            `
                            <span class="original-price">

                                ฿${originalPrice}

                            </span>
                            `
                            :
                            ""
                        }

                    </div>
                    `
                    :
                    ""
                }


                <!-- BUTTONS -->

                ${createButtons(item)}

            </div>

        </article>

    `;

}



/* ==================================================
   RENDER PRODUCTS
================================================== */

function renderProducts() {

    productsGrid.innerHTML = "";

    emptyBox.style.display = "none";


    if (
        !filteredProducts.length
    ) {

        emptyBox.style.display =
            "block";

        productsTitle.innerHTML = `

            <i class="fas fa-bowl-food"></i>

            ไม่พบสินค้า

        `;

        return;

    }


    productsTitle.innerHTML = `

        <i class="fas fa-bowl-food"></i>

        ${
            currentCategory === "ทั้งหมด"
            ?
            "ของอร่อยทั้งหมด"
            :
            escapeHTML(currentCategory)
        }

    `;


    productsGrid.innerHTML =
        filteredProducts
        .map(item =>
            createProductCard(item)
        )
        .join("");

}



/* ==================================================
   FILTER PRODUCTS
================================================== */

function filterProducts() {

    const keyword =
        searchInput.value
        .trim()
        .toLowerCase();


    filteredProducts =
        allProducts.filter(item => {


            const matchCategory =
                currentCategory === "ทั้งหมด" ||
                item.category
                    .toLowerCase()
                    .includes(
                        currentCategory.toLowerCase()
                    );


            const searchableText = [

                item.title,

                item.category,

                item.province,

                item.description,

                item.tags

            ]
            .join(" ")
            .toLowerCase();


            const matchSearch =
                !keyword ||
                searchableText.includes(
                    keyword
                );


            return (
                matchCategory &&
                matchSearch
            );

        });


    renderProducts();


    clearSearch.style.display =
        searchInput.value
        ?
        "block"
        :
        "none";

}



/* ==================================================
   RANDOM 3 PRODUCTS
================================================== */

function randomProducts() {

    if (
        !allProducts.length
    ) {

        return;

    }


    /*
     * เอาสินค้าที่ไม่ซ้ำกับรอบก่อน
     */

    let available =
        allProducts.filter(
            item =>
                !lastRandomIds.includes(
                    item.id
                )
        );


    /*
     * ถ้าเหลือน้อยกว่า 3
     * ใช้ทั้งหมดแล้วสุ่มใหม่
     */

    if (
        available.length < 3
    ) {

        available =
            [...allProducts];

    }


    available =
        shuffleArray(
            available
        );


    const selected =
        available.slice(
            0,
            Math.min(
                3,
                available.length
            )
        );


    lastRandomIds =
        selected.map(
            item => item.id
        );


    randomGrid.innerHTML =
        selected
        .map(item =>
            createProductCard(
                item,
                true
            )
        )
        .join("");


    randomStatus.textContent =
        `สุ่ม ${selected.length} รายการ`;


    /*
     * เลื่อนมาดูผลสุ่ม
     */

    document
        .getElementById("randomSection")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}



/* ==================================================
   CATEGORY CLICK
================================================== */

document
    .querySelectorAll(".category-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".category-button"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );


                button.classList.add(
                    "active"
                );


                currentCategory =
                    button.dataset.category;


                filterProducts();

            }
        );

    });



/* ==================================================
   SEARCH
================================================== */

searchInput.addEventListener(
    "input",
    filterProducts
);



/* ==================================================
   CLEAR SEARCH
================================================== */

clearSearch.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        filterProducts();

        searchInput.focus();

    }
);



/* ==================================================
   RANDOM BUTTON
================================================== */

randomButton.addEventListener(
    "click",
    randomProducts
);



/* ==================================================
   START
================================================== */

loadProducts();


</script>

</body>

</html>
