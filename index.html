<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Phaendin Rental</title>
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-600 p-4 text-white flex justify-between">
        <h1 class="font-bold">Phaendin Rental</h1>
        <button onclick="alert('ฟีเจอร์ลงทะเบียนกำลังมา!')" class="bg-white text-blue-600 px-3 py-1 rounded-full text-sm">+ ลงประกาศ</button>
    </nav>

    <div class="p-6 max-w-6xl mx-auto">
        <div id="app" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p>กำลังโหลดสินค้า...</p>
        </div>
    </div>

    <script>
        const API_URL = "ใส่_URL_ที่ก๊อปมาจาก_GAS_ตรงนี้";

        async function loadData() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const container = document.getElementById('app');
            container.innerHTML = data.map(item => `
                <div class="bg-white shadow rounded-xl overflow-hidden">
                    <img src="${item[5]}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold">${item[2]}</h3>
                        <p class="text-blue-600">${item[3]} บาท/วัน</p>
                        <a href="https://line.me/ti/p/~${item[4]}" class="block mt-4 bg-green-500 text-white text-center py-2 rounded">ติดต่อเช่า</a>
                    </div>
                </div>
            `).join('');
        }
        loadData();
    </script>
</body>
</html>
