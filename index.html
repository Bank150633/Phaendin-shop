<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 55px; transition: 0.3s; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 5px 10px; border-bottom: 1px solid var(--gold); display: flex; justify-content: center; align-items: center; height: 50px; }
        .logo-img { height: 45px; width: auto; display: block; }

        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; }
        #search { width: 100%; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; color: var(--gold); font-size: 13px; }

        /* Banner Section */
        .banner-box { padding: 8px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; height: 220px; background: #000; position: relative; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-end; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .bn-title { font-size: 16px; font-weight: 600; color: #fff; }
        .timer-unit { color: #ff4b2b; font-weight: 700; font-size: 13px; }

        /* Product Grid */
        .sec-title { padding: 10px; font-size: 13px; font-weight: 600; color: var(--gold); text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; background: #000; }
        .media-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .province-badge { position: absolute; top: 4px; right: 4px; background: var(--gold-grad); color: #000; font-size: 7px; padding: 2px 5px; border-radius: 4px; font-weight: 700; z-index: 10; }

        /* --- New UI: Order Detail & 2-Column Variants --- */
        .order-header-gallery { margin: -10px -10px 15px -10px; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .main-img-display { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
        .main-img-display img, .main-img-display video { width: 100%; height: 100%; object-fit: contain; }

        #optionBox { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .variant-item { 
            display: flex; flex-direction: column; align-items: center; 
            background: rgba(255,255,255,0.03); padding: 8px; 
            border-radius: 12px; border: 1px solid rgba(212,175,55,0.1);
            cursor: pointer; text-align: center; transition: 0.2s;
        }
        .variant-item:active { background: rgba(212,175,55,0.1); }
        .v-img { width: 100%; aspect-ratio: 1/1; border-radius: 8px; object-fit: cover; margin-bottom: 6px; border: 0.5px solid #333; }
        .v-name { font-size: 11px; color: #fff; line-height: 1.2; height: 2.4em; overflow: hidden; }
        .v-price { font-size: 12px; color: var(--gold); font-weight: bold; margin: 4px 0; }
        .v-ctrl { display: flex; align-items: center; justify-content: space-between; background: #000; padding: 4px 8px; border-radius: 20px; border: 0.5px solid #444; width: 100%; }
        .v-btn { width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--gold-grad); color: #000; font-weight: bold; }

        /* Modal & UI Elements */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 10px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 18px; width: 100%; max-width: 350px; padding: 12px; max-height: 94vh; overflow-y: auto; }
        .order-summary-box { background: linear-gradient(180deg, rgba(212,175,55,0.1), transparent); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; padding: 10px; margin-bottom: 15px; text-align: center; }
        
        .input-slim { width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 8px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 12px; outline: none; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 10px; font-weight: 700; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .copy-badge { cursor: pointer; background: rgba(212,175,55,0.2); padding: 2px 6px; border-radius: 4px; color: var(--gold); font-size: 10px; margin-left: 5px; }

        nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 9px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
    </style>
</head>
<body>

<header><img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img"></header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
</div>

<div class="sec-title"><i class="fa-solid fa-layer-group"></i> สินค้าทั้งหมด</div>
<main class="grid" id="productGrid"></main>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <div id="orderDetail"></div> <p id="minMaxText" style="font-size:10px; color:var(--gold); text-align:center; margin-bottom:10px;"></p>
        
        <form id="orderForm">
            <div id="optionBox"></div> <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:50px;"></textarea>
            
            <div style="text-align:center; margin: 10px 0; background:rgba(212,175,55,0.05); padding:10px; border-radius:12px; border:1px solid rgba(212,175,55,0.2);">
                <p style="font-size:11px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2 <span class="copy-badge" onclick="copyToClipboard('0358567622')">คัดลอก</span></p>
                <p style="font-size:10px; color:var(--text-dim);">ชื่อบัญชี: คุณวัชระ ชันสิน</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:60px; margin-top:8px; border-radius:5px;">
            </div>
            
            <div style="border:1px dashed var(--gold); padding:10px; border-radius:10px; text-align:center; cursor:pointer; margin-bottom:10px;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:10px; color:var(--gold);"><i class="fa-solid fa-image"></i> แนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:80px; margin:5px auto; border-radius:6px;">
            </div>
            
            <button type="submit" id="submitBtn" class="buy-now">ยืนยันการสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:12px; font-size:11px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
</nav>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    let db = [], activeP = {}, bannerEnd = null, selectedOptions = {};

    function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => alert("คัดลอกเลขบัญชีแล้ว!")); }

    async function init() {
        // Load Banner
        const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
        const bRaw = await resB.text();
        const b = bRaw.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
        if(b) {
            bannerEnd = new Date(b[2]).getTime();
            document.getElementById('banner').innerHTML = `
                <div class="bn-card">
                    <div class="bn-img">${renderMedia(b[0], true)}</div>
                    <div class="bn-txt">
                        <div class="bn-title">🔥 ${b[1]}</div>
                        <div style="background:rgba(255,255,255,0.1); padding:4px 8px; border-radius:10px;">
                            <span class="timer-unit" id="th">00</span>:<span class="timer-unit" id="tm">00</span>:<span class="timer-unit" id="ts">00</span>
                        </div>
                    </div>
                </div>`;
            setInterval(tick, 1000);
        }

        // Load Products
        const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
        const pRaw = await resP.text();
        db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
        db.sort(() => Math.random() - 0.5); 
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media-wrap">${renderMedia(p[1], true)}</div>
                ${p[13] ? `<div class="province-badge">${p[13]}</div>` : ''}
                <div style="padding:5px; text-align:center;">
                    <div style="font-size:10px; color:var(--gold); white-space:nowrap; overflow:hidden;">${p[0]}</div>
                    <div style="font-size:12px; font-weight:bold;">฿${parseFloat(p[3]).toLocaleString()}</div>
                </div>
                <button class="buy-now" style="font-size:10px; padding:6px; border-radius:0;" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}', 0, ${p[12]||999}, '${p[1]}', ${p[14]||1})">สั่งซื้อ</button>
            </div>`).join('');
    }

    function openOrder(n, pNormal, s, optStr, discPercent, maxLimit, imgUrl, minLimit) {
        activeP = { name: n, pNormal: parseFloat(pNormal), ship: parseFloat(s), disc: discPercent, max: parseInt(maxLimit), min: parseInt(minLimit), img: imgUrl };
        selectedOptions = {}; 
        
        document.getElementById('orderDetail').innerHTML = `
            <div class="order-header-gallery"><div class="main-img-display" id="mainView">${renderMedia(imgUrl, true)}</div></div>
            <div id="priceSummary"></div>
        `;
        document.getElementById('minMaxText').innerText = `📦 สั่งขั้นต่ำ ${activeP.min} ชิ้น (สูงสุด ${activeP.max})`;
        const box = document.getElementById('optionBox');
        box.innerHTML = ''; 

        if(optStr && optStr !== '-') {
            optStr.split(',').forEach(o => {
                let parts = o.split(':').map(v => v?.trim());
                let label = parts[0], price = parts[1] ? parseFloat(parts[1]) : activeP.pNormal, vImg = parts[2] || imgUrl;
                box.innerHTML += `
                    <div class="variant-item" onclick="changePreview('${vImg}')">
                        <img src="${vImg}" class="v-img" onerror="this.src='${imgUrl}'">
                        <div class="v-info">
                            <div class="v-name">${label}</div>
                            <div class="v-price">฿${price.toLocaleString()}</div>
                        </div>
                        <div class="v-ctrl" onclick="event.stopPropagation()">
                            <button type="button" class="v-btn" onclick="changeVQty('${label}', ${price}, -1)">-</button>
                            <span id="v-qty-${label}" style="font-size:12px; font-weight:bold; color:#fff;">0</span>
                            <button type="button" class="v-btn" onclick="changeVQty('${label}', ${price}, 1)">+</button>
                        </div>
                    </div>`;
                selectedOptions[label] = { qty: 0, price: price };
            });
        }
        updatePrice();
        openModal('orderModal');
    }

    function changePreview(url) { document.getElementById('mainView').innerHTML = renderMedia(url, true); }

    function changeVQty(label, price, delta) {
        let totalNow = Object.values(selectedOptions).reduce((sum, item) => sum + item.qty, 0);
        if (delta > 0 && totalNow >= activeP.max) return alert("จำกัดจำนวนสูงสุดที่ " + activeP.max);
        let nextQty = selectedOptions[label].qty + delta;
        if (nextQty >= 0) { selectedOptions[label].qty = nextQty; document.getElementById(`v-qty-${label}`).innerText = nextQty; updatePrice(); }
    }

    function updatePrice() {
        let subtotal = 0, totalItems = 0, summary = [];
        for (let key in selectedOptions) { 
            if(selectedOptions[key].qty > 0) {
                subtotal += (selectedOptions[key].price * selectedOptions[key].qty); 
                totalItems += selectedOptions[key].qty;
                summary.push(`${key} (${selectedOptions[key].qty})`);
            }
        }
        activeP.final = subtotal > 0 ? subtotal + activeP.ship : 0;
        activeP.summary = summary.join(', ');
        document.getElementById('priceSummary').innerHTML = `
            <div class="order-summary-box">
                <div style="font-size:12px; font-weight:600; color:var(--gold);">${activeP.name}</div>
                <div style="font-size:24px; font-weight:bold; margin:5px 0;">฿${activeP.final.toLocaleString()}</div>
                <div style="font-size:10px; color:var(--text-dim);">${activeP.summary || 'โปรดเลือกรายการสินค้า'}</div>
            </div>`;
        const btn = document.getElementById('submitBtn');
        btn.disabled = totalItems < activeP.min;
        btn.style.opacity = btn.disabled ? "0.5" : "1";
    }

    function renderMedia(url, isMuted) { if(!url) return ''; return url.match(/\.(mp4|webm|mov)$/i) ? `<video src="${url}" ${isMuted?'autoplay loop muted playsinline':'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${url}">`; }
    function tick() { if(!bannerEnd) return; const d = bannerEnd - Date.now(); if(d > 0) { document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0'); document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0'); document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0'); } }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; setTimeout(() => document.getElementById(id).classList.add('show'), 10); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); setTimeout(() => document.getElementById(id).style.display = 'none', 300); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("แนบสลิปด้วยนะครับ");
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = { productDetail: `${activeP.name} [${activeP.summary}] | ยอด: ฿${activeP.final}`, customerName: document.getElementById('cName').value, customerPhone: document.getElementById('cPhone').value, customerAddress: document.getElementById('cAddr').value, file: reader.result.split(',')[1] };
            await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
            alert("สั่งซื้อสำเร็จ!"); location.reload();
        };
        reader.readAsDataURL(file);
    };

    async function checkShip() {
        const p = prompt("เบอร์โทรศัพท์ที่ใช้สั่งซื้อ:"); 
        if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const text = await res.text();
        const rows = text.split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'').trim()));
        const orders = rows.filter(r => r[0] === p);
        if(orders.length > 0) alert(orders.map(f => `คุณ ${f[1]}\nสถานะ: ${f[2]}\nเลขพัสดุ: ${f[3]}`).join('\n---\n'));
        else alert("ไม่พบข้อมูล");
    }

    init();
</script>
</body>
</html>
