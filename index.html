<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #eec24b; --bg: #050505; --card: #1a1a1a; --text: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* Banner ตามภาพ 1064 */
        .banner { width: 100%; height: 210px; background: url('https://via.placeholder.com/1000x500/000/fff?text=Banner+Image') center/cover; position: relative; }
        .banner-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        .bn-tag { color: var(--gold); font-weight: 600; font-size: 1.1rem; line-height: 1.3; }
        .bn-timer { background: rgba(0,0,0,0.7); width: fit-content; padding: 4px 15px; border-radius: 20px; font-size: 0.8rem; margin: 10px 0; border: 1px solid var(--gold); color: #fff; }
        .bn-btn { background: var(--gold); color: #000; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 700; width: fit-content; cursor: pointer; }

        /* Search Bar */
        .search-box { padding: 15px; }
        .search-wrap { position: relative; background: #111; border-radius: 25px; border: 1px solid #333; display: flex; align-items: center; padding: 0 15px; }
        .search-wrap i { color: var(--gold); margin-right: 10px; }
        .search-wrap input { background: transparent; border: none; color: #fff; padding: 12px 0; width: 100%; outline: none; font-size: 0.9rem; }

        /* Grid 3 Columns เป๊ะๆ */
        .sec-title { padding: 0 15px 10px; color: var(--gold); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 10px; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; }
        .media-box { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 8px 5px; text-align: center; flex-grow: 1; }
        .p-name { font-size: 0.75rem; color: #ccc; margin-bottom: 5px; height: 2.4em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { color: #fff; font-weight: 700; font-size: 1rem; display: block; margin-bottom: 8px; }
        .btn-buy { background: var(--gold); color: #000; border: none; padding: 8px 0; width: 100%; font-weight: 700; font-size: 0.8rem; cursor: pointer; border-radius: 0 0 10px 100px; /* ทรงปุ่มตามรูป */ }

        /* Footer */
        footer { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; border-top: 1px solid #222; padding: 10px 0; }
        .nav-item { flex: 1; text-align: center; color: #666; font-size: 0.7rem; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div class="banner">
        <div class="banner-overlay">
            <div class="bn-tag">ไม่ควรพลาด ของถูก ของดี มาแล้ว!</div>
            <div class="bn-timer">⏳ <span id="timer">00 : 00 : 00</span></div>
            <button class="bn-btn">รับสิทธิ์ด่วน</button>
        </div>
    </div>

    <div class="search-box">
        <div class="search-wrap">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="ค้นหาสินค้า..." oninput="render()">
        </div>
    </div>

    <div class="sec-title"><i class="fa-solid fa-fire"></i> สินค้าแนะนำ</div>
    <div id="productGrid" class="grid">
        </div>

    <footer>
        <div class="nav-item active"><i class="fa-solid fa-house"></i>หน้าแรก</div>
        <div class="nav-item"><i class="fa-solid fa-truck"></i>พัสดุ</div>
        <div class="nav-item"><i class="fa-solid fa-comment"></i>ติดต่อ</div>
    </footer>

<script>
    // ⚠️ นำ ID จาก Google Sheets ของคุณมาใส่ตรงนี้
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y'; 
    let db = [];

    async function init() {
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Product`);
            const text = await res.text();
            
            // แปลง CSV เป็น Array
            const rows = text.split('\n').slice(1);
            db = rows.map(row => {
                // จัดการเรื่อง comma ในข้อความ
                return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            }).filter(row => row[0] !== ""); 

            render();
        } catch (e) {
            console.error("Load Error:", e);
            document.getElementById('productGrid').innerHTML = "<p style='grid-column:1/-1; text-align:center;'>กำลังเชื่อมต่อข้อมูล...</p>";
        }
    }

    function renderMedia(url) {
        if (!url) return '<img src="https://via.placeholder.com/300?text=No+Image">';
        const isVid = /\.(mp4|webm|mov)$/i.test(url);
        if (isVid) return `<video src="${url}" autoplay loop muted playsinline></video>`;
        return `<img src="${url}" onerror="this.src='https://via.placeholder.com/300?text=Error'">`;
    }

    function render() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        document.getElementById('productGrid').innerHTML = filtered.map(p => {
            // อ้างอิงคอลัมน์จากภาพ 1067
            // p[0] = ชื่อสินค้า, p[1] = ลิงก์รูป, p[3] = ราคา
            return `
                <div class="card">
                    <div class="media-box">${renderMedia(p[1])}</div>
                    <div class="card-body">
                        <div class="p-name">${p[0]}</div>
                        <div class="p-price">฿${p[3]}</div>
                    </div>
                    <button class="btn-buy">สั่งซื้อ</button>
                </div>
            `;
        }).join('');
    }

    init();
</script>
</body>
</html>
