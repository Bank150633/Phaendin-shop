<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%); --bg: #000; --card: #111; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 90px; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); z-index: 1000; border-bottom: 1px solid #222; padding: 10px 0; text-align: center; }
        .logo-img { height: 30px; }

        /* --- Layout --- */
        .content-body { padding-top: 60px; }
        .section-title { font-size: 16px; color: var(--gold); padding: 15px; font-weight: 600; }

        /* --- Product Card --- */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; }
        
        .media-box { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; cursor: zoom-in; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: contain; }
        
        .info-box { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .price-tag { color: var(--gold); font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .item-name { font-size: 13px; color: #ccc; margin-bottom: 10px; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .buy-btn { background: var(--gold-grad); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }

        /* --- Lightbox (ขยายรูป) --- */
        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; align-items: center; justify-content: center; }
        #lightbox-content { max-width: 95%; max-height: 80%; }
        .close-lightbox { position: absolute; top: 30px; right: 30px; font-size: 30px; color: #fff; cursor: pointer; }

        /* --- Form Modal --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; align-items: center; justify-content: center; padding: 20px; }
        .modal-inner { background: #111; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; }
        .input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 10px; font-family: 'Kanit'; }

        .footer { position: fixed; bottom: 0; width: 100%; height: 70px; background: #080808; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { color: #666; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-btn.active { color: var(--gold); }
    </style>
</head>
<body>

<header><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></header>

<div class="content-body">
    <div class="section-title">✨ สินค้าแนะนำ</div>
    <div class="product-grid" id="productList"></div>
</div>

<nav class="footer">
    <a href="#" class="nav-btn active"><i class="fa-solid fa-house"></i><br>หน้าหลัก</a>
    <a href="javascript:void(0)" onclick="alert('Coming Soon')" class="nav-btn"><i class="fa-solid fa-truck"></i><br>พัสดุ</a>
    <a href="javascript:void(0)" onclick="openContact()" class="nav-btn"><i class="fa-solid fa-comment"></i><br>ติดต่อ</a>
</nav>

<div id="lightbox" onclick="this.style.display='none'">
    <span class="close-lightbox">&times;</span>
    <div id="lightbox-viewer"></div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-inner">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:15px;">ข้อมูลการสั่งซื้อ</h3>
        <p id="targetName" style="font-size:13px; margin-bottom:10px; text-align:center;"></p>
        <form id="orderForm">
            <input type="text" id="name" class="input" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="phone" class="input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="addr" class="input" rows="3" placeholder="ที่อยู่จัดส่ง" required></textarea>
            <button type="submit" class="buy-btn">ยืนยันและส่งสลิป</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="text-align:center; margin-top:15px; font-size:12px; color:#555;">ปิดหน้าต่าง</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    
    async function load() {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`);
        const text = await res.text();
        const rows = text.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
        
        document.getElementById('productList').innerHTML = rows.filter(r => r[0] && r[1]).map(p => `
            <div class="card">
                <div class="media-box" onclick="zoomMedia('${p[1]}')">
                    ${p[1].toLowerCase().endsWith('.mp4') ? `<video src="${p[1]}" autoplay loop muted playsinline></video>` : `<img src="${p[1]}">`}
                    <div style="position:absolute; top:5px; right:5px; background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:4px; font-size:10px;">ขยายรูป</div>
                </div>
                <div class="info-box">
                    <div class="price-tag">฿${p[3]}</div>
                    <div class="item-name">${p[0]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}')">สั่งซื้อสินค้า</button>
                </div>
            </div>
        `).join('');
    }

    // ฟังก์ชันขยายรูป/วิดีโอ
    function zoomMedia(url) {
        const viewer = document.getElementById('lightbox-viewer');
        if (url.toLowerCase().endsWith('.mp4')) {
            viewer.innerHTML = `<video src="${url}" controls autoplay style="width:100%; max-height:80vh;"></video>`;
        } else {
            viewer.innerHTML = `<img src="${url}" style="width:100%; max-height:80vh; object-fit:contain;">`;
        }
        document.getElementById('lightbox').style.display = 'flex';
    }

    function openOrder(name, price) {
        document.getElementById('targetName').innerText = `สินค้า: ${name} (฿${price})`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function openContact() { window.open('https://line.me/ti/p/yourid'); }

    load();
</script>
</body>
</html>
