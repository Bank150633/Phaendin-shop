<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #0A0A0A; --card: rgba(255, 255, 255, 0.03); --text: #FFFFFF; --text-dim: #999999;
            --input-bg: #1A1A1A; --promo-red: #E74C3C; --promo-green: #2ECC71;
        }
        body.light-mode {
            --bg: #F5F5F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; transition: 0.3s; }

        /* Floating Theme Toggle */
        .theme-btn { position: fixed; top: 15px; right: 15px; z-index: 2001; background: var(--gold-grad); border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Header */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 1000; padding: 12px; border-bottom: 1px solid rgba(212,175,55,0.15); }
        .logo { height: 28px; display: block; margin: 0 auto 12px; filter: drop-shadow(0 0 5px rgba(212,175,55,0.5)); }
        .search-wrap { position: relative; width: 100%; }
        #search { width: 100%; padding: 10px 18px 10px 40px; border-radius: 25px; border: 1px solid rgba(128,128,128,0.2); background: rgba(255,255,255,0.08); color: var(--text); font-size: 13px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

        /* Banner */
        .banner-box { margin: 105px 12px 18px; border: 1.5px solid var(--gold); border-radius: 18px; overflow: hidden; display: flex; height: 140px; background: #000; }
        .bn-img { width: 42%; cursor: zoom-in; position: relative; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { width: 58%; padding: 15px; display: flex; flex-direction: column; justify-content: center; }
        .bn-title { font-size: 14px; font-weight: 600; color: var(--gold); margin-bottom: 5px; line-height: 1.2; }
        .bn-timer { display: flex; gap: 4px; margin-bottom: 10px; font-size: 11px; }
        .t-unit { background: var(--gold-grad); color: #000; padding: 2px 5px; border-radius: 4px; font-weight: 700; }
        .bn-btn { background: var(--promo-red); color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; animation: pulse 1.5s infinite; cursor: pointer; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 18px; overflow: hidden; position: relative; border: 1px solid rgba(128,128,128,0.08); display: flex; flex-direction: column; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; cursor: zoom-in; background: #000; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Badge Stack */
        .badge-container { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .badge { font-size: 9px; padding: 2px 8px; border-radius: 4px; font-weight: 700; color: #000; background: var(--gold-grad); }
        .badge.green { background: var(--promo-green); color: #fff; }

        .info { padding: 10px; text-align: center; flex: 1; }
        .p-name { font-size: 12px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { color: var(--gold); font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 8px; border-radius: 10px; font-weight: 700; font-size: 12px; }

        /* Modals & Zoom */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 330px; padding: 20px; text-align: center; position: relative; max-height: 85vh; overflow-y: auto; }
        
        /* Order Modal Elements */
        .sum-box { background: rgba(212,175,55,0.1); padding: 10px; border-radius: 12px; text-align: left; margin-bottom: 12px; font-size: 12px; border-left: 4px solid var(--gold); }
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid rgba(128,128,128,0.2); color: var(--text); padding: 9px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
        .qr-mini { width: 110px; margin: 5px auto; padding: 5px; background: #fff; border-radius: 8px; border: 2px solid var(--gold); }
        
        /* Contact Links */
        .contact-link { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid rgba(212,175,55,0.1); border-radius: 12px; color: var(--text); text-decoration: none; font-size: 13px; margin-bottom: 8px; }
        .contact-link i { font-size: 18px; width: 25px; }

        /* Zoom Overlay */
        #zoomOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; }
        #zoomContent img, #zoomContent video { max-width: 90vw; max-height: 80vh; border: 1px solid var(--gold); border-radius: 12px; }

        /* Nav */
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(0,0,0,0.9); display: flex; border-top: 1px solid rgba(212,175,55,0.2); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); text-decoration: none; font-size: 11px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 20px; margin-bottom: 3px; }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>

<header>
    <img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo">
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
    </div>
</header>

<div class="banner-box" id="banner"></div>

<main class="grid" id="productGrid">
    <div style="grid-column: span 2; text-align: center; padding: 50px; color: var(--text-dim);">กำลังโหลด...</div>
</main>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<div id="contactModal" class="modal" onclick="closeContact()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h3 style="color:var(--gold); margin-bottom:15px; font-size:16px;">ติดต่อสอบถาม</h3>
        <a href="tel:0944159031" class="contact-link"><i class="fa-solid fa-phone" style="color:#34c759;"></i> โทร: 094-415-9031</a>
        <a href="https://line.me/ti/p/YOUR_LINE_ID" target="_blank" class="contact-link"><i class="fa-brands fa-line" style="color:#06C755;"></i> LINE Official</a>
        <a href="https://m.me/YOUR_PAGE_ID" target="_blank" class="contact-link"><i class="fa-brands fa-facebook-messenger" style="color:#0084FF;"></i> Facebook Messenger</a>
        <a href="https://www.tiktok.com/@YOUR_USERNAME" target="_blank" class="contact-link"><i class="fa-brands fa-tiktok" style="color:#fff;"></i> TikTok Shop</a>
        <p onclick="closeContact()" style="font-size:11px; color:var(--text-dim); margin-top:10px; cursor:pointer;">[ ปิดหน้าต่าง ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h3 style="color:var(--gold); font-size:16px; margin-bottom:12px;">สั่งซื้อสินค้า</h3>
        <div class="sum-box">
            <b>กสิกร: 035-8-56762-2 (วัชระ ชันสิน)</b>
            <div id="sumDetail" style="margin-top:5px;"></div>
            <div id="sumTotal" style="font-weight:700; color:var(--gold); font-size:15px; border-top:1px solid rgba(212,175,55,0.1); padding-top:4px; margin-top:4px;"></div>
        </div>
        <form id="orderForm">
            <div id="variantArea" style="display:none"><select id="vSelect" class="form-control" onchange="calcPrice()"></select></div>
            <input type="text" id="cName" class="form-control" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="cPhone" class="form-control" placeholder="เบอร์โทรศัพท์" required>
            <input type="text" id="cAddr" class="form-control" placeholder="ที่อยู่จัดส่ง" required>
            <div class="qr-mini"><img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png" style="width:100%"></div>
            <div style="border:1px dashed var(--gold); padding:8px; border-radius:10px; margin-bottom:10px; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:11px; color:var(--gold)">📸 แตะแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)">
                <img id="preview" style="display:none; width:100%; border-radius:8px; margin-top:5px;">
            </div>
            <button type="submit" id="submitBtn" class="buy-now">ยืนยันการสั่งซื้อ</button>
        </form>
        <p onclick="closeOrder()" style="font-size:11px; color:var(--text-dim); margin-top:10px; cursor:pointer;">[ ยกเลิก ]</p>
    </div>
</div>

<nav>
    <a href="#" class="nav-tab active"><i class="fa-solid fa-gem"></i>หน้าแรก</a>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-box-open"></i>พัสดุ</div>
    <div class="nav-tab" onclick="openContact()"><i class="fa-solid fa-comment-dots"></i>ติดต่อเรา</div>
</nav>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;

    async function init() {
        try {
            // Load Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0])}</div>
                    <div class="bn-txt">
                        <div class="bn-title">${b[1]}</div>
                        <div class="bn-timer"><span class="t-unit" id="th">00</span>:<span class="t-unit" id="tm">00</span>:<span class="t-unit" id="ts">00</span></div>
                        <button class="bn-btn" onclick="openOrder('${b[1]}',0,0,'')">สั่งซื้อด่วน!</button>
                    </div>`;
                setInterval(tick, 1000);
            }
            // Load Products
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            db = (await resP.text()).split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        let list = db.filter(p => p[0].toLowerCase().includes(q));
        if(!q) list = list.sort(() => Math.random() - 0.5);

        document.getElementById('productGrid').innerHTML = list.map(p => {
            const badges = p[10] ? p[10].split(',').map(tag => `<span class="badge ${tag.includes('ส่งฟรี')?'green':''}">${tag.trim()}</span>`).join('') : '';
            return `
            <div class="card">
                <div class="badge-container">${badges}</div>
                <div class="media-wrap" onclick="zoom('${p[1]}')">${renderMedia(p[1])}</div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${p[3]}</div>
                    <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
                </div>
            </div>`;
        }).join('');
    }

    function renderMedia(url, controls=false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline ${controls?'controls':''}></video>` : `<img src="${url}">`;
    }

    // --- ZOOM & VIDEO FIX ---
    function zoom(url) {
        const overlay = document.getElementById('zoomOverlay');
        const content = document.getElementById('zoomContent');
        content.innerHTML = renderMedia(url, true);
        overlay.style.display = 'flex';
        const vid = content.querySelector('video');
        if(vid) { vid.muted = false; vid.play(); }
    }

    function closeZoom() {
        const overlay = document.getElementById('zoomOverlay');
        const content = document.getElementById('zoomContent');
        const vid = content.querySelector('video');
        if(vid) { vid.pause(); vid.src = ""; vid.load(); }
        overlay.style.display = 'none';
        content.innerHTML = "";
    }

    // --- MODAL SYSTEM ---
    function openOrder(n, p, s, v) {
        activeP = { n, p: parseFloat(p.toString().replace(/,/g,'')), s: parseFloat(s)||0 };
        const area = document.getElementById('variantArea');
        const sel = document.getElementById('vSelect');
        if(v && v.includes(':')) {
            area.style.display = 'block';
            sel.innerHTML = v.split(',').map(i => { const pair = i.split(':'); return `<option value="${pair[1]}">${pair[0]} (฿${pair[1]})</option>`; }).join('');
        } else {
            area.style.display = 'none';
            sel.innerHTML = `<option value="${activeP.p}">ปกติ</option>`;
        }
        calcPrice();
        const m = document.getElementById('orderModal'); m.style.display = 'flex'; setTimeout(()=>m.classList.add('show'),10);
    }

    function calcPrice() {
        const vp = parseFloat(document.getElementById('vSelect').value);
        const total = vp + activeP.s;
        document.getElementById('sumDetail').innerHTML = `📦 ${activeP.n}<br>🚚 ค่าส่ง ฿${activeP.s}`;
        document.getElementById('sumTotal').innerText = `ยอดโอนรวม: ฿${total.toLocaleString()}`;
    }

    function openContact() { const m = document.getElementById('contactModal'); m.style.display = 'flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeContact() { const m = document.getElementById('contactModal'); m.classList.remove('show'); setTimeout(()=>m.style.display='none',300); }
    function closeOrder() { const m = document.getElementById('orderModal'); m.classList.remove('show'); setTimeout(()=>m.style.display='none',300); }

    function handleFile(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => { 
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const sel = document.getElementById('vSelect');
            const data = {
                productDetail: `${activeP.n} [${sel.options[sel.selectedIndex].text}]`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1],
                mimeType: file.type
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        document.querySelector('.theme-btn i').classList.toggle('fa-moon');
        document.querySelector('.theme-btn i').classList.toggle('fa-sun');
    }

    async function checkShip() {
        const p = prompt("เบอร์โทรที่สั่งซื้อ:"); if(!p) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const rows = (await res.text()).split('\n').slice(1).map(r => r.split(','));
            const f = rows.find(r => r[0].replace(/"/g,'') === p);
            if(f) alert(`คุณ: ${f[1]}\nสถานะ: ${f[2]}\nเลขพัสดุ: ${f[3]}`); else alert("ไม่พบข้อมูล");
        } catch(e) { alert("ล้มเหลว"); }
    }

    init();
</script>
</body>
</html>
