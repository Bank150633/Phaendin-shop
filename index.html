<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode { --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 55px; transition: 0.3s; overflow-x: hidden; }

        /* Header */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 5px 10px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; height: 50px; }
        .logo-img { height: 45px; width: auto; }
        .theme-btn { background: var(--gold-grad); border: none; width: 30px; height: 30px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Banner */
        .banner-box { padding: 8px; margin-top: 5px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; display: block; height: 180px; background: #000; position: relative; }
        .bn-img img { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; justify-content: space-between; align-items: center; }
        .bn-title { font-size: 14px; font-weight: 600; color: #fff; }

        /* Search */
        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; }
        .media-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Badges */
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 2px; z-index: 5; }
        .badge { font-size: 7px; padding: 2px 4px; border-radius: 3px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .province-badge { position: absolute; top: 4px; right: 4px; background: var(--gold-grad); color: #000; font-size: 7.5px; padding: 2px 5px; border-radius: 4px; font-weight: 700; z-index: 5; }
        .bg-red { background: var(--red-grad); }
        .bg-gold { background: var(--gold-grad); color:#000; }

        .info { padding: 4px; text-align: center; }
        .p-name { font-size: 10px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { font-size: 11px; font-weight: 700; color: #fff; }

        .btn-buy { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 6px 0; font-weight: 700; font-size: 10px; cursor: pointer; border-radius: 0 0 8px 8px; }

        /* Modal 1205.jpg Style */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; padding: 10px; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 350px; padding: 15px; max-height: 90vh; overflow-y: auto; }
        
        .multi-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(212,175,55,0.1); }
        .multi-ctrl { display: flex; align-items: center; gap: 12px; }
        .btn-qty { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
        .qty-val { font-size: 15px; font-weight: 700; color: #fff; min-width: 20px; text-align: center; }

        .summary-box { background: rgba(212,175,55,0.1); padding: 10px; border-radius: 10px; margin: 10px 0; border: 1px dashed var(--gold); }
        .sum-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
        
        .input-slim { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 8px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 12px; outline: none; }

        nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 9px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img">
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
</div>

<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="alert('กำลังพัฒนาระบบเช็คพัสดุ')"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="alert('Line: @phaendin')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:15px;">🛒 สั่งซื้อสินค้า</h3>
        
        <div id="itemOptions"></div>

        <div class="summary-box" id="priceSummary"></div>

        <form id="orderForm">
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="text-align:center; padding:10px; border-radius:10px; background:rgba(255,255,255,0.03); margin-bottom:10px;">
                <p style="font-size:11px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2 (คุณแผ่นดิน)</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:80px; margin-top:5px; border:2px solid #fff;">
            </div>
            
            <input type="file" id="fileIn" accept="image/*" style="font-size:11px; margin-bottom:10px; color:var(--gold);">
            
            <button type="submit" id="submitBtn" class="btn-buy" style="border-radius:10px; padding:12px; font-size:13px;">ยืนยันสั่งซื้อและส่งสลิป</button>
            <p onclick="closeOrderModal()" style="text-align:center; color:var(--text-dim); margin-top:12px; font-size:12px; cursor:pointer;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {};

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const bRaw = await resB.text();
            const b = bRaw.split('\n')[1]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <img src="${b[0]}">
                        <div class="bn-txt"><div class="bn-title">${b[1]}</div></div>
                    </div>`;
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const pRaw = await resP.text();
            db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error("Load error", e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map(p => {
            let disc = [p[4],p[5],p[6],p[7]].find(t => t && t.includes('%')) || '';
            return `
            <div class="card">
                <div class="media-wrap">
                    <div class="badge-container">
                        ${disc ? `<span class="badge bg-red">${disc}</span>` : ''}
                        ${p[4] && p[4]!=='-' && !p[4].includes('%') ? `<span class="badge bg-gold">${p[4]}</span>` : ''}
                    </div>
                    ${p[13] ? `<div class="province-badge">${p[13]}</div>` : ''}
                    <img src="${p[1]}">
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[3]||0).toLocaleString()}</div>
                </div>
                <button class="btn-buy" onclick="openOrderModal('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function openOrderModal(name, price, ship, optStr) {
        activeP = { name: name, ship: parseFloat(ship), items: [] };
        const box = document.getElementById('itemOptions');
        box.innerHTML = '';
        
        let options = (optStr && optStr !== '-') ? optStr.split(',') : [name + ":" + price];
        
        options.forEach((opt, idx) => {
            let parts = opt.includes(':') ? opt.split(':') : opt.split('=');
            let label = parts[0].trim();
            let pVal = parts[1] ? parseFloat(parts[1]) : parseFloat(price);
            
            activeP.items.push({ label, price: pVal, qty: idx === 0 ? 1 : 0 });

            box.innerHTML += `
                <div class="multi-row">
                    <div><div style="font-size:12px;">${label}</div><div style="color:var(--gold); font-size:11px;">฿${pVal.toLocaleString()}</div></div>
                    <div class="multi-ctrl">
                        <button class="btn-qty" onclick="changeQty(${idx}, -1)">-</button>
                        <span class="qty-val" id="q_${idx}">${activeP.items[idx].qty}</span>
                        <button class="btn-qty" onclick="changeQty(${idx}, 1)">+</button>
                    </div>
                </div>`;
        });
        
        updateSummary();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function changeQty(idx, val) {
        let n = activeP.items[idx].qty + val;
        if(n >= 0) {
            activeP.items[idx].qty = n;
            document.getElementById(`q_${idx}`).innerText = n;
            updateSummary();
        }
    }

    function updateSummary() {
        let totalQty = activeP.items.reduce((s, i) => s + i.qty, 0);
        let itemsPrice = activeP.items.reduce((s, i) => s + (i.qty * i.price), 0);
        let grandTotal = totalQty > 0 ? itemsPrice + activeP.ship : 0;
        
        activeP.grandTotal = grandTotal;
        activeP.totalQty = totalQty;

        document.getElementById('priceSummary').innerHTML = `
            <div class="sum-line"><span>ค่าสินค้า (${totalQty} ชิ้น)</span><span>฿${itemsPrice.toLocaleString()}</span></div>
            <div class="sum-line"><span>ค่าส่งด่วน (เหมา)</span><span style="color:var(--gold);">+ ฿${activeP.ship.toLocaleString()}</span></div>
            <div class="sum-line" style="border-top:1px solid #333; padding-top:5px; font-weight:700; font-size:16px;">
                <span>ยอดโอนสุทธิ</span><span style="color:var(--gold);">฿${grandTotal.toLocaleString()}</span>
            </div>
        `;
    }

    function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        if(activeP.totalQty === 0) return alert("กรุณาเลือกอย่างน้อย 1 ชิ้น");
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิปโอนเงิน");

        const btn = document.getElementById('submitBtn');
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;

        const reader = new FileReader();
        reader.onload = async () => {
            const detail = activeP.items.filter(i => i.qty > 0).map(i => `${i.label}(${i.qty})`).join(', ');
            const data = {
                productDetail: `${activeP.name} [${detail}] | ยอด: ฿${activeP.grandTotal}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    init();
</script>
</body>
</html>
