<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%); --bg: #000; --card: #121212; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 12px 0; border-bottom: 1px solid #222; }
        .logo { height: 30px; display: block; margin: 0 auto; }

        .container { padding-top: 60px; }
        
        /* --- Recommended Horizontal Scroll --- */
        .rec-container { padding: 15px 0; background: rgba(212, 175, 55, 0.05); margin-bottom: 10px; }
        .section-label { font-size: 15px; color: var(--gold); padding: 0 15px 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .rec-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px; scrollbar-width: none; }
        .rec-scroll::-webkit-scrollbar { display: none; }
        .rec-item { min-width: 160px; max-width: 160px; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; }

        /* --- Main Grid --- */
        .main-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; }
        
        /* Media & Zoom */
        .media-link { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; cursor: zoom-in; }
        .media-link img, .media-link video { width: 100%; height: 100%; object-fit: contain; }
        .zoom-icon { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 4px; border-radius: 50%; font-size: 10px; color: var(--gold); }

        .info { padding: 12px; flex-grow: 1; }
        .price { color: var(--gold); font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .title { font-size: 13px; color: #ddd; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 10px; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }

        /* --- Navigation & Search --- */
        .search-wrap { padding: 10px 15px; }
        #search { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #fff; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 5px 15px 15px; scrollbar-width: none; }
        .cat-btn { padding: 7px 18px; border-radius: 50px; background: #222; color: #888; font-size: 12px; border: none; white-space: nowrap; }
        .cat-btn.active { background: var(--gold-grad); color: #000; font-weight: bold; }

        /* --- Modals --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 20px; }
        .modal-inner { background: #111; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; position: relative; }
        .close-x { position: absolute; top: -40px; right: 0; color: #fff; font-size: 30px; cursor: pointer; }
        .lb-media { width: 100%; max-height: 75vh; object-fit: contain; }

        .footer { position: fixed; bottom: 0; width: 100%; height: 75px; background: #080808; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 4000; }
        .nav-link { color: #666; text-decoration: none; text-align: center; font-size: 10px; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

<header><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo"></header>

<div class="container">
    <div class="search-wrap"><input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()"></div>
    <div class="cat-bar" id="catBar"></div>

    <main>
        <div id="recSection" class="rec-container" style="display:none;">
            <div class="section-label"><i class="fa-solid fa-fire"></i> สินค้าแนะนำพิเศษ</div>
            <div class="rec-scroll" id="recList"></div>
        </div>

        <div class="section-label"><i class="fa-solid fa-box-open"></i> รายการสินค้า</div>
        <div class="main-grid" id="allList"></div>
    </main>
</div>

<nav class="footer">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><br>หน้าหลัก</a>
    <a href="javascript:void(0)" onclick="alert('ระบบติดตามพัสดุ')" class="nav-link"><i class="fa-solid fa-truck-fast"></i><br>พัสดุ</a>
    <a href="javascript:void(0)" onclick="window.open('https://line.me/ti/p/yourid')" class="nav-link"><i class="fa-solid fa-comments"></i><br>ติดต่อเรา</a>
</nav>

<div id="lightbox" class="modal" onclick="this.style.display='none'">
    <span class="close-x">&times;</span>
    <div id="lbContent" style="width:100%; text-align:center;"></div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-inner">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:15px;">แจ้งความประสงค์สั่งซื้อ</h3>
        <div id="orderInfo" style="background:#000; padding:12px; border-radius:10px; margin-bottom:15px; font-size:13px; border:1px solid #333;"></div>
        <input type="text" id="cName" style="width:100%; padding:12px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:10px;" placeholder="ชื่อ-นามสกุล">
        <input type="tel" id="cPhone" style="width:100%; padding:12px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; margin-bottom:10px;" placeholder="เบอร์โทรศัพท์">
        <button onclick="confirmOrder()" class="buy-btn" style="height:50px; font-size:16px;">ยืนยันการสั่งซื้อ</button>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="text-align:center; color:#555; font-size:12px; margin-top:15px;">ปิดหน้าต่าง</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    let db = [], recs = [], curCat = 'all';

    function getMedia(url, isZoom) {
        if (!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        if (isVid) {
            return `<video src="${url}" ${isZoom ? 'controls autoplay' : 'autoplay loop muted playsinline'} style="width:100%; height:100%; object-fit:contain;"></video>`;
        }
        return `<img src="${url}" style="width:100%; height:100%; object-fit:contain;" loading="lazy">`;
    }

    async function init() {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`);
        const text = await res.text();
        const rows = text.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
        
        db = rows.filter(r => r[0] && r[1]).sort(() => Math.random() - 0.5);
        recs = db.filter(r => r[5] && r[5].includes("แนะนำ"));
        
        if (recs.length > 0) document.getElementById('recSection').style.display = 'block';
        render();
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        
        // Render Categories
        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('catBar').innerHTML = cats.map(c => `<button class="cat-btn ${curCat===c[0]?'active':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join('');

        // Render Recommended (เลื่อนซ้ายขวา)
        document.getElementById('recList').innerHTML = recs.map(p => `
            <div class="rec-item">
                <div class="media-link" onclick="zoom('${p[1]}')">${getMedia(p[1], false)}<i class="fa-solid fa-magnifying-glass zoom-icon"></i></div>
                <div style="padding:10px;">
                    <div style="color:var(--gold); font-weight:bold;">฿${p[3]}</div>
                    <div class="title" style="font-size:11px; height:32px;">${p[0]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}')">สั่งซื้อ</button>
                </div>
            </div>
        `).join('');

        // Render All Grid
        document.getElementById('allList').innerHTML = db
            .filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat))
            .map(p => `
                <div class="card">
                    <div class="media-link" onclick="zoom('${p[1]}')">${getMedia(p[1], false)}<i class="fa-solid fa-magnifying-glass zoom-icon"></i></div>
                    <div class="info">
                        <div class="price">฿${p[3]}</div>
                        <div class="title">${p[0]}</div>
                        <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}')">สั่งซื้อ</button>
                    </div>
                </div>
            `).join('');
    }

    function setCat(c) { curCat = c; render(); }
    function zoom(url) {
        document.getElementById('lbContent').innerHTML = getMedia(url, true);
        document.getElementById('lightbox').style.display = 'flex';
    }
    function openOrder(name, price) {
        document.getElementById('orderInfo').innerHTML = `<b>สินค้า:</b> ${name}<br><b>ราคา:</b> <span style="color:var(--gold)">฿${price}</span>`;
        document.getElementById('orderModal').style.display = 'flex';
    }
    function confirmOrder() {
        alert("ขอบคุณสำหรับคำสั่งซื้อ! เจ้าหน้าที่จะติดต่อกลับโดยเร็วที่สุด");
        location.reload();
    }

    init();
</script>
</body>
</html>
