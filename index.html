<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaendin Rent | แพลตฟอร์มเช่าของออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                <h1 class="text-xl font-bold tracking-tight">Phaendin Rent</h1>
            </div>
            <button onclick="toggleModal(true)" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 px-5 py-2 rounded-full font-bold transition-all transform active:scale-95 shadow-md flex items-center gap-2">
                <svg xmlns="http://filterByCategorysvg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                ลงของเช่า
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Search and Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="ค้นหาสินค้า เช่น กล้อง, เต็นท์..." class="w-full pl-10 pr-4 py-3 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterByCategory('ทั้งหมด')" class="category-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm">ทั้งหมด</button>
                <button onclick="filterByCategory('อุปกรณ์ไอที')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm hover:bg-slate-100">อุปกรณ์ไอที</button>
                <button onclick="filterByCategofilterByCategoryfilterByCategoryry('แคมป์ปิ้ง')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm hover:bg-slate-100">แคมป์ปิ้ง</button>
                <button onclick="filterByCategory('เครื่องมือช่าง')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm hover:bg-slate-100">เครื่องมือช่าง</button>
                <button onclick="filterByCategory('อื่นๆ')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm hover:bg-slate-100">อื่นๆ</button>
            </div>
        </div>

        <!-- Items Grid -->
        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Items will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="bg-slate-200 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-500">ไม่พบรายการเช่า</h3>
            <p class="text-slate-400">ลองค้นหาใหม่หรือเป็นคนแรกที่ลงประกาศสินค้า!</p>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-modal">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
                <h2 class="text-xl font-bold">ลงข้อมูลของให้เช่า</h2>
                <button onclick="toggleModal(false)" class="text-white hover:rotate-90 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l18 18" />
                    </svg>
                </button>
            </div>
            <form id="rentForm" onsubmit="handleForm(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">ชื่อสินค้า *</label>
                    <input type="text" id="itemName" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">ราคา (บาท/วัน) *</label>
                        <input type="number" id="itemPrice" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">หมวดหมู่</label>
                        <select id="itemCategory" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="ทั่วไป">ทั่วไป</option>
                            <option value="อุปกรณ์ไอที">อุปกรณ์ไอที</option>
                            <option value="แคมป์ปิ้ง">แคมป์ปิ้ง</option>
                            <option value="เครื่องมือช่าง">เครื่องมือช่าง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1 text-blue-600">ลิงก์รูปภาพ (แนะนำ: https://images.unsplash.com/...)</label>
                    <input type="url" id="itemImage" placeholder="https://..." class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">รายละเอียด</label>
                    <textarea id="itemDesc" rows="2" class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">ชื่อคุณ *</label>
                        <input type="text" id="itemOwner" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">LINE ID / เบอร์ *</label>
                        <input type="text" id="itemContact" required class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg active:scale-95">โพสต์ลงประกาศ</button>
            </form>
        </div>
    </div>

    <script>
        // State
        let items = JSON.parse(localStorage.getItem('phaendin_rent_items')) || [];
        let currentCategory = 'ทั้งหมด';

        // Initialize
        window.onload = () => {
            renderItems();
        };

        // Functions
        function toggleModal(show) {
            const modal = document.getElementById('modal');
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('rentForm').reset();
            }
        }

        function handleForm(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('itemName').value,
                price: document.getElementById('itemPrice').value,
                category: document.getElementById('itemCategory').value,
                image: document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1581244276891-6bc6127498f1?auto=format&fit=crop&q=80&w=500',
                desc: document.getElementById('itemDesc').value,
                owner: document.getElementById('itemOwner').value,
                contact: document.getElementById('itemContact').value,
                date: new Date().toLocaleDateString('th-TH')
            };

            items.unshift(newItem);
            localStorage.setItem('phaendin_rent_items', JSON.stringify(items));
            
            toggleModal(false);
            renderItems();
        }

        function deleteItem(id) {
            if (confirm('ยืนยันที่จะลบประกาศนี้ใช่ไหม?')) {
                items = items.filter(item => item.id !== id);
                localStorage.setItem('phaendin_rent_items', JSON.stringify(items));
                renderItems();
            }
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.textContent === cat) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-white', 'text-slate-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('bg-white', 'text-slate-600');
                }
            });
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const emptyState = document.getElementById('emptyState');
            
            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search);
                const matchesCategory = currentCategory === 'ทั้งหมด' || item.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                    <div class="h-48 bg-slate-200 relative overflow-hidden">
                        <img src="${item.image}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.src='https://via.placeholder.com/500x350?text=No+Image'">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold text-blue-600 shadow-sm uppercase">
                            ${item.category}
                        </div>
                        <button onclick="deleteItem(${item.id})" class="absolute top-3 right-3 p-2 bg-red-500/80 text-white rounded-full opacity-0 group-hover:opacity-100 transition-all hover:bg-red-600 shadow-md">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-slate-800 text-lg leading-tight">${item.name}</h3>
                            <div class="text-blue-600 font-bold text-right">
                                <span class="text-xl">฿${item.price}</span><br>
                                <span class="text-[10px] text-slate-400 font-normal">/วัน</span>
                            </div>
                        </div>
                        <p class="text-slate-500 text-sm mb-4 line-clamp-2 h-10 italic">${item.desc || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                        <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">ลงโดย</span>
                                <span class="text-xs font-semibold text-slate-700">${item.owner}</span>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="window.location.href='tel:${item.contact}'" class="p-2 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-600 hover:text-white transition-all">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                    </svg>
                                </button>
                                <button onclick="alert('ติดต่อผ่าน: ${item.contact}')" class="px-3 py-1 bg-green-50 text-green-600 rounded-full text-[10px] font-bold hover:bg-green-600 hover:text-white transition-all uppercase">
                                    ติดต่อ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>

    <style>
        @keyframes modalAnim {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-modal { animation: modalAnim 0.3s ease-out forwards; }
    </style>
</body>
</html>
