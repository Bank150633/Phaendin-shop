<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaendin Rent | แพลตฟอร์มเช่าของออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .item-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .item-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1.5 rounded-lg shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Phaendin Rent</h1>
            </div>
            <button onclick="openAddModal()" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 px-5 py-2 rounded-full font-bold transition-all transform active:scale-95 shadow-md flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                ลงของเช่า
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Search and Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="ค้นหาสินค้า หรือสถานที่..." class="w-full pl-10 pr-4 py-3 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="filterByCategory('ทั้งหมด')" class="category-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-transparent">ทั้งหมด</button>
                <button onclick="filterByCategory('อุปกรณ์ไอที')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">อุปกรณ์ไอที</button>
                <button onclick="filterByCategory('แคมป์ปิ้ง')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">แคมป์ปิ้ง</button>
                <button onclick="filterByCategory('เครื่องมือช่าง')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">เครื่องมือช่าง</button>
                <button onclick="filterByCategory('อื่นๆ')" class="category-btn bg-white text-slate-600 px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-slate-100 hover:bg-slate-50">อื่นๆ</button>
            </div>
        </div>

        <!-- Items Grid -->
        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
            <div class="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-slate-500">ไม่พบรายการเช่า</h3>
            <p class="text-slate-400 mt-2">ลองค้นหาใหม่หรือเป็นคนแรกที่ลงประกาศสินค้า!</p>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-modal">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
                <div class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                    </svg>
                    <h2 id="modalTitle" class="text-xl font-bold">ลงข้อมูลของให้เช่า</h2>
                </div>
                <button onclick="toggleModal(false)" class="text-white hover:rotate-90 transition-all p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l18 18" />
                    </svg>
                </button>
            </div>
            <form id="rentForm" onsubmit="handleForm(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto no-scrollbar">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ชื่อสินค้าที่ต้องการให้เช่า *</label>
                    <input type="text" id="itemName" required placeholder="เช่น สว่านไฟฟ้า, เต็นท์ 4 คน" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ราคา (บาท/วัน) *</label>
                        <input type="number" id="itemPrice" required placeholder="0" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">หมวดหมู่</label>
                        <select id="itemCategory" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="ทั่วไป">ทั่วไป</option>
                            <option value="อุปกรณ์ไอที">อุปกรณ์ไอที</option>
                            <option value="แคมป์ปิ้ง">แคมป์ปิ้ง</option>
                            <option value="เครื่องมือช่าง">เครื่องมือช่าง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">สถานที่ (จังหวัด/เขต) *</label>
                    <input type="text" id="itemLoc" required placeholder="เช่น ลาดพร้าว กทม." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">ลิงก์รูปภาพสินค้า (URL)</label>
                    <input type="url" id="itemImage" placeholder="https://images.unsplash.com/..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">รายละเอียดเพิ่มเติม</label>
                    <textarea id="itemDesc" rows="2" placeholder="ระบุสภาพของ หรือเงื่อนไขการเช่า..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">ชื่อผู้ให้เช่า *</label>
                        <input type="text" id="itemOwner" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">เบอร์ติดต่อ/LINE *</label>
                        <input type="text" id="itemContact" required placeholder="08x-xxxxxxx" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 transition-all shadow-xl active:scale-95 mt-2 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    ลงประกาศทันที
                </button>
            </form>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('phaendin_rent_items')) || [];
        let currentCategory = 'ทั้งหมด';
        let isEditing = false;

        window.onload = renderItems;

        function toggleModal(show) {
            const modal = document.getElementById('modal');
            modal.classList.toggle('hidden', !show);
            if (show) modal.classList.add('flex');
            else {
                modal.classList.remove('flex');
                document.getElementById('rentForm').reset();
                document.getElementById('editItemId').value = '';
                isEditing = false;
            }
        }

        function openAddModal() {
            isEditing = false;
            document.getElementById('modalTitle').innerText = 'ลงข้อมูลของให้เช่า';
            document.getElementById('submitBtn').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg> ลงประกาศทันที`;
            toggleModal(true);
        }

        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            isEditing = true;
            document.getElementById('modalTitle').innerText = 'แก้ไขข้อมูลสินค้า';
            document.getElementById('submitBtn').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg> บันทึกการแก้ไข`;
            
            document.getElementById('editItemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('itemLoc').value = item.loc;
            document.getElementById('itemImage').value = item.image;
            document.getElementById('itemDesc').value = item.desc;
            document.getElementById('itemOwner').value = item.owner;
            document.getElementById('itemContact').value = item.contact;

            toggleModal(true);
        }

        function handleForm(e) {
            e.preventDefault();
            const id = document.getElementById('editItemId').value;
            
            const itemData = {
                name: document.getElementById('itemName').value,
                price: document.getElementById('itemPrice').value,
                category: document.getElementById('itemCategory').value,
                loc: document.getElementById('itemLoc').value,
                image: document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1581244276891-6bc6127498f1?auto=format&fit=crop&q=80&w=500',
                desc: document.getElementById('itemDesc').value,
                owner: document.getElementById('itemOwner').value,
                contact: document.getElementById('itemContact').value
            };

            if (isEditing) {
                const index = items.findIndex(i => i.id == id);
                if (index !== -1) {
                    items[index] = { ...items[index], ...itemData };
                }
            } else {
                const newItem = {
                    id: Date.now(),
                    ...itemData,
                    date: new Date().toLocaleDateString('th-TH')
                };
                items.unshift(newItem);
            }

            localStorage.setItem('phaendin_rent_items', JSON.stringify(items));
            toggleModal(false);
            renderItems();
        }

        function deleteItem(id) {
            if (confirm('คุณต้องการลบประกาศนี้ใช่หรือไม่?')) {
                items = items.filter(i => i.id !== id);
                localStorage.setItem('phaendin_rent_items', JSON.stringify(items));
                renderItems();
            }
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                const isActive = btn.textContent === cat;
                btn.className = `category-btn px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border transition-all ${isActive ? 'bg-blue-600 text-white border-transparent' : 'bg-white text-slate-600 border-slate-100 hover:bg-slate-50'}`;
            });
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const emptyState = document.getElementById('emptyState');
            
            const filtered = items.filter(item => {
                const text = (item.name + item.desc + item.loc).toLowerCase();
                const matchesSearch = text.includes(search);
                const matchesCategory = currentCategory === 'ทั้งหมด' || item.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => `
                <div class="item-card bg-white rounded-[2.5rem] overflow-hidden shadow-sm hover:shadow-2xl border border-slate-100 flex flex-col group relative">
                    <!-- Action Buttons Overlay -->
                    <div class="absolute top-4 right-4 z-10 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                         <button onclick="openEditModal(${item.id})" class="p-2 bg-white/90 text-blue-600 rounded-full hover:bg-blue-600 hover:text-white shadow-lg backdrop-blur transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                        </button>
                        <button onclick="deleteItem(${item.id})" class="p-2 bg-white/90 text-red-500 rounded-full hover:bg-red-500 hover:text-white shadow-lg backdrop-blur transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>

                    <div class="h-56 bg-slate-100 relative overflow-hidden">
                        <img src="${item.image}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://via.placeholder.com/500x350?text=No+Image'">
                        <div class="absolute top-4 left-4 flex gap-2">
                            <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest shadow-lg">${item.category}</span>
                            <span class="bg-white/90 backdrop-blur text-slate-700 px-3 py-1 rounded-full text-[10px] font-bold shadow-sm flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" /></svg>
                                ${item.loc}
                            </span>
                        </div>
                    </div>
                    <div class="p-6 flex-grow flex flex-col">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-slate-800 text-xl leading-tight line-clamp-1">${item.name}</h3>
                            <div class="flex flex-col items-end">
                                <span class="text-blue-600 font-black text-2xl">฿${Number(item.price).toLocaleString()}</span>
                                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter -mt-1">/ วัน</span>
                            </div>
                        </div>
                        <p class="text-slate-500 text-sm mb-6 line-clamp-2 h-10 italic leading-relaxed">${item.desc || 'ผู้ให้เช่าไม่ได้ระบุรายละเอียดเพิ่มเติม'}</p>
                        
                        <div class="mt-auto pt-4 border-t border-slate-50 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs">
                                    ${item.owner.charAt(0)}
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-slate-400 uppercase font-black">ลงประกาศโดย</span>
                                    <span class="text-xs font-bold text-slate-700">${item.owner}</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.location.href='tel:${item.contact}'" class="p-2.5 bg-slate-100 text-slate-600 rounded-xl hover:bg-blue-600 hover:text-white transition-all shadow-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                                </button>
                                <button onclick="window.open('https://line.me/ti/p/~${item.contact}', '_blank')" class="bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-green-600 transition-all shadow-md active:scale-95">
                                    ติดต่อเช่า
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>

    <style>
        @keyframes modalAnim {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-modal { animation: modalAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</body>
</html>
