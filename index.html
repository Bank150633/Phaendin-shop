<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PHAENDIN FOOD AI | มีอะไรในตู้เย็น?</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#d71920,#123c8c);
  color:white;
  padding:22px 16px;
  text-align:center;
}

.logo{
  font-size:25px;
  font-weight:800;
}

header p{
  margin:7px 0 0;
  opacity:.95;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.box{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

.sub{
  color:#667085;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:2px solid #e5e7eb;
  border-radius:16px;
  padding:15px;
  font-size:17px;
  outline:none;
}

textarea:focus{
  border-color:#123c8c;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:12px;
  background:#d71920;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.examples{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.examples button{
  width:auto;
  margin:0;
  padding:9px 13px;
  background:#eef2ff;
  color:#123c8c;
  font-size:14px;
}

#loading{
  display:none;
  text-align:center;
  padding:25px;
  font-weight:bold;
}

#error{
  display:none;
  margin-top:15px;
  background:#fff0f0;
  color:#b42318;
  padding:15px;
  border-radius:12px;
}

#result{
  margin-top:20px;
}

.recipe{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  border:1px solid #e8eaf0;
}

.recipe h2{
  color:#d71920;
  margin-top:0;
  font-size:21px;
}

.recipe h3{
  margin-bottom:5px;
  color:#123c8c;
  font-size:16px;
}

.recipe p{
  line-height:1.7;
  white-space:pre-wrap;
}

.ad{
  margin-top:25px;
  min-height:100px;
  border:2px dashed #d0d5dd;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#98a2b3;
  background:white;
}

footer{
  text-align:center;
  color:#667085;
  padding:30px 15px;
  font-size:13px;
}

@media(max-width:600px){
  h1{
    font-size:22px;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🍳 PHAENDIN FOOD AI</div>
  <p>มีอะไรในตู้เย็น? ให้ AI ช่วยคิดเมนูให้</p>
</header>

<div class="container">

  <div class="box">

    <h1>🥕 วันนี้มีอะไรเหลือบ้าง?</h1>

    <div class="sub">
      พิมพ์วัตถุดิบที่มีอยู่ แล้วให้ AI ช่วยคิดเมนู
    </div>

    <textarea
      id="ingredients"
      placeholder="เช่น ไข่ไก่ 2 ฟอง หมูสับ มะเขือเทศ น้ำปลา"></textarea>

    <div class="examples">
      <button onclick="example('ไข่ไก่ หมูสับ น้ำปลา')">
        🍳 ไข่ + หมู
      </button>

      <button onclick="example('ไก่ กระเทียม พริก น้ำปลา')">
        🍗 ไก่
      </button>

      <button onclick="example('ไข่ เต้าหู้ หมูสับ')">
        🥚 เต้าหู้
      </button>
    </div>

    <button id="askBtn" onclick="askAI()">
      🤖 ให้ AI คิดเมนู
    </button>

    <div id="loading">
      🤖 AI กำลังคิดเมนูให้คุณ...
    </div>

    <div id="error"></div>

  </div>

  <div id="result"></div>

  <!-- พื้นที่โฆษณา -->
  <div class="ad">
    พื้นที่โฆษณา / ร้านค้าที่ต้องการโปรโมต
  </div>

</div>

<footer>
  PHAENDIN FOOD AI<br>
  ของอร่อยจากทั่วไทย • ไอเดียทำอาหารจากวัตถุดิบที่มี
</footer>


<script>

/* =====================================================
   ใส่ URL Apps Script ของคุณตรงนี้
===================================================== */

const API_URL =
"https://script.google.com/macros/s/ใส่_URL_ของคุณตรงนี้/exec";


function example(text){
  document.getElementById("ingredients").value = text;
}


async function askAI(){

  const ingredients =
    document.getElementById("ingredients").value.trim();

  const btn =
    document.getElementById("askBtn");

  const loading =
    document.getElementById("loading");

  const error =
    document.getElementById("error");

  const result =
    document.getElementById("result");


  error.style.display = "none";
  result.innerHTML = "";


  if(!ingredients){

    error.textContent =
      "กรุณาพิมพ์วัตถุดิบก่อนครับ";

    error.style.display = "block";

    return;
  }


  btn.disabled = true;
  loading.style.display = "block";


  try{

    const response = await fetch(API_URL, {

      method:"POST",

      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },

      body:JSON.stringify({
        ingredients:ingredients
      })

    });


    const data = await response.json();


    if(!data.success){
      throw new Error(
        data.error || "AI ไม่สามารถตอบได้"
      );
    }


    showResult(data.result);


  }catch(err){

    error.textContent =
      "เกิดข้อผิดพลาด: " + err.message;

    error.style.display = "block";

  }finally{

    btn.disabled = false;
    loading.style.display = "none";

  }

}


function showResult(text){

  const result =
    document.getElementById("result");

  /*
    แปลงคำตอบ AI ให้ดูง่าย
  */

  const sections =
    text.split(/\n(?=\d+[\.\)]|\*\*?\d+)/);

  let html = "";

  sections.forEach((section,index)=>{

    if(!section.trim()) return;

    let clean =
      section
      .replace(/\*\*/g,"")
      .trim();

    html += `
      <div class="recipe">

        <h2>
          🍽️ ${index + 1}. เมนูแนะนำ
        </h2>

        <p>${escapeHTML(clean)}</p>

      </div>
    `;

  });


  result.innerHTML =
    html || `
      <div class="recipe">
        <p>${escapeHTML(text)}</p>
      </div>
    `;
}


function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
