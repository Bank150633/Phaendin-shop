<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS เดิมของคุณทั้งหมด */
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; }
        @keyframes blink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        .badge-blink { animation: blink 1s infinite; box-shadow: 0 0 10px rgba(40, 167, 69, 0.4); }
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { height: 165px; display: flex; background: linear-gradient(135deg, #000 0%, #151515 100%); border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); cursor: pointer; }
        .banner-left { width: 45%; position: relative; overflow: hidden; background: #000; }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .flash-tag { position: absolute; top: 0; left: 0; background: var(--red); color: #fff; padding: 2px 10px; font-size: 10px; font-weight: bold; z-index: 5; border-bottom-right-radius: 10px; }
        .banner-right { width: 55%; padding: 12px; display: flex; flex-direction: column; justify-content: center; background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); }
        .banner-title { color: var(--gold); font-size: 18px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; text-transform: uppercase; }
        .banner-sub { font-size: 11px; color: #aaa; margin-bottom: 8px; }
        .banner-timer { display: flex; gap: 4px; margin-bottom: 12px; align-items: center; }
        .time-box { background: var(--gold); color: #000; padding: 4px 6px; border-radius: 4px; font-weight: 800; font-size: 13px; min-width: 28px; text-align: center; }
        .shop-now-btn { background: #fff; color: #000; padding: 6px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; align-self: flex-start; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }
        main { margin-top: 340px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
        .rec-card { min-width: 145px; border-radius: 12px; overflow: hidden; border: 1px solid #333; background: #111; position: relative; transition: 0.2s; display: flex; flex-direction: column; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; cursor: pointer; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price-tag { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); color: var(--gold); font-size: 13px; font-weight: 800; padding: 5px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; height: 20px; overflow: hidden; margin-bottom: 4px; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
        .description { font-size: 10px; color: #777; height: auto; min-height: 32px; margin-bottom: 10px; line-height: 1.4; display: block; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .float-pay-btn { position: fixed; bottom: 85px; right: 15px; background: var(--green); color: #fff; padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 2000; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
        .nav-link { color: #777; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; }
        .nav-link.active { color: var(--gold); }
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 10px; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 380px; padding: 20px; text-align: center; max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .summary-box { background: #000; padding: 12px; border-radius: 10px; margin: 10px 0; text-align: left; font-size: 14px; }
        .form-input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; margin-top: 5px; margin-bottom: 12px; font-family: 'Kanit'; font-size: 14px; }
        .confirm-btn { width: 100%; background: var(--green); color: #fff; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; margin-top: 10px; }
        .modal-body img, .modal-body video { max-width: 90%; max-height: 80vh; border-radius: 10px; }
        .opt-select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; background: #000; color: #fff; border: 1px solid #444; font-family: 'Kanit'; font-size: 13px; }
        .qty-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #1a1a1a; padding: 8px 12px; border-radius: 8px; }
        .qty-btn { width: 35px; height: 35px; background: var(--pill); color: var(--gold); border: 1px solid #444; border-radius: 5px; font-weight: bold; }
        /* สไตล์ใหม่สำหรับช่องอัปโหลด */
        .slip-upload-area { border: 1px dashed var(--gold); padding: 15px; border-radius: 10px; margin-top: 10px; cursor: pointer; background: #000; }
        #slipPreview { width: 100%; margin-top: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดข้อมูล...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<a href="javascript:void(0)" onclick="openOrder('ชำระเงิน/แจ้งโอนทั่วไป', 0, 0, '', 99)" class="float-pay-btn">
    <i class="fa-solid fa-receipt"></i> แจ้งโอนเงิน
</a>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck"></i><span>เช็คพัสดุ</span></a>
    <a href="https://m.me/PhaendinStore" target="_blank" class="nav-link"><i class="fa-solid fa-headset"></i><span>ติดต่อเรา</span></a>
</nav>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody" class="modal-body"></div></div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:10px;">ยืนยันการสั่งซื้อ</h3>
        
        <form id="orderForm">
            <div id="orderSummary" class="summary-box"></div>
            
            <div style="text-align:left; padding: 0 5px;">
                <label style="font-size:12px; color:var(--gold);">ชื่อ-นามสกุล ผู้รับ *</label>
                <input type="text" id="custName" class="form-input" placeholder="ระบุชื่อเพื่อจัดส่ง" required>
                
                <label style="font-size:12px; color:var(--gold);">เบอร์โทรศัพท์ *</label>
                <input type="tel" id="custPhone" class="form-input" placeholder="ระบุเบอร์โทรที่ติดต่อได้" required>
                
                <label style="font-size:12px; color:var(--gold);">ที่อยู่จัดส่ง *</label>
                <textarea id="custAddress" class="form-input" rows="3" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล..." required></textarea>

                <label style="font-size:12px; color:var(--gold);">รูปสลิปการโอนเงิน *</label>
                <div class="slip-upload-area" onclick="document.getElementById('slipFile').click()">
                    <span id="uploadText" style="font-size:12px; color:#777;">📸 คลิกเพื่อแนบรูปสลิป</span>
                    <img id="slipPreview" src="">
                </div>
                <input type="file" id="slipFile" accept="image/*" style="display:none;" onchange="previewSlip(this)">
            </div>

            <button type="submit" id="btnSubmit" class="confirm-btn">💰 ยืนยันแจ้งโอนเงิน</button>
        </form>
        
        <span class="cancel-link" onclick="document.getElementById('orderModal').style.display='none'">กลับไปหน้าเลือกสินค้า</span>
    </div>
</div>

<script>
    // --- ตั้งค่า URL ของ Apps Script ของคุณที่นี่ ---
    const APPS_URL = "ใส่_WEB_APP_URL_ของคุณที่นี่"; 
    
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], curCat = 'all';
    let currentData = { name: '', basePrice: 0, ship: 0, qty: 1, options: '', maxLimit: 99 };
    let bannerEndTime = null;

    // ฟังก์ชันเดิมของคุณทั้งหมด
    async function checkTracking() {
        const phone = prompt("กรุณากรอกเบอร์โทรศัพท์ที่ใช้สั่งซื้อ:");
        if (!phone) return;
        const TRACK_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`;
        try {
            const res = await fetch(TRACK_URL);
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
            const found = rows.find(r => r[0] === phone);
            if (found) alert(`📦 ข้อมูลพัสดุของคุณ\nคุณ: ${found[1]}\nขนส่ง: ${found[2]}\nเลขพัสดุ: ${found[3]}`);
            else alert("❌ ไม่พบข้อมูลพัสดุจากเบอร์โทรนี้");
        } catch (e) { alert("เชื่อมต่อข้อมูลล้มเหลว"); }
    }

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }
    function getMedia(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().trim().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }
    function openMedia(url) { document.getElementById('modalBody').innerHTML = getMedia(url); document.getElementById('mediaModal').style.display = 'flex'; }

    function openOrder(name, price, ship, options, limit) {
        currentData = { name, basePrice: parseFloat(price)||0, ship: parseFloat(ship)||0, qty: 1, options, maxLimit: parseInt(limit) || 99 };
        updateOrderUI();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function updateOrderUI() {
        let optHTML = "";
        if(currentData.options && currentData.options !== "-") {
            const optArray = currentData.options.split(",");
            optHTML = `<div style="margin-bottom: 12px;"><label style="font-size: 11px; color: var(--gold);">เลือกตัวเลือก:</label>
                <select class="opt-select" id="selectedOpt" onchange="calculateTotal()">
                ${optArray.map(o => { const [n,p] = o.split(":"); const pr = p ? p.trim() : currentData.basePrice; return `<option value="${pr}" data-name="${n.trim()}">${n.trim()} (฿${pr})</option>`; }).join('')}
                </select></div>`;
        }
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align: center; margin-bottom: 15px;">
                <b style="color: var(--gold); font-size: 15px;">ธนาคารกสิกรไทย</b><br>
                <b style="font-size: 18px; letter-spacing: 1px;">035-8-56762-2</b><br>
                <p style="font-size: 12px;">ชื่อบัญชี: นาย วัชระ ชันสิน</p>
                <img src="https://i.ibb.co/fVLb9p6B/004999092296200-20260224-144608.jpg" style="width: 120px; border-radius: 8px; border: 2px solid #fff; margin: 10px auto; display: block;">
            </div>
            ${optHTML}
            <div class="qty-row"><span>จำนวน:</span><div><button type="button" class="qty-btn" onclick="changeQty(-1)">-</button><span id="displayQty" style="margin: 0 15px; font-weight: bold;">1</span><button type="button" class="qty-btn" onclick="changeQty(1)">+</button></div></div>
            <div id="totalBox" style="background: #1a1a1a; padding: 10px; border-radius: 8px; border-left: 4px solid var(--gold); font-size: 13px;"></div>`;
        calculateTotal();
    }

    function changeQty(n) { 
        currentData.qty = Math.max(1, Math.min(currentData.maxLimit, currentData.qty + n)); 
        document.getElementById('displayQty').innerText = currentData.qty; 
        calculateTotal(); 
    }

    function calculateTotal() {
        const optEl = document.getElementById('selectedOpt');
        const pUnit = optEl ? parseFloat(optEl.value) : currentData.basePrice;
        const totalP = pUnit * currentData.qty;
        const finalT = totalP + currentData.ship;
        document.getElementById('totalBox').innerHTML = `
            <div style="display: flex; justify-content: space-between;"><span>ยอดสินค้า:</span> <span>฿${totalP.toLocaleString()}</span></div>
            <div style="display: flex; justify-content: space-between;"><span>ค่าส่ง:</span> <span>${currentData.ship === 0 ? 'ส่งฟรี' : '฿'+currentData.ship}</span></div>
            <div style="display: flex; justify-content: space-between; margin-top: 5px; font-weight: bold; color: var(--gold); font-size: 16px;"><span>รวมทั้งสิ้น:</span> <span>฿${finalT.toLocaleString()}</span></div>`;
    }

    // --- ฟังก์ชันเสริมสำหรับระบบใหม่ ---
    function previewSlip(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('slipPreview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // ฟังก์ชันส่งข้อมูลเข้า Apps Script
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileInput = document.getElementById('slipFile');
        if(!fileInput.files[0]) return alert("กรุณาแนบสลิปก่อนยืนยันครับ");

        btn.innerText = "กำลังส่งข้อมูล...";
        btn.disabled = true;

        // ดึงรายละเอียดออเดอร์
        const optEl = document.getElementById('selectedOpt');
        const oName = optEl ? optEl.options[optEl.selectedIndex].getAttribute('data-name') : '';
        const detail = `${currentData.name} ${oName} (${currentData.qty} ชิ้น)`;

        // แปลงรูปเป็น Base64
        const reader = new FileReader();
        reader.onload = async function() {
            const base64 = reader.result.split(',')[1];
            const payload = {
                productDetail: detail,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: base64,
                mimeType: fileInput.files[0].type
            };

            try {
                await fetch(APPS_URL, {
                    method: 'POST',
                    body: new URLSearchParams(payload)
                });
                alert("แจ้งโอนสำเร็จ! ข้อมูลถูกบันทึกแล้ว ระบบกำลังพาไป Messenger");
                window.location.href = "https://m.me/PhaendinStore";
            } catch(err) {
                alert("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่");
                btn.disabled = false;
                btn.innerText = "💰 ยืนยันแจ้งโอนเงิน";
            }
        };
        reader.readAsDataURL(fileInput.files[0]);
    };

    function bannerGoToProduct(productName) {
        if(!productName) return;
        const p = [...dbRec, ...dbAll].find(item => item[0].trim().toLowerCase() === productName.trim().toLowerCase());
        if (p) {
            const now = new Date().getTime(), time = p[7] ? new Date(p[7]).getTime() : 0, expired = time > 0 && time < now;
            openOrder(p[0], (expired && p[4]) ? p[4] : p[3], parseFloat(p[8])||0, p[9]||"", p[10]||99);
        }
    }

    async function init() {
        try {
            const resP = await fetch(PROD_URL), textP = await resP.text();
            // กรองไม่ให้ออเดอร์มาโผล่หน้าเว็บ
            let raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
            const shuffled = shuffle([...raw]);
            dbRec = shuffled.filter(p => p[5] && p[5].includes("แนะนำ")).slice(0, 8);
            dbAll = shuffled.filter(p => !dbRec.some(r => r[0] === p[0]));

            const resB = await fetch(BANN_URL), textB = await resB.text();
            const linesB = textB.split(/\r?\n/).slice(1).filter(l => l.trim() !== "");
            if(linesB.length > 0) {
                const b = linesB[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide" onclick="bannerGoToProduct('${b[3]||''}')">
                        <div class="banner-left">${getMedia(b[0])}<div class="flash-tag">FLASH SALE</div></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]||'ดีลพิเศษ'}</div>
                            <div class="banner-sub">โปรโมชั่นหมดเวลาใน:</div>
                            <div class="banner-timer"><div class="time-box" id="bh">00</div>: <div class="time-box" id="bm">00</div>: <div class="time-box" id="bs">00</div></div>
                            <div class="shop-now-btn">ช้อปเลย <i class="fa-solid fa-chevron-right"></i></div>
                        </div>
                    </div>`;
                setInterval(updateBannerTimer, 1000);
            }
            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { document.getElementById('status').innerText = "โหลดข้อมูลล้มเหลว"; }
    }

    function updateBannerTimer() {
        if (!bannerEndTime) return;
        const diff = bannerEndTime - new Date().getTime();
        if (diff > 0) {
            document.getElementById('bh').innerText = Math.floor(diff/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();
        const itemHTML = (p, isRec = false) => {
            const time = p[7] ? new Date(p[7]).getTime() : 0, expired = time > 0 && time < now;
            const price = (expired && p[4]) ? p[4] : p[3], ship = parseFloat(p[8])||0;
            let badge = p[5].includes("1แถม1") ? `<div class="badge-blink" style="position:absolute;top:6px;right:6px;background:#ffea00;color:#000;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:bold;z-index:10;border:1px solid #000;">1 แถม 1</div>` : "";
            if (ship === 0) badge += `<div class="badge-blink" style="position:absolute;top:${badge? '32px':'6px'};right:6px;background:#28a745;color:#fff;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:bold;z-index:10;">ส่งฟรี</div>`;
            if(isRec) return `<div class="rec-card"><div class="rec-media" onclick="openMedia('${p[1]}')">${badge}${getMedia(p[1])}<div class="rec-price-tag">฿${price}</div></div><div class="rec-btn-area"><button class="buy-btn" style="padding:7px;font-size:11px;" onclick="openOrder('${p[0]}','${price}','${ship}','${p[9]}','${p[10]}')"><i class="fa-solid fa-cart-shopping"></i> สั่งซื้อ</button></div></div>`;
            return `<div class="card"><div class="media" onclick="openMedia('${p[1]}')">${time > now ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}${badge}${getMedia(p[1])}</div><div class="info"><div class="title">${p[0]}</div><div class="description">${p[2]||''}</div><div class="price">฿${price}</div><button class="buy-btn" onclick="openOrder('${p[0]}','${price}','${ship}','${p[9]}','${p[10]}')"><i class="fa-solid fa-cart-shopping"></i> สั่งซื้อ</button></div></div>`;
        };
        if(dbRec.length > 0 && q === "") { 
            document.getElementById('rec-area').style.display = 'block'; 
            document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join(''); 
        } else { document.getElementById('rec-area').style.display = 'none'; }
        document.getElementById('main-list').innerHTML = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat)).map(p => itemHTML(p)).join('');
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const dist = new Date(el.dataset.time).getTime() - now;
            if (dist < 0) el.remove();
            else {
                const h = Math.floor(dist/3600000), m = Math.floor((dist%3600000)/60000), s = Math.floor((dist%60000)/1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    init();
    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
</script>
</body>
</html>
