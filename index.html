<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; --gold-light: #F5D76E; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; --card: rgba(255, 255, 255, 0.05); --pill: rgba(255, 255, 255, 0.08); 
            --red: #ff4d4d; --footer-h: 60px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 80px; overflow-x: hidden; }

        /* --- Header & Navigation --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.15); transition: 0.3s; }
        .logo-row { text-align: center; padding: 8px 0; }
        .logo-img { height: 24px; filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.3)); }
        
        .banner-container { padding: 0 10px 10px; }
        .banner-slide { height: 120px; display: flex; background: #000; border: 1px solid var(--gold); border-radius: 12px; overflow: hidden; position: relative; }
        .banner-left { width: 35%; border-right: 1px solid rgba(212, 175, 55, 0.1); }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .banner-right { width: 65%; padding: 10px; display: flex; flex-direction: column; justify-content: center; }
        .banner-title { color: var(--gold); font-size: 13px; font-weight: 600; line-height: 1.2; margin-bottom: 5px; }
        .banner-timer { display: flex; gap: 3px; align-items: center; }
        .time-box { background: var(--gold-grad); color: #000; padding: 2px 4px; border-radius: 4px; font-weight: 700; font-size: 10px; min-width: 20px; text-align: center; }

        .nav-container { padding: 0 10px 8px; }
        #search { width: 100%; padding: 7px 12px; border-radius: 10px; border: 1px solid #333; background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 6px; outline: none; font-size: 11px; }
        .cat-bar { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 10px; color: #888; padding: 3px 12px; border-radius: 7px; background: var(--pill); white-space: nowrap; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; }

        /* --- Main Content --- */
        main { margin-top: 275px; transition: 0.3s; }
        header.shrunk .banner-container { display: none; }
        header.shrunk + main { margin-top: 120px; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; padding: 0 7px; }
        .card { background: var(--card); border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); overflow: hidden; display: flex; flex-direction: column; }
        
        .media { width: 100%; aspect-ratio: 1/1; background: #000; cursor: zoom-in; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 7px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 11px; font-weight: 500; color: #eee; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .desc { font-size: 9px; color: #666; height: 24px; overflow: hidden; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price { color: var(--gold-light); font-size: 14px; font-weight: 700; margin-bottom: 5px; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 600; padding: 5px; border-radius: 7px; border: none; font-size: 10px; cursor: pointer; }

        /* --- Zoom Screen (Fix Center & Sound) --- */
        #mediaZoom { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; }
        #zoomBox { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #zoomBox img, #zoomBox video { max-width: 95vw; max-height: 80vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }

        /* --- Modals & Contact --- */
        .modal { display: none; position: fixed; z-index: 5000; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 15px; }
        .modal-card { background: #0a0a0a; border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 320px; padding: 15px; text-align: center; }
        .form-input { width: 100%; padding: 7px; background: #111; border: 1px solid #333; border-radius: 7px; color: #fff; margin-bottom: 7px; font-family: 'Kanit'; font-size: 11px; }
        
        .contact-grid { display: grid; gap: 8px; margin-top: 12px; }
        .contact-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #111; border-radius: 8px; text-decoration: none; color: #fff; font-size: 12px; border: 1px solid #222; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; display: flex; border-top: 1px solid rgba(212, 175, 55, 0.2); z-index: 2000; }
        .nav-link { color: #555; text-decoration: none; font-size: 9px; text-align: center; flex: 1; padding-top: 10px; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 15px; margin-bottom: 2px; display: block; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555; font-size: 11px;">กำลังเตรียมความหรูหรา...</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i>หน้าหลัก</a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck-fast"></i>พัสดุ</a>
    <a href="javascript:void(0)" onclick="document.getElementById('contactModal').style.display='flex'" class="nav-link"><i class="fa-solid fa-comments"></i>ติดต่อเรา</a>
</nav>

<div id="mediaZoom" onclick="closeZoom()"><div id="zoomBox"></div></div>

<div id="contactModal" class="modal" onclick="this.style.display='none'">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h4 style="color:var(--gold); font-size:14px;">ติดต่อเรา</h4>
        <div class="contact-grid">
            <a href="https://m.me/YOUR_PAGE_ID" target="_blank" class="contact-item"><i class="fa-brands fa-facebook-messenger" style="color:#0084ff;"></i> Facebook Messenger</a>
            <a href="https://line.me/ti/p/YOUR_LINE_ID" target="_blank" class="contact-item"><i class="fa-brands fa-line" style="color:#06c755;"></i> Line Official</a>
            <a href="tel:09XXXXXXXX" class="contact-item"><i class="fa-solid fa-phone" style="color:var(--gold);"></i> โทรสายด่วน</a>
        </div>
        <p onclick="document.getElementById('contactModal').style.display='none'" style="margin-top:12px; color:#555; font-size:10px; cursor:pointer;">ปิด</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); margin-bottom:10px; font-size:13px;">ยืนยันคำสั่งซื้อ</h4>
        <div id="orderSummary" style="background:#000; padding:10px; border-radius:8px; margin-bottom:10px; text-align:left; font-size:11px;"></div>
        <form id="orderForm">
            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="custAddress" class="form-input" rows="2" placeholder="ที่อยู่จัดส่ง" required></textarea>
            <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
            <div style="border: 1px dashed var(--gold); padding: 8px; border-radius: 8px; margin-bottom:8px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <span id="upTxt" style="color:var(--gold); font-size:10px;">📸 แตะเพื่อแนบสลิปโอนเงิน</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:5px; margin-top:5px;">
            </div>
            <button type="submit" id="btnSubmit" class="buy-btn" style="font-size:13px; padding: 8px;">ยืนยันและส่งข้อมูล</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:10px; color:#444; font-size:9px; cursor:pointer;">ยกเลิก</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], curCat = 'all';
    let currentData = {};
    let bannerEndTime = null;

    // ระบบสุ่มสินค้า (PR Shuffle)
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function getMedia(url, isZoom = false) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        if(isVid) {
            // หน้าซูมจะไม่ Muted เพื่อให้ได้ยินเสียง
            return `<video src="${url}" autoplay loop ${isZoom ? 'controls' : 'muted'} playsinline></video>`;
        }
        return `<img src="${url}" loading="lazy">`;
    }

    function zoom(url) {
        document.getElementById('zoomBox').innerHTML = getMedia(url, true);
        document.getElementById('mediaZoom').style.display = 'flex';
    }

    // ฟังก์ชันปิดและหยุดเสียงวิดีโอทันที
    function closeZoom() {
        const zoomBox = document.getElementById('zoomBox');
        const video = zoomBox.querySelector('video');
        if (video) {
            video.pause();
            video.src = "";
            video.load();
        }
        document.getElementById('mediaZoom').style.display = 'none';
        zoomBox.innerHTML = "";
    }

    async function init() {
        try {
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const textB = await resB.text();
            const b = textB.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b && b[0]) {
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide" onclick="zoom('${b[0]}')">
                        <div class="banner-left">${getMedia(b[0])}</div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]}</div>
                            <div class="banner-timer">
                                <div class="time-box" id="bh">00</div>:<div class="time-box" id="bm">00</div>:<div class="time-box" id="bs">00</div>
                            </div>
                        </div>
                    </div>`;
                setInterval(updateTimer, 1000);
            }

            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const textP = await resP.text();
            dbAll = textP.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));

            document.getElementById('status').style.display = 'none';
            render();
        } catch(e) { document.getElementById('status').innerText = "ขัดข้อง กรุณาลองใหม่"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        let filtered = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat));
        
        // สุ่มลำดับสินค้าก่อนแสดงผล
        filtered = shuffle(filtered);

        document.getElementById('main-list').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media" onclick="zoom('${p[1]}')">${getMedia(p[1])}</div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="desc">${p[2]||''}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}')">สั่งซื้อ</button>
                </div>
            </div>`).join('');
        
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimer() {
        if (!bannerEndTime) return;
        const d = bannerEndTime - new Date().getTime();
        if (d > 0) {
            document.getElementById('bh').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }

    function openOrder(n, p, s) {
        currentData = { n, p: parseFloat(p.replace(/,/g,'')), s: parseFloat(s) };
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align:center; margin-bottom:8px; border-bottom:1px solid #222; padding-bottom:5px;">
                <b style="color:var(--gold); font-size:12px;">กสิกร: 035-8-56762-2</b><br><small>วัชระ ชันสิน</small>
            </div>
            <b>สินค้า:</b> ${n}<br>
            <b>ยอดสุทธิ:</b> <span style="color:var(--gold); font-size:14px;">฿${(currentData.p + currentData.s).toLocaleString()}</span>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewSlip(f) {
        if (f.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result;
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            r.readAsDataURL(f.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btnSubmit');
        const f = document.getElementById('slipFile');
        if(!f.files[0]) return alert("กรุณาแนบสลิปโอนเงิน");
        b.innerText = "กำลังส่งข้อมูล..."; b.disabled = true;
        const r = new FileReader();
        r.onload = async function() {
            const payload = { 
                productDetail: currentData.n,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: r.result.split(',')[1], mimeType: f.files[0].type
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
                alert("✅ แจ้งชำระเงินสำเร็จ! ทีมงานจะรีบตรวจสอบครับ"); location.reload();
            } catch(err) { alert("ล้มเหลว กรุณาลองใหม่"); b.disabled = false; }
        };
        r.readAsDataURL(f.files[0]);
    };

    async function checkTracking() {
        const ph = prompt("เบอร์โทรศัพท์ที่ใช้สั่งซื้อ:");
        if (!ph) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const t = await res.text();
            const found = t.split('\n').slice(1).map(r => r.split(',')).find(r => r[0].replace(/"/g,'') === ph);
            if(found) alert(`คุณ: ${found[1]}\nสถานะ: ${found[2]}\nเลขพัสดุ: ${found[3]}`); else alert("ไม่พบข้อมูลพัสดุ");
        } catch(e) { alert("ผิดพลาดในการเชื่อมต่อ"); }
    }

    window.onscroll = () => { window.scrollY > 30 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
    init();
</script>
</body>
</html>
