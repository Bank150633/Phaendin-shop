<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHAENDIN SHOP</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:sans-serif;
background:#0a0a0a;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00eaff;
}

.search{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin:10px 0;
}

.container{
padding:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:10px;
}

.card{
background:#161616;
border-radius:12px;
overflow:hidden;
position:relative;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.name{
padding:5px;
font-size:14px;
}

.price{
color:#00eaff;
font-weight:bold;
padding:5px;
}

.btn{
background:#00eaff;
border:none;
width:90%;
margin:10px auto;
display:block;
padding:8px;
border-radius:10px;
cursor:pointer;
}

.cart-btn{
position:fixed;
bottom:20px;
right:20px;
background:#00eaff;
color:black;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
}

.modal-box{
background:#111;
padding:20px;
border-radius:10px;
width:90%;
max-width:400px;
}

.cart-item{
display:flex;
justify-content:space-between;
margin:5px 0;
}

</style>
</head>

<body>

<header>
<div class="logo">PHAENDIN SHOP</div>
<i class="fa fa-moon" onclick="toggleTheme()"></i>
</header>

<div class="container">

<input class="search" placeholder="ค้นหาสินค้า..." oninput="searchProduct(this.value)">

<div id="productGrid" class="grid"></div>

</div>

<div class="cart-btn" onclick="openCart()">
<i class="fa fa-shopping-cart"></i>
</div>

<div id="cartModal" class="modal">
<div class="modal-box">

<h3>ตะกร้าสินค้า</h3>

<div id="cartItems"></div>

<hr>

รวม <span id="total">0</span> บาท

<button class="btn" onclick="checkout()">ชำระเงิน</button>

<button class="btn" onclick="closeCart()">ปิด</button>

</div>
</div>

<script>

let products=[
{id:1,name:"เสื้อยืดแฟชั่น",price:199,img:"https://picsum.photos/300?1"},
{id:2,name:"รองเท้าผ้าใบ",price:590,img:"https://picsum.photos/300?2"},
{id:3,name:"หมวกเท่ๆ",price:150,img:"https://picsum.photos/300?3"},
{id:4,name:"กางเกงยีนส์",price:450,img:"https://picsum.photos/300?4"}
]

let cart=[]

function renderProducts(list=products){

const grid=document.getElementById("productGrid")

grid.innerHTML=""

list.forEach(p=>{

grid.innerHTML+=`

<div class="card">

<img src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price} บาท</div>

<button class="btn" onclick="addCart(${p.id})">ใส่ตะกร้า</button>

</div>

`

})

}

renderProducts()

function addCart(id){

const p=products.find(x=>x.id==id)

cart.push(p)

updateCart()

}

function updateCart(){

const box=document.getElementById("cartItems")

box.innerHTML=""

let total=0

cart.forEach((c,i)=>{

total+=c.price

box.innerHTML+=`

<div class="cart-item">

${c.name}

<span>${c.price}</span>

</div>

`

})

document.getElementById("total").innerText=total

}

function openCart(){

document.getElementById("cartModal").style.display="flex"

updateCart()

}

function closeCart(){

document.getElementById("cartModal").style.display="none"

}

function checkout(){

alert("โอนเงินไปที่ QR แล้วอัปโหลดสลิป")

}

function searchProduct(q){

q=q.toLowerCase()

const filtered=products.filter(p=>p.name.toLowerCase().includes(q))

renderProducts(filtered)

}

function toggleTheme(){

document.body.classList.toggle("light")

}

</script>

</body>
</html>
