<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณและขอผ่อนสินค้า</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-6 shadow-md">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-2xl md:text-3xl font-bold">บริการผ่อนสินค้าออนไลน์</h1>
            <p class="text-indigo-100 text-sm md:text-base mt-1">อนุมัติไว คำนวณยอดผ่อนได้ทันที ไม่ต้องมีผู้ค้ำ</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- ฝั่งคำนวณผ่อนสินค้า -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 002-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                คำนวณยอดผ่อนชำระ
            </h2>

            <form id="calcForm" class="space-y-4">
                <!-- เลือกสินค้า / ใส่ราคา -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ราคาสินค้า (บาท)</label>
                    <input type="number" id="productPrice" placeholder="เช่น 15000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <!-- เงินดาวน์ -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">เงินดาวน์ (บาท)</label>
                    <input type="number" id="downPayment" value="0" placeholder="0" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <p class="text-xs text-slate-400 mt-1">*กรณีไม่ดาวน์ ให้ใส่ 0</p>
                </div>

                <!-- จำนวนงวด -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">จำนวนงวด (เดือน)</label>
                    <select id="months" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="3">3 เดือน</option>
                        <option value="6" selected>6 เดือน</option>
                        <option value="10">10 เดือน</option>
                        <option value="12">12 เดือน</option>
                        <option value="24">24 เดือน</option>
                    </select>
                </div>

                <!-- ดอกเบี้ยต่อเดือน (%) -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">อัตราดอกเบี้ย (% ต่อเดือน)</label>
                    <input type="number" step="0.01" id="interestRate" value="1.5" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </form>

            <!-- สรุปผลการคำนวณ -->
            <div class="mt-6 p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                <div class="text-sm text-slate-600 space-y-2">
                    <div class="flex justify-between">
                        <span>ยอดจัดไฟแนนซ์/จัดผ่อน:</span>
                        <span id="loanAmount" class="font-semibold text-slate-800">0 บาท</span>
                    </div>
                    <div class="flex justify-between">
                        <span>ดอกเบี้ยรวมทั้งหมด:</span>
                        <span id="totalInterest" class="font-semibold text-slate-800">0 บาท</span>
                    </div>
                    <hr class="border-indigo-200 my-2">
                    <div class="flex justify-between items-center text-indigo-900 font-bold">
                        <span>ผ่อนประมาณเดือนละ:</span>
                        <span id="monthlyPayment" class="text-xl text-indigo-600">0 บาท</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ฝั่งกรอกข้อมูลส่งคำขอผ่อน -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                ลงทะเบียนขออนุมัติผ่อน
            </h2>

            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="custName" placeholder="สมชาย ใจดี" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">เบอร์โทรศัพท์</label>
                    <input type="tel" id="custPhone" placeholder="08X-XXX-XXXX" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อสินค้าที่ต้องการผ่อน</label>
                    <input type="text" id="custProduct" placeholder="เช่น iPhone 15 Pro, โน้ตบุ๊ก Asus" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">หมายเหตุเพิ่มเติม</label>

                    <textarea id="custNote" rows="2" placeholder="เช่น อาชีพ, ที่อยู่จัดส่ง หรือรายละเอียดเพิ่มเติม" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-1.5C13.67 9 13 9.67 13 10.5V12h3l-.5 3H13v6.8c4.56-.93 8-4.96 8-9.8 0-5.52-4.48-10-10-10z"/></svg>
                    ส่งข้อมูลขอผ่อนผ่าน LINE
                </button>
            </form>
        </section>

    </main>

    <!-- JavaScript Calculation Script -->
    <script>
        // Line Official Account ID ของคุณ (ใส่ไอดี Line เช่น @yourlineid)
        const LINE_ID = "@yourlineid"; 

        const priceInput = document.getElementById('productPrice');
        const downInput = document.getElementById('downPayment');
        const monthsInput = document.getElementById('months');
        const interestInput = document.getElementById('interestRate');

        const loanAmountEl = document.getElementById('loanAmount');
        const totalInterestEl = document.getElementById('totalInterest');
        const monthlyPaymentEl = document.getElementById('monthlyPayment');

        // ฟังก์ชันคำนวณยอดผ่อน
        function calculateLoan() {
            const price = parseFloat(priceInput.value) || 0;
            const down = parseFloat(downInput.value) || 0;
            const months = parseInt(monthsInput.value) || 1;
            const rate = parseFloat(interestInput.value) || 0;

            // ยอดจัด = ราคาสินค้า - เงินดาวน์
            let loan = price - down;
            if (loan < 0) loan = 0;

            // ดอกเบี้ยรวม = ยอดจัด * (อัตราดอกเบี้ยต่อเดือน / 100) * จำนวนเดือน
            const totalInterest = loan * (rate / 100) * months;

            // ยอดรวมทั้งหมด = ยอดจัด + ดอกเบี้ยรวม
            const totalPay = loan + totalInterest;

            // ค่างวดต่อเดือน
            const monthlyPay = months > 0 ? (totalPay / months) : 0;

            // แสดงผล
            loanAmountEl.innerText = loan.toLocaleString('th-TH') + ' บาท';
            totalInterestEl.innerText = Math.round(totalInterest).toLocaleString('th-TH') + ' บาท';
            monthlyPaymentEl.innerText = Math.round(monthlyPay).toLocaleString('th-TH') + ' บาท/เดือน';

            return { price, down, months, rate, loan, monthlyPay: Math.round(monthlyPay) };
        }

        // ตัวจับเหตุการณ์เมื่อมีการเปลี่ยนแปลงข้อมูลคำนวณ
        [priceInput, downInput, monthsInput, interestInput].forEach(input => {
            input.addEventListener('input', calculateLoan);
        });

        // ฟังก์ชันส่งข้อมูลเข้า Line
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const calc = calculateLoan();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const product = document.getElementById('custProduct').value;
            const note = document.getElementById('custNote').value;

            // ข้อความที่จะส่งเข้า Line
            const message = 
`📌 *สนใจขอผ่อนสินค้า*
---------------------------
👤 ชื่อ: ${name}
📞 โทร: ${phone}
📦 สินค้า: ${product}

💰 ราคาสินค้า: ${calc.price.toLocaleString()} บาท
💵 เงินดาวน์: ${calc.down.toLocaleString()} บาท
📅 ผ่อน: ${calc.months} เดือน
💸 ตกเดือนละประมาณ: ${calc.monthlyPay.toLocaleString()} บาท
📝 หมายเหตุ: ${note || '-'}
---------------------------`;

            // เปิด Line พร้อมข้อความที่จัดไว้
            const lineUrl = `https://line.me/R/oaMessage/${LINE_ID}/?${encodeURIComponent(message)}`;
            window.open(lineUrl, '_blank');
        });
    </script>
</body>
</html>
