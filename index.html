<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | CINEMATIC PREMIUM FULL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; transition: 0.3s; overflow-x: hidden; }

        /* Cinematic Banner Section - แบนเนอร์จอหนังเต็มจอ */
        .banner-container { 
            position: relative; width: 100%; height: 260px; background: #000; overflow: hidden;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }
        .bn-card { width: 100%; height: 100%; position: relative; }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        
        /* Overlay แบนเนอร์ - จัดวางแบบหนัง */
        .bn-txt { 
            position: absolute; inset: 0; padding: 20px; 
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 50%);
            text-align: center;
        }
        .bn-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .bn-timer { 
            display: flex; gap: 6px; font-size: 11px; color: var(--gold); 
            background: rgba(0,0,0,0.7); padding: 4px 15px; border-radius: 20px; 
            border: 1px solid rgba(212, 175, 55, 0.5); backdrop-filter: blur(5px);
        }
        .bn-btn { margin-top: 15px; background: var(--gold-grad); border: none; padding: 6px 25px; font-size: 11px; font-weight: 700; border-radius: 20px; color: #000; cursor: pointer; text-transform: uppercase; }

        /* Floating Search - ช่องค้นหาแบบลอย (ไม่ทับแบนเนอร์แล้ว) */
        header { position: sticky; top: 0; z-index: 1000; padding: 12px 15px; background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .search-wrap { position: relative; max-width: 500px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
        #search { flex-grow: 1; padding: 10px 15px 10px 40px; border-radius: 12px; border: 1px solid #333; background: var(--input-bg); color: var(--text); font-size: 13px; outline: none; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        .theme-btn { background: none; border: none; color: var(--gold); font-size: 18px; cursor: pointer; }

        /* Product Grid - 3 คอลัมน์ */
        .sec-title { padding: 20px 15px 5px; font-size: 13px; font-weight: 600; color: var(--gold); letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        
        /* Product Card */
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.1); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Badge บนสินค้า */
        .badge-container { position: absolute; top: 5px; left: 5px; display: flex; flex-direction: column; gap: 3px; z-index: 2; }
        .badge { font-size: 7px; padding: 2px 5px; border-radius: 3px; font-weight: 700; color: #000; background: var(--gold-grad); }

        .info { padding: 8px 5px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .p-name { font-size: 10px; font-weight: 500; color: var(--gold); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { font-size: 13px; font-weight: 700; color: #fff; }
        
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 8px 0; font-weight: 700; font-size: 10px; cursor: pointer; border-radius: 0 0 12px 12px; }

        /* Nav Bottom */
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.2); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 18px; margin-bottom: 4px; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 310px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        
        .opt-sel { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: #1a1a1a; color: var(--gold); border: 1px solid #333; font-size: 12px; outline: none; }
        .input-slim { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 12px; }

        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
        #zoomContent img, #zoomContent video { max-width: 95vw; max-height: 80vh; object-fit: contain; }
    </style>
</head>
<body>

<div class="banner-container" id="banner"></div>

<header>
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาเมนูอร่อยของคุณ..." oninput="render()">
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </div>
</header>

<div class="sec-title"><i class="fa-solid fa-crown"></i> สินค้าทั้งหมด</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-home"></i>หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i>พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment"></i>ติดต่อ</div>
</nav>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center;">
        <h4 style="color:var(--gold); margin-bottom:20px;">ติดต่อเรา</h4>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:12px; border-radius:10px; text-decoration:none; margin-bottom:10px;">📞 โทรสายด่วน</a>
        <p onclick="closeModal('contactModal')" style="color:#666; cursor:pointer; margin-top:20px;">[ ปิด ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:15px;">ยืนยันสั่งซื้อ</h4>
        <div id="orderDetail" style="font-size:11px; background:rgba(212,175,55,0.05); padding:10px; border-radius:10px; margin-bottom:15px; border-left: 4px solid var(--gold);"></div>
        
        <form id="orderForm">
            <div id="optionBox"></div>
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="text-align:center; margin: 10px 0;">
                <p style="font-size:10px; color:var(--gold);">โอนเงิน: กสิกร 035-8-56762-2</p>
                <img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png" style="width:100px; border-radius:10px; margin-top:5px; border:1px solid var(--gold);">
            </div>

            <div style="border:2px dashed var(--gold); padding:10px; border-radius:10px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:11px; color:var(--gold)">📸 คลิกแนบสลิป</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:100%; margin-top:10px; border-radius:8px;">
            </div>

            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:15px; border-radius:8px;">ยืนยันสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:#666; cursor:pointer; margin-top:15px; font-size:12px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;

    // ระบบสุ่มสินค้า (Shuffle) - ครบเหมือนเดิม
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">${b[1]}</div>
                            <div class="bn-timer">⏳ <span id="th">00</span>:<span id="tm">00</span>:<span id="ts">00</span></div>
                            <button class="bn-btn" onclick="openOrder('${b[1]}',0,0,'')">สั่งซื้อโปรโมชั่น</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            const rawData = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            db = shuffle(rawData); // สุ่มสินค้าทุกครั้งที่เปิด
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">${p[10]?p[10].split(',').map(t=>`<span class="badge">${t.trim()}</span>`).join(''):''}</div>
                    ${renderMedia(p[1], true)}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[3]).toLocaleString()}</div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
            </div>`).join('');
    }

    function renderMedia(url, isMuted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)$/i);
        return isVid ? `<video src="${url}" ${isMuted ? 'autoplay loop muted playsinline' : 'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
    }

    function openOrder(n, p, s, optStr) {
        activeP = { name: n, basePrice: parseFloat(p), ship: parseFloat(s), currentPrice: parseFloat(p), optText: '' };
        const box = document.getElementById('optionBox');
        box.innerHTML = '';
        if(optStr && optStr !== '-') {
            let html = `<select id="pOpt" class="opt-sel" onchange="updatePrice()">`;
            optStr.split(',').forEach(o => {
                const parts = o.trim().split('=');
                html += `<option value="${parts[1]||p}" data-label="${parts[0]}">${parts[0]} (฿${parseFloat(parts[1]||p).toLocaleString()})</option>`;
            });
            box.innerHTML = html + `</select>`;
        }
        updatePrice();
        openModal('orderModal');
    }

    function updatePrice() {
        const sel = document.getElementById('pOpt');
        if(sel) {
            activeP.currentPrice = parseFloat(sel.value);
            activeP.optText = ` [${sel.options[sel.selectedIndex].getAttribute('data-label')}]`;
        }
        document.getElementById('orderDetail').innerHTML = `🛒 ${activeP.name}${activeP.optText}<br>💰 ยอดโอน: ฿${(activeP.currentPrice + activeP.ship).toLocaleString()} (รวมส่ง)`;
    }

    function zoom(url) { document.getElementById('zoomContent').innerHTML = renderMedia(url, false); document.getElementById('zoomOverlay').style.display = 'flex'; }
    function closeZoom() { document.getElementById('zoomOverlay').style.display = 'none'; document.getElementById('zoomContent').innerHTML = ''; }
    function openModal(id) { const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none', 300); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        btn.innerText = "กำลังสั่งซื้อ..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name}${activeP.optText} ยอด: ${activeP.currentPrice + activeP.ship}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }
    
    async function checkShip() {
        const p = prompt("เบอร์โทรที่ใช้สั่งซื้อ:"); if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const f = rows.find(r => r[0] === p);
        if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nพัสดุ: ${f[3]}`);
        else alert("ไม่พบข้อมูล");
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    init();
</script>
</body>
</html>
