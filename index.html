<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | EXTRA MINI</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #0A0A0A; 
            --card: #141414; 
            --text: #FFFFFF; 
            --text-dim: #999999;
            --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; transition: 0.3s; overflow-x: hidden; font-size: 12px; }

        /* Header - ย่อให้เล็กลงอีก */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 8px; border-bottom: 1px solid var(--gold); }
        .search-wrap { position: relative; max-width: 400px; margin: 0 auto; }
        #search { width: 100%; padding: 6px 12px 6px 32px; border-radius: 15px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 11px; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 12px; }

        .theme-btn { position: fixed; top: 10px; right: 8px; z-index: 2001; background: var(--gold-grad); border: none; width: 26px; height: 26px; border-radius: 50%; color: #000; cursor: pointer; font-size: 10px; }

        /* Banner - ย่อความสูง */
        .banner-box { margin-top: 55px; padding: 8px; }
        .bn-card { border: 1px solid var(--gold); border-radius: 12px; overflow: hidden; display: flex; height: 90px; background: #000; }
        .bn-img { width: 35%; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { width: 65%; padding: 8px; display: flex; flex-direction: column; justify-content: center; }
        .bn-title { font-size: 12px; font-weight: 600; color: var(--gold); margin-bottom: 2px; }
        .bn-timer { display: flex; gap: 2px; margin-bottom: 5px; font-size: 8px; }
        .t-unit { background: var(--gold-grad); color: #000; padding: 1px 3px; border-radius: 2px; font-weight: 700; }

        /* Section Title - ย่อขนาด */
        .sec-title { padding: 8px 12px 4px; font-size: 12px; font-weight: 600; color: var(--gold); display: flex; align-items: center; justify-content: space-between; }

        /* Recom Scroll - การ์ดมินิ */
        .recom-container { padding: 4px 0 10px; }
        .recom-scroll { display: flex; overflow-x: auto; gap: 8px; padding: 0 12px; scrollbar-width: none; }
        .recom-item { min-width: 110px; max-width: 110px; }

        /* Grid System - เพิ่มระยะห่างให้ดูไม่ตัน */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 12px; }
        
        .card { 
            background: var(--card); border: 1px solid var(--gold); border-radius: 10px; 
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; border-bottom: 0.5px solid rgba(212,175,55,0.1); }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 2px; z-index: 2; }
        .badge { font-size: 7px; padding: 1px 4px; border-radius: 2px; font-weight: 700; color: #000; background: var(--gold-grad); }

        .info { padding: 6px; display: flex; flex-direction: column; flex-grow: 1; text-align: center; }
        .p-name { font-size: 10px; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-desc { font-size: 8px; color: var(--text-dim); margin-bottom: 4px; line-height: 1.1; height: 18px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
        
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 5px; border-radius: 6px; font-weight: 700; font-size: 9px; cursor: pointer; }

        /* Navigation - ย่อความสูง */
        nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: rgba(0,0,0,0.95); display: flex; border-top: 1px solid var(--gold); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); text-decoration: none; font-size: 9px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 16px; margin-bottom: 2px; }

        /* Contact Link */
        .contact-link { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.1); border-radius: 8px; color: var(--text); text-decoration: none; margin-bottom: 8px; font-size: 11px; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 280px; padding: 15px; position: relative; max-height: 80vh; overflow-y: auto; }
        
        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
        #zoomContent video, #zoomContent img { max-width: 95vw; max-height: 80vh; border: 1px solid var(--gold); border-radius: 8px; }
    </style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>

<header>
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหา..." oninput="render()">
    </div>
</header>

<div class="banner-box" id="banner"></div>

<div id="recommendedSection" style="display:none;">
    <div class="sec-title"><span><i class="fa-solid fa-star"></i> สินค้าแนะนำ</span></div>
    <div class="recom-container"><div class="recom-scroll" id="recomGrid"></div></div>
</div>

<div class="sec-title"><span><i class="fa-solid fa-box"></i> สินค้าทั้งหมด</span></div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i>หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck-fast"></i>พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-phone"></i>ติดต่อ</div>
</nav>

<div id="contactModal" class="modal">
    <div class="modal-card">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:15px; font-size:14px;">ติดต่อเรา</h3>
        <a href="tel:0944159031" class="contact-link"><i class="fa-solid fa-phone" style="color:#2ECC71;"></i> โทร: 094-415-9031</a>
        <a href="https://line.me/ti/p/YOUR_LINE_ID" target="_blank" class="contact-link"><i class="fa-brands fa-line" style="color:#06C755;"></i> LINE Official</a>
        <a href="https://m.me/YOUR_PAGE_ID" target="_blank" class="contact-link"><i class="fa-brands fa-facebook-messenger" style="color:#0084FF;"></i> Facebook</a>
        <p onclick="closeModal('contactModal')" style="text-align:center; font-size:10px; color:var(--text-dim); margin-top:10px; cursor:pointer;">[ ปิด ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:10px; font-size:13px;">สั่งซื้อสินค้า</h3>
        <div id="orderDetail" style="font-size:10px; background:rgba(212,175,55,0.1); padding:8px; border-radius:8px; margin-bottom:10px; border-left: 3px solid var(--gold);"></div>
        <form id="orderForm">
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required style="width:100%; padding:7px; margin-bottom:6px; border-radius:5px; background:var(--input-bg); color:#fff; border:1px solid #333; font-size:10px;">
            <input type="tel" id="cPhone" placeholder="เบอร์โทร" required style="width:100%; padding:7px; margin-bottom:6px; border-radius:5px; background:var(--input-bg); color:#fff; border:1px solid #333; font-size:10px;">
            <textarea id="cAddr" placeholder="ที่อยู่" required style="width:100%; padding:7px; margin-bottom:8px; border-radius:5px; background:var(--input-bg); color:#fff; border:1px solid #333; font-size:10px; height:40px;"></textarea>
            
            <div style="text-align:center; margin-bottom:8px;">
                <p style="font-size:9px; color:var(--gold);">กสิกร 035-8-56762-2</p>
                <img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png" style="width:90px; border:1px solid var(--gold); border-radius:5px; margin-top:3px;">
            </div>

            <div style="border:1px dashed var(--gold); padding:6px; border-radius:5px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:9px; color:var(--gold)">📸 แนบสลิป</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)">
                <img id="preview" style="display:none; width:100%; margin-top:5px; border-radius:3px;">
            </div>
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:10px; padding:8px;">ยืนยันสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; font-size:9px; color:var(--text-dim); margin-top:10px; cursor:pointer;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;

    async function init() {
        try {
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">${b[1]}</div>
                            <div class="bn-timer">⏳ <span id="th">00</span>:<span id="tm">00</span>:<span id="ts">00</span></div>
                            <button class="buy-now" style="width:60px; padding:3px;" onclick="openOrder('${b[1]}',0,0)">รับสิทธิ์</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const list = db.filter(p => p[0].toLowerCase().includes(q));
        const recoms = db.filter(p => p[10] && p[10].includes('แนะนำ'));
        document.getElementById('recomGrid').innerHTML = recoms.map(p => createCard(p, true)).join('');
        document.getElementById('recommendedSection').style.display = (recoms.length > 0 && !q) ? 'block' : 'none';
        document.getElementById('productGrid').innerHTML = list.map(p => createCard(p, false)).join('');
    }

    function createCard(p, isRecom) {
        const badgeHTML = p[10] ? p[10].split(',').map(t => `<span class="badge">${t.trim()}</span>`).join('') : '';
        return `
            <div class="${isRecom ? 'recom-item' : 'card'}">
                <div class="${isRecom ? 'card' : ''}">
                    <div class="media-wrap" onclick="zoom('${p[1]}')">
                        <div class="badge-container">${badgeHTML}</div>
                        ${renderMedia(p[1], true)}
                    </div>
                    <div class="info">
                        <div class="p-name">${p[0]}</div>
                        <div class="p-price">฿${p[3]}</div>
                        <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}')">สั่งซื้อ</button>
                    </div>
                </div>
            </div>`;
    }

    // แก้ไขเสียง: หน้าแรกปิดเสียง (muted), หน้า Zoom เปิดเสียง (controls)
    function renderMedia(url, isMuted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)$/);
        if(isVid) {
            return `<video src="${url}" ${isMuted ? 'autoplay loop muted playsinline' : 'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>`;
        }
        return `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
    }

    function zoom(url) {
        const overlay = document.getElementById('zoomOverlay');
        // เมื่อ Zoom จะเรียก renderMedia แบบเปิดเสียง (isMuted = false)
        document.getElementById('zoomContent').innerHTML = renderMedia(url, false);
        overlay.style.display = 'flex';
    }

    function closeZoom() { 
        document.getElementById('zoomOverlay').style.display='none'; 
        document.getElementById('zoomContent').innerHTML=''; // หยุดวิดีโอทันทีเมื่อปิด
    }

    // ฟังก์ชันตามพัสดุ (เพิ่มกลับมาให้แล้ว)
    async function checkShip() {
        const p = prompt("กรุณากรอกเบอร์โทรศัพท์ที่ใช้สั่งซื้อ:"); if(!p) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
            const f = rows.find(r => r[0] === p);
            if(f) alert(`คุณ: ${f[1]}\nสถานะ: ${f[2]}\nเลขพัสดุ: ${f[3]}`);
            else alert("ไม่พบข้อมูลพัสดุ เบอร์นี้อาจยังไม่ได้เข้าระบบครับ");
        } catch(e) { alert("ล้มเหลวในการเชื่อมต่อ"); }
    }

    function openOrder(n, p, s) {
        activeP = { n, p: parseFloat(p), s: parseFloat(s)||0 };
        document.getElementById('orderDetail').innerHTML = `📦 ${n}<br>💰 ยอดโอนรวม: ฿${(activeP.p + activeP.s).toLocaleString()}`;
        openModal('orderModal');
    }

    function openModal(id) { const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none',300); }

    function handleFile(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => { 
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิปด้วยครับ");
        btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: activeP.n,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ! ขอบคุณครับ"); location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด ลองใหม่อีกครั้ง"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const i = document.querySelector('.theme-btn i');
        i.classList.toggle('fa-moon'); i.classList.toggle('fa-sun');
    }
    init();
</script>
</body>
</html>
