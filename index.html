<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 55px; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 5px; border-bottom: 1px solid var(--gold); display: flex; justify-content: center; align-items: center; height: 50px; }
        .logo-img { height: 40px; }

        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; }
        #search { width: 100%; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: #fff; font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; color: var(--gold); font-size: 13px; }

        .banner-box { padding: 8px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; height: 200px; background: #000; position: relative; }
        .bn-img { width: 100%; height: 100%; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; width: 100%; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; justify-content: space-between; align-items: flex-end; }
        .bn-title { font-size: 15px; font-weight: 600; color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid rgba(212,175,55,0.1); position: relative; display: flex; flex-direction: column; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        .province-badge { position: absolute; top: 5px; right: 5px; background: var(--gold-grad); color: #000; font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        
        .info { padding: 8px; flex-grow: 1; text-align: center; }
        .p-name { font-size: 12px; color: var(--gold); font-weight: 500; margin-bottom: 4px; }
        .p-price { font-size: 14px; font-weight: 700; color: #ff4b2b; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 8px; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; }

        /* SHOPEE STYLE OPTION SLIDER */
        .option-container { margin: 10px 0; }
        .option-label { font-size: 12px; color: var(--gold); margin-bottom: 8px; padding-left: 5px; }
        .variant-slider { 
            display: flex; gap: 10px; overflow-x: auto; padding: 5px; 
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .variant-slider::-webkit-scrollbar { display: none; }
        
        .variant-item { 
            flex: 0 0 100px; background: #1A1A1A; border-radius: 10px; 
            padding: 8px; border: 1px solid #333; transition: 0.2s;
            text-align: center;
        }
        .variant-item.active { border-color: var(--gold); background: rgba(212,175,55,0.1); }
        .v-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-bottom: 6px; }
        .v-name { font-size: 10px; color: #fff; height: 2.4em; overflow: hidden; margin-bottom: 5px; }
        .v-price { font-size: 11px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
        
        /* MODERN COUNTER */
        .v-ctrl { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .v-btn { width: 24px; height: 24px; border-radius: 50%; border: none; background: #333; color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .v-btn.plus { background: var(--gold-grad); color: #000; }
        .v-qty { font-size: 13px; font-weight: 700; color: #fff; min-width: 15px; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: flex-end; justify-content: center; }
        .modal.show { display: flex; }
        .modal-card { 
            background: #111; border-radius: 20px 20px 0 0; width: 100%; 
            max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto;
            border-top: 2px solid var(--gold);
        }
        .input-slim { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; background: #1A1A1A; color: #fff; border: 1px solid #333; outline: none; }

        .order-summary-box { background: #1A1A1A; border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .total-price { font-size: 28px; font-weight: 800; color: #fff; }

        nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; border-top: 1px solid #222; z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 10px; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

<header><img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img"></header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาของอร่อยที่นี่..." oninput="render()">
</div>

<main class="grid" id="productGrid"></main>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <div id="mainPreview" style="width:100%; aspect-ratio:1/1; border-radius:15px; overflow:hidden; margin-bottom:15px;"></div>
        
        <div class="option-container">
            <div class="option-label"><i class="fa-solid fa-list"></i> เลือกรายการสินค้า</div>
            <div class="variant-slider" id="optionBox"></div>
        </div>

        <div class="order-summary-box">
            <div id="summaryItems" style="font-size:11px; color:#888; margin-bottom:5px;">ยังไม่ได้เลือกสินค้า</div>
            <div class="total-price" id="totalDisplay">฿0</div>
            <div style="font-size:10px; color:var(--gold);" id="shippingInfo"></div>
        </div>

        <form id="orderForm">
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่งโดยละเอียด" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="background:#000; padding:15px; border-radius:12px; margin-bottom:15px; text-align:center; border:1px solid #333;">
                <p style="color:var(--gold); font-size:12px;">กสิกรไทย: 035-8-56762-2</p>
                <p style="font-size:10px; color:#888;">ชื่อบัญชี: คุณวัชระ ชันสิน</p>
            </div>

            <div style="border:2px dashed #333; padding:15px; border-radius:12px; text-align:center; margin-bottom:15px;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:12px; color:var(--gold);"><i class="fa-solid fa-upload"></i> กดแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:100px; margin:10px auto; border-radius:8px;">
            </div>

            <button type="submit" id="submitBtn" class="buy-now" style="border-radius:12px; padding:15px; font-size:14px;">ยืนยันการสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:#555; cursor:pointer; margin-top:15px; font-size:12px;">กลับไปหน้าหลัก</p>
        </form>
    </div>
</div>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-home"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-box"></i> เช็คพัสดุ</div>
</nav>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    let db = [], activeP = {}, selectedOptions = {};

    async function init() {
        const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
        const pRaw = await resP.text();
        db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media-wrap">
                    ${p[13] ? `<div class="province-badge">${p[13]}</div>` : ''}
                    ${renderMedia(p[1])}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[10]||p[3]).toLocaleString()}</div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]}','${p[1]}','${p[14]||1}','${p[12]||99}')">สั่งซื้อ</button>
            </div>`).join('');
    }

    function openOrder(n, price, ship, optStr, img, min, max) {
        activeP = { name: n, ship: parseFloat(ship), img, min: parseInt(min), max: parseInt(max) };
        selectedOptions = {};
        document.getElementById('mainPreview').innerHTML = renderMedia(img);
        document.getElementById('shippingInfo').innerText = activeP.ship > 0 ? `+ ค่าส่ง ฿${activeP.ship}` : 'จัดส่งฟรี!';
        
        const box = document.getElementById('optionBox');
        box.innerHTML = '';
        if(optStr && optStr !== '-') {
            optStr.split(',').forEach(o => {
                let [label, p, vImg] = o.split(':').map(v => v?.trim());
                let finalP = parseFloat(p || price);
                box.innerHTML += `
                    <div class="variant-item" id="v-item-${label}">
                        <img src="${vImg||img}" class="v-img" onclick="changePreview('${vImg||img}', '${label}')">
                        <div class="v-name">${label}</div>
                        <div class="v-price">฿${finalP.toLocaleString()}</div>
                        <div class="v-ctrl">
                            <button type="button" class="v-btn" onclick="updateQty('${label}', ${finalP}, -1)">-</button>
                            <span class="v-qty" id="qty-${label}">0</span>
                            <button type="button" class="v-btn plus" onclick="updateQty('${label}', ${finalP}, 1)">+</button>
                        </div>
                    </div>`;
                selectedOptions[label] = { qty: 0, price: finalP };
            });
        }
        updateTotal();
        openModal('orderModal');
    }

    function changePreview(url, label) {
        document.getElementById('mainPreview').innerHTML = renderMedia(url);
        document.querySelectorAll('.variant-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`v-item-${label}`).classList.add('active');
    }

    function updateQty(label, price, delta) {
        let currentQty = selectedOptions[label].qty;
        let totalItems = Object.values(selectedOptions).reduce((s, i) => s + i.qty, 0);
        
        if (delta > 0 && totalItems >= activeP.max) return alert("ขออภัย สั่งได้สูงสุด " + activeP.max + " ชิ้นครับ");
        if (currentQty + delta >= 0) {
            selectedOptions[label].qty += delta;
            document.getElementById(`qty-${label}`).innerText = selectedOptions[label].qty;
            
            // Toggle active class
            if(selectedOptions[label].qty > 0) document.getElementById(`v-item-${label}`).classList.add('active');
            else document.getElementById(`v-item-${label}`).classList.remove('active');
            
            updateTotal();
        }
    }

    function updateTotal() {
        let subtotal = 0, items = [], count = 0;
        for (let k in selectedOptions) {
            if(selectedOptions[k].qty > 0) {
                subtotal += (selectedOptions[k].price * selectedOptions[k].qty);
                items.push(`${k} x${selectedOptions[k].qty}`);
                count += selectedOptions[k].qty;
            }
        }
        let total = subtotal > 0 ? subtotal + activeP.ship : 0;
        document.getElementById('totalDisplay').innerText = `฿${total.toLocaleString()}`;
        document.getElementById('summaryItems').innerText = items.join(', ') || 'ยังไม่ได้เลือกสินค้า';
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = count < activeP.min;
        btn.style.opacity = btn.disabled ? "0.5" : "1";
        if(count > 0 && count < activeP.min) btn.innerText = `ขั้นต่ำ ${activeP.min} ชิ้น (ขาดอีก ${activeP.min - count})`;
        else btn.innerText = "ยืนยันการสั่งซื้อ";
        
        activeP.finalTotal = total;
        activeP.summary = items.join(', ');
    }

    function renderMedia(url) { return url.match(/\.(mp4|webm)$/i) ? `<video src="${url}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`; }
    function openModal(id) { document.getElementById(id).style.display='flex'; setTimeout(()=>document.getElementById(id).classList.add('show'),10); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); setTimeout(()=>document.getElementById(id).style.display='none', 300); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิปโอนเงินครับ");
        
        document.getElementById('submitBtn').innerText = "กำลังสั่งซื้อ...";
        document.getElementById('submitBtn').disabled = true;

        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name} [${activeP.summary}] | ยอด: ฿${activeP.finalTotal}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
            alert("สั่งซื้อสำเร็จแล้ว! เราจะรีบจัดส่งให้โดยเร็วที่สุด");
            location.reload();
        };
        reader.readAsDataURL(file);
    };

    init();
</script>
</body>
</html>
