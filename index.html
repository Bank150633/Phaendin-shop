<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | PREMIUM STORE</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 50px; padding-bottom: 60px; transition: 0.3s; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 12px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .logo-txt { color: var(--gold); font-weight: 600; font-size: 16px; letter-spacing: 1px; }

        /* Search Section */
        .search-wrap { position: relative; width: 100%; max-width: 600px; margin: 15px auto 5px; padding: 0 12px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 10px 10px 10px 40px; border-radius: 15px; border: 1.5px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; transition: 0.3s; }
        #search:focus { box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .search-icon { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 15px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 35px; height: 35px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Banner */
        .banner-box { padding: 10px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 20px; overflow: hidden; height: 220px; background: #000; box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2); position: relative; }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px 15px; background: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%); }
        .bn-title { font-size: 18px; font-weight: 600; color: var(--gold); margin-bottom: 8px; text-shadow: 2px 2px 4px #000; }
        .timer-unit { background: #ff4b2b; color: #fff; padding: 4px 6px; border-radius: 6px; font-weight: bold; font-size: 12px; min-width: 30px; text-align: center; }

        /* Product Grid */
        .sec-title { padding: 15px 12px 5px; font-size: 14px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; position: relative; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .media-wrap img { transform: scale(1.05); }

        .badge-container { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
        .badge { font-size: 8px; padding: 3px 7px; border-radius: 5px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .bg-red { background: var(--red-grad); }
        .bg-gold { background: var(--gold-grad); color: #000; }

        .info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .p-name { font-size: 13px; font-weight: 500; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-desc { font-size: 10px; color: var(--text-dim); line-height: 1.3; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-size: 15px; font-weight: 700; margin-top: auto; display: flex; align-items: center; gap: 6px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 11px; }
        .new-price { color: #ff4b2b; }

        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 12px 0; font-weight: 700; font-size: 12px; cursor: pointer; border-radius: 0 0 15px 15px; text-transform: uppercase; position: relative; overflow: hidden; }
        .buy-now::after { content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255, 255, 255, 0.4); transform: rotate(30deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }

        /* Order Modal */
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 380px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .stepper-wrap { background: rgba(212,175,55,0.1); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid rgba(212,175,55,0.2); }
        .step-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; color: var(--gold); font-weight: bold; cursor: pointer; }
        #qtyDisplay { font-size: 18px; font-weight: bold; min-width: 30px; text-align: center; }

        /* Navigation */
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 20px; margin-bottom: 3px; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo-txt">PHAENDIN STORE</div>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้าที่ต้องการ..." oninput="render()">
</div>

<div class="sec-title"><i class="fa-solid fa-fire"></i> สินค้าแนะนำสำหรับคุณ</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck-fast"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:12px; font-size:16px;">ยืนยันการสั่งซื้อ</h4>
        <div id="orderDetail" style="background:rgba(212,175,55,0.1); padding:15px; border-radius:15px; margin-bottom:15px; border:1.5px solid var(--gold);"></div>
        <form id="orderForm">
            <div id="optionBox"></div>
            
            <div class="stepper-wrap">
                <span style="font-size:13px; font-weight:500; color:var(--gold);">จำนวนสินค้า</span>
                <div style="display:flex; align-items:center; gap:15px;">
                    <button type="button" class="step-btn" onclick="updateQty(-1)"><i class="fa-solid fa-minus"></i></button>
                    <span id="qtyDisplay">1</span>
                    <button type="button" class="step-btn" onclick="updateQty(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล ผู้รับ" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่งโดยละเอียด" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="text-align:center; margin: 15px 0; background:rgba(255,255,255,0.05); padding:12px; border-radius:15px; border:1px solid #333;">
                <p style="font-size:11px; color:var(--gold); font-weight:bold;">🏦 โอนเข้าบัญชี กสิกรไทย: 035-8-56762-2</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=0358567622" style="width:100px; margin-top:10px; border:2px solid #fff; border-radius:10px;">
            </div>
            
            <div style="border:2px dashed var(--gold); padding:15px; border-radius:15px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:12px; color:var(--gold); font-weight:600;">📸 กดแนบสลิปโอนเงินที่นี่</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:100px; margin:10px auto; border-radius:8px;">
            </div>
            
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:15px; border-radius:15px;">ยืนยันและส่งคำสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:12px; font-size:12px;">[ ยกเลิกรายการ ]</p>
        </form>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;
    let selectedQty = 1;

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">💥 ${b[1]}</div>
                            <div style="display:flex; gap:5px; align-items:center;">
                                <span class="timer-unit" id="th">00</span> :
                                <span class="timer-unit" id="tm">00</span> :
                                <span class="timer-unit" id="ts">00</span>
                                <button class="buy-now" style="width:100px; padding:6px 0; border-radius:50px; font-size:10px; margin-left:10px;" 
                                    onclick="openOrder('${b[1]}','${b[6]||0}','${b[7]||0}','${b[8]||''}', ${b[9]||0}, 10)">สั่งเลย</button>
                            </div>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            db.sort(() => Math.random() - 0.5); 
            render();
            setInterval(updateProductTimers, 1000);
        } catch(e) { console.error("Load Error:", e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const now = Date.now();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        document.getElementById('productGrid').innerHTML = filtered.map((p) => {
            const priceNormal = parseFloat(p[3] || 0);    
            const pricePromo = parseFloat(p[10] || 0);   
            const expiryDate = p[11] ? new Date(p[11]).getTime() : 0;
            const isPromoActive = pricePromo > 0 && expiryDate > now;
            
            const currentPrice = isPromoActive ? pricePromo : priceNormal;
            const discount = isPromoActive ? Math.round(((priceNormal - pricePromo)/priceNormal)*100) : 0;

            return `
            <div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">
                        ${discount > 0 ? `<span class="badge bg-red">ลด ${discount}%</span>` : ''}
                        ${[p[4], p[5], p[6], p[7]].filter(t => t && t !== '-').map(t => `<span class="badge bg-gold">${t}</span>`).join('')}
                    </div>
                    ${renderMedia(p[1], true)}
                    ${isPromoActive ? `<div class="p-timer-badge" data-expire="${p[11]}">⏳ 00:00:00</div>` : ''}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-desc">${p[2] || ''}</div>
                    <div class="p-price">
                        ${isPromoActive ? `<span class="old-price">฿${priceNormal.toLocaleString()}</span>` : ''}
                        <span class="${isPromoActive ? 'new-price' : ''}">฿${currentPrice.toLocaleString()}</span>
                    </div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${currentPrice}','${p[8]||0}','${p[9]||''}', 0, ${p[12]||10})">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function openOrder(name, price, ship, optStr, disc, limit) {
        selectedQty = 1;
        activeP = { name, basePrice: parseFloat(price), ship: parseFloat(ship), limit: parseInt(limit), optLabel: '' };
        
        const box = document.getElementById('optionBox');
        box.innerHTML = '';
        if(optStr && optStr !== '-') {
            let html = `<label style="font-size:11px; color:var(--gold); font-weight:bold; display:block; margin-bottom:5px;">เลือกตัวเลือกสินค้า:</label>`;
            html += `<select id="pOpt" class="opt-sel" onchange="updatePrice()">`;
            optStr.split(',').forEach(o => {
                let [label, val] = o.includes(':') ? o.split(':') : [o, price];
                html += `<option value="${parseFloat(val) || price}" data-label="${label.trim()}">${label.trim()} (฿${(parseFloat(val) || price).toLocaleString()})</option>`;
            });
            box.innerHTML = html + `</select>`;
        }
        updatePrice();
        openModal('orderModal');
    }

    function updatePrice() {
        const sel = document.getElementById('pOpt');
        const unitPrice = sel ? parseFloat(sel.value) : activeP.basePrice;
        activeP.optLabel = sel ? ` [${sel.options[sel.selectedIndex].getAttribute('data-label')}]` : '';
        activeP.total = (unitPrice * selectedQty) + activeP.ship;
        
        document.getElementById('qtyDisplay').innerText = selectedQty;
        document.getElementById('orderDetail').innerHTML = `
            <div style="font-size:13px; font-weight:600; color:var(--gold);">🛒 ${activeP.name}${activeP.optLabel}</div>
            <div style="font-size:22px; font-weight:800; text-align:center; color:#fff; margin:10px 0;">฿${activeP.total.toLocaleString()}</div>
            <div style="font-size:10px; text-align:center; color:var(--text-dim);">ราคาสินค้า x ${selectedQty} + ค่าส่ง ฿${activeP.ship}</div>
        `;
    }

    function updateQty(v) {
        if(selectedQty + v >= 1 && selectedQty + v <= activeP.limit) {
            selectedQty += v;
            updatePrice();
        }
    }

    // ฟังก์ชันช่วยจัดการ Media
    function renderMedia(url, muted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)$/i);
        return isVid 
            ? `<video src="${url}" ${muted?'autoplay loop muted playsinline':'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>` 
            : `<img src="${url}" loading="lazy" style="width:100%; height:100%; object-fit:cover;">`;
    }

    // ฟังก์ชันส่งฟอร์ม (ปรับปรุงให้รองรับ Apps Script)
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบรูปสลิปเพื่อยืนยันการโอนเงินครับ");
        
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const formData = new URLSearchParams({
                productDetail: `${activeP.name}${activeP.optLabel} | จำนวน: ${selectedQty} | ยอดโอน: ฿${activeP.total}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            });
            try {
                await fetch(APPS_URL, { method: 'POST', body: formData, mode: 'no-cors' });
                alert("🛒 สั่งซื้อสำเร็จ! เราจะรีบดำเนินการตรวจสอบและจัดส่งให้ท่านครับ");
                location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function updateProductTimers() {
        document.querySelectorAll('.p-timer-badge').forEach(el => {
            const diff = new Date(el.getAttribute('data-expire')).getTime() - Date.now();
            if (diff > 0) {
                const h = Math.floor(diff/3600000).toString().padStart(2,'0');
                const m = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                el.innerText = `⏳ หมดใน ${h}:${m}:${s}`;
            } else el.parentElement.parentElement.style.display = 'none';
        });
    }

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }

    function zoom(url) { document.getElementById('zoomContent').innerHTML = renderMedia(url, false); document.getElementById('zoomOverlay').style.display = 'flex'; }
    function closeZoom() { document.getElementById('zoomOverlay').style.display = 'none'; }
    function openModal(id) { const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none', 300); }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }
    
    async function checkShip() {
        const p = prompt("ระบุเบอร์โทรที่ใช้สั่งซื้อ:"); if(!p) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
            const f = rows.find(r => r[0].trim() === p.trim());
            if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nเลขพัสดุ: ${f[3]}`);
            else alert("ไม่พบข้อมูลพัสดุสำหรับเบอร์นี้");
        } catch(e) { alert("ระบบขัดข้อง กรุณาลองใหม่ภายหลัง"); }
    }

    init();
</script>
</body>
</html>
