<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แม่สมคิด STORE | FULL OPTION V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 65px; transition: 0.3s; overflow-x: hidden; }

        /* Header */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index: 1000; padding: 10px; border-bottom: 1px solid var(--gold); }
        #search { width: 100%; padding: 8px 12px 8px 35px; border-radius: 20px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 12px; }
        .theme-btn { position: fixed; top: 12px; right: 15px; z-index: 2001; background: var(--gold-grad); border: none; width: 28px; height: 28px; border-radius: 50%; color: #000; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Banner */
        .banner-box { padding: 8px; margin-top: 5px; }
        .bn-card { border: 1px solid var(--gold); border-radius: 12px; overflow: hidden; display: flex; height: 90px; background: #000; }
        .bn-img { width: 40%; border-right: 1px solid rgba(212,175,55,0.3); position: relative; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .bn-txt { width: 60%; padding: 8px; display: flex; flex-direction: column; justify-content: center; }
        .bn-title { font-size: 12px; font-weight: 600; color: var(--gold); margin-bottom: 4px; }
        .bn-timer { display: flex; gap: 4px; font-size: 10px; margin-bottom: 6px; }

        /* Grid & Cards */
        .sec-title { padding: 10px 15px 5px; font-size: 13px; font-weight: 600; color: var(--gold); }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }

        /* แก้ปัญหาภาพไม่เต็ม */
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: pointer; }
        .media-wrap img, .media-wrap video { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Badges */
        .badge-container { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
        .badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 700; color: #fff; }
        .bg-gold { background: var(--gold-grad); color: #000; }
        .bg-red { background: #ff3b30; }
        .bg-blue { background: #007aff; }
        .bg-green { background: #34c759; }

        /* ข้อมูลสินค้าใต้ภาพ */
        .info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .p-name { font-size: 12px; font-weight: 600; color: var(--gold); margin-bottom: 4px; text-align: center; }
        .p-desc { font-size: 10px; color: var(--text-dim); margin-bottom: 8px; text-align: center; line-height: 1.3; min-height: 26px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .p-price { font-size: 15px; font-weight: 700; color: #fff; margin-top: auto; padding-bottom: 8px; }
        
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 10px; font-weight: 700; font-size: 12px; cursor: pointer; border-radius: 0 0 10px 10px; }

        /* Modal & Forms */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 15px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 300px; padding: 20px; max-height: 85vh; overflow-y: auto; }
        .option-select { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; background: #222; color: var(--gold); border: 1px solid var(--gold); font-size: 12px; }

        /* Contact Buttons */
        .btn-contact { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; text-decoration: none; color: white; font-size: 13px; margin-bottom: 10px; font-weight: 500; }
        .btn-tel { background: #28a745; }
        .btn-line { background: #06c755; }
        .btn-fb { background: #0084ff; }

        /* Nav Footer */
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.98); display: flex; border-top: 1px solid var(--gold); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; text-decoration: none; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 18px; margin-bottom: 4px; }
    </style>
</head>
<body>

<button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>

<header>
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
    </div>
</header>

<div class="banner-box" id="banner"></div>

<div class="sec-title"><i class="fa-solid fa-star"></i> รายการสินค้า (สุ่มลำดับ)</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i>หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i>เช็คพัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment"></i>ติดต่อเรา</div>
</nav>

<div id="contactModal" class="modal">
    <div class="modal-card">
        <h3 style="color:var(--gold); text-align:center; margin-bottom:20px;">ช่องทางติดต่อ</h3>
        <a href="tel:0944159031" class="btn-contact btn-tel"><i class="fa-solid fa-phone"></i> โทรสายด่วน</a>
        <a href="https://line.me/ti/p/YOUR_ID" class="btn-contact btn-line"><i class="fa-brands fa-line"></i> ติดต่อทาง LINE</a>
        <a href="https://m.me/YOUR_PAGE" class="btn-contact btn-fb"><i class="fa-brands fa-facebook-messenger"></i> Messenger</a>
        <p onclick="closeModal('contactModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:10px;">[ ปิดหน้าต่าง ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:10px;">สรุปรายการสั่งซื้อ</h4>
        <div id="orderDetail" style="font-size:11px; background:rgba(212,175,55,0.1); padding:10px; border-radius:8px; margin-bottom:15px; border-left: 4px solid var(--gold);"></div>
        <form id="orderForm">
            <div id="optionContainer"></div>
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required style="width:100%; padding:10px; margin-bottom:8px; border-radius:6px; background:var(--input-bg); color:#fff; border:1px solid #333; font-size:12px;">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required style="width:100%; padding:10px; margin-bottom:8px; border-radius:6px; background:var(--input-bg); color:#fff; border:1px solid #333; font-size:12px;">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required style="width:100%; padding:10px; margin-bottom:12px; border-radius:6px; background:var(--input-bg); color:#fff; border:1px solid #333; font-size:12px; height:60px;"></textarea>
            
            <div style="text-align:center; margin-bottom:15px;">
                <p style="font-size:10px; color:var(--gold);">สแกนจ่าย: กสิกร 035-8-56762-2</p>
                <img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png" style="width:120px; border:2px solid var(--gold); border-radius:8px; margin-top:5px;">
            </div>

            <div style="border:2px dashed var(--gold); padding:10px; border-radius:8px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:11px; color:var(--gold)">📸 คลิกแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:100%; margin-top:8px; border-radius:5px;">
            </div>
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:15px;">ยืนยันการสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:10px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="zoomOverlay" onclick="this.style.display='none'"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    let db = [], activeP = {}, bannerEnd = null;

    // ระบบสุ่ม
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `<div class="bn-card"><div class="bn-img">${renderMedia(b[0], true)}</div><div class="bn-txt"><div class="bn-title">${b[1]}</div><div class="bn-timer">⏳ <span id="th">00</span>:<span id="tm">00</span>:<span id="ts">00</span></div><button class="buy-now" style="width:70px; padding:4px; font-size:10px;" onclick="openOrder('${b[1]}',0,0,'','')">รับสิทธิ์</button></div></div>`;
                setInterval(tick, 1000);
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            shuffle(db); // สุ่มสินค้าทุกครั้งที่เปิด
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        document.getElementById('productGrid').innerHTML = filtered.map(p => {
            let badgeHTML = '';
            if (p[10]) {
                badgeHTML = p[10].split(',').map(t => {
                    const text = t.trim();
                    let colorClass = 'bg-blue';
                    if(text.includes('แนะนำ')) colorClass = 'bg-gold';
                    else if(text.includes('1แถม1')) colorClass = 'bg-red';
                    else if(text.includes('ฟรี')) colorClass = 'bg-green';
                    return `<span class="badge ${colorClass}">${text}</span>`;
                }).join('');
            }

            return `
                <div class="card">
                    <div class="media-wrap" onclick="zoom('${p[1]}')">
                        <div class="badge-container">${badgeHTML}</div>
                        ${renderMedia(p[1], true)}
                    </div>
                    <div class="info">
                        <div class="p-name">${p[0]}</div>
                        <div class="p-desc">${p[2] || ''}</div>
                        <div class="p-price">฿${parseFloat(p[3]).toLocaleString()}</div>
                    </div>
                    <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}','${p[10]||''}')">สั่งซื้อเลย</button>
                </div>
            `;
        }).join('');
    }

    function openOrder(n, p, s, optionsStr, tagsStr) {
        let originalPrice = parseFloat(p);
        let finalPrice = originalPrice;
        let discountDesc = "";

        if (tagsStr && tagsStr.includes('%')) {
            let pct = parseFloat(tagsStr.match(/\d+/)[0]);
            let discount = (originalPrice * pct) / 100;
            finalPrice = originalPrice - discount;
            discountDesc = `<br><span style="color:#ff3b30;">(ลดราคา ${pct}%: -฿${discount})</span>`;
        }

        activeP = { n, p: finalPrice, s: parseFloat(s)||0, tags: tagsStr };
        document.getElementById('orderDetail').innerHTML = `📦 ${n}${discountDesc}<br>💰 ราคา: ฿${finalPrice.toLocaleString()} (ค่าส่ง ฿${activeP.s})`;
        
        const container = document.getElementById('optionContainer');
        container.innerHTML = '';
        if(optionsStr && optionsStr !== '-') {
            const opts = optionsStr.split(',').map(o => o.trim());
            let html = `<select id="pOption" class="option-select">`;
            opts.forEach(opt => html += `<option value="${opt}">${opt}</option>`);
            container.innerHTML = html + `</select>`;
        }
        openModal('orderModal');
    }

    function renderMedia(url, muted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)$/i);
        return isVid ? `<video src="${url}" ${muted?'autoplay loop muted playsinline':'controls autoplay'}></video>` : `<img src="${url}">`;
    }

    function handleFile(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => { 
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            r.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        const opt = document.getElementById('pOption') ? document.getElementById('pOption').value : '-';
        const btn = document.getElementById('submitBtn');
        btn.innerText = "กำลังสั่งซื้อ..."; btn.disabled = true;
        
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.n} [${activeP.tags}] (ตัวเลือก: ${opt})`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    function zoom(url) { document.getElementById('zoomContent').innerHTML = renderMedia(url, false); document.getElementById('zoomOverlay').style.display='flex'; }
    function openModal(id) { const m=document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m=document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none',300); }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }
    async function checkShip() {
        const p = prompt("เบอร์โทรที่สั่งซื้อ:"); if(!p) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
            const f = rows.find(r => r[0] === p);
            if(f) alert(`คุณ ${f[1]}: ${f[2]}\nเลขพัสดุ: ${f[3]}`);
            else alert("ไม่พบข้อมูล");
        } catch(e) {}
    }
    init();
</script>
</body>
</html>
