/* =====================================================
   QUICK INGREDIENT
===================================================== */

function toggleIngredient(button, ingredient){

    button.classList.toggle("active");

    const textarea =
        document.getElementById("ingredients");

    let current =
        textarea.value
        .split(",")
        .map(x => x.trim())
        .filter(x => x);

    if(button.classList.contains("active")){

        if(!current.includes(ingredient)){
            current.push(ingredient);
        }

    }else{

        current =
            current.filter(
                x => x !== ingredient
            );

    }

    textarea.value =
        current.join(", ");

}


/* =====================================================
   GET INGREDIENTS
===================================================== */

function getIngredients(){

    const value =
        document
        .getElementById("ingredients")
        .value
        .toLowerCase()
        .trim();

    return value
        .split(",")
        .map(x => x.trim())
        .filter(x => x);

}


/* =====================================================
   FIND MENU
===================================================== */

function findMenu(){

    const userIngredients =
        getIngredients();

    const results =
        document.getElementById("results");


    if(userIngredients.length === 0){

        results.innerHTML = `

            <div class="empty">

                🧊
                <br><br>

                ลองเลือกวัตถุดิบด้านบน
                <br>
                หรือพิมพ์วัตถุดิบที่มีได้เลย

            </div>

        `;

        return;

    }


    const matched =
        menus

        .map(menu => {

            let matches = 0;

            menu.ingredients.forEach(item => {

                userIngredients.forEach(user => {

                    if(
                        user.includes(item) ||
                        item.includes(user)
                    ){

                        matches++;

                    }

                });

            });

            return {
                ...menu,
                matches
            };

        })

        .filter(menu => menu.matches > 0)

        .sort(
            (a,b) =>
            b.matches - a.matches
        );


    renderMenus(matched);

}


/* =====================================================
   RANDOM MENU
===================================================== */

function randomMenu(){

    const random =
        menus[
            Math.floor(
                Math.random() * menus.length
            )
        ];

    renderMenus([random]);

}

                    <div class="ingredients">

                        ใช้:
                        ${menu.ingredients.join(", ")}

                    </div>


                    <div class="card-buttons">

                        <button
                            class="cook-btn"
                            onclick="showRecipe('${menu.name}')">

                            👨‍🍳 วิธีทำ

                        </button>


                        <button
                            class="save-btn ${saved ? 'saved':''}"
                            onclick="toggleFavorite('${menu.name}',this)">

                            ${saved ? "❤️":"♡"}

                        </button>

                    </div>

                </div>

            </div>

        `;

    });


    html += `</div>`;

    results.innerHTML = html;

}


/* =====================================================
   SHOW RECIPE
===================================================== */

function showRecipe(name){

    const menu =
        menus.find(
            x => x.name === name
        );

    if(!menu) return;


    document
        .getElementById("modalTitle")
        .innerText =
        menu.emoji + " " + menu.name;


    document
        .getElementById("modalDescription")
        .innerText =
        menu.description;


    let html = "";


    menu.steps.forEach(
        (step,index) => {

            html += `

                <div class="step">

                    <b>${index+1}.</b>

                    ${step}

                </div>

            `;

        }
    );


    document
        .getElementById("modalSteps")
        .innerHTML =
        html;


    document
        .getElementById("modal")
        .style.display =
        "block";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document
        .getElementById("modal")
        .style.display =
        "none";

}


window.onclick =
function(event){

    const modal =
        document.getElementById("modal");

    if(event.target === modal){

        closeModal();

    }

};


/* =====================================================
   FAVORITES
===================================================== */

function getFavorites(){

    return JSON.parse(
        localStorage.getItem(
            "phaendinFavorites"
        ) || "[]"
    );

}


function isFavorite(name){

    return getFavorites()
        .includes(name);

}


function toggleFavorite(name,button){

    let favorites =
        getFavorites();


    if(favorites.includes(name)){

        favorites =
            favorites.filter(
                x => x !== name
            );

        button.innerText = "♡";

        button.classList.remove("saved");

    }else{

        favorites.push(name);

        button.innerText = "❤️";

        button.classList.add("saved");

    }


    localStorage.setItem(
        "phaendinFavorites",
        JSON.stringify(favorites)
    );

}


/* =====================================================
   SHOW FAVORITES
===================================================== */

function showFavorites(){

    const results =
        document.getElementById("results");

    const favoritesBox =
        document.getElementById("favorites");


    const favorites =
        getFavorites();


    results.style.display =
        "none";

    favoritesBox.classList.add("show");


    let list =
        menus.filter(
            menu =>
            favorites.includes(menu.name)
        );


    let html = `

        <button
            class="back-btn"
            onclick="hideFavorites()">

            ← กลับไปหาเมนู

        </button>

        <div class="result-title">

            ❤️ เมนูโปรด

        </div>

    `;


    if(!list.length){

        html += `

            <div class="empty">

                ❤️
                <br><br>

                ยังไม่มีเมนูโปรด

                <br>

                กด ♡ บนเมนูที่ชอบได้เลย

            </div>

        `;

    }else{

        html += `<div class="menu-grid">`;


        list.forEach(menu => {

            html += `

                <div class="card">

                    <div class="food-img">

                        ${menu.emoji}

                    </div>

                    <div class="card-body">

                        <h3>
                            ${menu.name}
                        </h3>

                        <div class="ingredients">

                            ใช้:
                            ${menu.ingredients.join(", ")}

                        </div>

                        <button
                            class="cook-btn"
                            style="width:100%;margin-top:10px"
                            onclick="showRecipe('${menu.name}')">

                            👨‍🍳 ดูวิธีทำ

                        </button>

                    </div>

                </div>

            `;

        });


        html += `</div>`;

    }


    favoritesBox.innerHTML =
        html;

}


function hideFavorites(){

    document
        .getElementById("favorites")
        .classList.remove("show");

    document
        .getElementById("results")
        .style.display =
        "block";

}


</script>
