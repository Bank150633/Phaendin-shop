<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 120px; }
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { position: relative; width: 100%; height: 120px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }
        main { margin-top: 300px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .media img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; height: 20px; overflow: hidden; margin-bottom: 4px; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-top: auto; padding-bottom: 10px; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; border: none; }
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 90%; max-width: 350px; padding: 25px; text-align: center; max-height: 90vh; overflow-y: auto; }
        .summary-box { background: #000; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; font-size: 14px; }
        .confirm-btn { display: block; background: var(--green); color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .pay-info-white { background: #fff; color: #000; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .qr-img { width: 160px; height: 160px; margin: 10px auto; display: block; }
        .opt-select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; background: #222; color: #fff; border: 1px solid #444; font-family: 'Kanit'; font-size: 13px; }
        .qty-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; background: #1a1a1a; padding: 8px 12px; border-radius: 8px; }
        .qty-btn { width: 30px; height: 30px; background: var(--pill); color: var(--gold); border: 1px solid #444; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide" id="bannerContent"></div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดสินค้า...</div>
    <div id="main-label" class="section-label" style="display:none;">📦 รายการสินค้า</div>
    <div class="grid" id="main-list"></div>
</main>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:10px;">ยืนยันการสั่งซื้อ</h3>
        <div id="orderSummary" class="summary-box"></div>
        <a href="#" id="finalOrderBtn" target="_blank" class="confirm-btn">แจ้งโอนและส่งสลิป</a>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:#777; font-size:12px; cursor:pointer;">ย้อนกลับ</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], curCat = 'all';
    let currentData = { name: '', basePrice: 0, ship: 0, qty: 1, options: '' };

    async function init() {
        try {
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const b = textB.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()))[0];
            if(b) document.getElementById('bannerContent').innerHTML = `<img src="${b[0]}">`;

            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            dbAll = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat));
        document.getElementById('main-list').innerHTML = filt.map(p => `
            <div class="card">
                <div class="media"><img src="${p[1]}"></div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price-row"><div class="price">฿${p[3]}</div></div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
                </div>
            </div>`).join('');
        
        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function openOrder(name, price, ship, options) {
        currentData = { name, basePrice: parseFloat(price), ship: parseFloat(ship), qty: 1, options };
        updateOrderUI();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function updateOrderUI() {
        let optHTML = "";
        if(currentData.options && currentData.options !== "-") {
            const optArray = currentData.options.split(",");
            optHTML = `<div style="margin-bottom:12px;"><label style="font-size:11px; color:var(--gold);">ตัวเลือก:</label><select class="opt-select" id="selectedOpt" onchange="calculateTotal()">${optArray.map(o => { const [n, p] = o.split(":"); const pr = p ? p.trim() : currentData.basePrice; return `<option value="${pr}" data-name="${n.trim()}">${n.trim()} (฿${pr})</option>`; }).join('')}</select></div>`;
        }

        document.getElementById('orderSummary').innerHTML = `
            <div class="pay-info-white">
                <p style="font-size:11px; font-weight:bold; color:#666;">SCAN TO PAY (PromptPay)</p>
                <img src="https://i.ibb.co/6R2N7v7D/image.png" class="qr-img">
                <div style="text-align:center; border-top:1px dashed #ccc; padding-top:10px; margin-top:5px;">
                    <b style="color:#003d6b; font-size:13px;">กสิกรไทย (K-Bank)</b><br>
                    <b style="font-size:18px; letter-spacing:1px;">xxx-x-x6762-x</b><br>
                    <p style="font-size:13px; font-weight:600;">นาย วัชระ ชันสิน</p>
                </div>
            </div>
            ${optHTML}
            <div class="qty-row"><span>จำนวน:</span><div><button class="qty-btn" onclick="changeQty(-1)">-</button><span id="displayQty" style="margin:0 15px; font-weight:bold;">1</span><button class="qty-btn" onclick="changeQty(1)">+</button></div></div>
            <div id="totalBox"></div>`;
        calculateTotal();
    }

    function changeQty(n) { currentData.qty = Math.max(1, currentData.qty + n); document.getElementById('displayQty').innerText = currentData.qty; calculateTotal(); }

    function calculateTotal() {
        const optEl = document.getElementById('selectedOpt');
        const pUnit = optEl ? parseFloat(optEl.value) : currentData.basePrice;
        const oName = optEl ? optEl.options[optEl.selectedIndex].getAttribute('data-name') : '';
        const totalP = pUnit * currentData.qty;
        const total = totalP + currentData.ship;

        document.getElementById('totalBox').innerHTML = `
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>ยอดสินค้า:</span><span>฿${totalP.toLocaleString()}</span></div>
            <div style="display:flex; justify-content:space-between; font-size:13px;"><span>ค่าจัดส่ง:</span><span>${currentData.ship===0?'ส่งฟรี':'฿'+currentData.ship}</span></div>
            <div style="display:flex; justify-content:space-between; font-size:18px; font-weight:bold; color:var(--gold); margin-top:10px; border-top:1px solid #333; padding-top:10px;"><span>ยอดรวม:</span><span>฿${total.toLocaleString()}</span></div>`;

        // เชื่อมโยง Google Form ด้วยลิงก์ที่คุณส่งมา
        const fURL = "https://docs.google.com/forms/d/e/1FAIpQLScbfnx4Vgo4skn8irT-1c6GOG9wWBnWmafEy9kZjZ5eBUrjPw/viewform";
        const entry = "entry.1053869414"; // เลขจากลิ้งก์ที่คุณส่งมา
        const msg = `[สินค้า: ${currentData.name} ${oName} | จำนวน: ${currentData.qty} | ยอดโอน: ฿${total.toLocaleString()}] - ชื่อลูกค้า: `;
        
        document.getElementById('finalOrderBtn').href = `${fURL}?usp=pp_url&${entry}=${encodeURIComponent(msg)}`;
    }

    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
    init();
</script>
</body>
</html>
