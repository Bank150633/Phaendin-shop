<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- สีพื้นฐานคงเดิม --- */
        :root { 
            --gold: #D4AF37; --gold-light: #F5D76E; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; --header: rgba(0, 0, 0, 0.95); --card: rgba(255, 255, 255, 0.05); 
            --pill: rgba(255, 255, 255, 0.08); --text: #ffffff; --text-dim: #aaa;
            --input-bg: #1a1a1a; --modal-bg: #0d0d0d; --nav-bg: #0a0a0a;
        }
        body.light-mode {
            --bg: #f2f2f7; --header: rgba(255, 255, 255, 0.95); --card: #ffffff; 
            --pill: rgba(0, 0, 0, 0.05); --text: #1c1c1e; --text-dim: #636366;
            --input-bg: #f2f2f7; --modal-bg: #ffffff; --nav-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; transition: background 0.3s, color 0.3s; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-x: hidden; }

        .theme-toggle { position: fixed; top: 12px; right: 15px; z-index: 5001; background: var(--gold-grad); color: #000; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        header { position: fixed; top: 0; width: 100%; background: var(--header); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.1); transition: 0.3s; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 26px; }
        
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(128,128,128,0.2); background: var(--pill); color: var(--text); margin-bottom: 10px; outline: none; font-size: 13px; }
        
        main { margin-top: 140px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid rgba(128,128,128,0.1); overflow: hidden; display: flex; flex-direction: column; }
        .media { width: 100%; aspect-ratio: 1/1; background: #000; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; flex: 1; }
        
        .title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
        .desc { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
        .price { color: var(--gold); font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 700; padding: 8px; border-radius: 10px; border: none; font-size: 12px; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 5000; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 15px; }
        .modal-card { background: var(--modal-bg); border: 1.5px solid var(--gold); border-radius: 20px; width: 100%; max-width: 360px; padding: 20px; text-align: center; max-height: 90vh; overflow-y: auto; color: var(--text); }
        .form-input, .form-select { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid rgba(128,128,128,0.2); border-radius: 10px; color: var(--text); margin-bottom: 10px; font-family: 'Kanit'; font-size: 13px; }
        
        .qr-area { background: #fff; padding: 10px; border-radius: 12px; width: 140px; margin: 10px auto; border: 2px solid var(--gold); }
        .qr-area img { width: 100%; display: block; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--nav-bg); display: flex; border-top: 1.5px solid rgba(212, 175, 55, 0.2); z-index: 2000; }
        .nav-link { color: var(--text-dim); text-decoration: none; font-size: 11px; text-align: center; flex: 1; padding-top: 12px; cursor: pointer; }
        .nav-link i { font-size: 20px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i></button>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:120px 0; color:var(--text-dim);">กำลังโหลด...</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i>หน้าหลัก</a>
    <a onclick="document.getElementById('contactModal').style.display='flex'" class="nav-link"><i class="fa-solid fa-comment-dots"></i>ติดต่อเรา</a>
</nav>

<div id="contactModal" class="modal" onclick="this.style.display='none'">
    <div class="modal-card" onclick="event.stopPropagation()">
        <h4 style="color:var(--gold); margin-bottom:15px;">ติดต่อเจ้าหน้าที่</h4>
        <div style="display: grid; gap: 10px;">
            <a href="tel:0944159031" style="text-decoration:none; color:var(--text); background:var(--pill); padding:15px; border-radius:12px; display:flex; align-items:center; gap:10px;">
                <i class="fa-solid fa-phone" style="color:var(--gold); font-size:24px;"></i> โทรเลย: 094-415-9031
            </a>
            <a href="https://line.me/ti/p/YOUR_ID" target="_blank" style="text-decoration:none; color:var(--text); background:var(--pill); padding:15px; border-radius:12px; display:flex; align-items:center; gap:10px;">
                <i class="fa-brands fa-line" style="color:#06c755; font-size:24px;"></i> Line Official
            </a>
        </div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); margin-bottom:10px;">ยืนยันการสั่งซื้อ</h4>
        <div id="orderSummary" style="background:rgba(128,128,128,0.1); padding:12px; border-radius:12px; margin-bottom:10px; text-align:left; font-size:12px;"></div>
        
        <form id="orderForm">
            <div id="variantArea" style="display:none; text-align:left; margin-bottom:10px;">
                <label style="font-size:11px; color:var(--gold);">เลือกตัวเลือกสินค้า:</label>
                <select id="variantSelect" class="form-select" onchange="updateTotal()"></select>
            </div>

            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="custAddress" class="form-input" rows="2" placeholder="ที่อยู่จัดส่งสินค้า" required></textarea>
            
            <div class="qr-area">
                <img src="https://i.ibb.co/Vp8pXQj/your-qr-code.png">
                <p style="color:#000; font-size:10px; font-weight:bold;">สแกนโอนเงิน</p>
            </div>

            <div id="totalDisplay" style="font-size:18px; font-weight:700; color:var(--gold); margin-bottom:10px;"></div>

            <div style="border: 1px dashed var(--gold); padding: 10px; border-radius: 12px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
                <span id="upTxt" style="color:var(--gold); font-size:12px;">📸 แตะเพื่อแนบสลิป</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:10px; margin-top:8px;">
            </div>
            <button type="submit" id="btnSubmit" class="buy-btn" style="margin-top:10px;">ส่งข้อมูลการสั่งซื้อ</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:var(--text-dim); font-size:11px; cursor:pointer;">ยกเลิก</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], currentItem = {};

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        document.getElementById('themeBtn').innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    if(localStorage.getItem('theme') === 'light') toggleTheme();

    async function init() {
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const text = await res.text();
            dbAll = text.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            document.getElementById('status').style.display = 'none';
            render();
        } catch(e) { document.getElementById('status').innerText = "โหลดไม่สำเร็จ"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const list = dbAll.filter(p => p[0].toLowerCase().includes(q));
        document.getElementById('main-list').innerHTML = list.map(p => `
            <div class="card">
                <div class="media">${getMedia(p[1])}</div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="desc">${p[2] || ''}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
                </div>
            </div>`).join('');
    }

    function getMedia(url) {
        if(!url) return '';
        return url.match(/\.(mp4|webm)$/) ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }

    function openOrder(name, price, ship, opts) {
        currentItem = { name, basePrice: parseFloat(price.replace(/,/g,'')), ship: parseFloat(ship) };
        const vSelect = document.getElementById('variantSelect');
        const vArea = document.getElementById('variantArea');

        if(opts && opts.includes(':')) {
            vArea.style.display = 'block';
            vSelect.innerHTML = opts.split(',').map(o => {
                const [n, p] = o.split(':');
                return `<option value="${p}">${n} (฿${p})</option>`;
            }).join('');
        } else {
            vArea.style.display = 'none';
            vSelect.innerHTML = `<option value="${currentItem.basePrice}">ปกติ</option>`;
        }

        document.getElementById('orderSummary').innerHTML = `<b>สินค้า:</b> ${name}<br><b>ค่าจัดส่ง:</b> ฿${currentItem.ship}`;
        updateTotal();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function updateTotal() {
        const itemP = parseFloat(document.getElementById('variantSelect').value);
        const total = itemP + currentItem.ship;
        document.getElementById('totalDisplay').innerText = `ยอดโอนสุทธิ: ฿${total.toLocaleString()}`;
    }

    function previewSlip(f) {
        if (f.files[0]) {
            const r = new FileReader();
            r.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result;
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            r.readAsDataURL(f.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const b = document.getElementById('btnSubmit');
        const f = document.getElementById('slipFile');
        if(!f.files[0]) return alert("กรุณาแนบสลิป");
        
        b.innerText = "กำลังส่ง..."; b.disabled = true;
        const r = new FileReader();
        r.onload = async function() {
            const sel = document.getElementById('variantSelect');
            const optName = sel.options[sel.selectedIndex].text;
            const payload = { 
                productDetail: `${currentItem.name} [${optName}]`,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: r.result.split(',')[1], mimeType: f.files[0].type
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
                alert("✅ สำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); b.disabled = false; }
        };
        r.readAsDataURL(f.files[0]);
    };

    init();
</script>
</body>
</html>
