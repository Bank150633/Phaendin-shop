<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | PREMIUM STEPPER</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --green-grad: linear-gradient(145deg, #11998e 0%, #38ef7d 100%);
            --fb-grad: linear-gradient(145deg, #00c6ff 0%, #0072ff 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 45px; padding-bottom: 55px; transition: 0.3s; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index: 1000; padding: 10px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .logo-txt { color: var(--gold); font-weight: 600; font-size: 14px; letter-spacing: 1px; }

        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 13px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 30px; height: 30px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }

        .banner-box { padding: 8px; margin-top: 5px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; display: block; height: 180px; background: #000; position: relative; }
        .bn-img { width: 100%; height: 100%; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; background: linear-gradient(to top, rgba(0,0,0,1) 0%, transparent 100%); }
        .bn-title { font-size: 14px; font-weight: 600; color: var(--gold); }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; background: #000; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 2px; z-index: 5; }
        .badge { font-size: 7px; padding: 1px 4px; border-radius: 3px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .bg-red { background: var(--red-grad); }
        .bg-gold { background: var(--gold-grad); color: #000; }

        .info { padding: 4px; text-align: center; flex-grow: 1; }
        .p-name { font-size: 9px; font-weight: 500; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 8px; margin-right: 3px; }
        .new-price { color: #ff416c; }

        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 5px 0; font-weight: 700; font-size: 9px; cursor: pointer; border-radius: 0 0 8px 8px; }

        /* ปรับ Modal บีบให้เล็กลง */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; padding: 5px; }
        .modal.show { display: flex; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 300px; padding: 10px; max-height: 95vh; overflow-y: auto; }
        
        .input-slim { width: 100%; padding: 6px; margin-bottom: 4px; border-radius: 6px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 11px; outline: none; }
        .stepper-wrap { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 8px; margin-bottom: 6px; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 8px; }
        .nav-tab i { font-size: 16px; margin-bottom: 2px; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div class="logo-txt">PHAENDIN STORE</div>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
</div>

<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center;">
        <h4 style="color:var(--gold); margin-bottom:10px; font-size:14px;">ติดต่อเรา</h4>
        <a href="https://m.me/YOUR_PAGE_NAME" style="display:block; background:var(--fb-grad); color:#fff; padding:8px; border-radius:6px; text-decoration:none; margin-bottom:6px; font-size:12px;"><i class="fa-brands fa-facebook-messenger"></i> Messenger Page</a>
        <a href="https://line.me/ti/p/YOUR_ID" style="display:block; background:#06c755; color:#fff; padding:8px; border-radius:6px; text-decoration:none; margin-bottom:6px; font-size:12px;"><i class="fa-brands fa-line"></i> Line OA</a>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:8px; border-radius:6px; text-decoration:none; margin-bottom:6px; font-size:12px;"><i class="fa-solid fa-phone"></i> โทรสายด่วน</a>
        <p onclick="closeModal('contactModal')" style="color:var(--text-dim); cursor:pointer; font-size:10px; margin-top:5px;">[ ปิด ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:5px; font-size:13px;">ยืนยันสั่งซื้อ</h4>
        <div id="orderDetail" style="background:rgba(212,175,55,0.1); padding:6px; border-radius:8px; margin-bottom:6px; border:1px solid var(--gold); font-size:10px;"></div>
        <form id="orderForm">
            <div id="optionBox"></div>
            <div class="stepper-wrap">
                <span style="font-size:10px; color:var(--gold);">จำนวน:</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button type="button" onclick="updateQty(-1)" style="width:20px; height:20px; border-radius:50%; border:1px solid var(--gold); background:none; color:var(--gold);">-</button>
                    <span id="qtyDisplay" style="color:#fff; font-weight:bold;">1</span>
                    <button type="button" onclick="updateQty(1)" style="width:20px; height:20px; border-radius:50%; border:1px solid var(--gold); background:none; color:var(--gold);">+</button>
                </div>
            </div>
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:40px;"></textarea>
            
            <div style="text-align:center; padding:4px; background:rgba(255,255,255,0.03); border-radius:8px; margin-bottom:5px;">
                <p style="font-size:9px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:70px; margin-top:2px; border:1px solid #fff;">
            </div>

            <div style="border:1px dashed var(--gold); padding:5px; border-radius:8px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:9px; color:var(--gold);">📸 แนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:50px; margin:2px auto; border-radius:4px;">
            </div>

            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:8px; border-radius:8px; padding:8px 0; font-size:11px;">ยืนยันสั่งซื้อสินค้า</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:5px; font-size:9px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, selectedQty = 1;

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt"><div class="bn-title">🔥 ${b[1]}</div></div>
                    </div>`;
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            // --- หัวใจสำคัญ: สุ่มเรียงลำดับใหม่ทุกครั้งที่รีเฟรช ---
            db.sort(() => Math.random() - 0.5);

            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        document.getElementById('productGrid').innerHTML = filtered.map((p) => {
            let pName = p[0], pImg = p[1], pPrice = parseFloat(p[3]||0);
            let pPromo = parseFloat(p[10]||0), pDiscPercent = 0;

            // ตรวจสอบส่วนลดจาก Badge หรือคำนวณจากราคาโปรโมชั่น
            [p[4], p[5], p[6], p[7]].forEach(t => { if(t && t.includes('%')) pDiscPercent = parseInt(t); });
            if(pPromo > 0) pDiscPercent = Math.round(((pPrice - pPromo) / pPrice) * 100);

            let currentPrice = pPromo > 0 ? pPromo : (pDiscPercent > 0 ? pPrice * (1 - (pDiscPercent/100)) : pPrice);

            return `
            <div class="card">
                <div class="media-wrap">
                    <div class="badge-container">
                        ${pDiscPercent > 0 ? `<span class="badge bg-red">ลด ${pDiscPercent}%</span>` : ''}
                        ${p[4] && p[4] !== '-' && !p[4].includes('%') ? `<span class="badge bg-gold">${p[4]}</span>` : ''}
                    </div>
                    ${renderMedia(pImg, true)}
                </div>
                <div class="info">
                    <div class="p-name">${pName}</div>
                    <div class="p-price">
                        ${currentPrice < pPrice ? `<span class="old-price">฿${pPrice.toLocaleString()}</span>` : ''}
                        <span class="new-price">฿${currentPrice.toLocaleString()}</span>
                    </div>
                </div>
                <button class="buy-now" onclick="openOrder('${pName}', ${pPrice}, ${p[8]||0}, '${p[9]||''}', ${pDiscPercent})">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function openOrder(n, p, s, opt, disc) {
        selectedQty = 1;
        activeP = { name: n, pNormal: p, ship: parseFloat(s), disc: disc, total: 0 };
        document.getElementById('qtyDisplay').innerText = selectedQty;
        updateOrderPrice();
        openModal('orderModal');
    }

    function updateQty(v) {
        if(selectedQty + v >= 1) {
            selectedQty += v;
            document.getElementById('qtyDisplay').innerText = selectedQty;
            updateOrderPrice();
        }
    }

    function updateOrderPrice() {
        let discPrice = activeP.disc > 0 ? activeP.pNormal * (1 - (activeP.disc/100)) : activeP.pNormal;
        activeP.total = (discPrice * selectedQty) + activeP.ship;
        document.getElementById('orderDetail').innerHTML = `
            <b>${activeP.name}</b><br>
            ราคา: ฿${discPrice.toLocaleString()} x ${selectedQty} (+ส่ง ฿${activeP.ship})<br>
            <span style="font-size:14px; color:#ff416c;">ยอดรวมโอน: ฿${activeP.total.toLocaleString()}</span>
        `;
    }

    function renderMedia(u, m) { return u.match(/\.(mp4|webm|mov)$/i) ? `<video src="${u}" ${m?'autoplay loop muted playsinline':'controls'}></video>` : `<img src="${u}">`; }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; document.getElementById(id).classList.remove('show'); }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function handleFile(i) { if(i.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(i.files[0]); } }
    
    // ส่งข้อมูลสั่งซื้อ
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name} | จำนวน: ${selectedQty} | ยอดโอน: ฿${activeP.total}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    async function checkShip() {
        const p = prompt("เบอร์โทรที่ใช้สั่งซื้อ:"); if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const f = rows.find(r => r[0] === p);
        if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nพัสดุ: ${f[3]}`);
        else alert("ไม่พบข้อมูล");
    }

    init();
</script>
</body>
</html>
