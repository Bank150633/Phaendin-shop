<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --green: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 1. แก้ฟุตเตอร์หาย/ทับ: ดันพื้นหลังขึ้นไปให้พ้นปุ่ม */
        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            padding-bottom: 200px !important; /* ดันขึ้นมาสูงๆ เลยครับ */
        }

        /* 2. ส่วนหัว: ปรับให้คงที่และไม่บังสินค้า */
        header { 
            position: sticky; /* เปลี่ยนจาก fixed เป็น sticky เพื่อความเสถียร */
            top: 0; 
            width: 100%; 
            background: #000; 
            z-index: 999; 
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 30px; }
        .banner-container { padding: 0 12px; margin-bottom: 10px; }
        .banner-box { 
            width: 100%; 
            height: 140px; 
            background: #111; 
            border-radius: 12px; 
            border: 1px solid var(--gold);
            overflow: hidden;
        }
        #bannerImg { width: 100%; height: 100%; object-fit: cover; }

        /* ค้นหา */
        .search-box { padding: 0 12px; }
        #search { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            background: #111; 
            border: 1px solid #333; 
            color: #fff;
        }

        /* 3. รายการสินค้า: ไม่ต้องใช้ margin-top แล้วเพราะใช้ sticky */
        main { padding: 10px 12px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }
        .card { 
            background: var(--card); 
            border-radius: 12px; 
            border: 1px solid #222; 
            overflow: hidden;
        }
        .media-box { width: 100%; aspect-ratio: 1/1; cursor: pointer; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; }
        .price { color: var(--gold); font-size: 18px; font-weight: bold; }
        .buy-btn { 
            background: var(--gold); 
            color: #000; 
            text-align: center; 
            padding: 8px; 
            border-radius: 6px; 
            margin-top: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        /* 4. ฟุตเตอร์: ล็อคตายตัวหน้าจอ (Fixed) */
        .footer-btn { 
            position: fixed; 
            bottom: 25px; 
            left: 5%; 
            width: 90%; 
            background: var(--green); 
            color: #fff; 
            padding: 18px; 
            border-radius: 50px; 
            text-align: center; 
            font-weight: bold; 
            z-index: 9999 !important; /* ต้องอยู่บนสุดเท่านั้น */
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            text-decoration: none;
            display: block;
        }

        /* Modal ดูรูป */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 10000; 
            align-items: center; justify-content: center; 
        }
        .modal-content { max-width: 90%; max-height: 80%; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-box"><img id="bannerImg" src=""></div>
    </div>
    <div class="search-box"><input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()"></div>
</header>

<main>
    <h3 style="color:var(--gold); margin-bottom:10px; font-size:14px;">📦 รายการสินค้า</h3>
    <div class="grid" id="main-list"></div>
</main>

<a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" class="footer-btn">
    💰 แจ้งโอนเงิน / ยืนยันคำสั่งซื้อ
</a>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let db = [];

    async function loadData() {
        try {
            // โหลดแบนเนอร์
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const bRow = textB.split('\n')[1];
            if(bRow) document.getElementById('bannerImg').src = bRow.split(',')[0].replace(/"/g,'');

            // โหลดสินค้า
            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            db = textP.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const filt = db.filter(p => p[0].toLowerCase().includes(q));
        
        document.getElementById('main-list').innerHTML = filt.map(p => `
            <div class="card">
                <div class="media-box" onclick="showMedia('${p[1]}')">
                    ${p[1].includes('.mp4') ? `<video src="${p[1]}" autoplay loop muted playsinline></video>` : `<img src="${p[1]}">`}
                </div>
                <div class="info">
                    <div style="font-size:13px; height:35px; overflow:hidden; margin-bottom:5px;">${p[0]}</div>
                    <div class="price">฿${p[3]}</div>
                    <div class="buy-btn" onclick="showMedia('${p[1]}')">ดูรายละเอียด</div>
                </div>
            </div>
        `).join('');
    }

    function showMedia(url) {
        const content = url.includes('.mp4') ? `<video src="${url}" controls autoplay class="modal-content"></video>` : `<img src="${url}" class="modal-content">`;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('mediaModal').style.display = 'flex';
    }

    loadData();
</script>
</body>
</html>
