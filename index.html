<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHAENDIN FOOD | ของอร่อยจากทั่วไทย</title>

<meta name="description"
      content="PHAENDIN FOOD รวมของอร่อย น้ำพริก ขนม ของฝาก และอาหารเด็ดจากทั่วไทย">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Kanit',sans-serif;
    background:#f6f7f9;
    color:#222;
}

button,
input{
    font-family:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    border-bottom:1px solid #eee;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:700;
    color:#b91c1c;
    white-space:nowrap;
}

.logo span{
    color:#222;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    border:1px solid #ddd;
    border-radius:30px;
    padding:11px 18px;
    font-size:15px;
    outline:none;
    background:#f7f7f7;
}

.search input:focus{
    border-color:#dc2626;
    background:#fff;
}

.cart-btn{
    border:0;
    background:#111;
    color:#fff;
    border-radius:25px;
    padding:10px 16px;
    cursor:pointer;
    font-size:14px;
}

.cart-count{
    background:#ef4444;
    padding:1px 6px;
    border-radius:20px;
    margin-left:3px;
}

/* HERO */

.hero{
    max-width:1200px;
    margin:18px auto;
    padding:0 18px;
}

.hero-box{
    min-height:190px;
    border-radius:24px;
    padding:30px;
    background:
      linear-gradient(120deg,#7f1d1d,#dc2626,#f97316);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    overflow:hidden;
}

.hero-text{
    max-width:650px;
}

.hero h1{
    font-size:34px;
    line-height:1.15;
    margin-bottom:8px;
}

.hero p{
    font-size:16px;
    opacity:.9;
}

.hero-btn{
    margin-top:18px;
    border:0;
    background:#fff;
    color:#b91c1c;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:600;
}

.hero-icon{
    font-size:100px;
    opacity:.18;
}

/* CATEGORY */

.categories{
    max-width:1200px;
    margin:0 auto 18px;
    padding:0 18px;
}

.category-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
}

.category-scroll::-webkit-scrollbar{
    display:none;
}

.category{
    white-space:nowrap;
    border:1px solid #ddd;
    background:#fff;
    padding:8px 15px;
    border-radius:25px;
    cursor:pointer;
    font-size:14px;
}

.category.active{
    background:#b91c1c;
    border-color:#b91c1c;
    color:#fff;
}

/* TOOLBAR */

.toolbar{
    max-width:1200px;
    margin:0 auto 15px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.section-title{
    font-size:22px;
    font-weight:600;
}

.random-btn{
    border:0;
    background:#111;
    color:#fff;
    border-radius:22px;
    padding:9px 16px;
    cursor:pointer;
}

.random-btn:hover{
    opacity:.85;
}

/* PRODUCTS */

.products{
    max-width:1200px;
    margin:auto;
    padding:0 18px 40px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    border:1px solid #eee;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.product-img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#eee;
}

.card-body{
    padding:10px;
}

.tag{
    display:inline-block;
    background:#fee2e2;
    color:#b91c1c;
    font-size:11px;
    padding:3px 7px;
    border-radius:8px;
    margin-bottom:5px;
}

.title{
    font-size:15px;
    font-weight:500;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.province{
    font-size:12px;
    color:#888;
    margin-top:2px;
}

.price-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:7px;
}

.price{
    color:#dc2626;
    font-size:19px;
    font-weight:700;
}

.old-price{
    color:#aaa;
    font-size:11px;
    text-decoration:line-through;
    margin-left:4px;
}

.buy-btn{
    width:100%;
    border:0;
    background:#111;
    color:#fff;
    border-radius:10px;
    padding:8px;
    margin-top:8px;
    cursor:pointer;
}

.buy-btn:hover{
    background:#b91c1c;
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px 10px;
    color:#888;
}

/* CART */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:200;
    display:none;
}

.overlay.show{
    display:block;
}

.cart-panel{
    position:absolute;
    right:0;
    top:0;
    height:100%;
    width:min(420px,94%);
    background:#fff;
    padding:20px;
    overflow-y:auto;
}

.cart-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
}

.cart-item{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.cart-item img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:10px;
}

.cart-info{
    flex:1;
}

.cart-name{
    font-size:14px;
}

.cart-price{
    color:#dc2626;
    font-weight:600;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:5px;
}

.qty button{
    border:0;
    background:#eee;
    width:25px;
    height:25px;
    border-radius:6px;
    cursor:pointer;
}

.remove{
    border:0;
    background:none;
    color:#999;
    cursor:pointer;
}

.cart-total{
    margin-top:20px;
    padding-top:15px;
    border-top:2px solid #222;
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:600;
}

.checkout{
    width:100%;
    margin-top:15px;
    border:0;
    background:#b91c1c;
    color:#fff;
    padding:12px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

/* ORDER MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#fff;
    width:min(500px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:4px;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    font-size:14px;
    outline:none;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.submit-order{
    width:100%;
    border:0;
    background:#16a34a;
    color:#fff;
    padding:12px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

/* FOOTER */

footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:25px 15px;
    font-size:13px;
}

/* MOBILE */

@media(max-width:900px){

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:650px){

    .header-inner{
        flex-wrap:wrap;
    }

    .logo{
        font-size:21px;
    }

    .search{
        order:3;
        flex-basis:100%;
    }

    .hero-box{
        min-height:170px;
        padding:22px;
    }

    .hero h1{
        font-size:27px;
    }

    .hero-icon{
        display:none;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        padding-left:12px;
        padding-right:12px;
    }

    .categories{
        padding-left:12px;
        padding-right:12px;
    }

    .toolbar{
        padding-left:12px;
        padding-right:12px;
    }

    .section-title{
        font-size:19px;
    }

    .random-btn{
        font-size:12px;
        padding:8px 12px;
    }

    .card-body{
        padding:8px;
    }

    .title{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

}

@media(max-width:380px){

    .products{
        gap:7px;
    }

    .buy-btn{
        font-size:12px;
    }

}
</style>
</head>

<body>

<!-- HEADER -->

<header>
    <div class="header-inner">

        <div class="logo">
            PHAENDIN <span>FOOD</span>
        </div>

        <div class="search">
            <input
                id="searchInput"
                type="search"
                placeholder="ค้นหาน้ำพริก ขนม ของฝาก..."
                oninput="renderProducts()"
            >
        </div>

        <button class="cart-btn" onclick="openCart()">
            🛒 ตะกร้า
            <span id="cartCount" class="cart-count">0</span>
        </button>

    </div>
</header>


<!-- HERO -->

<section class="hero">

    <div class="hero-box">

        <div class="hero-text">

            <h1>
                ของอร่อยจากทั่วไทย
            </h1>

            <p>
                คัดสรรน้ำพริก ขนม ของฝาก และของดีจากแต่ละจังหวัด
            </p>

            <button class="hero-btn" onclick="randomProducts()">
                🎲 สุ่มของอร่อย
            </button>

        </div>

        <div class="hero-icon">
            🍜
        </div>

    </div>

</section>


<!-- CATEGORY -->

<section class="categories">

    <div class="category-scroll">

        <button
            class="category active"
            data-category="ทั้งหมด"
            onclick="setCategory('ทั้งหมด',this)">
            ทั้งหมด
        </button>

        <button
            class="category"
            data-category="น้ำพริก"
            onclick="setCategory('น้ำพริก',this)">
            🌶️ น้ำพริก
        </button>

        <button
            class="category"
            data-category="ขนม"
            onclick="setCategory('ขนม',this)">
            🍪 ขนม
        </button>

        <button
            class="category"
            data-category="ของฝาก"
            onclick="setCategory('ของฝาก',this)">
            🎁 ของฝาก
        </button>

        <button
            class="category"
            data-category="อาหาร"
            onclick="setCategory('อาหาร',this)">
            🍜 อาหาร
        </button>

        <button
            class="category"
            data-category="เครื่องดื่ม"
            onclick="setCategory('เครื่องดื่ม',this)">
            🥤 เครื่องดื่ม
        </button>

    </div>

</section>


<!-- TOOLBAR -->

<section class="toolbar">

    <div class="section-title">
        สินค้าแนะนำ
    </div>

    <button class="random-btn" onclick="randomProducts()">
        🎲 สุ่มสินค้า
    </button>

</section>


<!-- PRODUCTS -->

<main id="products" class="products"></main>


<!-- CART -->

<div id="cartOverlay" class="overlay">

    <div class="cart-panel">

        <div class="cart-head">

            <h2>🛒 ตะกร้าสินค้า</h2>

            <button class="close" onclick="closeCart()">
                ✕
            </button>

        </div>

        <div id="cartItems"></div>

        <div class="cart-total">

            <span>รวม</span>

            <span id="cartTotal">
                ฿0
            </span>

        </div>

        <button
            class="checkout"
            onclick="openOrder()">
            ดำเนินการสั่งซื้อ
        </button>

    </div>

</div>


<!-- ORDER MODAL -->

<div id="orderModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>📦 ข้อมูลจัดส่ง</h2>

            <button
                class="close"
                onclick="closeOrder()">
                ✕
            </button>

        </div>

        <form onsubmit="submitOrder(event)">

            <div class="form-group">

                <label>
                    ชื่อผู้รับ
                </label>

                <input
                    id="customerName"
                    required
                    placeholder="ชื่อ-นามสกุล">

            </div>

            <div class="form-group">

                <label>
                    เบอร์โทร
                </label>

                <input
                    id="customerPhone"
                    type="tel"
                    required
                    placeholder="08xxxxxxxx">

            </div>

            <div class="form-group">

                <label>
                    ที่อยู่จัดส่ง
                </label>

                <textarea
                    id="customerAddress"
                    required
                    placeholder="บ้านเลขที่ ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์"></textarea>

            </div>

            <button
                class="submit-order"
                type="submit">

                ยืนยันการสั่งซื้อ

            </button>

        </form>

    </div>

</div>


<!-- FOOTER -->

<footer>

    © 2026 PHAENDIN FOOD
    <br>
    ของอร่อยจากทั่วไทย

</footer>


<script>

/* ==========================================
   ข้อมูลสินค้า
   ตอนนี้ใช้ข้อมูลตัวอย่าง
   ภายหลังจะเปลี่ยนเป็น Google Sheets
========================================== */

const products = [

    {
        id:1,
        title:"น้ำพริกปลาร้าทรงเครื่อง",
        category:"น้ำพริก",
        province:"อุบลราชธานี",
        price:89,
        oldPrice:120,
        image:"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:2,
        title:"หมูฝอยกรอบ สูตรโบราณ",
        category:"ของฝาก",
        province:"เชียงใหม่",
        price:159,
        oldPrice:199,
        image:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:3,
        title:"ข้าวแต๋นน้ำแตงโม",
        category:"ขนม",
        province:"ลำปาง",
        price:79,
        oldPrice:99,
        image:"https://images.unsplash.com/photo-1606312619070-d48b4c652a52?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:4,
        title:"น้ำพริกกากหมูแซ่บๆ",
        category:"น้ำพริก",
        province:"นครราชสีมา",
        price:99,
        oldPrice:129,
        image:"https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:5,
        title:"กล้วยฉาบหวานกรอบ",
        category:"ขนม",
        province:"พิษณุโลก",
        price:69,
        oldPrice:89,
        image:"https://images.unsplash.com/photo-1621939514649-280e2aa4c3a3?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:6,
        title:"ปลาส้มทอดพร้อมทาน",
        category:"อาหาร",
        province:"ยโสธร",
        price:129,
        oldPrice:159,
        image:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:7,
        title:"กาแฟคั่วหอมจากดอย",
        category:"เครื่องดื่ม",
        province:"เชียงราย",
        price:149,
        oldPrice:189,
        image:"https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=800&q=80"
    },

    {
        id:8,
        title:"มะม่วงอบแห้ง",
        category:"ของฝาก",
        province:"เพชรบุรี",
        price:109,
        oldPrice:139,
        image:"https://images.unsplash.com/photo-1599909533730-f9d5d5c2f7d3?auto=format&fit=crop&w=800&q=80"
    }

];


/* ==========================================
   ตัวแปรระบบ
========================================== */

let currentCategory = "ทั้งหมด";

let cart = [];

let randomMode = false;


/* ==========================================
   แสดงสินค้า
========================================== */

function renderProducts(){

    const container =
        document.getElementById("products");

    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    let list = products.filter(product => {

        const categoryOK =
            currentCategory === "ทั้งหมด" ||
            product.category === currentCategory;

        const searchOK =
            !search ||
            product.title.toLowerCase().includes(search) ||
            product.province.toLowerCase().includes(search);

        return categoryOK && searchOK;

    });


    if(randomMode){

        list = [...list]
            .sort(() => Math.random() - 0.5)
            .slice(0,3);

        randomMode = false;

    }


    if(list.length === 0){

        container.innerHTML = `
            <div class="empty">
                ไม่พบสินค้าที่ค้นหา
            </div>
        `;

        return;

    }


    container.innerHTML =
        list.map(product => `

            <div class="card">

                <img
                    class="product-img"
                    src="${product.image}"
                    alt="${product.title}"
                    loading="lazy"
                >

                <div class="card-body">

                    <span class="tag">
                        ${product.category}
                    </span>

                    <div class="title"
                         title="${product.title}">
                        ${product.title}
                    </div>

                    <div class="province">
                        📍 ${product.province}
                    </div>

                    <div class="price-row">

                        <div>

                            <span class="price">
                                ฿${product.price}
                            </span>

                            <span class="old-price">
                                ฿${product.oldPrice}
                            </span>

                        </div>

                    </div>

                    <button
                        class="buy-btn"
                        onclick="addToCart(${product.id})">

                        🛒 เพิ่มลงตะกร้า

                    </button>

                </div>

            </div>

        `).join("");

}


/* ==========================================
   เลือกหมวดหมู่
========================================== */

function setCategory(category,button){

    currentCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderProducts();

}


/* ==========================================
   สุ่มสินค้า 1-3 ชิ้น
========================================== */

function randomProducts(){

    randomMode = true;

    renderProducts();

    window.scrollTo({
        top:document.querySelector(".toolbar").offsetTop - 70,
        behavior:"smooth"
    });

}


/* ==========================================
   CART
========================================== */

function addToCart(id){

    const product =
        products.find(p => p.id === id);

    if(!product) return;


    const existing =
        cart.find(item => item.id === id);


    if(existing){

        existing.qty++;

    }else{

        cart.push({
            ...product,
            qty:1
        });

    }


    updateCart();

    openCart();

}


function updateCart(){

    const count =
        cart.reduce(
            (sum,item) => sum + item.qty,
            0
        );


    document
        .getElementById("cartCount")
        .textContent = count;


    renderCart();

}


function renderCart(){

    const container =
        document.getElementById("cartItems");


    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty">
                ยังไม่มีสินค้าในตะกร้า
            </div>
        `;

        document
            .getElementById("cartTotal")
            .textContent = "฿0";

        return;

    }


    container.innerHTML =
        cart.map(item => `

            <div class="cart-item">

                <img
                    src="${item.image}"
                    alt="${item.title}"
                >

                <div class="cart-info">

                    <div class="cart-name">
                        ${item.title}
                    </div>

                    <div class="cart-price">
                        ฿${item.price}
                    </div>

                    <div class="qty">

                        <button
                            onclick="changeQty(${item.id},-1)">
                            −
                        </button>

                        <span>
                            ${item.qty}
                        </span>

                        <button
                            onclick="changeQty(${item.id},1)">
                            +
                        </button>

                        <button
                            class="remove"
                            onclick="removeFromCart(${item.id})">
                            ลบ
                        </button>

                    </div>

                </div>

            </div>

        `).join("");


    const total =
        cart.reduce(
            (sum,item) =>
                sum + item.price * item.qty,
            0
        );


    document
        .getElementById("cartTotal")
        .textContent =
        "฿" + total.toLocaleString();

}


function changeQty(id,amount){

    const item =
        cart.find(item => item.id === id);

    if(!item) return;


    item.qty += amount;


    if(item.qty <= 0){

        cart =
            cart.filter(item => item.id !== id);

    }


    updateCart();

}


function removeFromCart(id){

    cart =
        cart.filter(item => item.id !== id);

    updateCart();

}


/* ==========================================
   CART PANEL
========================================== */

function openCart(){

    document
        .getElementById("cartOverlay")
        .classList.add("show");

    renderCart();

}


function closeCart(){

    document
        .getElementById("cartOverlay")
        .classList.remove("show");

}


/* ==========================================
   ORDER
========================================== */

function openOrder(){

    if(cart.length === 0){

        alert("กรุณาเลือกสินค้าก่อน");

        return;

    }


    closeCart();

    document
        .getElementById("orderModal")
        .classList.add("show");

}


function closeOrder(){

    document
        .getElementById("orderModal")
        .classList.remove("show");

}


function submitOrder(event){

    event.preventDefault();


    const name =
        document
        .getElementById("customerName")
        .value;

    const phone =
        document
        .getElementById("customerPhone")
        .value;

    const address =
        document
        .getElementById("customerAddress")
        .value;


    let orderText =
        "รายการสั่งซื้อ\n\n";


    cart.forEach(item => {

        orderText +=
            `${item.title} x ${item.qty} = ฿${item.price * item.qty}\n`;

    });


    const total =
        cart.reduce(
            (sum,item) =>
                sum + item.price * item.qty,
            0
        );


    orderText +=
        `\nรวม ฿${total.toLocaleString()}`;

    orderText +=
        `\n\nชื่อ: ${name}`;

    orderText +=
        `\nโทร: ${phone}`;

    orderText +=
        `\nที่อยู่: ${address}`;


    alert(
        "รับข้อมูลคำสั่งซื้อแล้วครับ\n\n" +
        orderText
    );


    /*
      ขั้นต่อไปเราจะเปลี่ยนส่วนนี้
      ให้ส่งข้อมูลไป Google Sheets
    */


    cart = [];

    updateCart();

    closeOrder();

}


/* ==========================================
   START
========================================== */

renderProducts();

updateCart();

</script>

</body>
</html>
