<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phaendin Rent Pro | แผ่นดินเช่า</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons (Inline Replacement) -->
    <style>
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-morphism { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .active-push:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideInUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-up { animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen pb-20 overflow-x-hidden">

    <!-- Splash/Login Screen -->
    <div id="authScreen" class="fixed inset-0 z-[2000] bg-blue-700 flex flex-col items-center justify-center p-8 transition-all duration-700">
        <div class="mb-8 text-white text-center">
            <div class="w-24 h-24 bg-white/20 rounded-[2.5rem] flex items-center justify-center mx-auto mb-4 backdrop-blur-md">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">PHAENDIN RENT</h1>
            <p class="text-blue-100 mt-2 opacity-80">พื้นที่เช่าของสำหรับคนกันเอง</p>
        </div>
        <div class="w-full max-w-sm bg-white rounded-[2rem] p-8 shadow-2xl">
            <label class="block text-sm font-semibold text-gray-500 mb-2">เข้าใช้งานด้วยชื่อเล่นของคุณ</label>
            <input type="text" id="usernameInput" placeholder="พิมพ์ชื่อเล่นที่นี่..." class="w-full p-4 bg-slate-100 rounded-2xl mb-4 text-center text-xl font-bold border-2 border-transparent focus:border-blue-500 outline-none transition-all">
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-lg active-push shadow-lg shadow-blue-200">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-[100] glass-morphism border-b border-slate-200 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <span class="font-bold text-xl text-slate-800">Phaendin</span>
            </div>
            <div id="userBadge" class="bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-xs font-bold border border-blue-100">
                ...
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-4xl mx-auto p-4">
        <!-- Filter Tabs -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2" id="categoryList">
            <!-- Categories will be injected here -->
        </div>

        <!-- Search Bar -->
        <div class="relative mb-6">
            <input type="text" id="searchBar" oninput="handleSearch()" placeholder="ค้นหาของเช่า..." class="w-full p-4 pl-12 bg-white rounded-2xl shadow-sm border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>

        <!-- Products Grid -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Skeleton Loading -->
            <div class="loading-shimmer h-64 rounded-3xl"></div>
            <div class="loading-shimmer h-64 rounded-3xl"></div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-slate-400">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="mb-4 opacity-50"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
            <p class="font-medium text-lg">ไม่พบสินค้าที่คุณต้องการ</p>
            <button onclick="resetFilters()" class="text-blue-600 font-bold mt-2">ดูสินค้าทั้งหมด</button>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button onclick="toggleModal(true)" class="fixed bottom-6 right-6 w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-2xl flex items-center justify-center active-push z-[1000] ring-4 ring-white">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Add Item Modal -->
    <div id="addModal" class="fixed inset-0 z-[3000] bg-black/60 hidden items-end sm:items-center justify-center transition-opacity duration-300">
        <div class="bg-white w-full max-w-lg rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 animate-up overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">ลงของเช่าใหม่</h2>
                <button onclick="toggleModal(false)" class="p-2 bg-slate-100 rounded-full text-slate-500">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-bold text-slate-500 mb-1 block">ชื่อสินค้า *</label>
                    <input type="text" id="formName" placeholder="เช่น สว่านไร้สาย Makita" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-bold text-slate-500 mb-1 block">ราคาเช่า/วัน (฿) *</label>
                        <input type="number" id="formPrice" placeholder="0" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-sm font-bold text-slate-500 mb-1 block">หมวดหมู่</label>
                        <select id="formCat" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="ทั่วไป">ทั่วไป</option>
                            <option value="ไอที">ไอที</option>
                            <option value="อุปกรณ์ช่าง">อุปกรณ์ช่าง</option>
                            <option value="แคมป์ปิ้ง">แคมป์ปิ้ง</option>
                            <option value="กล้อง">กล้อง</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-sm font-bold text-slate-500 mb-1 block">เบอร์โทร/LINE (สำหรับติดต่อ) *</label>
                    <input type="text" id="formContact" placeholder="08x-xxx-xxxx" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="text-sm font-bold text-slate-500 mb-1 block text-blue-600">ลิงก์รูปภาพ (เว้นว่างได้)</label>
                    <input type="url" id="formImg" placeholder="https://..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button id="submitBtn" onclick="saveToCloud()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg active-push shadow-xl shadow-blue-100 flex items-center justify-center gap-2">
                    <span id="btnText">โพสต์ลงแอปเลย</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'phaendin-pro-v1'; // unique ID for your app data

        let currentUser = null;
        let allProducts = [];
        let activeCategory = 'ทั้งหมด';
        let searchString = '';

        const categories = ['ทั้งหมด', 'ทั่วไป', 'ไอที', 'อุปกรณ์ช่าง', 'แคมป์ปิ้ง', 'กล้อง', 'อื่นๆ'];

        // --- Auth Logic ---
        window.handleLogin = () => {
            const val = document.getElementById('usernameInput').value.trim();
            if(!val) return alert("กรุณาระบุชื่อของคุณ");
            localStorage.setItem('phaendin_user', val);
            initApplication(val);
        };

        async function initApplication(name) {
            currentUser = name;
            document.getElementById('authScreen').style.opacity = '0';
            setTimeout(() => document.getElementById('authScreen').classList.add('hidden'), 700);
            document.getElementById('userBadge').innerText = `👋 สวัสดีคุณ ${name}`;
            
            // Login to Firebase
            await signInAnonymously(auth);
            
            setupRealtimeSync();
            renderCategories();
        }

        // Check for existing login
        window.onload = () => {
            const saved = localStorage.getItem('phaendin_user');
            if(saved) initApplication(saved);
        };

        // --- Category Navigation ---
        function renderCategories() {
            const container = document.getElementById('categoryList');
            container.innerHTML = categories.map(c => `
                <button onclick="setFilter('${c}')" class="category-pill whitespace-nowrap px-6 py-2 rounded-full font-bold text-sm transition-all border ${activeCategory === c ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-slate-500 border-slate-200'}">
                    ${c}
                </button>
            `).join('');
        }

        window.setFilter = (c) => {
            activeCategory = c;
            renderCategories();
            processProducts();
        };

        window.handleSearch = () => {
            searchString = document.getElementById('searchBar').value.toLowerCase();
            processProducts();
        };

        window.resetFilters = () => {
            activeCategory = 'ทั้งหมด';
            searchString = '';
            document.getElementById('searchBar').value = '';
            renderCategories();
            processProducts();
        };

        // --- Data Handling ---
        function setupRealtimeSync() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'items');
            onSnapshot(q, (snapshot) => {
                allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                processProducts();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function processProducts() {
            let filtered = allProducts;
            
            if(activeCategory !== 'ทั้งหมด') {
                filtered = filtered.filter(p => p.category === activeCategory);
            }
            
            if(searchString) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchString));
            }

            // Sort by latest
            filtered.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            
            renderProducts(filtered);
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            const empty = document.getElementById('emptyState');
            
            if(items.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            empty.classList.add('hidden');

            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 relative animate-up group active-push">
                    <div class="aspect-square bg-slate-100 relative">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1581244276891-6bc6127498f1?auto=format&fit=crop&q=60&w=400'}" class="w-full h-full object-cover">
                        <div class="absolute top-2 left-2 bg-blue-600/90 backdrop-blur-sm text-white text-[10px] px-2 py-1 rounded-lg font-bold">
                            ${item.category}
                        </div>
                        ${item.owner === currentUser ? `
                            <button onclick="event.stopPropagation(); deleteItem('${item.id}')" class="absolute top-2 right-2 bg-red-500/90 text-white p-2 rounded-xl">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        ` : ''}
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-sm text-slate-800 truncate">${item.name}</h3>
                        <div class="flex items-baseline gap-1 mt-1">
                            <span class="text-blue-600 font-bold text-lg">฿${Number(item.price).toLocaleString()}</span>
                            <span class="text-[10px] text-slate-400">/วัน</span>
                        </div>
                        <a href="tel:${item.contact}" class="mt-3 w-full bg-slate-900 text-white py-2.5 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                            ติดต่อเช่า
                        </a>
                        <div class="mt-2 text-[8px] text-slate-300 text-right">โพสต์โดย: ${item.owner}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- Operations ---
        window.toggleModal = (show) => {
            const modal = document.getElementById('addModal');
            if(show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        };

        window.saveToCloud = async () => {
            const name = document.getElementById('formName').value.trim();
            const price = document.getElementById('formPrice').value;
            const cat = document.getElementById('formCat').value;
            const contact = document.getElementById('formContact').value.trim();
            const img = document.getElementById('formImg').value.trim();

            if(!name || !price || !contact) return alert("กรุณากรอกข้อมูลที่จำเป็น (*) ให้ครบถ้วน");

            const btn = document.getElementById('submitBtn');
            const text = document.getElementById('btnText');
            
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-slate-400');
            text.innerText = "กำลังจัดเก็บข้อมูล...";

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'items'), {
                    name,
                    price: parseFloat(price),
                    category: cat,
                    contact,
                    img: img || null,
                    owner: currentUser,
                    createdAt: serverTimestamp()
                });
                
                // Reset & Close
                document.getElementById('formName').value = '';
                document.getElementById('formPrice').value = '';
                document.getElementById('formContact').value = '';
                document.getElementById('formImg').value = '';
                toggleModal(false);
                
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                btn.disabled = false;
                btn.classList.replace('bg-slate-400', 'bg-blue-600');
                text.innerText = "โพสต์ลงแอปเลย";
            }
        };

        window.deleteItem = async (id) => {
            if(confirm("คุณต้องการลบรายการเช่านี้ใช่หรือไม่?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'items', id));
                } catch(err) {
                    alert("ไม่สามารถลบได้: " + err.message);
                }
            }
        };

    </script>
</body>
</html>
