<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode { --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 60px; transition: 0.3s; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 5px 15px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; height: 55px; }
        .logo-img { height: 40px; width: auto; }

        /* Banner Style */
        .banner-box { padding: 10px; }
        .bn-card { border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; height: 180px; position: relative; background: #000; }
        .bn-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .bn-content { position: absolute; bottom: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; justify-content: space-between; align-items: center; }

        /* Search */
        .search-wrap { position: relative; padding: 0 10px; margin-bottom: 10px; }
        #search { width: 100%; padding: 10px 10px 10px 40px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); outline: none; }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--gold); }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.2); border-radius: 10px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; }
        .media-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Badges */
        .badge-left { position: absolute; top: 5px; left: 5px; display: flex; flex-direction: column; gap: 3px; z-index: 5; }
        .badge { font-size: 8px; padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: bold; }
        .badge-province { position: absolute; top: 5px; right: 5px; background: var(--gold-grad); color: #000; font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: bold; z-index: 5; }
        
        .info { padding: 6px; text-align: center; flex-grow: 1; }
        .p-name { font-size: 11px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { font-size: 13px; font-weight: bold; }

        .btn-order { width: 100%; background: var(--gold-grad); border: none; padding: 8px 0; font-size: 11px; font-weight: bold; cursor: pointer; color: #000; }

        /* Modal ตามรูป 1205.jpg */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 360px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        
        .multi-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(212,175,55,0.1); }
        .multi-info { flex: 1; }
        .multi-ctrl { display: flex; align-items: center; gap: 15px; }
        .btn-qty { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-val { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

        .summary-box { background: rgba(212,175,55,0.05); padding: 15px; border-radius: 12px; margin: 15px 0; border: 1px dashed var(--gold); }
        .sum-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        .sum-total { border-top: 1px solid #444; margin-top: 8px; padding-top: 8px; font-size: 18px; font-weight: bold; color: var(--gold); }

        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; background: var(--input-bg); color: #fff; border: 1px solid #333; outline: none; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; border-top: 1px solid #333; z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img">
    <div onclick="toggleTheme()" style="color:var(--gold); font-size: 20px;"><i class="fa-solid fa-circle-half-stroke"></i></div>
</header>

<div id="bannerArea"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาสินค้าที่ต้องการ..." oninput="render()">
</div>

<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="alert('ระบบกำลังจัดเตรียมข้อมูล')"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="alert('Line: @phaendin')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h3 style="text-align:center; color:var(--gold); margin-bottom:20px;">สรุปรายการสั่งซื้อ</h3>
        
        <div id="itemContainer"></div>

        <div class="summary-box" id="summaryArea"></div>

        <form id="orderForm">
            <input type="text" id="userName" placeholder="ชื่อ-นามสกุล" required class="input-box">
            <input type="tel" id="userPhone" placeholder="เบอร์โทรศัพท์" required class="input-box">
            <textarea id="userAddr" placeholder="ที่อยู่ในการจัดส่ง" required class="input-box" style="height:80px;"></textarea>
            
            <div style="text-align:center; padding:15px; background:rgba(255,255,255,0.03); border-radius:15px; margin-bottom:15px;">
                <p style="font-size:12px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2</p>
                <p style="font-size:12px; margin-bottom:10px;">ชื่อบัญชี: คุณแผ่นดิน</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:100px; border:3px solid #fff; border-radius:10px;">
            </div>

            <p style="font-size:12px; color:var(--gold); margin-bottom:5px;">แนบสลิปโอนเงิน:</p>
            <input type="file" id="slipFile" accept="image/*" required style="margin-bottom:20px;">

            <button type="submit" id="submitBtn" class="btn-order" style="border-radius:10px; padding:15px; font-size:14px;">ยืนยันและส่งสลิป</button>
            <p onclick="closeModal()" style="text-align:center; margin-top:15px; color:var(--text-dim); cursor:pointer;">[ กลับสู่หน้าหลัก ]</p>
        </form>
    </div>
</div>

<script>
    const SHEET_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let products = [], activeOrder = {};

    async function fetchData() {
        // ดึงแบนเนอร์
        Papa.parse(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Banner`, {
            download: true,
            header: true,
            complete: (results) => {
                const b = results.data[0];
                if(b) {
                    document.getElementById('bannerArea').innerHTML = `
                        <div class="banner-box">
                            <div class="bn-card">
                                <img src="${b['Image URL'] || b[Object.keys(b)[0]]}" class="bn-img">
                                <div class="bn-content">
                                    <div class="bn-title">${b['Title'] || b[Object.keys(b)[1]]}</div>
                                </div>
                            </div>
                        </div>`;
                }
            }
        });

        // ดึงสินค้า (Sheet1/gid=0)
        Papa.parse(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`, {
            download: true,
            header: false,
            complete: (results) => {
                products = results.data.slice(1).filter(r => r[0]); // ตัด Header ออก
                render();
            }
        });
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const html = products.filter(p => p[0].toLowerCase().includes(query)).map((p, idx) => {
            const price = parseFloat(p[3]) || 0;
            const discTag = [p[4],p[5],p[6],p[7]].find(t => t && t.includes('%')) || '';
            return `
                <div class="card">
                    <div class="media-wrap">
                        <div class="badge-left">
                            ${discTag ? `<span class="badge" style="background:var(--red-grad)">${discTag}</span>` : ''}
                            ${p[4] && p[4]!=='-' && !p[4].includes('%') ? `<span class="badge" style="background:var(--gold-grad); color:#000">${p[4]}</span>` : ''}
                        </div>
                        ${p[13] ? `<span class="badge-province">${p[13]}</span>` : ''}
                        <img src="${p[1]}">
                    </div>
                    <div class="info">
                        <div class="p-name">${p[0]}</div>
                        <div class="p-price">฿${price.toLocaleString()}</div>
                    </div>
                    <button class="btn-order" onclick="openOrder(${products.indexOf(p)})">สั่งซื้อ</button>
                </div>
            `;
        }).join('');
        document.getElementById('productGrid').innerHTML = html;
    }

    function openOrder(index) {
        const p = products[index];
        activeOrder = {
            mainName: p[0],
            shipPrice: parseFloat(p[8]) || 0,
            items: []
        };

        const optStr = p[9];
        const container = document.getElementById('itemContainer');
        container.innerHTML = '';

        // แยกรายการสินค้า (บวก-ลบ)
        let options = (optStr && optStr !== '-') ? optStr.split(',') : [p[0] + ":" + p[3]];
        
        options.forEach((opt, i) => {
            let [label, price] = opt.includes(':') ? opt.split(':') : opt.split('=');
            let pVal = parseFloat(price) || parseFloat(p[3]);
            activeOrder.items.push({ label: label.trim(), price: pVal, qty: i === 0 ? 1 : 0 });

            container.innerHTML += `
                <div class="multi-row">
                    <div class="multi-info">
                        <div style="font-size:13px; font-weight:500;">${label.trim()}</div>
                        <div style="color:var(--gold); font-size:12px;">฿${pVal.toLocaleString()}</div>
                    </div>
                    <div class="multi-ctrl">
                        <button type="button" class="btn-qty" onclick="updateQty(${i}, -1)">-</button>
                        <span class="qty-val" id="qty_${i}">${activeOrder.items[i].qty}</span>
                        <button type="button" class="btn-qty" onclick="updateQty(${i}, 1)">+</button>
                    </div>
                </div>`;
        });

        updateSummary();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function updateQty(idx, val) {
        let current = activeOrder.items[idx].qty + val;
        if(current >= 0) {
            activeOrder.items[idx].qty = current;
            document.getElementById(`qty_${idx}`).innerText = current;
            updateSummary();
        }
    }

    function updateSummary() {
        const itemTotal = activeOrder.items.reduce((sum, i) => sum + (i.qty * i.price), 0);
        const totalQty = activeOrder.items.reduce((sum, i) => sum + i.qty, 0);
        const grandTotal = totalQty > 0 ? itemTotal + activeOrder.shipPrice : 0;

        activeOrder.grandTotal = grandTotal;
        activeOrder.totalQty = totalQty;

        document.getElementById('summaryArea').innerHTML = `
            <div class="sum-line"><span>สินค้าทั้งหมด (${totalQty} ชิ้น)</span><span>฿${itemTotal.toLocaleString()}</span></div>
            <div class="sum-line"><span>ค่าจัดส่งบริการด่วน</span><span>฿${activeOrder.shipPrice.toLocaleString()}</span></div>
            <div class="sum-line sum-total"><span>ยอดโอนสุทธิ</span><span>฿${grandTotal.toLocaleString()}</span></div>
        `;
    }

    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        if(activeOrder.totalQty === 0) return alert("กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น");
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "กำลังสั่งซื้อ..."; btn.disabled = true;

        const file = document.getElementById('slipFile').files[0];
        const reader = new FileReader();
        reader.onload = async () => {
            const detailStr = activeOrder.items.filter(i => i.qty > 0).map(i => `${i.label}(${i.qty})`).join(', ');
            const payload = {
                productDetail: `${activeOrder.mainName} | รายการ: ${detailStr} | ยอดโอน: ฿${activeOrder.grandTotal}`,
                customerName: document.getElementById('userName').value,
                customerPhone: document.getElementById('userPhone').value,
                customerAddress: document.getElementById('userAddr').value,
                file: reader.result.split(',')[1]
            };

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ! เจ้าหน้าที่จะรีบดำเนินการครับ");
                location.reload();
            } catch(err) {
                alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
                btn.disabled = false;
            }
        };
        reader.readAsDataURL(file);
    };

    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    fetchData();
</script>
</body>
</html>
