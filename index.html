<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEALTHAI - รวมดีลเด็ด สินค้าลดราคาพิเศษ</title>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'thai-red': '#EF3340',
                        'thai-blue': '#00247D',
                        'thai-bg': '#F8FAFC'
                    },
                    fontFamily: { kanit: ['Kanit', 'sans-serif'] }
                }
            }
        }
    </script>
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-thai-bg text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-thai-blue text-white shadow-lg sticky top-0 z-50">
        <div class="h-2 bg-thai-red w-full"></div>
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilter()">
                <div class="bg-white text-thai-blue p-2 rounded-lg font-black text-2xl shadow">🇹🇭</div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide text-white leading-tight">DEAL<span class="text-thai-red bg-white px-1.5 py-0.5 rounded ml-1 text-xl">THAI</span></h1>
                    <p class="text-xs text-blue-200">รวมดีลเด็ด สินค้าลดแรง คัดมาให้แล้ว</p>
                </div>
            </div>
            <div class="relative w-full md:w-1/2">
                <input type="text" id="searchInput" onkeyup="filterProducts()" 
                       placeholder="ค้นหาสินค้าลดราคา..." 
                       class="w-full pl-10 pr-4 py-2 rounded-full text-gray-800 focus:outline-none focus:ring-2 focus:ring-thai-red border-2 border-white/20 shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="bg-gradient-to-r from-thai-blue via-blue-900 to-thai-blue text-white py-8 px-4 border-b-4 border-thai-red">
        <div class="container mx-auto text-center">
            <span class="bg-thai-red text-white text-xs md:text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wider animate-pulse inline-block mb-3">
                🔥 Flash Sale อัปเดตสดใหม่
            </span>
            <h2 class="text-3xl md:text-5xl font-extrabold mb-2 text-white">มหกรรมสินค้าลดราคาแรง</h2>
            <p class="text-blue-100 text-sm md:text-base max-w-2xl mx-auto">ชี้เป้าของถูก คูปองส่วนลด ส่งตรงจากร้านค้าชั้นนำ</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        <!-- Categories -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-8" id="categoryContainer"></div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>

        <!-- Not Found -->
        <div id="notFound" class="hidden text-center py-12">
            <i class="fa-solid fa-box-open text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-600">ไม่พบสินค้าที่คุณค้นหา</h3>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-thai-blue text-white border-t-4 border-thai-red mt-12">
        <div class="container mx-auto px-4 py-6 text-center text-xs text-blue-300">
            &copy; 2026 DealThai. All rights reserved. 🇹🇭
        </div>
    </footer>

    <!-- Logic -->
    <script>
        // ⚠️ นำ URL Web App จาก Step 2 มาวางในอัญประกาศคู่ด้านล่างนี้
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxqXpc-Q_2TPzyVnfFaInoGldXl-s8Du6XKfcic3lYKUBXy-FkyQaXGtNcbjTSWOUJI/exec";

        let products = [];
        const categories = ["ทั้งหมด", "IT / ไอที", "ของใช้ในบ้าน", "เครื่องใช้ไฟฟ้า"];
        let currentCategory = "ทั้งหมด";

        document.addEventListener("DOMContentLoaded", () => {
            renderCategories();
            fetchProductsFromSheet();
        });

        function fetchProductsFromSheet() {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i><p>กำลังโหลดสินค้าล่าสุด...</p></div>`;

            fetch(SHEET_API_URL)
                .then(response => response.json())
                .then(data => {
                    products = data;
                    renderProducts(products);
                })
                .catch(error => {
                    console.error("Error:", error);
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล (โปรดตรวจสอบ Web App URL)</div>`;
                });
        }

        function renderCategories() {
            const container = document.getElementById("categoryContainer");
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                        class="px-4 py-1.5 rounded-full text-sm font-medium transition shadow-sm ${
                            currentCategory === cat 
                            ? 'bg-thai-red text-white font-bold ring-2 ring-offset-1 ring-thai-red' 
                            : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'
                        }">
                    ${cat}
                </button>
            `).join('');
        }

        function renderProducts(items) {
            const grid = document.getElementById("productGrid");
            const notFound = document.getElementById("notFound");

            if (!items || items.length === 0) {
                grid.innerHTML = "";
                notFound.classList.remove("hidden");
                return;
            }

            notFound.classList.add("hidden");
            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col justify-between group">
                    <div class="relative overflow-hidden">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-44 sm:h-52 object-cover group-hover:scale-105 transition duration-300">
    <div class="flex flex-wrap gap-1 mt-2">
    <span class="bg-red-500 text-white text-xs px-2 py-1 rounded">
        ลด ${item.discount}%
    </span>

    ${item.isFlashSale ? `
    <span class="bg-yellow-400 text-black text-xs px-2 py-1 rounded">
        ⚡ Flash Sale
    </span>` : ""}

    ${item.buy1get1 ? `
    <span class="bg-green-600 text-white text-xs px-2 py-1 rounded">
        🎁 1 แถม 1
    </span>` : ""}
</div>
                        
                    </div>
                    <div class="p-3 sm:p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] sm:text-xs text-gray-400 block mb-1">${item.category}</span>
                            <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 mb-2 group-hover:text-thai-blue transition">
                                ${item.title}
                            </h3>
                        </div>
                        <div class="mt-2">
                            <div class="flex items-baseline space-x-2">
                                <span class="text-lg sm:text-xl font-black text-thai-red">฿${Number(item.salePrice).toLocaleString()}</span>
                                <span class="text-xs text-gray-400 line-through">฿${Number(item.originalPrice).toLocaleString()}</span>
                            </div>
                            <a href="${item.affiliateUrl}" target="_blank" rel="noopener noreferrer" 
                               class="mt-3 w-full bg-thai-blue hover:bg-blue-900 text-white text-center py-2 rounded-lg font-medium text-xs sm:text-sm block shadow transition flex items-center justify-center gap-1">
                                <span>เช็กราคา / สั่งซื้อ</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const searchText = document.getElementById("searchInput").value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCat = currentCategory === "ทั้งหมด" || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchText) || p.category.toLowerCase().includes(searchText);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        function resetFilter() {
            document.getElementById("searchInput").value = "";
            setCategory("ทั้งหมด");
        }
    </script>
</body>
</html>
