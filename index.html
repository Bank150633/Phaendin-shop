<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; }

        /* --- Header & Navigation --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { position: relative; width: 100%; height: 120px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img, .banner-slide video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        /* --- Layout --- */
        main { margin-top: 300px; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }

        /* --- Recommended --- */
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 5px; scrollbar-width: none; }
        .rec-card { min-width: 125px; border-radius: 12px; overflow: hidden; border: 1px solid #222; background: #111; position: relative; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { position: absolute; bottom: 0; width: 100%; background: rgba(212,175,55,0.9); color: #000; font-size: 12px; font-weight: bold; text-align: center; padding: 6px 0; }

        /* --- Product Grid --- */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 8px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; height: 20px; overflow: hidden; margin-bottom: 4px; color: #fff; white-space: nowrap; text-overflow: ellipsis; }
        .description { font-size: 10px; color: #777; height: 32px; overflow: hidden; margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-top: auto; padding-bottom: 10px; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .price-old { color: #555; font-size: 11px; text-decoration: line-through; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 10px; border-radius: 8px; cursor: pointer; border: none; }

        /* --- Floating Button --- */
        .float-pay-btn { position: fixed; bottom: 85px; right: 15px; background: var(--green); color: #fff; padding: 12px 18px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; }
        .float-pay-btn:active { transform: scale(0.9); }

        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
        .nav-link { color: #777; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; }
        .nav-link.active { color: var(--gold); }

        /* --- Modals --- */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 90%; max-width: 350px; padding: 25px; text-align: center; }
        .summary-box { background: #000; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; font-size: 14px; }
        .confirm-btn { display: block; background: var(--green); color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .modal-body img, .modal-body video { max-width: 90%; max-height: 80vh; border-radius: 10px; }

        /* --- Option Select --- */
        .opt-select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; background: #222; color: #fff; border: 1px solid #444; font-family: 'Kanit'; font-size: 13px; outline: none; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide" id="bannerContent"></div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดสินค้า...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<a href="javascript:void(0)" onclick="openOrder('แจ้งโอนเงินทั่วไป', 0, 0, '')" class="float-pay-btn">
    <i class="fa-solid fa-receipt"></i> แจ้งโอนเงิน
</a>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-book"></i><span>วิธีสั่งซื้อ</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-truck"></i><span>เช็คพัสดุ</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-headset"></i><span>ติดต่อเรา</span></a>
</nav>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody" class="modal-body"></div></div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold)">สรุปยอดสั่งซื้อ</h3>
        <div id="orderSummary" class="summary-box"></div>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" class="confirm-btn">ยืนยันยอดและส่งสลิป</a>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:#555; font-size:12px; cursor:pointer;">ยกเลิก</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], curCat = 'all';

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    function getMedia(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }

    function openMedia(url) { document.getElementById('modalBody').innerHTML = getMedia(url); document.getElementById('mediaModal').style.display = 'flex'; }

    // ฟังก์ชันใหม่: รองรับการเลือกตัวเลือก (Option)
    function openOrder(name, price, ship, options) {
        const p = parseFloat(price) || 0;
        const s = parseFloat(ship) || 0;
        const total = p + s;

        let optionHTML = "";
        if(options && options.trim() !== "" && options !== "-") {
            const optArray = options.split(",");
            optionHTML = `
                <div style="margin-bottom: 12px;">
                    <label style="font-size: 11px; color: var(--gold);">เลือกขนาด/เบอร์:</label>
                    <select class="opt-select" id="selectedOpt">
                        ${optArray.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('')}
                    </select>
                </div>
            `;
        }

        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align: center; margin-bottom: 15px;">
                <p style="color: #aaa; font-size: 11px; margin-bottom: 5px;">ช่องทางชำระเงิน</p>
                <b style="color: var(--gold); font-size: 15px;">ธนาคารกสิกรไทย</b><br>
                <b style="font-size: 18px; letter-spacing: 1px;">xxx-x-xxxxx-x</b><br>
                <p style="font-size: 13px; margin-top: 5px;">ชื่อบัญชี: บจก. แผ่นดิน สโตร์</p>
                <img src="https://via.placeholder.com/150?text=QR+CODE" style="width: 140px; height: 140px; margin: 15px auto; border-radius: 8px; border: 4px solid #fff; display: block;">
            </div>

            ${optionHTML}

            <div style="background: #1a1a1a; padding: 10px; border-radius: 8px; border-left: 4px solid var(--gold);">
                <b style="color: #888; font-size: 11px;">รายการ:</b> <span style="font-size: 13px;">${name}</span>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px;">
                    <span>ราคา:</span> <span>฿${p.toLocaleString()}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 13px;">
                    <span>ค่าจัดส่ง:</span> <span>${s === 0 ? 'ส่งฟรี' : '฿'+s}</span>
                </div>
                <hr style="border:0; border-top:1px solid #333; margin:8px 0;">
                <div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; color: var(--gold);">
                    <span>ยอดรวม:</span> <span>฿${total.toLocaleString()}</span>
                </div>
            </div>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    async function init() {
        try {
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const b = textB.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()))[0];
            
            if(b) { 
                const bannerDiv = document.getElementById('bannerContent');
                const isVid = b[0].toLowerCase().match(/\.(mp4|webm|mov)$/);
                bannerDiv.innerHTML = isVid 
                    ? `<video src="${b[0]}" autoplay loop muted playsinline></video><div style="position:absolute; bottom:10px; left:15px; font-size:14px; font-weight:600;">${b[1]}</div>`
                    : `<img src="${b[0]}"><div style="position:absolute; bottom:10px; left:15px; font-size:14px; font-weight:600;">${b[1]}</div>`;
            }

            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            // ปรับการ map ให้เก็บ Column J (Index 9)
            let raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);

            const shuffled = shuffle([...raw]);
            dbRec = shuffled.filter(p => p[5] && p[5].includes("แนะนำ")).slice(0, 8);
            dbAll = shuffled.filter(p => !dbRec.includes(p));

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();
        const itemHTML = (p, isRec = false) => {
            const time = p[7] ? new Date(p[7]).getTime() : 0;
            const expired = time > 0 && time < now;
            const price = (expired && p[4]) ? p[4] : p[3];
            const old = expired ? null : p[4];
            // p[9] คือคอลัมน์ J ใน Sheets
            if(isRec) return `<div class="rec-card"><div class="rec-media" onclick="openMedia('${p[1]}')">${getMedia(p[1])}</div><div class="rec-price" onclick="openOrder('${p[0]}','${price}','${p[8]}','${p[9]||""}')">฿${price}</div></div>`;
            return `<div class="card"><div class="media" onclick="openMedia('${p[1]}')">${p[7] && p[7].length > 5 && !expired ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}${getMedia(p[1])}</div><div class="info"><div class="title">${p[0]}</div><div class="description">${p[2]||'รายละเอียดสินค้า'}</div><div class="price-row"><div class="price">฿${price}</div>${old ? `<div class="price-old">฿${old}</div>` : ''}</div><button class="buy-btn" onclick="openOrder('${p[0]}','${price}','${p[8]}','${p[9]||""}')">สั่งซื้อ</button></div></div>`;
        };

        if(dbRec.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join('');
        } else { document.getElementById('rec-area').style.display = 'none'; }
        
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat));
        document.getElementById('main-list').innerHTML = filt.map(p => itemHTML(p)).join('');
        
        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const dist = new Date(el.dataset.time).getTime() - now;
            if (dist < 0) { el.remove(); } else {
                const h = Math.floor(dist / 3600000), m = Math.floor((dist % 3600000) / 60000), s = Math.floor((dist % 60000) / 1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    init();
    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
</script>
</body>
</html>
