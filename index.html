<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | LUXURY OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; --gold-light: #F5D76E; --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; --card: rgba(255, 255, 255, 0.03); --pill: rgba(255, 255, 255, 0.1); 
            --red: #ff4d4d; --green: #28a745; --footer-h: 70px; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 120px; overflow-x: hidden; }

        /* --- Header --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.2); transition: 0.4s; }
        .logo-row { text-align: center; padding: 12px 0; }
        .logo-img { height: 38px; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4)); }
        
        .banner-container { padding: 0 15px 15px; }
        .banner-slide { 
            height: 185px; display: flex; background: #000; border: 1.5px solid var(--gold); 
            border-radius: 25px; overflow: hidden; position: relative; cursor: pointer;
        }
        .banner-left { width: 45%; border-right: 1px solid rgba(212, 175, 55, 0.2); }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .banner-right { width: 55%; padding: 15px; display: flex; flex-direction: column; justify-content: center; background: #111; }
        .banner-title { color: var(--gold); font-size: 19px; font-weight: 800; line-height: 1.2; }
        .banner-timer { display: flex; gap: 5px; margin-top: 10px; }
        .time-box { background: var(--gold-grad); color: #000; padding: 4px 8px; border-radius: 8px; font-weight: 800; font-size: 14px; }
        .flash-tag { position: absolute; top: 0; left: 0; background: var(--red); color: #fff; padding: 4px 12px; font-size: 10px; font-weight: bold; border-bottom-right-radius: 15px; }

        .nav-container { padding: 0 15px 12px; }
        #search { width: 100%; padding: 12px 20px; border-radius: 50px; border: 1px solid #333; background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 10px; outline: none; }
        .cat-bar { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 12px; color: #888; padding: 7px 20px; border-radius: 50px; background: var(--pill); white-space: nowrap; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; }

        /* --- Main --- */
        main { margin-top: 365px; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        header.shrunk + main { margin-top: 155px; }

        .section-label { font-size: 15px; color: var(--gold); padding: 20px 15px 10px; font-weight: 600; }
        .rec-list { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 15px; scrollbar-width: none; }
        .rec-card { min-width: 160px; border-radius: 25px; overflow: hidden; background: var(--card); border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .rec-media { width: 100%; aspect-ratio: 1/1; background: #000; cursor: pointer; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: contain; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 15px; }
        .card { background: var(--card); border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .media { width: 100%; aspect-ratio: 1/1; background: #000; cursor: pointer; position: relative; }
        .info { padding: 12px; }
        .price { color: var(--gold-light); font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 800; padding: 12px; border-radius: 15px; border: none; cursor: pointer; font-size: 12px; }

        /* --- Nav & Modal --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--footer-h); background: rgba(10,10,10,0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(212, 175, 55, 0.2); z-index: 2000; }
        .nav-link { color: #666; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 18px; margin-bottom: 4px; }

        .modal { display: none; position: fixed; z-index: 5000; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
        .order-card { background: #0a0a0a; border: 1.5px solid var(--gold); border-radius: 30px; width: 100%; max-width: 400px; padding: 25px; text-align: center; max-height: 85vh; overflow-y: auto; }
        .form-input, .opt-select { width: 100%; padding: 12px; background: #151515; border: 1px solid #333; border-radius: 12px; color: #fff; margin-bottom: 12px; font-family: 'Kanit'; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังเตรียมความหรูหรา...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำพิเศษ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 คอลเลกชันทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><br>หน้าหลัก</a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck-fast"></i><br>พัสดุ</a>
    <a href="https://www.facebook.com/share/1BNoZAqd7W/" target="_blank" class="nav-link"><i class="fa-brands fa-facebook-messenger"></i><br>ติดต่อเรา</a>
</nav>

<div id="mediaModal" class="modal" onclick="this.style.display='none'">
    <div id="modalBody" style="width:100%; text-align:center;"></div>
</div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:15px;">ยืนยันคำสั่งซื้อ</h3>
        <div id="orderSummary" style="background:#000; padding:15px; border-radius:15px; margin-bottom:15px; text-align:left;"></div>
        <form id="orderForm">
            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล *" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์ *" required>
            <textarea id="custAddress" class="form-input" rows="3" placeholder="ที่อยู่จัดส่ง *" required></textarea>
            <div style="border: 2px dashed var(--gold); padding: 15px; border-radius: 15px; margin-bottom:10px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <span id="upTxt" style="color:var(--gold); font-size:12px;">📸 แตะแนบสลิปโอนเงิน</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:10px; margin-top:10px;">
            </div>
            <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
            <button type="submit" id="btnSubmit" class="buy-btn" style="font-size:18px;">ยืนยันแจ้งโอนเงิน</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:20px; color:#555; font-size:12px; cursor:pointer;">ยกเลิก</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], dbRec = [], curCat = 'all';
    let currentData = { name: '', basePrice: 0, ship: 0, qty: 1 };
    let bannerEndTime = null;

    function getMedia(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:contain;"></video>` : `<img src="${url}" style="width:100%; height:100%; object-fit:contain;">`;
    }

    function openMedia(url) {
        document.getElementById('modalBody').innerHTML = getMedia(url);
        document.getElementById('mediaModal').style.display = 'flex';
    }

    async function init() {
        try {
            // Load Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const textB = await resB.text();
            const b = textB.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b && b[0]) {
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide" onclick="openMedia('${b[0]}')">
                        <div class="banner-left">${getMedia(b[0])}<div class="flash-tag">FLASH SALE</div></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]}</div>
                            <div class="banner-timer">
                                <div class="time-box" id="bh">00</div>:<div class="time-box" id="bm">00</div>:<div class="time-box" id="bs">00</div>
                            </div>
                        </div>
                    </div>`;
                setInterval(updateTimer, 1000);
            }

            // Load Products
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`);
            const textP = await resP.text();
            let raw = textP.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
            
            dbRec = raw.filter(p => p[5] && p[5].includes("แนะนำ")).sort(() => Math.random() - 0.5).slice(0, 6);
            dbAll = raw.filter(p => !dbRec.some(r => r[0] === p[0])).sort(() => Math.random() - 0.5);

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            if(dbRec.length > 0) document.getElementById('rec-area').style.display = 'block';
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const itemHTML = (p, isRec) => `
            <div class="${isRec ? 'rec-card' : 'card'}">
                <div class="${isRec ? 'rec-media' : 'media'}" onclick="openMedia('${p[1]}')">${getMedia(p[1])}</div>
                <div class="info">
                    <div class="price">฿${p[3]}</div>
                    <div style="font-size:13px; color:#ddd; height:32px; overflow:hidden; margin-bottom:10px;">${p[0]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
                </div>
            </div>`;

        document.getElementById('rec-list').innerHTML = dbRec.map(p => itemHTML(p, true)).join('');
        document.getElementById('main-list').innerHTML = dbAll
            .filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat))
            .map(p => itemHTML(p, false)).join('');
        
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimer() {
        if (!bannerEndTime) return;
        const diff = bannerEndTime - new Date().getTime();
        if (diff > 0) {
            document.getElementById('bh').innerText = Math.floor(diff/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        }
    }

    function openOrder(name, price, ship, options) {
        currentData = { name, basePrice: parseFloat(price), ship: parseFloat(ship) };
        let optHTML = "";
        if(options && options !== "-") {
            const opts = options.split(",");
            optHTML = `<select class="opt-select" id="pOpt">${opts.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
        }
        document.getElementById('orderSummary').innerHTML = `
            <div style="text-align:center; margin-bottom:10px;">
                <b style="color:var(--gold);">กสิกรไทย: 035-8-56762-2</b><br><small>นาย วัชระ ชันสิน</small>
            </div>
            <b>สินค้า:</b> ${name}<br>
            <b>ยอดโอน:</b> <span style="color:var(--gold); font-size:18px;">฿${(currentData.basePrice + currentData.ship).toLocaleString()}</span>
            ${optHTML}
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewSlip(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result;
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('upTxt').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const fileInput = document.getElementById('slipFile');
        if(!fileInput.files[0]) return alert("กรุณาแนบสลิปครับ");
        
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async function() {
            const base64 = reader.result.split(',')[1];
            const payload = { 
                productDetail: currentData.name + (document.getElementById('pOpt')?.value || ""),
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: base64, mimeType: fileInput.files[0].type
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
                alert("✅ แจ้งโอนสำเร็จ!"); location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; }
        };
        reader.readAsDataURL(fileInput.files[0]);
    };

    async function checkTracking() {
        const phone = prompt("กรอกเบอร์โทรศัพท์:");
        if (!phone) return;
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
            const text = await res.text();
            const rows = text.split('\n').slice(1).map(r => r.split(','));
            const found = rows.find(r => r[0].replace(/"/g,'') === phone);
            if(found) alert(`คุณ: ${found[1]}\nเลขพัสดุ: ${found[3]}`);
            else alert("ไม่พบข้อมูล");
        } catch(e) { alert("ผิดพลาด"); }
    }

    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
    init();
</script>
</body>
</html>
