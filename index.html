<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(135deg, #D4AF37 0%, #F5D76E 100%);
            --bg: #050505; 
            --card: #121212; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 100px; }

        /* --- Header & Banner --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid rgba(212,175,55,0.2); transition: 0.3s; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        
        .banner-container { padding: 0 15px 15px; }
        .banner-slide { 
            height: 160px; display: flex; background: #000; border: 1px solid var(--gold); 
            border-radius: 20px; overflow: hidden; position: relative;
        }
        .banner-left { width: 45%; border-right: 1px solid #222; }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .flash-tag { position: absolute; top: 0; left: 0; background: #ff4d4d; color: #fff; padding: 2px 10px; font-size: 10px; font-weight: bold; border-bottom-right-radius: 10px; }
        .banner-right { width: 55%; padding: 15px; display: flex; flex-direction: column; justify-content: center; }
        .banner-title { color: var(--gold); font-size: 16px; font-weight: 800; line-height: 1.2; margin-bottom: 8px; }
        .banner-timer { display: flex; gap: 5px; align-items: center; margin-bottom: 10px; }
        .time-box { background: var(--gold-grad); color: #000; padding: 4px 6px; border-radius: 6px; font-weight: 800; font-size: 12px; }

        /* --- Nav & Categories --- */
        .nav-container { padding: 0 15px 10px; }
        #search { width: 100%; padding: 10px 20px; border-radius: 50px; border: 1px solid #333; background: #1a1a1a; color: #fff; margin-bottom: 10px; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 12px; color: #888; padding: 6px 18px; border-radius: 50px; background: #222; white-space: nowrap; }
        .cat-item.active { background: var(--gold-grad); color: #000; font-weight: 600; }

        /* --- Main Content --- */
        main { margin-top: 340px; }
        header.shrunk .banner-container { display: none; }
        header.shrunk + main { margin-top: 145px; }

        .section-label { font-size: 14px; color: var(--gold); padding: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        
        /* สไตล์ราคาและรูปภาพที่แก้ไขใหม่ */
        .media-link { display: block; width: 100%; aspect-ratio: 1/1; position: relative; overflow: hidden; cursor: pointer; background: #000; }
        .media-link img, .media-link video { width: 100%; height: 100%; object-fit: contain; }
        .price-overlay { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: var(--gold); font-weight: 800; padding: 8px; text-align: center; font-size: 16px; border-top: 1px solid rgba(212,175,55,0.3); }

        /* Recommended List */
        .rec-list { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 15px; scrollbar-width: none; }
        .rec-card { min-width: 150px; border-radius: 20px; overflow: hidden; background: var(--card); border: 1px solid #222; }

        /* Grid List */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 20px; border: 1px solid #222; overflow: hidden; }
        .info { padding: 10px; }
        .title { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .buy-btn { width: 100%; background: var(--gold-grad); color: #000; font-weight: 800; padding: 10px; border-radius: 12px; border: none; font-size: 12px; cursor: pointer; }

        /* --- Bottom Nav & Contact --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
        .nav-link { color: #666; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 18px; }

        /* --- Modals --- */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; }
        .order-card { background: #000; border: 1px solid var(--gold); border-radius: 25px; width: 100%; max-width: 380px; padding: 20px; text-align: center; }
        .form-input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 10px; font-family: 'Kanit'; }
        
        .contact-choice { display: flex; align-items: center; gap: 12px; background: #111; padding: 12px; border-radius: 15px; margin-bottom: 10px; text-decoration: none; color: #fff; border: 1px solid #222; }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:50px 0; color:#555;">กำลังสุ่มความหรูหรา...</div>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำพิเศษ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck-fast"></i><span>ติดตามพัสดุ</span></a>
    <a href="javascript:void(0)" onclick="openContactModal()" class="nav-link"><i class="fa-solid fa-comments"></i><span>ติดต่อเรา</span></a>
</nav>

<div id="contactChoiceModal" class="modal" onclick="if(event.target===this) this.style.display='none'">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:15px;">ติดต่อเจ้าหน้าที่</h3>
        <a href="https://m.me/yourfb" target="_blank" class="contact-choice">
            <i class="fa-brands fa-facebook-messenger" style="color:#0084FF; font-size:24px;"></i>
            <div style="text-align:left;"><b>Messenger</b><br><span style="font-size:10px; color:#666;">สอบถาม/สั่งซื้อ</span></div>
        </a>
        <a href="https://line.me/ti/p/yourid" target="_blank" class="contact-choice">
            <i class="fa-brands fa-line" style="color:#06C755; font-size:24px;"></i>
            <div style="text-align:left;"><b>LINE Official</b><br><span style="font-size:10px; color:#666;">คุยกับแอดมิน</span></div>
        </a>
        <p style="margin-top:10px; color:#444; font-size:12px;" onclick="document.getElementById('contactChoiceModal').style.display='none'">[ ปิดหน้าต่าง ]</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 id="orderTitle" style="color:var(--gold); margin-bottom:10px;">แจ้งชำระเงิน</h3>
        <div style="background:#0a0a0a; padding:10px; border-radius:15px; margin-bottom:15px;">
            <b style="color:var(--gold); font-size:14px;">ธ.กสิกรไทย: 035-8-56762-2</b><br>
            <span style="font-size:11px; color:#888;">นาย วัชระ ชันสิน</span>
            <img src="https://i.ibb.co/fVLb9p6B/004999092296200-20260224-144608.jpg" style="width: 80px; display:block; margin:8px auto; border-radius:5px;">
            <div id="itemDetailText" style="font-size:12px; color:#fff; border-top:1px solid #222; padding-top:8px;"></div>
            <div id="totalBox" style="color:var(--gold); font-weight:800; font-size:16px;"></div>
        </div>
        <form id="orderForm">
            <input type="text" id="custName" class="form-input" placeholder="ชื่อ-นามสกุล *" required>
            <input type="tel" id="custPhone" class="form-input" placeholder="เบอร์โทรศัพท์ *" required>
            <textarea id="custAddress" class="form-input" rows="2" placeholder="ที่อยู่จัดส่ง *" required></textarea>
            <div style="border:1px dashed var(--gold); padding:10px; border-radius:10px; cursor:pointer;" onclick="document.getElementById('slipFile').click()">
                <span id="uploadText" style="font-size:11px; color:var(--gold);">📸 แตะเพื่อแนบสลิป</span>
                <img id="slipPreview" style="width:100%; display:none; border-radius:8px; margin-top:5px;">
            </div>
            <input type="file" id="slipFile" style="display:none;" onchange="previewSlip(this)">
            <button type="submit" id="btnSubmit" class="buy-btn" style="margin-top:15px; height:45px;">ยืนยันการสั่งซื้อ</button>
        </form>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:#444; font-size:11px; cursor:pointer;">ยกเลิก</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;
    const APPS_URL = "https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec";

    let dbAll = [], dbRec = [], curCat = 'all', currentData = {}, bannerEndTime = null;

    function openContactModal() { document.getElementById('contactChoiceModal').style.display = 'flex'; }
    const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);
    
    function getMediaTag(url, price) {
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        const tag = isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
        return `<div class="media-link">${tag}<div class="price-overlay">฿${price}</div></div>`;
    }

    async function init() {
        try {
            const resB = await fetch(BANN_URL), textB = await resB.text();
            const lb = textB.split(/\r?\n/).slice(1).filter(l => l.trim() !== "");
            if(lb.length > 0) {
                const b = lb[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
                bannerEndTime = b[2] ? new Date(b[2]).getTime() : null;
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide" onclick="bannerGoToProduct('${b[3]}')">
                        <div class="banner-left">${b[0].match(/\.(mp4|webm)$/) ? `<video src="${b[0]}" autoplay loop muted playsinline></video>` : `<img src="${b[0]}">`}<div class="flash-tag">FLASH SALE</div></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]}</div>
                            <div class="banner-timer">
                                <div class="time-box" id="bh">00</div>:<div class="time-box" id="bm">00</div>:<div class="time-box" id="bs">00</div>
                            </div>
                            <div style="font-size:10px; color:#fff; background:rgba(255,255,255,0.1); padding:4px 10px; border-radius:50px; align-self:flex-start;">ช้อปเลย ></div>
                        </div>
                    </div>`;
                if(bannerEndTime) setInterval(updateBannerTimer, 1000);
            }

            const resP = await fetch(PROD_URL), textP = await resP.text();
            let raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
            
            dbRec = shuffle(raw.filter(p => p[5] && p[5].includes("แนะนำ"))).slice(0, 8);
            dbAll = shuffle(raw.filter(p => !dbRec.some(r => r[0] === p[0])));

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
        } catch(e) { document.getElementById('status').innerText = "เชื่อมต่อฐานข้อมูลล้มเหลว"; }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const draw = (p, isRec) => {
            const price = p[3], ship = parseFloat(p[8])||0;
            const content = getMediaTag(p[1], price);
            if(isRec) return `<div class="rec-card" onclick="openOrder('${p[0]}','${price}','${ship}')">${content}</div>`;
            return `
                <div class="card">
                    <div onclick="openOrder('${p[0]}','${price}','${ship}')">${content}</div>
                    <div class="info">
                        <div class="title">${p[0]}</div>
                        <button class="buy-btn" onclick="openOrder('${p[0]}','${price}','${ship}')">สั่งซื้อ</button>
                    </div>
                </div>`;
        };

        if(dbRec.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRec.map(p => draw(p, true)).join('');
        } else { document.getElementById('rec-area').style.display = 'none'; }

        document.getElementById('main-list').innerHTML = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat)).map(p => draw(p, false)).join('');
        document.getElementById('cats').innerHTML = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']].map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function openOrder(name, price, ship) {
        currentData = { name, price: parseFloat(price), ship: parseFloat(ship) };
        document.getElementById('itemDetailText').innerText = `สินค้า: ${name}`;
        document.getElementById('totalBox').innerText = `รวมยอดโอน: ฿${(currentData.price + currentData.ship).toLocaleString()}`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewSlip(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => { 
                document.getElementById('slipPreview').src = e.target.result; 
                document.getElementById('slipPreview').style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const file = document.getElementById('slipFile').files[0];
        if(!file) return alert("กรุณาแนบสลิปครับ");
        btn.innerText = "กำลังบันทึก..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const payload = {
                productDetail: currentData.name,
                customerName: document.getElementById('custName').value,
                customerPhone: document.getElementById('custPhone').value,
                customerAddress: document.getElementById('custAddress').value,
                file: reader.result.split(',')[1],
                mimeType: file.type
            };
            await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(payload), mode: 'no-cors' });
            alert("สั่งซื้อสำเร็จ!"); location.reload();
        };
        reader.readAsDataURL(file);
    };

    function updateBannerTimer() {
        const diff = bannerEndTime - new Date().getTime();
        if(diff > 0) {
            document.getElementById('bh').innerText = Math.floor(diff/3600000).toString().padStart(2,'0');
            document.getElementById('bm').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('bs').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
        }
    }

    function bannerGoToProduct(name) {
        const p = [...dbRec, ...dbAll].find(x => x[0] === name);
        if(p) openOrder(p[0], p[3], p[8]||0);
    }

    async function checkTracking() {
        const phone = prompt("กรอกเบอร์โทรศัพท์ติดตามพัสดุ:");
        if (!phone) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
        const found = rows.find(r => r[0] === phone);
        if (found) alert(`คุณ: ${found[1]}\nขนส่ง: ${found[2]}\nเลขพัสดุ: ${found[3]}`);
        else alert("ไม่พบข้อมูล");
    }

    init();
    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
</script>
</body>
</html>
