<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | THE ULTIMATE STORE</title>

    <link href="https://fonts.googleapis.com/css2?family=Niramit:wght@300;500;700&family=Kanit:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --thai-indigo: #0F1D35; --thai-gold: #C5A059; --thai-stone: #F9F7F2; 
            --thai-accent: #B22222; --white: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Niramit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--thai-stone); color: var(--thai-indigo); padding-bottom: 90px; }

        /* --- Header & Tabs --- */
        header { position: fixed; top: 0; width: 100%; height: 60px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 2px solid var(--thai-gold); display: flex; justify-content: center; align-items: center; }
        .logo-img { height: 38px; }

        .tabs-nav { display: flex; overflow-x: auto; padding: 75px 15px 10px; gap: 10px; scrollbar-width: none; }
        .tab-btn { padding: 8px 18px; background: #fff; border-radius: 30px; border: 1px solid #ddd; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--thai-indigo); }
        .tab-btn.active { background: var(--thai-indigo); color: var(--thai-gold); border-color: var(--thai-indigo); }

        /* --- Product Grid (3-Col) --- */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 10px; }
        .card { background: var(--white); border-radius: 15px; overflow: hidden; border: 1px solid rgba(197, 160, 89, 0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 6px; text-align: center; }
        .p-name { font-size: 10px; font-weight: 600; height: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-price { font-size: 12px; font-weight: 800; color: var(--thai-gold); }

        /* --- Modern Slider --- */
        .slider-box { width: 100%; aspect-ratio: 1/1; position: relative; border-radius: 20px; overflow: hidden; background: #000; margin-bottom: 15px; }
        .slides { display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; }
        .slide-item { min-width: 100%; height: 100%; }
        .slide-item img, .slide-item video { width: 100%; height: 100%; object-fit: contain; }
        .dots { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 5px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
        .dot.active { background: var(--thai-gold); width: 15px; border-radius: 10px; }

        /* --- Variants --- */
        .v-label { font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--thai-clay); }
        .variant-flex { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .v-item { padding: 10px 15px; border: 1px solid #ddd; border-radius: 12px; background: #fff; cursor: pointer; min-width: 80px; text-align: center; }
        .v-item.active { border-color: var(--thai-gold); background: rgba(197, 160, 89, 0.1); border-width: 2px; }
        .v-name { display: block; font-size: 12px; font-weight: 700; }
        .v-price { font-size: 10px; color: var(--thai-gold); }

        /* --- Modal & Form --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 29, 53, 0.98); z-index: 5000; align-items: center; justify-content: center; padding: 10px; }
        .modal.show { display: flex; animation: slideUp 0.3s ease; }
        .modal-card { background: var(--thai-stone); border-radius: 30px; width: 100%; max-width: 400px; padding: 20px; max-height: 92vh; overflow-y: auto; border: 2px solid var(--thai-gold); position: relative; }
        .input-group { background: #fff; padding: 15px; border-radius: 20px; border: 1px solid #eee; margin-bottom: 15px; }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #ddd; outline: none; background: #fdfdfd; }
        
        .submit-btn { width: 100%; padding: 18px; border-radius: 50px; border: none; background: var(--thai-accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 20px rgba(178, 34, 34, 0.3); }
        
        /* --- Utils --- */
        .share-btn { position: absolute; top: 20px; right: 20px; z-index: 100; background: rgba(255,255,255,0.8); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--thai-indigo); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #fff; display: flex; border-top: 1px solid var(--thai-gold); z-index: 1000; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .nav-tab { flex: 1; text-align: center; color: var(--thai-indigo); font-size: 10px; font-weight: 600; padding-top: 15px; opacity: 0.5; }
        .nav-tab.active { opacity: 1; }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 4px; color: var(--thai-gold); }
    </style>
</head>
<body>

<header><img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img"></header>

<div class="tabs-nav">
    <div class="tab-btn active" onclick="filterCat('all', this)">สินค้าทั้งหมด</div>
    <div class="tab-btn" onclick="filterCat('best', this)">ยอดนิยม</div>
    <div class="tab-btn" onclick="filterCat('promo', this)">โปรโมชั่น</div>
</div>

<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house-chimney-window"></i>หน้าหลัก</div>
    <div class="nav-tab" onclick="window.open('https://m.me/YourPageID')"><i class="fa-solid fa-comment-dots"></i>ปรึกษา</div>
    <div class="nav-tab" onclick="alert('กำลังอัปเดตระบบสมาชิก')"><i class="fa-solid fa-circle-user"></i>ฉัน</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <div class="share-btn" onclick="shareProd()"><i class="fa-solid fa-share-nodes"></i></div>
        
        <div class="slider-box" id="sliderTop">
            <div class="slides" id="slideTrack"></div>
            <div class="dots" id="dotBox"></div>
        </div>
        
        <h2 id="pName" style="text-align:center; font-size:18px; margin-bottom:5px;"></h2>
        <p id="pPrice" style="text-align:center; font-size:24px; font-weight:800; color:var(--thai-gold); margin-bottom:20px;"></p>

        <div class="v-label">เลือกสไตล์ที่คุณชอบ:</div>
        <div class="variant-flex" id="variantGrid"></div>

        <form id="orderForm">
            <div class="input-group">
                <input type="text" id="cName" placeholder="ชื่อ-นามสกุล ผู้รับ" required class="input-box">
                <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-box">
                <textarea id="cAddr" placeholder="ที่อยู่สำหรับจัดส่งสินค้า" required class="input-box" style="height:70px;"></textarea>
            </div>
            
            <div style="background:var(--white); padding:15px; border-radius:20px; border:2px dashed var(--thai-gold); text-align:center; margin-bottom:15px;">
                <p style="font-size:12px; color:var(--thai-gold); font-weight:700; margin-bottom:5px;">โอนเงินผ่านบัญชี กสิกรไทย</p>
                <p style="font-size:16px; font-weight:800; letter-spacing:1px;">035-8-56762-2</p>
                <p style="font-size:11px; opacity:0.7;">คุณวัชระ ชันสิน</p>
                
                <div onclick="document.getElementById('slipIn').click()" style="margin-top:10px; background:var(--thai-indigo); color:var(--thai-gold); padding:10px; border-radius:12px; cursor:pointer;">
                    <span id="slipTxt"><i class="fa-solid fa-file-invoice-dollar"></i> แนบสลิปเพื่อยืนยัน</span>
                    <input type="file" id="slipIn" style="display:none" onchange="previewSlip(this)" accept="image/*">
                    <img id="slipPrev" style="display:none; width:60px; margin:5px auto; border-radius:8px;">
                </div>
            </div>

            <button type="submit" id="subBtn" class="submit-btn">ยืนยันสั่งซื้อสินค้า</button>
            <p onclick="closeModal()" style="text-align:center; color:#999; cursor:pointer; margin-top:20px; font-size:12px; font-weight:600;">ปิดหน้าต่างนี้</p>
        </form>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbyoY_2RajmKgO6NHXlyX0cR404kHG7EqElMB4z7I_lmKrOUKezLOVzMPdMjfKZD_5YJyg/exec';

    let db = [], curP = {}, slideIdx = 0, currentMedia = [];

    async function init() {
        const rp = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
        const pt = await rp.text();
        db = pt.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
        render('all');
    }

    function filterCat(cat, el) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        render(cat);
    }

    function render(filter) {
        const grid = document.getElementById('productGrid');
        let filtered = db;
        if(filter === 'best') filtered = db.slice(0, 6); // ตัวอย่างดึง 6 อันดับแรก
        
        grid.innerHTML = filtered.map((p, idx) => `
            <div class="card" onclick="openOrder(${idx})">
                <div class="media-wrap"><img src="${p[1].split(',')[0]}"></div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[3]||0).toLocaleString()}</div>
                </div>
            </div>`).join('');
    }

    function openOrder(idx) {
        const p = db[idx];
        curP = { 
            name: p[0], mainMedia: p[1].split(','), price: parseFloat(p[3]),
            variants: p[8] ? p[8].split('|').map(v => {
                const parts = v.split(':');
                return { name: parts[0], price: parts[1], images: parts[2] ? parts[2].split(',') : [] };
            }) : []
        };

        document.getElementById('pName').innerText = curP.name;
        document.getElementById('pPrice').innerText = `฿${curP.price.toLocaleString()}`;
        
        const vGrid = document.getElementById('variantGrid');
        vGrid.innerHTML = curP.variants.map((v, i) => `
            <div class="v-item" id="v-${i}" onclick="selectVariant(${i})">
                <span class="v-name">${v.name}</span>
                <span class="v-price">฿${parseFloat(v.price).toLocaleString()}</span>
            </div>
        `).join('');

        updateSlider(curP.mainMedia);
        document.getElementById('orderModal').classList.add('show');
    }

    function selectVariant(i) {
        const v = curP.variants[i];
        document.querySelectorAll('.v-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`v-${i}`).classList.add('active');
        document.getElementById('pPrice').innerText = `฿${parseFloat(v.price).toLocaleString()}`;
        
        if(v.images.length > 0) updateSlider(v.images);
        else updateSlider(curP.mainMedia);
        
        // เลื่อนสไลเดอร์กลับไปรูปแรกสุด
        document.getElementById('sliderTop').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function updateSlider(mediaArray) {
        currentMedia = mediaArray; slideIdx = 0;
        const track = document.getElementById('slideTrack');
        const dotBox = document.getElementById('dotBox');
        
        track.innerHTML = currentMedia.map(m => {
            const isVid = m.trim().toLowerCase().endsWith('.mp4');
            return `<div class="slide-item">${isVid ? `<video muted loop playsinline autoplay><source src="${m.trim()}"></video>` : `<img src="${m.trim()}">`}</div>`;
        }).join('');
        
        dotBox.innerHTML = currentMedia.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('');
        
        // Touch Slider Logic
        let startX = 0;
        track.onmousedown = track.ontouchstart = e => startX = e.pageX || e.touches[0].pageX;
        track.onmouseup = track.ontouchend = e => {
            let diff = startX - (e.pageX || e.changedTouches[0].pageX);
            if(Math.abs(diff) > 50) moveSlide(diff > 0 ? 1 : -1);
        };
        
        updateSlideUI();
    }

    function moveSlide(d) {
        slideIdx = (slideIdx + d + currentMedia.length) % currentMedia.length;
        updateSlideUI();
    }

    function updateSlideUI() {
        document.getElementById('slideTrack').style.transform = `translateX(-${slideIdx * 100}%)`;
        document.querySelectorAll('.dot').forEach((d, i) => d.className = i===slideIdx ? 'dot active' : 'dot');
    }

    function shareProd() {
        if (navigator.share) {
            navigator.share({ title: curP.name, text: `ดูสินค้าชิ้นนี้ที่ PHAENDIN: ${curP.name}`, url: window.location.href });
        } else {
            alert("คัดลอกลิงก์แล้ว!");
        }
    }

    function previewSlip(input) {
        if(input.files[0]) {
            const r = new FileReader();
            r.onload = e => { document.getElementById('slipPrev').src = e.target.result; document.getElementById('slipPrev').style.display='block'; document.getElementById('slipTxt').style.display='none'; };
            r.readAsDataURL(input.files[0]);
        }
    }

    function closeModal() { document.getElementById('orderModal').classList.remove('show'); }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('subBtn');
        btn.innerText = "กำลังสั่งซื้อ..."; btn.disabled = true;
        
        const slip = document.getElementById('slipIn').files[0];
        const toB64 = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(f); });

        const activeVariant = document.querySelector('.v-item.active');
        const vText = activeVariant ? ` (${activeVariant.querySelector('.v-name').innerText})` : "";

        const fd = new URLSearchParams();
        fd.append('productDetail', curP.name + vText);
        fd.append('customerName', document.getElementById('cName').value);
        fd.append('customerPhone', document.getElementById('cPhone').value);
        fd.append('customerAddress', document.getElementById('cAddr').value);
        fd.append('file', await toB64(slip));

        await fetch(APPS_URL, { method: 'POST', body: fd, mode: 'no-cors' });
        alert("ขอบคุณสำหรับการสั่งซื้อ! ทางเราได้รับข้อมูลแล้ว"); location.reload();
    };

    init();
</script>
</body>
</html>
