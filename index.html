<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHAENDIN FOOD | ของอร่อยจากทั่วไทย</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Kanit", sans-serif;
    background: #f7f7f5;
    color: #222;
}

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #eee;
}

.container {
    width: min(1200px, 94%);
    margin: auto;
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: .5px;
}

.logo span {
    color: #d89b00;
}

.hero {
    margin-top: 20px;
    background: linear-gradient(135deg,#171717,#3a2b08);
    color: white;
    border-radius: 24px;
    padding: 32px 25px;
    overflow: hidden;
    position: relative;
}

.hero h1 {
    font-size: clamp(30px,5vw,52px);
    line-height: 1.05;
    margin: 0 0 10px;
    font-weight: 700;
}

.hero p {
    color: #ddd;
    margin: 0 0 20px;
}

.random-btn {
    border: 0;
    background: #e4ad25;
    color: #111;
    padding: 11px 18px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

.random-btn:hover {
    transform: translateY(-2px);
}

.search-box {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.search-box input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    background: white;
}

.search-box input:focus {
    border-color: #d5a21d;
}

.section-title {
    margin: 30px 0 14px;
    font-size: 22px;
    font-weight: 600;
}

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
}

.filter-btn {
    white-space: nowrap;
    border: 1px solid #ddd;
    background: white;
    border-radius: 999px;
    padding: 8px 15px;
    font-family: inherit;
    cursor: pointer;
}

.filter-btn.active {
    background: #222;
    color: white;
    border-color: #222;
}

.products {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 14px;
}

.card {
    background: white;
    border-radius: 17px;
    overflow: hidden;
    border: 1px solid #eee;
    transition: .2s;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,.07);
}

.card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #eee;
}

.card-body {
    padding: 12px;
}

.card-name {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.3;
    height: 42px;
    overflow: hidden;
}

.province {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.price {
    color: #d18d00;
    font-size: 20px;
    font-weight: 700;
    margin-top: 6px;
}

.buy-btn {
    width: 100%;
    border: 0;
    background: #222;
    color: white;
    padding: 9px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
}

.buy-btn:hover {
    background: #d99e10;
    color: #111;
}

.loading {
    text-align: center;
    padding: 50px 10px;
    color: #777;
}

.empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 50px 10px;
    color: #888;
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(500px,100%);
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 22px;
    padding: 20px;
}

.modal h2 {
    margin-top: 0;
}

.form-input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 11px;
    font-family: inherit;
    margin-bottom: 10px;
    outline: none;
}

.form-input:focus {
    border-color: #d4a017;
}

.close-btn {
    float: right;
    border: 0;
    background: #eee;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
}

.submit-btn {
    width: 100%;
    border: 0;
    background: #d9a21b;
    color: #111;
    padding: 12px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.footer {
    margin-top: 50px;
    padding: 30px 0;
    text-align: center;
    color: #888;
    border-top: 1px solid #eee;
}

@media(max-width:900px) {
    .products {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(max-width:650px) {
    .products {
        grid-template-columns: repeat(2,1fr);
        gap: 9px;
    }

    .card-body {
        padding: 9px;
    }

    .card-name {
        font-size: 14px;
    }

    .price {
        font-size: 18px;
    }

    .buy-btn {
        font-size: 14px;
        padding: 8px;
    }

    .hero {
        border-radius: 18px;
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="container">
        <div class="flex items-center justify-between py-4">
            <div class="logo">
                PHAENDIN <span>FOOD</span>
            </div>

            <button onclick="openCart()" class="relative text-2xl">
                🛒
                <span id="cartCount"
                      class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
                    0
                </span>
            </button>
        </div>
    </div>
</header>

<main class="container">

    <section class="hero">

        <h1>
            ของอร่อย<br>
            จากทั่วไทย 🇹🇭
        </h1>

        <p>
            คัดสรรอาหาร ของฝาก และของดีจากแต่ละจังหวัด
        </p>

        <button class="random-btn" onclick="randomProducts()">
            🎲 สุ่มของอร่อยให้ฉัน
        </button>

    </section>

    <div class="search-box">
        <input
            id="searchInput"
            type="search"
            placeholder="🔍 ค้นหาน้ำพริก ขนม ของฝาก..."
            oninput="renderProducts()"
        >
    </div>

    <h2 class="section-title">
        🏷️ หมวดหมู่
    </h2>

    <div id="categories" class="filters">
        <button
            class="filter-btn active"
            onclick="selectCategory('ทั้งหมด',this)">
            ทั้งหมด
        </button>
    </div>

    <h2 class="section-title">
        🛍️ สินค้าแนะนำ
    </h2>

    <div id="products" class="products">

        <div class="loading">
            ⏳ กำลังโหลดสินค้า...
        </div>

    </div>

</main>

<footer class="footer">
    <div class="container">
        <b>PHAENDIN FOOD</b>
        <br>
        ของอร่อยจากทั่วไทย ❤️
    </div>
</footer>


<!-- =========================
     ORDER MODAL
========================= -->

<div id="orderModal" class="modal-bg">

    <div class="modal">

        <button class="close-btn" onclick="closeModal()">
            ✕
        </button>

        <h2>🛒 สั่งซื้อสินค้า</h2>

        <div id="selectedProduct"></div>

        <input
            id="customerName"
            class="form-input"
            placeholder="ชื่อผู้สั่งซื้อ"
        >

        <input
            id="customerPhone"
            class="form-input"
            placeholder="เบอร์โทรศัพท์"
            type="tel"
        >

        <textarea
            id="customerAddress"
            class="form-input"
            rows="3"
            placeholder="ที่อยู่จัดส่ง"
        ></textarea>

        <input
            id="customerQty"
            class="form-input"
            type="number"
            min="1"
            value="1"
            onchange="updateOrderTotal()"
        >

        <div id="orderTotal"
             class="text-xl font-bold mb-3">
        </div>

        <button class="submit-btn" onclick="submitOrder()">
            ยืนยันการสั่งซื้อ
        </button>

    </div>

</div>


<!-- =========================
     CART MODAL
========================= -->

<div id="cartModal" class="modal-bg">

    <div class="modal">

        <button class="close-btn" onclick="closeCart()">
            ✕
        </button>

        <h2>🛒 ตะกร้าของฉัน</h2>

        <div id="cartItems"></div>

        <div id="cartTotal"
             class="text-xl font-bold mt-4">
        </div>

        <button
            class="submit-btn mt-4"
            onclick="checkoutCart()">
            ดำเนินการสั่งซื้อ
        </button>

    </div>

</div>


<script>

/* =========================================
   GOOGLE APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxReEoKJ6HJpfJqoul4AVwWcFdoA_MtigEnugjHYnUY5m79dfA2oDV73q2sFwlhnleGrA/exec";


/* =========================================
   DATA
========================================= */

let products = [];

let filteredProducts = [];

let currentCategory = "ทั้งหมด";

let selectedProduct = null;

let cart = [];


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts() {

    const box = document.getElementById("products");

    box.innerHTML = `
        <div class="loading">
            ⏳ กำลังโหลดสินค้า...
        </div>
    `;

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("โหลดข้อมูลไม่สำเร็จ");
        }

        const data = await response.json();

        products = Array.isArray(data) ? data : [];

        filteredProducts = [...products];

        createCategories();

        renderProducts();

    } catch(error) {

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                ❌ โหลดสินค้าไม่สำเร็จ
                <br><br>
                กรุณาตรวจสอบ Web App URL
                และการตั้งค่า Apps Script
            </div>
        `;
    }
}


/* =========================================
   CREATE CATEGORIES
========================================= */

function createCategories() {

    const box = document.getElementById("categories");

    box.innerHTML = `
        <button
            class="filter-btn active"
            onclick="selectCategory('ทั้งหมด',this)">
            ทั้งหมด
        </button>
    `;

    const categories = [
        ...new Set(
            products
                .map(p => p.category)
                .filter(Boolean)
        )
    ];

    categories.forEach(category => {

        const button = document.createElement("button");

        button.className = "filter-btn";

        button.textContent = category;

        button.onclick = () =>
            selectCategory(category, button);

        box.appendChild(button);

    });
}


/* =========================================
   CATEGORY
========================================= */

function selectCategory(category, button) {

    currentCategory = category;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderProducts();
}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts() {

    const box = document.getElementById("products");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    filteredProducts = products.filter(product => {

        const name =
            String(product.name || "").toLowerCase();

        const category =
            String(product.category || "");

        const province =
            String(product.province || "").toLowerCase();

        const matchSearch =
            !search ||
            name.includes(search) ||
            category.toLowerCase().includes(search) ||
            province.includes(search);

        const matchCategory =
            currentCategory === "ทั้งหมด" ||
            category === currentCategory;

        return matchSearch && matchCategory;

    });

    if (filteredProducts.length === 0) {

        box.innerHTML = `
            <div class="empty">
                😢 ไม่พบสินค้าที่ค้นหา
            </div>
        `;

        return;
    }

    box.innerHTML = "";

    filteredProducts.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "card";

        const image =
            product.image ||
            "https://via.placeholder.com/600x600?text=PHAENDIN+FOOD";

        const price =
            Number(product.price || 0);

        card.innerHTML = `

            <img
                class="card-img"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(product.name || "สินค้า")}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/600x600?text=NO+IMAGE'"
            >

            <div class="card-body">

                <div class="card-name">
                    ${escapeHTML(product.name || "ไม่มีชื่อสินค้า")}
                </div>

                <div class="province">
                    📍 ${escapeHTML(product.province || "ประเทศไทย")}
                </div>

                <div class="price">
                    ฿${price.toLocaleString("th-TH")}
                </div>

                <button
                    class="buy-btn"
                    onclick="openOrder(${JSON.stringify(product).replace(/"/g,'&quot;')})">
                    🛒 สั่งซื้อ
                </button>

            </div>
        `;

        box.appendChild(card);

    });
}


/* =========================================
   RANDOM 1-3 PRODUCTS
========================================= */

function randomProducts() {

    if (!products.length) {
        alert("ยังไม่มีสินค้า");
        return;
    }

    const shuffled =
        [...products].sort(() => Math.random() - 0.5);

    const count =
        Math.min(3, shuffled.length);

    filteredProducts =
        shuffled.slice(0, count);

    const box =
        document.getElementById("products");

    box.innerHTML = "";

    filteredProducts.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "card";

        const image =
            product.image ||
            "https://via.placeholder.com/600x600?text=PHAENDIN+FOOD";

        const price =
            Number(product.price || 0);

        card.innerHTML = `

            <img
                class="card-img"
                src="${escapeHTML(image)}"
                alt="${escapeHTML(product.name || "สินค้า")}"
            >

            <div class="card-body">

                <div class="card-name">
                    ${escapeHTML(product.name || "สินค้า")}
                </div>

                <div class="province">
                    📍 ${escapeHTML(product.province || "ประเทศไทย")}
                </div>

                <div class="price">
                    ฿${price.toLocaleString("th-TH")}
                </div>

                <button
                    class="buy-btn"
                    onclick="openOrder(${JSON.stringify(product).replace(/"/g,'&quot;')})">
                    🛒 สั่งซื้อ
                </button>

            </div>
        `;

        box.appendChild(card);

    });

    window.scrollTo({
        top: document.getElementById("products").offsetTop - 80,
        behavior: "smooth"
    });
}


/* =========================================
   OPEN ORDER
========================================= */

function openOrder(product) {

    selectedProduct = product;

    const price =
        Number(product.price || 0);

    document.getElementById("selectedProduct").innerHTML = `

        <div class="bg-gray-100 rounded-xl p-3 mb-4">

            <div class="font-semibold">
                ${escapeHTML(product.name || "")}
            </div>

            <div class="text-gray-500">
                ${escapeHTML(product.province || "")}
            </div>

            <div class="text-lg font-bold mt-1">
                ฿${price.toLocaleString("th-TH")}
            </div>

        </div>
    `;

    document.getElementById("customerQty").value = 1;

    updateOrderTotal();

    document
        .getElementById("orderModal")
        .classList.add("show");
}


function closeModal() {

    document
        .getElementById("orderModal")
        .classList.remove("show");
}


/* =========================================
   ORDER TOTAL
========================================= */

function updateOrderTotal() {

    if (!selectedProduct) return;

    const price =
        Number(selectedProduct.price || 0);

    const qty =
        Math.max(
            1,
            Number(document.getElementById("customerQty").value || 1)
        );

    const total =
        price * qty;

    document.getElementById("orderTotal").innerHTML =
        `รวมสินค้า: ฿${total.toLocaleString("th-TH")}`;
}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(product) {

    const existing =
        cart.find(item => item.id == product.id);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });

    }

    updateCartCount();

    alert("เพิ่มสินค้าในตะกร้าแล้ว 🛒");
}


function updateCartCount() {

    const count =
        cart.reduce(
            (sum,item) => sum + item.quantity,
            0
        );

    document.getElementById("cartCount").textContent =
        count;
}


/* =========================================
   CART
========================================= */

function openCart() {

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("show");
}


function closeCart() {

    document
        .getElementById("cartModal")
        .classList.remove("show");
}


function renderCart() {

    const box =
        document.getElementById("cartItems");

    if (!cart.length) {

        box.innerHTML = `
            <div class="text-center text-gray-500 py-8">
                🛒 ยังไม่มีสินค้าในตะกร้า
            </div>
        `;

        document.getElementById("cartTotal").textContent =
            "รวม ฿0";

        return;
    }

    box.innerHTML = "";

    let total = 0;

    cart.forEach((item,index) => {

        const price =
            Number(item.price || 0);

        const itemTotal =
            price * item.quantity;

        total += itemTotal;

        const div =
            document.createElement("div");

        div.className =
            "border-b py-3";

        div.innerHTML = `

            <div class="flex justify-between gap-3">

                <div>

                    <div class="font-medium">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="text-sm text-gray-500">
                        ${item.quantity} ×
                        ฿${price.toLocaleString("th-TH")}
                    </div>

                </div>

                <button
                    onclick="removeCart(${index})"
                    class="text-red-500">
                    ลบ
                </button>

            </div>
        `;

        box.appendChild(div);

    });

    document.getElementById("cartTotal").textContent =
        `รวม ฿${total.toLocaleString("th-TH")}`;
}


function removeCart(index) {

    cart.splice(index,1);

    updateCartCount();

    renderCart();
}


/* =========================================
   CHECKOUT CART
========================================= */

function checkoutCart() {

    if (!cart.length) {

        alert("ยังไม่มีสินค้าในตะกร้า");

        return;
    }

    alert(
        "ระบบตะกร้าพร้อมแล้ว\n\n" +
        "ขั้นต่อไปเราจะเชื่อมระบบชำระเงินและบันทึกออเดอร์ลง Google Sheets"
    );
}


/* =========================================
   SUBMIT ORDER
========================================= */

async function submitOrder() {

    if (!selectedProduct) return;

    const name =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    const qty =
        Math.max(
            1,
            Number(document.getElementById("customerQty").value || 1)
        );

    if (!name || !phone || !address) {

        alert("กรุณากรอกข้อมูลให้ครบ");

        return;
    }

    const total =
        Number(selectedProduct.price || 0) * qty;

    alert(
        "รับข้อมูลคำสั่งซื้อแล้วครับ ❤️\n\n" +
        "สินค้า: " + selectedProduct.name +
        "\nจำนวน: " + qty +
        "\nรวม: ฿" + total.toLocaleString("th-TH") +
        "\n\nขั้นต่อไปจะเชื่อมการบันทึกออเดอร์ลง Google Sheets"
    );

    closeModal();

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   START
========================================= */

loadProducts();

</script>

</body>
</html>
