<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PHAENDIN PICKS - ของน่าซื้อ คัดมาให้แล้ว</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'main': '#111827',
                        'accent': '#ef4444',
                        'gold': '#f59e0b',
                        'soft': '#f8fafc'
                    },

                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>


<body class="bg-soft text-gray-800 min-h-screen flex flex-col">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="bg-white sticky top-0 z-50 shadow-sm">

    <div class="container mx-auto px-4">

        <div class="flex items-center justify-between gap-3 py-3">

            <!-- LOGO -->
            <div onclick="resetFilter()"
                 class="flex items-center gap-2 cursor-pointer min-w-fit">

                <div class="w-10 h-10 rounded-xl bg-gray-900
                            flex items-center justify-center
                            text-white font-black text-lg shadow">

                    P
                </div>

                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight">
                        PHAENDIN
                        <span class="text-red-500">PICKS</span>
                    </h1>

                    <p class="text-[10px] sm:text-xs text-gray-400">
                        ของน่าซื้อ คัดมาให้แล้ว
                    </p>
                </div>

            </div>


            <!-- SEARCH -->
            <div class="relative flex-1 max-w-xl">

                <input
                    type="text"
                    id="searchInput"
                    onkeyup="filterProducts()"
                    placeholder="ค้นหาสินค้า..."
                    class="w-full pl-10 pr-4 py-2.5
                           rounded-full
                           bg-gray-100
                           border border-gray-200
                           focus:outline-none
                           focus:ring-2
                           focus:ring-red-400
                           text-sm">

                <i class="fa-solid fa-magnifying-glass
                          absolute left-4 top-3.5
                          text-gray-400">
                </i>

            </div>

        </div>

    </div>

</header>



<!-- =====================================================
     HERO
===================================================== -->

<section class="bg-gray-900 text-white">

    <div class="container mx-auto px-4 py-10 sm:py-14">

        <div class="max-w-3xl mx-auto text-center">

            <span class="inline-block
                         bg-red-500
                         text-white
                         px-4 py-1.5
                         rounded-full
                         text-xs sm:text-sm
                         font-medium
                         mb-4">

                🔥 PICKS OF THE DAY

            </span>


            <h2 class="text-3xl sm:text-5xl
                       font-black
                       leading-tight
                       mb-3">

                ของน่าซื้อ
                <br class="sm:hidden">

                <span class="text-red-400">
                    คัดมาให้แล้ว
                </span>

            </h2>


            <p class="text-gray-300
                      text-sm sm:text-base
                      max-w-xl
                      mx-auto">

                รวมของกิน ของใช้ และของน่าสนใจ
                ที่เราเจอแล้วอยากบอกต่อ

            </p>

        </div>

    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container mx-auto px-4 py-6 flex-grow">


    <!-- CATEGORY -->

    <div class="mb-6">

        <div id="categoryContainer"
             class="flex gap-2 overflow-x-auto
                    hide-scrollbar pb-2">
        </div>

    </div>



    <!-- PRODUCT COUNT -->

    <div class="flex items-center justify-between mb-4">

        <h2 class="font-bold text-lg">
            🛍️ สินค้าน่าสนใจ
        </h2>

        <span id="productCount"
              class="text-xs text-gray-400">
        </span>

    </div>



    <!-- PRODUCT GRID -->

    <div id="productGrid"
         class="grid
                grid-cols-2
                md:grid-cols-3
                lg:grid-cols-4
                gap-3
                sm:gap-5">
    </div>



    <!-- NOT FOUND -->

    <div id="notFound"
         class="hidden text-center py-16">

        <div class="text-6xl mb-4">
            🔍
        </div>

        <h3 class="text-xl font-bold text-gray-600">
            ไม่พบสินค้าที่ค้นหา
        </h3>

        <p class="text-sm text-gray-400 mt-1">
            ลองค้นหาด้วยคำอื่น
        </p>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="bg-gray-900 text-white mt-10">

    <div class="container mx-auto px-4 py-8">

        <div class="text-center">

            <div class="text-xl font-black mb-2">
                PHAENDIN
                <span class="text-red-400">PICKS</span>
            </div>

            <p class="text-gray-400 text-xs">
                ของน่าซื้อ คัดมาให้แล้ว
            </p>

            <p class="text-gray-600 text-[10px] mt-4">
                © 2026 PHAENDIN PICKS
            </p>

        </div>

    </div>

</footer>



<!-- =====================================================
     SCRIPT เดิม
===================================================== -->

<script>

    /*
    =====================================================
    Google Sheets Web App URL
    ใช้ตัวเดิมของคุณ
    =====================================================
    */

    const SHEET_API_URL =
        "https://script.google.com/macros/s/AKfycbxqXpc-Q_2TPzyVnfFaInoGldXl-s8Du6XKfcic3lYKUBXy-FkyQaXGtNcbjTSWOUJI/exec";


    let products = [];

    /*
    =====================================================
    หมวดสินค้า
    =====================================================
    */

    const categories = [
        "ทั้งหมด",
        "อาหาร",
        "น้ำพริก",
        "ของใช้ในบ้าน",
        "เครื่องใช้ไฟฟ้า",
        "แฟชั่น",
        "สัตว์เลี้ยง",
        "อื่นๆ"
    ];


    let currentCategory = "ทั้งหมด";



    /*
    =====================================================
    START
    =====================================================
    */

    document.addEventListener("DOMContentLoaded", () => {

        renderCategories();

        fetchProductsFromSheet();

    });



    /*
    =====================================================
    ดึงข้อมูลจาก Google Sheets
    =====================================================
    */

    function fetchProductsFromSheet() {

        const grid =
            document.getElementById("productGrid");


        grid.innerHTML = `

            <div class="col-span-full
                        text-center
                        py-16
                        text-gray-400">

                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>

                <p class="text-sm">
                    กำลังโหลดสินค้า...
                </p>

            </div>

        `;


        fetch(SHEET_API_URL)

            .then(response => response.json())

            .then(data => {

                products = data;

                renderProducts(products);

            })

            .catch(error => {

                console.error("Error:", error);

                grid.innerHTML = `

                    <div class="col-span-full
                                text-center
                                py-16
                                text-red-500">

                        <i class="fa-solid
                                  fa-triangle-exclamation
                                  text-3xl
                                  mb-3">
                        </i>

                        <p>
                            ไม่สามารถโหลดสินค้าได้
                        </p>

                    </div>

                `;

            });

    }



    /*
    =====================================================
    CATEGORY
    =====================================================
    */

    function renderCategories() {

        const container =
            document.getElementById("categoryContainer");


        container.innerHTML =
            categories.map(cat => `

                <button
                    onclick="setCategory('${cat}')"

                    class="whitespace-nowrap
                           px-4 py-2
                           rounded-full
                           text-sm
                           font-medium
                           transition

                           ${
                               currentCategory === cat

                               ? "bg-gray-900 text-white shadow"

                               : "bg-white text-gray-600 border border-gray-200 hover:bg-gray-100"
                           }">

                    ${cat}

                </button>

            `).join("");

    }



    /*
    =====================================================
    PRODUCT
    =====================================================
    */

    function renderProducts(items) {

        const grid =
            document.getElementById("productGrid");

        const notFound =
            document.getElementById("notFound");

        const count =
            document.getElementById("productCount");


        if (!items || items.length === 0) {

            grid.innerHTML = "";

            notFound.classList.remove("hidden");

            count.innerText = "";

            return;

        }


        notFound.classList.add("hidden");


        count.innerText =
            `${items.length} รายการ`;


        grid.innerHTML = items.map(item => {


            /*
            ===============================
            TAGS
            ===============================
            */

            const tags = item.tags
                ? item.tags
                    .split(",")
                    .map(tag => {

                        tag = tag.trim();


                        let color =
                            "bg-gray-700 text-white";


                        if (tag === "Flash Sale")
                            color =
                                "bg-yellow-400 text-black";


                        else if (tag === "ส่งฟรี")
                            color =
                                "bg-blue-500 text-white";


                        else if (tag === "ขายดี")
                            color =
                                "bg-orange-500 text-white";


                        else if (tag === "1 แถม 1")
                            color =
                                "bg-green-600 text-white";


                        else if (tag === "Official Store")
                            color =
                                "bg-purple-600 text-white";


                        else if (tag.includes("ลด"))
                            color =
                                "bg-red-500 text-white";


                        return `

                            <span class="${color}
                                         text-[10px]
                                         px-2
                                         py-1
                                         rounded-full">

                                ${tag}

                            </span>

                        `;

                    })
                    .join("")
                : "";


            /*
            ===============================
            PRODUCT CARD
            ===============================
            */

            return `

                <div class="bg-white
                            rounded-2xl
                            overflow-hidden
                            border border-gray-100
                            shadow-sm
                            hover:shadow-lg
                            transition
                            group">


                    <!-- IMAGE -->

                    <div class="relative
                                overflow-hidden
                                bg-gray-100">

                        <img
                            src="${item.image}"
                            alt="${item.title}"

                            class="w-full
                                   h-40
                                   sm:h-52
                                   object-cover
                                   group-hover:scale-105
                                   transition
                                   duration-500">


                        <!-- TAG -->

                        <div class="absolute
                                    top-2
                                    left-2
                                    flex
                                    flex-wrap
                                    gap-1">

                            ${tags}

                        </div>

                    </div>



                    <!-- CONTENT -->

                    <div class="p-3 sm:p-4">


                        <!-- TITLE -->

                        <h3 class="text-sm
                                   font-medium
                                   text-gray-800
                                   line-clamp-2
                                   min-h-[40px]
                                   group-hover:text-red-500
                                   transition">

                            ${item.title}

                        </h3>



                        <!-- PRICE -->

                        <div class="mt-3">

                            <div class="flex
                                        items-baseline
                                        gap-2">

                                <span class="text-xl
                                             sm:text-2xl
                                             font-black
                                             text-red-500">

                                    ฿${Number(item.salePrice)
                                        .toLocaleString()}

                                </span>


                                ${
                                    item.originalPrice

                                    ? `

                                    <span class="text-xs
                                                 text-gray-400
                                                 line-through">

                                        ฿${Number(item.originalPrice)
                                            .toLocaleString()}

                                    </span>

                                    `

                                    : ""
                                }

                            </div>

                        </div>



                        <!-- BUY BUTTON -->

                        <a
                            href="${item.affiliateUrl}"
                            target="_blank"
                            rel="noopener noreferrer"

                            class="mt-3
                                   w-full
                                   bg-gray-900
                                   hover:bg-red-500
                                   text-white
                                   py-2.5
                                   rounded-xl
                                   font-medium
                                   text-xs
                                   sm:text-sm
                                   flex
                                   items-center
                                   justify-center
                                   gap-2
                                   transition">

                            <i class="fa-solid fa-cart-shopping"></i>

                            ดูสินค้า / สั่งซื้อ

                        </a>

                    </div>

                </div>

            `;

        }).join("");

    }



    /*
    =====================================================
    CATEGORY FILTER
    =====================================================
    */

    function setCategory(cat) {

        currentCategory = cat;

        renderCategories();

        filterProducts();

    }



    /*
    =====================================================
    SEARCH
    =====================================================
    */

    function filterProducts() {

        const searchInput =
            document.getElementById("searchInput");


        const searchText =
            searchInput.value
                .toLowerCase()
                .trim();


        const filtered =
            products.filter(p => {


                const title =
                    String(p.title || "")
                        .toLowerCase();


                const category =
                    String(p.category || "")
                        .toLowerCase();


                const matchesCat =
                    currentCategory === "ทั้งหมด" ||
                    p.category === currentCategory;


                const matchesSearch =
                    title.includes(searchText) ||
                    category.includes(searchText);


                return matchesCat && matchesSearch;

            });


        renderProducts(filtered);

    }



    /*
    =====================================================
    RESET
    =====================================================
    */

    function resetFilter() {

        document.getElementById("searchInput").value = "";

        setCategory("ทั้งหมด");

    }

</script>


</body>
</html>
