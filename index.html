<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Price Checker</title>

<style>
body {
    font-family: Arial;
    background: #020617;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: #0f172a;
    padding: 25px;
    border-radius: 15px;
    width: 380px;
}
input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}
button {
    background: #22c55e;
    font-weight: bold;
    cursor: pointer;
}
.result {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
}
.good { background: #16a34a; }
.mid { background: #eab308; color:black;}
.bad { background: #dc2626; }

small { color: #94a3b8; }
</style>
</head>

<body>

<div class="container">
    <h2>💸 Smart Price Checker</h2>

    <input type="text" id="product" placeholder="ชื่อสินค้า เช่น iPhone 13">
    <input type="number" id="price" placeholder="ราคาที่เจอ (บาท)">

    <button onclick="checkPrice()">เช็คราคา</button>

    <div id="output"></div>
</div>

<script>

async function fetchMarketPrices(product) {

    const url = "https://real-time-product-search.p.rapidapi.com/search?q=" + encodeURIComponent(product);

    const options = {
        method: 'GET',
        headers: {
            'X-RapidAPI-Key': 'ใส่APIKEYตรงนี้',
            'X-RapidAPI-Host': 'real-time-product-search.p.rapidapi.com'
        }
    };

    try {
        const res = await fetch(url, options);
        const data = await res.json();

        let prices = [];

        if (data.data) {
            prices = data.data.map(item => {
                let priceText = item.price || "";
                let number = parseFloat(priceText.replace(/[^\d]/g, ""));
                return number;
            }).filter(p => !isNaN(p));
        }

        return prices.length ? prices : [1000]; // กัน error

    } catch (err) {
        console.error(err);
        return [1000];
    }
}
function analyze(prices, userPrice) {
    let avg = prices.reduce((a,b)=>a+b,0) / prices.length;
    let min = Math.min(...prices);
    let max = Math.max(...prices);

    let diff = ((userPrice - avg) / avg) * 100;

    let status, className, advice;

    if (diff > 20) {
        status = "🔴 แพงเกินไป";
        className = "bad";
        advice = "แนะนำให้รอ หรือหาซื้อร้านอื่น";
    } else if (diff < -15) {
        status = "🟢 ถูกมาก คุ้ม!";
        className = "good";
        advice = "ราคานี้น่าซื้อทันที";
    } else {
        status = "🟡 ราคาปกติ";
        className = "mid";
        advice = "อาจลองเปรียบเทียบเพิ่มก่อนตัดสินใจ";
    }

    return {
        avg, min, max, diff,
        status, className, advice
    };
}

async function checkPrice() {
    let product = document.getElementById("product").value;
    let price = parseFloat(document.getElementById("price").value);
    let output = document.getElementById("output");

    if (!product || !price) {
        output.innerHTML = "<div class='result bad'>กรอกข้อมูลก่อน</div>";
        return;
    }

    output.innerHTML = "กำลังเช็คราคา...";

    let prices = await fetchMarketPrices(product);

// 🔥 เพิ่มตรงนี้
let cheapest = prices.length ? Math.min(...prices) : 0;

let result = analyze(prices, price);
    
    output.innerHTML = `
    <div class="result ${result.className}">
        <b>${result.status}</b><br><br>

        💰 ราคาคุณ: ${price} บาท<br>
        🛒 ราคาถูกสุด: ${cheapest.toFixed(0)} บาท<br>
        📊 ราคาเฉลี่ย: ${result.avg.toFixed(0)} บาท<br>
        🔻 ต่ำสุด: ${result.min.toFixed(0)} บาท<br>
        🔺 สูงสุด: ${result.max.toFixed(0)} บาท<br><br>

        📉 ต่างจากตลาด: ${result.diff.toFixed(1)}%<br><br>

        💡 <b>${result.advice}</b><br><br>

        <a href="https://shopee.co.th/search?keyword=${encodeURIComponent(product)}" target="_blank">
            <button>🛒 ไปดูราคาจริง</button>
        </a>

        <small>ดึงข้อมูลจาก API จริงแล้ว</small>
    </div>
`;
}
</script>

</body>
</html>
