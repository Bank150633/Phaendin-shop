button,

button{

/* ================================
HEADER
================================ */

header{

}

.header{

    display:flex;
    align-items:center;

}

.logo{

}

.logo span{

}

.favorite-top{
    border:0;
    background:rgba(255,255,255,.16);
    color:white;
    border-radius:30px;
    padding:8px 13px;
    font-size:14px;
}


/* ================================
MAIN
================================ */

.container{
    max-width:950px;
    margin:auto;
    padding:15px 14px 100px;
}


/* ================================
HERO
================================ */

.hero{
    text-align:center;
    padding:20px 5px;
}

.hero-icon{

}

.hero h1{

    line-height:1.25;

}

.hero p{

    font-size:15px;
    margin-top:6px;
}


/* ================================
PHOTO BOX
================================ */

    border-radius:20px;

}

.photo-title{
    font-size:18px;
    font-weight:600;
    margin-bottom:10px;
}

.photo-area{
    border:2px dashed #d5d9df;
    border-radius:15px;
    min-height:105px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:10px;

    color:#777;
    position:relative;
    overflow:hidden;
}

.photo-area img{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:11px;
    display:none;
}

.photo-text{
    font-size:14px;
}

.photo-btn{
    margin-top:8px;
    background:#f1f3f5;
    border:0;
    padding:9px 15px;
    border-radius:10px;
    font-size:14px;
}


/* ================================
INGREDIENT BOX
================================ */

.input-box{
    background:white;
    border-radius:20px;
    padding:17px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.input-title{
    font-size:19px;
    font-weight:600;
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:80px;
    resize:none;

    border:2px solid #e5e7eb;
    border-radius:14px;

    padding:12px;
    font-size:16px;
    outline:none;
}

textarea:focus{
    border-color:#123c8c;
}

.example{
    color:#888;
    font-size:12px;
    margin-top:5px;
}


/* ================================
QUICK INGREDIENT
================================ */

.quick-title{
    margin-top:14px;
    margin-bottom:8px;
    font-size:14px;
    color:#555;
}

.quick-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.ingredient-btn{
    border:1px solid #ddd;
    background:white;
    padding:7px 11px;
    border-radius:30px;
    font-size:14px;
}

.ingredient-btn.active{
    background:#123c8c;
    color:white;
    border-color:#123c8c;
}


/* ================================
ACTIONS
================================ */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.find-btn,
.random-btn{
    border:0;
    padding:13px;
    border-radius:13px;
    font-size:17px;
    font-weight:600;
}

.find-btn{
    background:#d71920;
    color:white;
}

.random-btn{
    background:#123c8c;
    color:white;
}

RESULT
================================ */

.result-head{

    justify-content:space-between;

.result-title{
    font-size:21px;
    font-weight:600;
}

.result-sub{
    color:#777;
    font-size:13px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

CARD
================================ */

    position:relative;
}

    position:absolute;

    left:8px;

    width:30px;
    height:30px;

    border-radius:50%;

    background:#d71920;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;
    font-weight:600;
}

.card-body{
    padding:12px;
}

.card h3{
    font-size:18px;
    margin-bottom:5px;
}

.match{
    display:inline-block;
    background:#eaf8ef;
    color:#16803c;
    padding:3px 8px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:7px;
}

    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-bottom:7px;
}

.info{

    color:#666;
    border-radius:20px;

    font-size:11px;
}

.ingredients{
    color:#777;
    font-size:12px;
    line-height:1.5;
}

    background:#fff7e6;
    color:#a15c00;
    border-radius:9px;
    padding:7px;
    margin-top:8px;
    font-size:12px;
    line-height:1.5;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 42px;
    gap:6px;
    margin-top:10px;
}

.cook-btn{
    border:0;
    background:#123c8c;
    color:white;
    border-radius:9px;
    padding:9px;
    font-size:14px;

.save-btn{
    border:0;
    background:#f1f3f5;
    border-radius:9px;
    font-size:20px;
}

.save-btn.saved{
    background:#ffe8e8;

/* ================================
EMPTY
================================ */

.empty{
    background:white;
    border-radius:18px;
    padding:30px 15px;
    text-align:center;
    color:#777;
    margin-top:15px;
}


/* ================================
AD
================================ */

.ad{
    margin-top:25px;
    min-height:100px;

    background:white;

    border:1px dashed #bbb;
    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#aaa;
    text-align:center;
    font-size:13px;
}

.ad span{
    display:block;
}


/* ================================
MODAL
================================ */

.modal{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.62);

    z-index:100;

    padding:15px;
}

.modal-box{
    background:white;
    max-width:520px;

    margin:25px auto;

    border-radius:20px;

    padding:20px;

    overflow:auto;

    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:8px;

    font-size:28px;
    color:#777;

.modal h2{
    font-size:24px;

.modal-desc{

/* ==================================================
PHOTO PREVIEW
================================================== */

function previewPhoto(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const preview =
        document.getElementById("preview");

    const text =
        document.getElementById("photoText");

    preview.src =
        URL.createObjectURL(file);

    preview.style.display =
        "block";

    text.style.display =
        "none";
}


/* ==================================================
QUICK INGREDIENT
================================================== */

function toggleIngredient(button,ingredient){

    button.classList.toggle("active");

    const textarea =
        document.getElementById("ingredients");

    let items =
        textarea.value
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);


    if(button.classList.contains("active")){

        if(!items.includes(ingredient)){
            items.push(ingredient);
        }

    }else{

        items =
            items.filter(
                x => x !== ingredient
            );

    }


    textarea.value =
        items.join(", ");

}


/* ==================================================
GET USER INGREDIENTS
================================================== */

function getIngredients(){

    return document
        .getElementById("ingredients")
        .value
        .toLowerCase()
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);

}


/* ==================================================
FIND MENU
================================================== */

function findMenu(){

    const user =
        getIngredients();

    if(!user.length){

        showEmpty();

        return;

    }


    const result = menus

        .map(menu => {

            let matches = 0;

            let matchedItems = [];


            menu.ingredients.forEach(item => {

                const found =
                    user.some(
                        u =>
                        u.includes(item) ||
                        item.includes(u)
                    );


                if(found){

                    matches++;

                    matchedItems.push(item);

                }

            });


            const missing =
                menu.ingredients.filter(
                    item =>
                    !matchedItems.includes(item)
                );


            return {
                ...menu,
                matches,
                missing
            };

        })

        .filter(
            menu =>
            menu.matches > 0
        )

        .sort(
            (a,b) =>
            b.matches - a.matches
        );


    renderMenus(
        result.slice(0,3)
    );

}


/* ==================================================
RANDOM
================================================== */

function randomMenu(){

    const shuffled =
        [...menus]
        .sort(
            () =>
            Math.random() - .5
        );

    renderMenus(
        shuffled.slice(0,3)
    );

}


/* ==================================================
RENDER
================================================== */

function renderMenus(list){

    const results =
        document.getElementById("results");

    document
        .getElementById("favorites")
        .classList.remove("show");


    if(!list.length){

        showEmpty();

        return;

    }


    results.style.display =
        "block";


    let html = `

        <div class="result-head">

            <div class="result-title">
                🍽️ เมนูที่เราเลือกให้
            </div>

            <div class="result-sub">
                ${list.length} เมนู
            </div>

        </div>

        <div class="menu-grid">

    `;


    list.forEach((menu,index) => {

        const saved =
            isFavorite(menu.name);


        let missingHTML = "";


        if(menu.missing &&
           menu.missing.length){

            missingHTML = `

                <div class="missing">

                    🛒 ขาด:
                    ${menu.missing.join(", ")}

                </div>

            `;

        }else{

            missingHTML = `

                <div class="missing"
                     style="
                     background:#eaf8ef;
                     color:#16803c;
                     ">

                    ✅ วัตถุดิบพร้อมทำ

                </div>

            `;

        }


        html += `

            <div class="card">

                <div class="food-img">

                    <div class="food-number">
                        ${index + 1}
                    </div>

                    ${menu.emoji}

                </div>


                <div class="card-body">

                    <h3>
                        ${menu.name}
                    </h3>


                    ${
                        menu.matches
                        ?
                        `
                        <div class="match">

                            ✓ มี ${menu.matches}
                            วัตถุดิบ

                        </div>
                        `
                        :
                        ""
                    }


                    <div class="info-row">

                        <div class="info">
                            ⏱️ ${menu.time}
                        </div>

                        <div class="info">
                            ${menu.cost}
                        </div>

                    </div>


                    <div class="ingredients">

                        ใช้:
                        ${menu.ingredients.join(", ")}

                    </div>


                    ${missingHTML}


                    <div class="card-actions">

                        <button
                            class="cook-btn"
                            onclick="showRecipe('${menu.name}')">

                            👨‍🍳 วิธีทำ

                        </button>


                        <button
                            class="save-btn ${saved ? "saved":""}"
                            onclick="toggleFavorite('${menu.name}',this)">

                            ${saved ? "❤️":"♡"}

                        </button>

                    </div>

                </div>

            </div>

        `;

    });


    html += `
        </div>
    `;


    results.innerHTML =
        html;

}


/* ==================================================
EMPTY
================================================== */

function showEmpty(){

    document
        .getElementById("results")
        .style.display =
        "block";


    document
        .getElementById("favorites")
        .classList.remove("show");


    document
        .getElementById("results")
        .innerHTML = `

            <div class="empty">

                🧊
                <br><br>

                บอกเราก่อนว่า
                <br>
                ในตู้เย็นมีอะไร

                <br><br>

                เช่น
                <br>

                <b>
                ไข่, หมู, กระเทียม
                </b>

            </div>

        `;

}


/* ==================================================
RECIPE MODAL
================================================== */

function showRecipe(name){

    const menu =
        menus.find(
            x => x.name === name
        );

    if(!menu) return;


    document
        .getElementById("modalTitle")
        .innerText =
        menu.emoji + " " + menu.name;


    document
        .getElementById("modalDescription")
        .innerText =
        menu.description;


    document
        .getElementById("modalInfo")
        .innerHTML = `

            <div class="info">
                ⏱️ ${menu.time}
            </div>

            <div class="info">
                ${menu.cost}
            </div>

        `;


    let html = "";


    menu.steps.forEach(
        (step,index) => {

            html += `

                <div class="step">

                    <b>${index+1}.</b>
                    ${step}

                </div>

            `;

        }
    );


    document
        .getElementById("modalSteps")
        .innerHTML =
        html;


    document
        .getElementById("modal")
        .style.display =
        "block";

}


function closeModal(){

    document
        .getElementById("modal")
        .style.display =
        "none";

}


window.onclick =
function(event){

    const modal =
        document.getElementById("modal");

    if(event.target === modal){

        closeModal();

    }

};


/* ==================================================
FAVORITES
================================================== */

function getFavorites(){

    return JSON.parse(
        localStorage.getItem(
            "phaendinKitchenFavorites"
        ) || "[]"
    );

}


function isFavorite(name){

    return getFavorites()
        .includes(name);

}


function toggleFavorite(name,button){

    let favorites =
        getFavorites();


    if(favorites.includes(name)){

        favorites =
            favorites.filter(
                x => x !== name
            );

        button.innerText =
            "♡";

        button.classList.remove(
            "saved"
        );

    }else{

        favorites.push(name);

        button.innerText =
            "❤️";

        button.classList.add(
            "saved"
        );

    }


    localStorage.setItem(
        "phaendinKitchenFavorites",
        JSON.stringify(favorites)
    );

}


/* ==================================================
SHOW FAVORITES
================================================== */

function showFavorites(){

    const results =
        document.getElementById("results");

    const favorites =
        document.getElementById("favorites");


    const saved =
        getFavorites();


    results.style.display =
        "none";


    favorites.classList.add("show");


    let list =
        menus.filter(
            menu =>
            saved.includes(menu.name)
        );


    let html = `

        <button
            class="back-btn"
            onclick="hideFavorites()">

            ← กลับไปหน้าเมนู

        </button>


        <div class="result-head">

            <div class="result-title">
                ❤️ เมนูโปรด
            </div>

            <div class="result-sub">
                ${list.length} เมนู
            </div>

        </div>

    `;


    if(!list.length){

        html += `

            <div class="empty">

                ❤️

                <br><br>

                ยังไม่มีเมนูโปรด

                <br>

                กด ♡ บนเมนูที่ชอบได้เลย

            </div>

        `;

    }else{

        html += `
            <div class="menu-grid">
        `;


        list.forEach(menu => {

            html += `

                <div class="card">

                    <div class="food-img">

                        ${menu.emoji}

                    </div>


                    <div class="card-body">

                        <h3>
                            ${menu.name}
                        </h3>

                        <div class="info-row">

                            <div class="info">
                                ⏱️ ${menu.time}
                            </div>

                            <div class="info">
                                ${menu.cost}
                            </div>

                        </div>


                        <button
                            class="cook-btn"
                            style="width:100%"
                            onclick="showRecipe('${menu.name}')">

                            👨‍🍳 ดูวิธีทำ

                        </button>

                    </div>

                </div>

            `;

        });


        html += `
            </div>
        `;

    }


    favorites.innerHTML =
        html;

}


function hideFavorites(){

    document
        .getElementById("favorites")
        .classList.remove("show");

    document
        .getElementById("results")
        .style.display =
        "block";

}
