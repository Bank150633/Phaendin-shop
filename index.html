<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">NeighborShare</h1>
    <div id="list" class="space-y-4 text-center text-gray-400 italic">กำลังโหลดของ...</div>
  </div>

  <script>
    // เมื่อเปิดแอป ให้ดึงข้อมูลมาโชว์
    window.onload = () => {
      google.script.run.withSuccessHandler(draw).getItems();
    };

    function draw(data) {
      const list = document.getElementById('list');
      if (data.length === 0) { list.innerHTML = 'ไม่มีของในระบบ'; return; }
      
      list.innerHTML = data.map(row => `
        <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-4">
          <img src="${row[3] || 'https://via.placeholder.com/80'}" class="w-16 h-16 rounded-xl object-cover bg-gray-50">
          <div class="flex-1 text-left">
            <h3 class="font-bold text-gray-800">${row[1]}</h3>
            <p class="text-blue-500 font-bold text-sm">มัดจำ ${row[4]}.-</p>
            <div class="mt-2 text-right">
              ${row[5] == 'Available' 
                ? `<button onclick="borrow('${row[0]}')" class="bg-blue-600 text-white px-4 py-1 rounded-lg text-xs">ยืม</button>`
                : `<span class="text-red-400 text-xs italic font-bold">ไม่ว่าง</span>`}
            </div>
          </div>
        </div>
      `).join('');
    }

    function borrow(id) {
      const name = prompt("ชื่อเล่น/เลขที่บ้านของคุณ:");
      const tel = prompt("เบอร์โทรหรือ Line ID:");
      if (name && tel) {
        google.script.run.withSuccessHandler(msg => {
          alert(msg);
          location.reload();
        }).saveBorrow(id, name, tel);
      }
    }
  </script>
</body>
</html>
