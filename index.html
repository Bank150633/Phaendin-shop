<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 55px; transition: 0.3s; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 5px 10px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; height: 50px; }
        .logo-img { height: 45px; width: auto; }

        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 13px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 30px; height: 30px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .banner-box { padding: 8px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; height: 220px; background: #000; position: relative; }
        .bn-img { width: 100%; height: 100%; position: relative; }
        .bn-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%); z-index: 2; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; }
        
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; }
        .bn-title { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.2; flex: 1; }
        .bn-timer { display: flex; gap: 4px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 8px; margin-bottom: 5px; }
        .timer-unit { color: #ff4b2b; font-weight: 700; font-size: 13px; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: contain; }
        
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 3px; z-index: 5; }
        .badge { font-size: 7px; padding: 2px 5px; border-radius: 3px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .bg-gold { background: var(--gold-grad); color: #000; }
        .bg-red { background: var(--red-grad); }
        .province-badge { position: absolute; top: 4px; right: 4px; background: var(--gold-grad); color: #000; font-size: 7.5px; padding: 2px 5px; border-radius: 4px; font-weight: 700; z-index: 10; }
        .p-timer-badge { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 65, 108, 0.9); color: #fff; font-size: 8px; text-align: center; font-weight: bold; }

        .info { padding: 4px; flex-grow: 1; text-align: center; }
        .p-name { font-size: 10px; font-weight: 500; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .p-price { font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px; }
        .new-price { color: #ff4b2b; }

        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 6px 0; font-weight: 700; font-size: 10px; cursor: pointer; text-transform: uppercase; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 5px; }
        .modal.show { display: flex; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 320px; padding: 10px; max-height: 95vh; overflow-y: auto; }
        
        .stepper-ctrl { display: flex; align-items: center; gap: 8px; }
        .step-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--gold); background: transparent; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .input-slim { width: 100%; padding: 7px; margin-bottom: 5px; border-radius: 6px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 11px; outline: none; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 8px; }
        .nav-tab.active { color: var(--gold); }

        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
        #zoomContent img { max-width: 95vw; max-height: 80vh; }
    </style>
</head>
<body class="dark-mode">

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" alt="Logo" class="logo-img">
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาสินค้า..." oninput="render()">
</div>

<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:8px; font-size:14px;">🛒 ยืนยันคำสั่งซื้อ</h4>
        
        <div id="orderDetail" style="background:rgba(212,175,55,0.08); padding:8px; border-radius:10px; margin-bottom:10px; border:1px solid rgba(212,175,55,0.3);"></div>
        
        <form id="orderForm">
            <div id="optionBox"></div>

            <div class="stepper-wrap" id="mainStepper" style="display: none; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(212,175,55,0.2);">
                <span style="font-size: 11px; color: var(--gold);">ระบุจำนวน:</span>
                <div class="stepper-ctrl">
                    <button type="button" class="step-btn" onclick="updateQty(-1)"><i class="fa-solid fa-minus"></i></button>
                    <span id="qtyDisplay" style="color:#fff; font-weight:bold; min-width:20px; text-align:center;">1</span>
                    <button type="button" class="step-btn" onclick="updateQty(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:50px;"></textarea>
            
            <div style="text-align:center; margin: 8px 0; background:rgba(255,255,255,0.03); padding:10px; border-radius:10px;">
                <p style="font-size:11px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:80px; margin:5px 0;">
                <p style="font-size:10px; color:#fff;" onclick="copyToClipboard('0358567622')">คัดลอกเลขบัญชี <i class="fa-solid fa-copy"></i></p>
            </div>
            
            <div style="border:1px dashed var(--gold); padding:8px; border-radius:8px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:10px; color:var(--gold);">📸 แนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:70px; margin:5px auto; border-radius:4px;">
            </div>
            
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:10px; border-radius:8px; height:40px;">ยืนยันสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:10px; font-size:11px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center; padding: 20px;">
        <h4 style="color:var(--gold); margin-bottom:15px;">ติดต่อเรา</h4>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:10px; border-radius:8px; text-decoration:none; margin-bottom:10px;">โทรสายด่วน</a>
        <p onclick="closeModal('contactModal')" style="color:var(--text-dim); cursor:pointer;">[ ปิด ]</p>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, selectedOptions = {}, selectedQty = 1, bannerEnd = null;

    async function init() {
        try {
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const bRaw = await resB.text();
            const b = bRaw.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-badges">${[b[3], b[4], b[5]].filter(t => t && t !== '-').map(t => `<span class="badge ${t.includes('โปร')?'bg-red':'bg-gold'}">${t}</span>`).join('')}</div>
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">🔥 ${b[1]}</div>
                            <div>
                                <div class="bn-timer"><span class="timer-unit" id="th">00</span>:<span class="timer-unit" id="tm">00</span>:<span class="timer-unit" id="ts">00</span></div>
                                <button class="buy-now" style="width:90px; border-radius:20px;" onclick="openOrder('${b[1]}','${b[6]||0}','${b[7]||0}','${b[8]||''}', ${b[9]||0}, ${b[10]||10}, '${b[0]}', ['PROMO'])">สั่งเลย</button>
                            </div>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const pRaw = await resP.text();
            db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
            setInterval(updateProductTimers, 1000);
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map((p) => {
            let pNormal = parseFloat(p[3]||0), pPromo = parseFloat(p[10]||0), expiry = p[11]?new Date(p[11]).getTime():0;
            let isSale = (pPromo > 0 && expiry > Date.now());
            let currentPrice = isSale ? pPromo : pNormal;
            let disc = Math.round(((pNormal-currentPrice)/pNormal)*100) || 0;
            let tags = [p[4], p[5], p[6], p[7]].filter(t => t && t !== '-' && !t.includes('%'));

            return `
            <div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">
                        ${disc > 0 ? `<span class="badge bg-red">ลด ${disc}%</span>` : ''}
                        ${tags.map(t => `<span class="badge bg-gold">${t}</span>`).join('')}
                    </div>
                    ${p[13] ? `<div class="province-badge">${p[13]}</div>` : ''}
                    ${renderMedia(p[1], true)}
                    ${isSale ? `<div class="p-timer-badge" data-expire="${p[11]}">⏳ 00:00:00</div>` : ''}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">
                        ${currentPrice < pNormal ? `<span style="text-decoration:line-through; color:#888; font-size:9px;">฿${pNormal}</span>` : ''}
                        <span class="${currentPrice < pNormal ? 'new-price' : ''}">฿${currentPrice}</span>
                    </div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${pNormal}','${p[8]||0}','${p[9]||''}','${disc}','${p[12]||10}','${p[1]}', ${JSON.stringify(tags)})">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function openOrder(n, pNormal, s, optStr, disc, limit, img, tags) {
        activeP = { name: n, pNormal: parseFloat(pNormal), ship: parseFloat(s), disc: parseInt(disc), limit: parseInt(limit), img: img, tags: tags || [] };
        selectedOptions = {}; selectedQty = 1;

        const box = document.getElementById('optionBox');
        const mainStepper = document.getElementById('mainStepper');
        box.innerHTML = '';

        if(optStr && optStr !== '-') {
            mainStepper.style.display = 'none';
            let html = `<label style="font-size:11px; color:var(--gold); display:block; margin-bottom:8px;">📦 เลือกรายการสินค้า:</label>`;
            optStr.split(',').forEach(o => {
                let pts = o.split(':');
                let label = pts[0].trim(), price = pts[1]?parseFloat(pts[1]):activeP.pNormal, optImg = pts[2]?pts[2].trim():activeP.img;
                let discounted = activeP.disc > 0 ? price * (1-(activeP.disc/100)) : price;
                html += `
                <div style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:8px; border-radius:10px; margin-bottom:8px; border:1px solid rgba(212,175,55,0.2);">
                    <img src="${optImg}" style="width:50px; height:50px; border-radius:6px; object-fit:cover; border:1px solid #333;">
                    <div style="flex-grow:1;"><div style="font-size:11px; color:#fff; font-weight:500;">${label}</div><div style="font-size:10px; color:var(--gold);">฿${discounted.toLocaleString()}</div></div>
                    <div class="stepper-ctrl">
                        <button type="button" class="step-btn" onclick="changeOptQty('${label}', ${discounted}, -1)"><i class="fa-solid fa-minus"></i></button>
                        <span id="qty-${label}" style="width:25px; text-align:center; color:#fff; font-weight:bold;">0</span>
                        <button type="button" class="step-btn" onclick="changeOptQty('${label}', ${discounted}, 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>`;
                selectedOptions[label] = { qty: 0, price: discounted };
            });
            box.innerHTML = html;
        } else { mainStepper.style.display = 'flex'; document.getElementById('qtyDisplay').innerText = 1; }
        updatePrice(); openModal('orderModal');
    }

    function changeOptQty(l, p, d) {
        let n = (selectedOptions[l].qty || 0) + d;
        if(n >= 0 && n <= activeP.limit) { selectedOptions[l].qty = n; document.getElementById(`qty-${l}`).innerText = n; updatePrice(); }
    }

    function updateQty(v) {
        let n = selectedQty + v;
        if(n >= 1 && n <= activeP.limit) { selectedQty = n; document.getElementById('qtyDisplay').innerText = n; updatePrice(); }
    }

    function updatePrice() {
        let sub = 0, parts = [], totalItems = 0;
        if(Object.keys(selectedOptions).length > 0) {
            for(let k in selectedOptions) { if(selectedOptions[k].qty > 0) { sub += (selectedOptions[k].price * selectedOptions[k].qty); parts.push(`${k}(${selectedOptions[k].qty})`); totalItems += selectedOptions[k].qty; } }
        } else {
            totalItems = selectedQty;
            let discPrice = activeP.disc > 0 ? activeP.pNormal * (1-(activeP.disc/100)) : activeP.pNormal;
            sub = discPrice * selectedQty; parts.push(`${selectedQty} ชิ้น`);
        }
        activeP.total = sub + (totalItems > 0 ? activeP.ship : 0);
        activeP.fullDetail = parts.join(', ');

        let tagsHtml = activeP.tags.map(t => `<span class="badge bg-gold" style="margin-right:3px;">${t}</span>`).join('');
        if(activeP.disc > 0) tagsHtml += `<span class="badge bg-red">ลด ${activeP.disc}%</span>`;

        document.getElementById('orderDetail').innerHTML = `
            <div style="display:flex; gap:12px; align-items:center;">
                <img src="${activeP.img}" style="width:60px; height:60px; border-radius:8px; border:1px solid var(--gold); object-fit:cover;">
                <div style="flex-grow:1;">
                    <div style="font-size:12px; font-weight:600; color:var(--gold); line-height:1.2;">🛒 ${activeP.name}</div>
                    <div style="margin:4px 0;">${tagsHtml}</div>
                    <div style="font-size:10px; color:#fff;">${totalItems > 0 ? activeP.fullDetail : 'กรุณาเลือกรายการ'} | ค่าส่ง: ${activeP.ship > 0 ? '฿'+activeP.ship : 'ส่งฟรี'}</div>
                </div>
            </div>
            <div style="font-size:24px; font-weight:800; text-align:center; color:#fff; border-top:1px dashed rgba(212,175,55,0.3); padding-top:10px; margin-top:10px;">
                <span style="font-size:12px; color:var(--gold); font-weight:400;">ยอดโอน: </span>฿${activeP.total.toLocaleString()}
            </div>`;
        document.getElementById('submitBtn').disabled = (totalItems === 0);
    }

    function renderMedia(u, m) { return u?.match(/\.(mp4|webm|mov)$/i) ? `<video src="${u}" ${m?'autoplay loop muted playsinline':'controls autoplay'} style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${u}" style="width:100%; height:100%; object-fit:cover;">`; }
    function zoom(u) { document.getElementById('zoomContent').innerHTML = renderMedia(u, false); document.getElementById('zoomOverlay').style.display = 'flex'; }
    function closeZoom() { document.getElementById('zoomOverlay').style.display = 'none'; }
    function openModal(id) { document.getElementById(id).style.display='flex'; setTimeout(()=>document.getElementById(id).classList.add('show'),10); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); setTimeout(()=>document.getElementById(id).style.display='none', 300); }
    function copyToClipboard(t) { navigator.clipboard.writeText(t).then(()=>alert("คัดลอกเลขบัญชีแล้ว")); }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function handleFile(i) { if(i.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(i.files[0]); } }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const f = document.getElementById('fileIn').files[0]; if(!f) return alert("กรุณาแนบสลิป!");
        const btn = document.getElementById('submitBtn'); btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        const r = new FileReader();
        r.onload = async () => {
            const data = {
                productDetail: `${activeP.name} [${activeP.fullDetail}] รวม ฿${activeP.total}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: r.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        r.readAsDataURL(f);
    };

    function tick() { if(!bannerEnd) return; const d = bannerEnd - Date.now(); if(d > 0) { document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0'); document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0'); document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0'); } }
    function updateProductTimers() { document.querySelectorAll('.p-timer-badge').forEach(el => { const d = new Date(el.getAttribute('data-expire')).getTime() - Date.now(); if(d > 0) { const h = Math.floor(d/3600000).toString().padStart(2,'0'), m = Math.floor((d%3600000)/60000).toString().padStart(2,'0'), s = Math.floor((d%60000)/1000).toString().padStart(2,'0'); el.innerText = `⏳ ${h}:${m}:${s}`; } else { el.style.display='none'; } }); }
    async function checkShip() {
        const p = prompt("เบอร์โทรที่สั่งซื้อ:"); if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const f = rows.find(r => r[0] === p);
        if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nพัสดุ: ${f[3]}`); else alert("ไม่พบข้อมูล");
    }
    init();
</script>
