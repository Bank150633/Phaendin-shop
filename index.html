<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รวมโปร 1 แถม 1 - Shopee | Lazada | TikTok</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- Header Section -->
  <header class="bg-[#0f172a] text-white shadow-md border-b-4 border-[#b91c1c] sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center gap-3">
        <span class="bg-[#b91c1c] text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider animate-pulse shadow">
          ดีลเด็ดประจำวัน
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
          รวมโปร <span class="text-[#ef4444]">1 แถม 1</span>
        </h1>
      </div>
      <p class="text-xs sm:text-sm text-slate-300 font-light">
        ช้อปสุดคุ้มจาก Shopee / Lazada / TikTok
      </p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Filter Buttons (แถบเลือกแพลตฟอร์ม) -->
    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <button onclick="filterCategory('all')" class="filter-btn active bg-[#1e293b] text-white hover:bg-[#0f172a] px-5 py-2 rounded-full text-sm font-semibold shadow transition">
        🇹🇭 ทั้งหมด
      </button>
      <button onclick="filterCategory('Shopee')" class="filter-btn bg-white text-orange-600 hover:bg-orange-50 border border-slate-200 px-5 py-2 rounded-full text-sm font-semibold shadow-sm transition">
        🧡 Shopee
      </button>
      <button onclick="filterCategory('Lazada')" class="filter-btn bg-white text-blue-600 hover:bg-blue-50 border border-slate-200 px-5 py-2 rounded-full text-sm font-semibold shadow-sm transition">
        💙 Lazada
      </button>
      <button onclick="filterCategory('TikTok')" class="filter-btn bg-white text-slate-900 hover:bg-slate-100 border border-slate-200 px-5 py-2 rounded-full text-sm font-semibold shadow-sm transition">
        🖤 TikTok
      </button>
    </div>

    <!-- Product Grid Container -->
    <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
      <!-- ข้อมูลสินค้าจะถูกโหลดมาแสดงตรงนี้ -->
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-16">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-[#b91c1c] border-t-transparent"></div>
      <p class="mt-3 text-slate-500 text-sm font-medium">กำลังโหลดโปรโมชัน 1 แถม 1...</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-[#0f172a] text-slate-400 text-center py-6 border-t-2 border-[#b91c1c] mt-12 text-sm">
    <p>© 2026 ศูนย์รวมโปรโมชัน 1 แถม 1 สินค้าออนไลน์ราคาประหยัด</p>
  </footer>

  <!-- JavaScript -->
  <script>
    // URL Google Apps Script
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfqQzJwYt4NsnX5PeWe1aOtplZo14hZawBD0G7RuApd6U73GatL-uHjZVOKqC9Qfq7ww/exec";

    let allProducts = [];

    // ฟังก์ชั่นดึงข้อมูล (เพิ่ม redirect: 'follow' ป้องกัน CORS)
    async function fetchProducts() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL, { redirect: 'follow' });
        allProducts = await res.json();
        
        document.getElementById('loading').classList.add('hidden');
        renderProducts(allProducts);
      } catch (err) {
        console.error("Error fetching products:", err);
        document.getElementById('loading').innerHTML = `
          <div class="text-center py-6">
            <p class="text-red-600 font-semibold mb-2">โหลดข้อมูลไม่สำเร็จ</p>
            <p class="text-xs text-slate-400">กรุณาเช็กว่า Google Apps Script ตั้งค่าเป็น "ทุกคน (Anyone)" แล้วหรือยัง</p>
          </div>
        `;
      }
    }

    // ฟังก์ชั่นแสดงผลการ์ดสินค้า
    function renderProducts(products) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      if (!products || products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">ยังไม่มีสินค้าในขณะนี้</div>`;
        return;
      }

      products.forEach(item => {
        const platformName = (item.platform || '').toString().trim();
        const platformLower = platformName.toLowerCase();

        let badgeBg = 'bg-slate-800';
        if (platformLower === 'shopee') badgeBg = 'bg-orange-500';
        if (platformLower === 'lazada') badgeBg = 'bg-blue-600';
        if (platformLower === 'tiktok') badgeBg = 'bg-black';

        const card = `
          <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between group">
            <div class="relative">
              <img src="${item.image}" alt="${item.title}" class="w-full h-40 sm:h-48 object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
              <span class="absolute top-2 left-2 ${badgeBg} text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow">
                ${platformName || 'General'}
              </span>
              <span class="absolute top-2 right-2 bg-[#b91c1c] text-white text-[10px] font-extrabold px-2 py-0.5 rounded shadow">
                1 แถม 1
              </span>
            </div>
            
            <div class="p-3 flex-grow flex flex-col justify-between">
              <div>
                <h3 class="text-xs sm:text-sm font-semibold text-slate-800 line-clamp-2 mb-2 leading-snug">
                  ${item.title}
                </h3>
              </div>
              
              <div>
                <div class="flex items-baseline gap-1.5 my-1">
                  <span class="text-[#b91c1c] font-extrabold text-base sm:text-xl">฿${item.price}</span>
                  ${item.originalPrice ? `<span class="text-slate-400 text-xs line-through">฿${item.originalPrice}</span>` : ''}
                </div>
                
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                   class="block w-full text-center bg-[#b91c1c] hover:bg-[#991b1b] text-white text-xs font-bold py-2 rounded transition shadow-sm mt-2">
                  กดรับโปร 1 แถม 1
                </a>
              </div>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    // ฟังก์ชั่นกรองสินค้า (ลบฟังก์ชันซ้ำออกแล้ว)
    function filterCategory(category) {
      if (category === 'all') {
        renderProducts(allProducts);
      } else {
        const filtered = allProducts.filter(p => (p.platform || '').toString().toLowerCase() === category.toLowerCase());
        renderProducts(filtered);
      }
    }

    // เรียกทำงานเมื่อเปิดหน้า
    fetchProducts();
  </script>
</body>
</html>
