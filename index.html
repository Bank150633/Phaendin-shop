<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHAENDIN STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --navy: #00247D; --red: #ED1C24; --white: #FFFFFF; --bg: #F4F7FA; --gray: #bbb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); padding-top: 65px; padding-bottom: 80px; }
        header { position: fixed; top: 0; width: 100%; height: 60px; background: var(--navy); border-bottom: 3px solid var(--red); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px; }
        .p-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        
        .media-box { width: 100%; height: 160px; background: #000; position: relative; }
        .p-img, .p-video { width: 100%; height: 100%; object-fit: cover; }
        
        .badge-container { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; }
        .bg-green { background: #28a745; }
        .bg-yellow { background: #ffc107; color: #000; }
        .bg-province { background: var(--navy); border: 1px solid white; }
        
        .timer-box { position: absolute; bottom: 0; width: 100%; background: rgba(237, 28, 36, 0.9); color: #fff; text-align: center; font-size: 10px; padding: 4px 0; font-weight: bold; }

        .p-info { padding: 10px; flex-grow: 1; }
        .p-name { font-size: 14px; font-weight: 600; line-height: 1.2; height: 35px; overflow: hidden; color: var(--navy); }
        .p-desc { font-size: 11px; color: #666; margin-top: 4px; height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { color: var(--red); font-size: 19px; font-weight: bold; margin-top: 8px; }
        
        .btn-buy { width: 100%; padding: 12px; border: none; background: var(--red); color: white; font-weight: 600; cursor: pointer; }
        .btn-buy:disabled { background: var(--gray); cursor: not-allowed; }

        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--navy); display: flex; justify-content: space-around; align-items: center; border-top: 3px solid var(--red); }
        .nav-item { text-align: center; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 12px; }
        .nav-item i { font-size: 20px; display: block; }
    </style>
</head>
<body>
    <header><img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" height="35"></header>
    <div class="container" id="app"></div>
    <nav>
        <a href="#" class="nav-item"><i class="fa-solid fa-house"></i>หน้าแรก</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-truck"></i>เช็คพัสดุ</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-wallet"></i>ยอดผ่อน</a>
    </nav>

    <script>
        const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';

        async function load() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv`);
                const text = await res.text();
                let db = text.split('\n').slice(1).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
                
                db.sort(() => Math.random() - 0.5);

                let html = "";
                db.forEach((p, index) => {
                    const price = parseFloat(p[3]); 
                    const videoUrl = p[6]; 
                    const expireTimeStr = p[8] ? p[8].replace(/-/g, "/") : "";

                    let mediaHtml = `<img src="${p[1]}" class="p-img" onerror="this.src='https://via.placeholder.com/150'">`;
                    if (videoUrl && videoUrl.trim() !== "") {
                        mediaHtml = `<video class="p-video" src="${videoUrl}" autoplay loop muted playsinline></video>`;
                    }

                    html += `
                        <div class="p-card" id="card-${index}">
                            <div class="badge-container">
                                ${p[7] ? `<span class="badge bg-province"><i class="fa-solid fa-location-dot"></i> ${p[7]}</span>` : ''}
                                ${p[4] ? `<span class="badge bg-green promo-badge-${index}">${p[4]}</span>` : ''}
                                ${p[5] ? `<span class="badge bg-yellow promo-badge-${index}">${p[5]}</span>` : ''}
                            </div>
                            <div class="media-box">
                                ${mediaHtml}
                                ${expireTimeStr ? `<div class="timer-box" id="timer-${index}" data-time="${expireTimeStr}">รอสักครู่...</div>` : ''}
                            </div>
                            <div class="p-info">
                                <div class="p-name">${p[0]}</div>
                                <div class="p-desc">${p[2] || ''}</div>
                                <div class="p-price">฿${isNaN(price) ? '0' : price.toLocaleString()}</div>
                            </div>
                            <button class="btn-buy" id="btn-${index}" onclick="handleOrder('${p[0]}', ${price})">สั่งซื้อ / ผ่อนชำระ</button>
                        </div>
                    `;
                });

                document.getElementById('app').innerHTML = html;
                startTimers();
            } catch (e) { console.error(e); }
        }

        function startTimers() {
            const update = () => {
                const now = new Date().getTime();
                document.querySelectorAll('.timer-box').forEach(el => {
                    const targetStr = el.getAttribute('data-time');
                    const id = el.id.split('-')[1];
                    const target = new Date(targetStr).getTime();
                    const diff = target - now;
                    const btn = document.getElementById(`btn-${id}`);
                    const promoBadges = document.querySelectorAll(`.promo-badge-${id}`);

                    if (diff <= 0) {
                        el.innerText = "หมดเวลาโปรโมชั่น";
                        el.style.background = "#555";
                        if (btn) btn.disabled = true; // ปิดปุ่ม
                        // สั่งซ่อนป้าย %ส่วนลด หรือ 1แถม1 เมื่อหมดเวลา
                        promoBadges.forEach(badge => badge.style.display = 'none');
                    } else {
                        const h = Math.floor(diff / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);
                        el.innerText = `เหลือ ${h}ชม. ${m}น. ${s}ว.`;
                    }
                });
            };
            update();
            setInterval(update, 1000);
        }

        function handleOrder(name, price) {
            alert("สั่งซื้อ: " + name + "\nยอดผ่อน: ฿" + (price * 1.2).toLocaleString());
        }
        load();
    </script>
</body>
</html>
