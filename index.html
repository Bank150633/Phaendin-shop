<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --green-grad: linear-gradient(145deg, #11998e 0%, #38ef7d 100%);
            --blue-grad: linear-gradient(145deg, #00c6ff 0%, #0072ff 100%);
            --fb-grad: linear-gradient(145deg, #00c6ff 0%, #0072ff 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 55px; padding-bottom: 55px; transition: 0.3s; overflow-x: hidden; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 5px 10px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; height: 50px; }
        .logo-img { height: 45px; width: auto; display: block; }

        .search-wrap { position: relative; width: 100%; max-width: 500px; margin: 10px auto; padding: 0 10px; display: flex; align-items: center; gap: 8px; }
        #search { flex-grow: 1; padding: 8px 10px 8px 35px; border-radius: 12px; border: 1px solid var(--gold); background: var(--input-bg); color: var(--text); font-size: 12px; outline: none; }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 13px; }
        .theme-btn { background: var(--gold-grad); border: none; width: 30px; height: 30px; border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; flex-shrink: 0; }

        .banner-box { padding: 8px; margin-top: 5px; } 
        .bn-card { border: 2.5px solid var(--gold); border-radius: 18px; overflow: hidden; display: block; height: 220px; background: #000; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); position: relative; }
        .bn-img { width: 100%; height: 100%; position: relative; background: #000; cursor: pointer; }
        .bn-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 40%, transparent 100%); z-index: 2; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .bn-badges { position: absolute; top: 12px; left: 12px; display: flex; gap: 5px; z-index: 10; }
        
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; }
        .bn-title { font-size: 16px; font-weight: 600; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); line-height: 1.2; }
        .bn-timer-wrap { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .bn-timer { display: flex; gap: 4px; align-items: center; }
        .timer-unit { color: #ff4b2b; font-weight: 700; font-size: 13px; }

        .bn-txt .buy-now { width: auto !important; padding: 8px 18px !important; font-size: 11px !important; border-radius: 50px !important; }

        .sec-title { padding: 10px 10px 5px; font-size: 13px; font-weight: 600; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: contain; }
        .p-timer-badge { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 65, 108, 0.9); color: #fff; font-size: 8.5px; text-align: center; padding: 2px 0; font-weight: bold; z-index: 6; }
        .badge-container { position: absolute; top: 4px; left: 4px; display: flex; flex-direction: column; gap: 3px; z-index: 5; }
        .badge { font-size: 7px; padding: 2px 5px; border-radius: 3px; font-weight: 800; color: #fff; text-transform: uppercase; border: 0.5px solid rgba(255,255,255,0.2); }
        .bg-gold { background: var(--gold-grad); color: #000; }
        .bg-red { background: var(--red-grad); }

        .info { padding: 4px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .p-name { font-size: 10px; font-weight: 500; color: var(--gold); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-desc { font-size: 8px; color: var(--text-dim); text-align: center; height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .p-price { font-size: 12px; font-weight: 700; color: #fff; margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 9px; }
        .new-price { color: #ff4b2b; }

        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 6px 0; font-weight: 700; font-size: 10px; cursor: pointer; border-radius: 0 0 8px 8px; text-transform: uppercase; position: relative; overflow: hidden; }
        .buy-now::after { content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%; background: rgba(255, 255, 255, 0.4); transform: rotate(30deg); animation: shine 4s infinite; }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }

        /* การแจ้งเตือน Copy */
        .copy-notice { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: var(--gold); padding: 10px 20px; border-radius: 20px; font-size: 12px; border: 1px solid var(--gold); z-index: 10000; display: none; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; padding: 5px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 12px; width: 100%; max-width: 320px; padding: 8px; max-height: 95vh; overflow-y: auto; }
        
        .bank-box { background: rgba(212,175,55,0.1); border: 1.5px dashed var(--gold); padding: 8px; border-radius: 10px; margin: 8px 0; text-align: center; cursor: pointer; position: relative; }
        .bank-box:active { background: rgba(212,175,55,0.2); }

        .opt-sel { width: 100%; padding: 4px 8px; margin-bottom: 5px; border-radius: 6px; background: #1a1a1a; color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.4); font-size: 10px; outline: none; }
        .input-slim { width: 100%; padding: 6px; margin-bottom: 4px; border-radius: 6px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 11px; outline: none; }

        .stepper-wrap { display: flex; align-items: center; justify-content: space-between; background: rgba(212,175,55,0.05); padding: 6px 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(212,175,55,0.2); }
        .step-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--gold); background: transparent; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }

        nav { position: fixed; bottom: 0; width: 100%; height: 50px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 8px; cursor: pointer; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 15px; margin-bottom: 2px; }

        #zoomOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
    </style>
</head>
<body class="dark-mode">

<div id="copyNotice" class="copy-notice">คัดลอกเลขบัญชีแล้ว!</div>

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" alt="Logo" class="logo-img">
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-wrap">
    <i class="fa-solid fa-search search-icon"></i>
    <input type="text" id="search" placeholder="ค้นหาชื่อสินค้าที่ท่านต้องการ..." oninput="render()">
</div>

<div class="sec-title"><i class="fa-solid fa-layer-group"></i> สินค้าแนะนำวันนี้</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:6px; font-size:13px;">ยืนยันการสั่งซื้อ</h4>
        <div id="orderDetail" style="background:rgba(212,175,55,0.08); padding:8px; border-radius:10px; margin-bottom:8px; border:1px solid rgba(212,175,55,0.3);"></div>
        <form id="orderForm">
            <div id="optionBox"></div>
            <div class="stepper-wrap">
                <span style="font-size:10px; color:var(--gold);">จำนวน</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button type="button" class="step-btn" onclick="updateQty(-1)"><i class="fa-solid fa-minus"></i></button>
                    <span id="qtyDisplay" style="font-weight:bold;">1</span>
                    <button type="button" class="step-btn" onclick="updateQty(1)"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required class="input-slim" style="height:45px;"></textarea>
            
            <div class="bank-box" onclick="copyBank('0358567622')">
                <p style="font-size:9px; color:var(--gold);">🏦 กสิกรไทย (แตะเพื่อคัดลอก)</p>
                <p style="font-size:15px; font-weight:800; color:#fff; letter-spacing:1px;">035-8-56762-2</p>
                <p style="font-size:10px; color:var(--text-dim);">ชื่อบัญชี: แผ่นดิน & ต้นไม้</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=0358567622" style="width:60px; margin-top:5px; border:1px solid #fff; border-radius:4px;">
            </div>
            
            <div style="border:1px dashed var(--gold); padding:6px; border-radius:8px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:9px; color:var(--gold);">📸 คลิกแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:60px; margin:5px auto; border-radius:4px;">
            </div>
            
            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:8px; border-radius:8px; padding: 10px 0;">ยืนยันสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:6px; font-size:10px;">[ ยกเลิก ]</p>
        </form>
    </div>
</div>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center; padding: 15px;">
        <h4 style="color:var(--gold); margin-bottom:12px;">ติดต่อเรา</h4>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:8px; border-radius:6px; text-decoration:none; margin-bottom:8px;"><i class="fa-solid fa-phone"></i> โทรสายด่วน</a>
        <a href="https://line.me/ti/p/YOUR_ID" style="display:block; background:#06c755; color:#fff; padding:8px; border-radius:6px; text-decoration:none; margin-bottom:8px;"><i class="fa-brands fa-line"></i> Line OA</a>
        <p onclick="closeModal('contactModal')" style="color:var(--text-dim); cursor:pointer; font-size:10px;">[ ปิด ]</p>
    </div>
</div>

<div id="zoomOverlay" onclick="closeZoom()"><div id="zoomContent"></div></div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null, selectedQty = 1;

    async function init() {
        try {
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const bRaw = await resB.text();
            const b = bRaw.split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-badges">${[b[3],b[4],b[5]].filter(t=>t&&t!=='-').map(t=>`<span class="badge ${t.includes('โปร')?'bg-red':'bg-gold'}">${t}</span>`).join('')}</div>
                        <div class="bn-img" onclick="zoom('${b[0]}')">${renderMedia(b[0],true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">🔥 ${b[1]}</div>
                            <div class="bn-timer-wrap"><div class="bn-timer"><span class="timer-unit" id="th">00</span>:<span class="timer-unit" id="tm">00</span>:<span class="timer-unit" id="ts">00</span></div></div>
                            <button class="buy-now" style="width:100px; border-radius:50px;" onclick="openOrder('${b[1]}','${b[6]}','${b[7]}','${b[8]}',${b[9]||0},10,'${b[0]}')">สั่งซื้อด่วน</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const pRaw = await resP.text();
            db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
            setInterval(updateProductTimers, 1000);
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const now = Date.now();
        document.getElementById('productGrid').innerHTML = db.filter(p => p[0].toLowerCase().includes(query)).map(p => {
            let price = parseFloat(p[3]), promo = parseFloat(p[10]), expire = p[11]?new Date(p[11]).getTime():0;
            let current = (promo>0 && expire>now) ? promo : price;
            return `<div class="card">
                <div class="media-wrap" onclick="zoom('${p[1]}')">
                    <div class="badge-container">
                        ${current<price?`<span class="badge bg-red">ลดแรง</span>`:''}
                        ${[p[4],p[5],p[6]].filter(t=>t&&t!=='-').map(t=>`<span class="badge bg-gold">${t}</span>`).join('')}
                    </div>
                    ${renderMedia(p[1],true)}
                    ${(promo>0 && expire>now)?`<div class="p-timer-badge" data-expire="${p[11]}">⏳ 00:00:00</div>`:''}
                </div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">
                        ${current<price?`<span class="old-price">฿${price}</span>`:''}
                        <span class="${current<price?'new-price':''}">฿${current.toLocaleString()}</span>
                    </div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${price}','${p[8]||0}','${p[9]||''}',${current<price?Math.round((price-promo)/price*100):0},10,'${p[1]}')">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function copyBank(num) {
        navigator.clipboard.writeText(num).then(() => {
            const n = document.getElementById('copyNotice');
            n.style.display = 'block'; setTimeout(() => n.style.display = 'none', 2000);
        });
    }

    function openOrder(n, p, s, opt, disc, lim, img) {
        selectedQty = 1;
        activeP = { name: n, pNormal: parseFloat(p), ship: parseFloat(s), disc: disc, limit: lim, img: img };
        document.getElementById('qtyDisplay').innerText = selectedQty;
        const box = document.getElementById('optionBox'); box.innerHTML = '';
        if(opt && opt !== '-') {
            let html = `<select id="pOpt" class="opt-sel" onchange="updatePrice()">`;
            opt.split(',').forEach(o => {
                let pts = o.split(':');
                html += `<option value="${pts[1]||p}" data-label="${pts[0]}">${pts[0]}</option>`;
            });
            box.innerHTML = html + `</select>`;
        }
        updatePrice(); openModal('orderModal');
    }

    function updateQty(v) { let n = selectedQty + v; if(n>=1 && n<=activeP.limit) { selectedQty = n; document.getElementById('qtyDisplay').innerText = n; updatePrice(); } }
    
    function updatePrice() {
        const sel = document.getElementById('pOpt');
        let base = sel ? parseFloat(sel.value) : activeP.pNormal;
        let discounted = activeP.disc > 0 ? base * (1 - (activeP.disc / 100)) : base;
        activeP.total = (discounted * selectedQty) + activeP.ship;
        document.getElementById('orderDetail').innerHTML = `<div style="display:flex; gap:10px;"><img src="${activeP.img}" style="width:50px; height:50px; border-radius:5px; object-fit:cover;"><div><p style="font-size:11px; color:var(--gold);">${activeP.name}</p><p style="font-size:15px; font-weight:bold;">฿${activeP.total.toLocaleString()}</p></div></div>`;
    }

    function updateProductTimers() {
        document.querySelectorAll('.p-timer-badge').forEach(el => {
            const d = new Date(el.getAttribute('data-expire')).getTime() - Date.now();
            if(d>0) {
                const h = Math.floor(d/3600000).toString().padStart(2,'0');
                const m = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
                const s = Math.floor((d%60000)/1000).toString().padStart(2,'0');
                el.innerText = `⏳ ${h}:${m}:${s}`;
            } else { el.style.display = 'none'; }
        });
    }

    function renderMedia(url, m) { return url.match(/\.(mp4|webm|mov)$/i) ? `<video src="${url}" ${m?'autoplay loop muted playsinline':'controls'} style="width:100%; height:100%; object-fit:cover;"></video>` : `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`; }
    function openModal(id) { const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none',300); }
    function handleFile(i) { if(i.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display='block'; document.getElementById('upTxt').style.display='none'; }; r.readAsDataURL(i.files[0]); } }
    function tick() { if(!bannerEnd) return; const d = bannerEnd - Date.now(); if(d>0) { document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0'); document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0'); document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0'); } }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function zoom(url) { document.getElementById('zoomContent').innerHTML = renderMedia(url,false); document.getElementById('zoomOverlay').style.display='flex'; }
    function closeZoom() { document.getElementById('zoomOverlay').style.display='none'; }
    
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        btn.innerText = "กำลังส่ง..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name} | จำนวน: ${selectedQty} | ยอด: ฿${activeP.total}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ!"); location.reload();
            } catch(err) { alert("ล้มเหลว"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    async function checkShip() {
        const p = prompt("เบอร์โทรที่ใช้สั่งซื้อ:"); if(!p) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const rows = (await res.text()).split('\n').slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const f = rows.find(r => r[0] === p);
        if(f) alert(`คุณ ${f[1]}\nสถานะ: ${f[2]}\nพัสดุ: ${f[3]}`);
        else alert("ไม่พบข้อมูล");
    }

    init();
</script>
</body>
</html>
