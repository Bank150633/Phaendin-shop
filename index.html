<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | PREMIUM</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --red-grad: linear-gradient(145deg, #ff4b2b 0%, #ff416c 100%);
            --green-grad: linear-gradient(145deg, #11998e 0%, #38ef7d 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 65px; transition: 0.3s; overflow-x: hidden; }

        /* ส่วนแบนเนอร์ */
        .banner-box { padding: 8px; margin-top: 5px; } 
        .bn-card { border: 2px solid var(--gold); border-radius: 18px; overflow: hidden; display: block; height: 210px; background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); position: relative; }
        .bn-img { width: 100%; height: 100%; position: relative; background: #000; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .bn-badges { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 10; }
        .bn-txt { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 12px; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); }
        .bn-title { font-size: 16px; font-weight: 600; color: var(--gold); text-shadow: 2px 2px 4px rgba(0,0,0,0.9); margin-bottom: 5px; }
        .bn-timer-wrap { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        .bn-timer { display: flex; gap: 3px; }
        .timer-unit { background: #ff4b2b; color: #fff; padding: 2px 5px; border-radius: 4px; font-weight: bold; font-size: 11px; min-width: 24px; text-align: center; }

        /* ส่วนค้นหาใหม่ ใต้แบนเนอร์ */
        .search-container { padding: 0 10px; margin: 10px 0; }
        .search-wrap { 
            position: relative; display: flex; align-items: center; gap: 10px; 
            background: var(--card); padding: 8px 12px; border-radius: 12px; 
            border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #search { flex-grow: 1; background: transparent; border: none; color: var(--text); font-size: 12px; outline: none; }
        .search-icon { color: var(--gold); font-size: 14px; }
        .theme-btn { 
            background: var(--gold-grad); border: none; width: 28px; height: 28px; 
            border-radius: 8px; color: #000; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; font-size: 12px; 
        }

        /* Grid สินค้า */
        .sec-title { padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; }
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: contain; }
        
        /* สไตล์ปุ่มและ Badge */
        .badge { font-size: 7px; padding: 2px 5px; border-radius: 3px; font-weight: 800; color: #fff; text-transform: uppercase; }
        .bg-gold { background: var(--gold-grad); color: #000; }
        .bg-red { background: var(--red-grad); }
        .p-name { font-size: 10px; font-weight: 500; color: var(--gold); text-align: center; padding: 4px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-price { font-size: 11px; font-weight: 700; color: #fff; text-align: center; padding-bottom: 5px; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 7px 0; font-weight: 700; font-size: 10px; cursor: pointer; text-transform: uppercase; }

        /* Modal & Stepper */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; padding: 10px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: var(--bg); border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 300px; padding: 15px; max-height: 90vh; overflow-y: auto; }
        .stepper-wrap { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .step-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; }
        .step-btn:disabled { opacity: 0.2; color: #666; border-color: #666; }
        .input-slim { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; background: var(--input-bg); color: #fff; border: 1px solid #333; font-size: 12px; outline: none; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; border-top: 1px solid rgba(212,175,55,0.3); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 9px; }
        .nav-tab.active { color: var(--gold); }
    </style>
</head>
<body class="dark-mode">

<div class="banner-box" id="banner"></div>

<div class="search-container">
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาสินค้าที่ต้องการ..." oninput="render()">
        <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
    </div>
</div>

<div class="sec-title"><i class="fa-solid fa-star"></i> สินค้าแนะนำ</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-house"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-truck"></i> พัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-comment-dots"></i> ติดต่อ</div>
</nav>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:12px;">รายละเอียดการสั่งซื้อ</h4>
        <div id="orderDetail" style="background:rgba(212,175,55,0.08); padding:10px; border-radius:10px; margin-bottom:12px; border:1px solid rgba(212,175,55,0.2);"></div>
        
        <form id="orderForm">
            <div id="optionBox"></div>
            
            <div class="stepper-wrap">
                <span style="font-size:11px; color:var(--gold);">จำนวนที่ต้องการ</span>
                <div style="display:flex; align-items:center; gap:15px;">
                    <button type="button" class="step-btn" onclick="updateQty(-1)" id="btnMinus"><i class="fa-solid fa-minus"></i></button>
                    <span id="qtyDisplay" style="font-weight:bold; color:#fff;">1</span>
                    <button type="button" class="step-btn" onclick="updateQty(1)" id="btnPlus"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required class="input-slim">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required class="input-slim">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่งโดยละเอียด" required class="input-slim" style="height:60px;"></textarea>
            
            <div style="text-align:center; margin: 10px 0; background:rgba(255,255,255,0.03); padding:10px; border-radius:10px;">
                <p style="font-size:11px; color:var(--gold);">🏦 กสิกรไทย: 035-8-56762-2</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=0358567622" style="width:110px; margin-top:5px; border:2px solid #fff;">
            </div>

            <div style="border:1px dashed var(--gold); padding:10px; border-radius:10px; text-align:center; cursor:pointer;" onclick="document.getElementById('fileIn').click()">
                <span id="upTxt" style="font-size:11px; color:var(--gold);">📸 คลิกเพื่อแนบสลิปโอนเงิน</span>
                <input type="file" id="fileIn" style="display:none" onchange="handleFile(this)" accept="image/*">
                <img id="preview" style="display:none; width:100%; margin-top:5px; border-radius:5px;">
            </div>

            <button type="submit" id="submitBtn" class="buy-now" style="margin-top:15px; border-radius:10px; font-size:12px;">ยืนยันการสั่งซื้อ</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:var(--text-dim); cursor:pointer; margin-top:12px; font-size:11px;">[ กลับไปเลือกสินค้า ]</p>
        </form>
    </div>
</div>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center;">
        <h4 style="color:var(--gold); margin-bottom:15px;">ช่องทางการติดต่อ</h4>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:10px; border-radius:8px; text-decoration:none; margin-bottom:10px;">📞 โทรหาเจ้าหน้าที่</a>
        <a href="#" style="display:block; background:#06c755; color:#fff; padding:10px; border-radius:8px; text-decoration:none; margin-bottom:10px;">💬 LINE Official</a>
        <p onclick="closeModal('contactModal')" style="color:var(--text-dim); cursor:pointer; font-size:11px; margin-top:10px;">[ ปิด ]</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    
    let db = [], activeP = {}, bannerEnd = null;
    let selectedQty = 1;

    async function init() {
        try {
            // โหลด Banner
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-badges">${[b[3], b[4], b[5]].filter(t => t && t !== '-').map(t => `<span class="badge ${t.includes('โปร')?'bg-red':'bg-gold'}">${t}</span>`).join('')}</div>
                        <div class="bn-img">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">🔥 ${b[1]}</div>
                            <div class="bn-timer-wrap">
                                <div class="bn-timer">
                                    <span class="timer-unit" id="th">00</span> : <span class="timer-unit" id="tm">00</span> : <span class="timer-unit" id="ts">00</span>
                                </div>
                            </div>
                            <button class="buy-now" style="width:120px; padding:6px; border-radius:50px;" 
                                onclick="openOrder('${b[1]}','${b[6]||0}','${b[7]||0}','${b[8]||''}', ${b[9]||0}, ${b[10]||10})">
                                รับสิทธิ์ด่วน
                            </button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }

            // โหลดสินค้า
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        
        document.getElementById('productGrid').innerHTML = filtered.map((p) => {
            let price = parseFloat(p[3] || 0);
            let buyLimit = p[12] ? parseInt(p[12]) : 10;
            return `
            <div class="card">
                <div class="media-wrap">
                    <div style="position:absolute; top:5px; left:5px;">${p[4]!=='--'?`<span class="badge bg-red">${p[4]}</span>`:''}</div>
                    ${renderMedia(p[1], true)}
                </div>
                <div class="p-name">${p[0]}</div>
                <div class="p-price">฿${price.toLocaleString()}</div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${price}','${p[8]||0}','${p[9]||''}', 0, ${buyLimit})">สั่งซื้อ</button>
            </div>`;
        }).join('');
    }

    function openOrder(n, pNormal, s, optStr, discPercent, buyLimit) {
        selectedQty = 1; 
        activeP = { name: n, pNormal: parseFloat(pNormal), ship: parseFloat(s), disc: discPercent, optLabel: '', limit: buyLimit };
        
        document.getElementById('qtyDisplay').innerText = selectedQty;
        const box = document.getElementById('optionBox');
        box.innerHTML = '';
        if(optStr && optStr !== '-') {
            let html = `<label style="font-size:10px; color:var(--gold);">เลือกตัวเลือก:</label><select id="pOpt" class="input-slim" onchange="updatePrice()" style="margin-top:5px;">`;
            optStr.split(',').forEach((o) => {
                let pts = o.split(':');
                let label = pts[0].trim(), price = pts[1] ? parseFloat(pts[1]) : activeP.pNormal;
                html += `<option value="${price}" data-label="${label}">${label} (฿${price.toLocaleString()})</option>`;
            });
            box.innerHTML = html + `</select>`;
        }
        updatePrice();
        openModal('orderModal');
    }

    function updateQty(val) {
        const nextQty = selectedQty + val;
        if (nextQty >= 1 && nextQty <= activeP.limit) {
            selectedQty = nextQty;
            document.getElementById('qtyDisplay').innerText = selectedQty;
            updatePrice();
        }
    }

    function updatePrice() {
        document.getElementById('btnPlus').disabled = (selectedQty >= activeP.limit);
        document.getElementById('btnMinus').disabled = (selectedQty <= 1);

        const sel = document.getElementById('pOpt');
        let basePrice = activeP.pNormal;
        if(sel) {
            basePrice = parseFloat(sel.value);
            activeP.optLabel = ` [${sel.options[sel.selectedIndex].getAttribute('data-label')}]`;
        }
        let discounted = activeP.disc > 0 ? basePrice * (1 - (activeP.disc / 100)) : basePrice;
        activeP.total = (discounted * selectedQty) + activeP.ship;
        
        document.getElementById('orderDetail').innerHTML = `
            <div style="font-size:11px; color:#fff;">${activeP.name}${activeP.optLabel}</div>
            <div style="font-size:20px; font-weight:800; color:var(--gold); margin-top:5px;">฿${activeP.total.toLocaleString()}</div>
            <div style="font-size:10px; color:var(--text-dim);">฿${discounted.toLocaleString()} x ${selectedQty} ชิ้น + ส่ง ฿${activeP.ship}</div>
        `;
    }

    function renderMedia(url, isMuted) {
        if(!url) return '';
        if(url.match(/\.(mp4|webm|mov)$/i)) return `<video src="${url}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
        return `<img src="${url}" style="width:100%; height:100%; object-fit:cover;">`;
    }

    function openModal(id) { const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none', 300); }
    function handleFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = e => { document.getElementById('preview').src = e.target.result; document.getElementById('preview').style.display = 'block'; document.getElementById('upTxt').style.display = 'none'; }; r.readAsDataURL(input.files[0]); } }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const file = document.getElementById('fileIn').files[0];
        if(!file) return alert("กรุณาแนบสลิป!");
        btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;
        const reader = new FileReader();
        reader.onload = async () => {
            const data = {
                productDetail: `${activeP.name}${activeP.optLabel} | x${selectedQty} | ฿${activeP.total}`,
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddr').value,
                file: reader.result.split(',')[1]
            };
            try {
                await fetch(APPS_URL, { method: 'POST', body: new URLSearchParams(data), mode: 'no-cors' });
                alert("สั่งซื้อสำเร็จ! เจ้าหน้าที่จะติดต่อกลับโดยเร็วที่สุด"); location.reload();
            } catch(err) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; }
        };
        reader.readAsDataURL(file);
    };

    init();
</script>
</body>
</html>
