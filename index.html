<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHAENDIN SHOP</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:sans-serif;
background:#0a0a0a;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#111;
position:sticky;
top:0;
z-index:100;
}

.logo{
color:#00eaff;
font-weight:bold;
font-size:18px;
}

.search{
width:100%;
padding:10px;
border:none;
border-radius:8px;
margin:10px 0;
}

.container{
padding:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
gap:10px;
}

.card{
background:#161616;
border-radius:10px;
overflow:hidden;
position:relative;
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.name{
padding:5px;
font-size:14px;
}

.price{
padding:5px;
color:#00eaff;
font-weight:bold;
}

.viewer{
font-size:10px;
color:#aaa;
padding-left:5px;
}

.btn{
background:#00eaff;
border:none;
width:90%;
margin:10px auto;
display:block;
padding:8px;
border-radius:8px;
cursor:pointer;
}

.cart-btn{
position:fixed;
bottom:20px;
right:20px;
background:#00eaff;
color:black;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
z-index:999;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
}

.modal-box{
background:#111;
padding:20px;
border-radius:10px;
width:90%;
max-width:400px;
}

body.light{
background:#f2f2f2;
color:black;
}

.badge{
position:absolute;
top:5px;
left:5px;
background:red;
padding:3px 6px;
font-size:10px;
border-radius:5px;
}

.fav{
position:absolute;
top:5px;
right:5px;
cursor:pointer;
}

</style>
</head>

<body>

<header>

<div class="logo">PHAENDIN SHOP</div>

<i class="fa fa-moon" onclick="toggleTheme()"></i>

</header>

<div class="container">

<input id="search" class="search" placeholder="ค้นหาสินค้า...">

<div id="products" class="grid"></div>

</div>

<div class="cart-btn" onclick="openCart()">
<i class="fa fa-shopping-cart"></i>
</div>

<div id="cartModal" class="modal">
<div class="modal-box">

<h3>ตะกร้าสินค้า</h3>

<div id="cartItems"></div>

<hr>

รวม <span id="total">0</span> บาท

<button class="btn" onclick="checkout()">ชำระเงิน</button>

<button class="btn" onclick="closeCart()">ปิด</button>

</div>
</div>

<script>

let products=[

{id:1,name:"เสื้อยืดแฟชั่น",price:199,img:"https://picsum.photos/300?1"},
{id:2,name:"รองเท้าผ้าใบ",price:590,img:"https://picsum.photos/300?2"},
{id:3,name:"หมวกเท่ๆ",price:150,img:"https://picsum.photos/300?3"},
{id:4,name:"กระเป๋าแฟชั่น",price:390,img:"https://picsum.photos/300?4"}

]

let cart=[]

let favorites=JSON.parse(localStorage.getItem("fav")||"[]")

function viewers(){
return Math.floor(Math.random()*80)+20
}

function render(list=products){

const grid=document.getElementById("products")

grid.innerHTML=""

list.forEach(p=>{

let sold=Math.floor(Math.random()*500)

grid.innerHTML+=`

<div class="card">

${sold>300?'<div class="badge">ขายดี</div>':''}

<div class="fav" onclick="toggleFav('${p.name}')">

<i class="fa-solid fa-heart" style="color:${favorites.includes(p.name)?'#ff4b2b':'#999'}"></i>

</div>

<img loading="lazy" src="${p.img}">

<div class="name">${p.name}</div>

<div class="price">${p.price} บาท</div>

<div class="viewer">👁️ ${viewers()} คนกำลังดู</div>

<button class="btn" onclick="addCart(${p.id})">ใส่ตะกร้า</button>

</div>

`

})

}

render()

function toggleFav(name){

if(favorites.includes(name)){

favorites=favorites.filter(x=>x!==name)

}else{

favorites.push(name)

}

localStorage.setItem("fav",JSON.stringify(favorites))

render()

}

function addCart(id){

const p=products.find(x=>x.id==id)

cart.push(p)

updateCart()

}

function updateCart(){

const box=document.getElementById("cartItems")

box.innerHTML=""

let total=0

cart.forEach(c=>{

total+=c.price

box.innerHTML+=`<div>${c.name} - ${c.price}</div>`

})

document.getElementById("total").innerText=total

}

function openCart(){

document.getElementById("cartModal").style.display="flex"

updateCart()

}

function closeCart(){

document.getElementById("cartModal").style.display="none"

}

function checkout(){

alert("โอนเงินแล้วส่งสลิป")

}

document.getElementById("search").addEventListener("input",e=>{

const q=e.target.value.toLowerCase()

const filtered=products.filter(p=>p.name.toLowerCase().includes(q))

render(filtered)

})

function toggleTheme(){

document.body.classList.toggle("light")

}

</script>

</body>
</html>
