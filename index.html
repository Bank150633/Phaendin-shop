<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHAENDIN STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Kanit', sans-serif; 
            background: #000; 
            color: #fff; 
            padding-bottom: 120px; /* เว้นที่ด้านล่างให้ปุ่มฟุตเตอร์ */
        }

        /* 1. ส่วนหัวและแบนเนอร์ */
        header { 
            background: #000; 
            padding: 10px; 
            text-align: center; 
            border-bottom: 1px solid #222;
        }
        .banner-box { 
            width: 100%; 
            height: 150px; 
            background: #111; 
            border-radius: 12px; 
            border: 1px solid #D4AF37;
            overflow: hidden;
            margin-top: 10px;
        }
        #bannerImg { width: 100%; height: 100%; object-fit: cover; }

        /* 2. รายการสินค้า */
        main { padding: 15px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }
        .card { 
            background: #111; 
            border-radius: 12px; 
            border: 1px solid #222; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .media-box { width: 100%; aspect-ratio: 1/1; cursor: pointer; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; }
        .price { color: #D4AF37; font-size: 18px; font-weight: bold; }
        .buy-btn { 
            background: #D4AF37; 
            color: #000; 
            text-align: center; 
            padding: 10px; 
            border-radius: 8px; 
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 3. ฟุตเตอร์ (จุดสำคัญที่เคยหาย) */
        .footer-fixed { 
            position: fixed; 
            bottom: 20px; 
            left: 5%; 
            width: 90%; 
            background: #28a745; 
            color: #fff; 
            padding: 18px; 
            border-radius: 50px; 
            text-align: center; 
            font-weight: bold; 
            z-index: 9999; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            text-decoration: none;
            display: block;
            font-size: 16px;
        }

        /* 4. หน้าต่างดูรูป */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 10000; 
            align-items: center; justify-content: center; 
        }
        .modal-content { max-width: 90%; max-height: 80%; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" style="height:35px;">
    <div class="banner-box">
        <img id="bannerImg" src="">
    </div>
</header>

<main>
    <div class="grid" id="main-list">
        </div>
</main>

<a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" class="footer-fixed">
    💰 แจ้งโอนเงิน / ยืนยันคำสั่งซื้อ
</a>

<div id="mediaModal" class="modal" onclick="this.style.display='none'">
    <div id="modalBody"></div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    async function loadData() {
        try {
            // โหลด Banner
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const bLines = textB.split('\n');
            if(bLines[1]) document.getElementById('bannerImg').src = bLines[1].split(',')[0].replace(/"/g,'');

            // โหลดสินค้า
            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            const rows = textP.split('\n').slice(1);
            
            const db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            document.getElementById('main-list').innerHTML = db.map(p => `
                <div class="card">
                    <div class="media-box" onclick="showMedia('${p[1]}')">
                        ${p[1].includes('.mp4') ? `<video src="${p[1]}" autoplay loop muted playsinline></video>` : `<img src="${p[1]}">`}
                    </div>
                    <div class="info">
                        <div style="font-size:14px; margin-bottom:5px;">${p[0]}</div>
                        <div class="price">฿${p[3]}</div>
                        <div class="buy-btn" onclick="showMedia('${p[1]}')">ดูรูปใหญ่</div>
                    </div>
                </div>
            `).join('');
        } catch(e) { console.error("โหลดข้อมูลไม่สำเร็จ:", e); }
    }

    function showMedia(url) {
        const content = url.includes('.mp4') ? `<video src="${url}" controls autoplay class="modal-content"></video>` : `<img src="${url}" class="modal-content">`;
        document.getElementById('modalBody').innerHTML = content;
        document.getElementById('mediaModal').style.display = 'flex';
    }

    loadData();
</script>
</body>
</html>
