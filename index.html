<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* เพิ่มระยะขอบล่างให้มากขึ้นเพื่อให้สินค้าชิ้นสุดท้ายไม่โดนปุ่มทับ */
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 180px; overflow-x: hidden; } 

        /* Header & Banner - ปรับความเสถียร */
        header { position: fixed; top: 0; width: 100%; background: #000; z-index: 2000; border-bottom: 1px solid #222; }
        .logo-row { display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .logo-img { height: 32px; object-fit: contain; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { width: 100%; height: 140px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); position: relative; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Search & Categories */
        .nav-container { padding: 0 12px 10px; background: #000; }
        #search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 8px; outline: none; font-size: 14px; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-item { font-size: 12px; color: #aaa; padding: 6px 18px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; border-color: var(--gold); }

        /* Layout - ปรับ Margin ให้สอดคล้องกับความสูง Header */
        main { margin-top: 310px; }
        .section-label { font-size: 14px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        /* สินค้าแนะนำ */
        .rec-list { display: flex; gap: 12px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
        .rec-list::-webkit-scrollbar { display: none; }
        .rec-card { min-width: 140px; width: 140px; border-radius: 12px; overflow: hidden; border: 1px solid #222; background: #111; }
        .rec-media { width: 100%; aspect-ratio: 1/1; cursor: pointer; background: #000; position: relative; }
        .rec-media img, .rec-media video { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { background: var(--gold); color: #000; font-size: 14px; font-weight: bold; text-align: center; padding: 10px 0; cursor: pointer; }

        /* รายการสินค้าทั้งหมด */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 1px solid #222; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; background: #000; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 8px; left: 8px; background: var(--red); color: #fff; font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: bold; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        
        .info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 14px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price-row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; padding-bottom: 10px; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; }
        .price-old { color: #666; font-size: 12px; text-decoration: line-through; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 8px; cursor: pointer; border: none; transition: 0.2s; }
        .buy-btn:active { opacity: 0.8; transform: scale(0.98); }

        /* Footer - ปรับตำแหน่งให้เด่นและไม่บังเนื้อหาจนเกินไป */
        .footer-fixed { position: fixed; bottom: 20px; left: 5%; width: 90%; background: var(--green); color: white; padding: 18px; border-radius: 50px; text-align: center; font-weight: bold; z-index: 3000; box-shadow: 0 8px 30px rgba(0,0,0,0.8); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; border: 2px solid rgba(255,255,255,0.1); }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 20px; }
        .modal-body { max-width: 100%; max-height: 80vh; display: flex; justify-content: center; }
        .modal-body img, .modal-body video { max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 380px; padding: 25px; text-align: center; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img" alt="Logo"></div>
    <div class="banner-container">
        <div class="banner-slide" id="bannerBox">
            <img id="bannerImg" src="" style="display:none;" alt="Banner">
        </div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<div class="footer-fixed" onclick="document.getElementById('orderModal').style.display='flex'">
    💰 แจ้งโอนเงิน / ยืนยันคำสั่งซื้อ
</div>

<div id="mediaModal" class="modal" onclick="this.style.display='none'"><div id="modalBody" class="modal-body"></div></div>

<div id="orderModal" class="modal">
    <div class="order-card" onclick="event.stopPropagation()">
        <h3 style="color:var(--gold); margin-bottom:15px; font-size: 20px;">สรุปยอดชำระ</h3>
        <div id="orderSummary" style="background:#000; padding:18px; border-radius:12px; margin-bottom:20px; text-align:left; border-left:4px solid var(--gold); line-height:1.8; font-size: 15px;"></div>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" target="_blank" style="display:block; background:var(--green); color:white; padding:16px; border-radius:12px; text-decoration:none; font-weight:bold; font-size:17px; margin-bottom: 10px;">ยืนยันและส่งสลิป</a>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:#888; cursor:pointer; font-size: 14px;">ปิดหน้าต่าง</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], cur = 'all';

    function createMediaHTML(url) {
        if(!url) return '';
        const isVid = url.toLowerCase().match(/\.(mp4|webm|mov)$/);
        return isVid ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" loading="lazy">`;
    }

    function openMedia(url) {
        document.getElementById('modalBody').innerHTML = createMediaHTML(url);
        document.getElementById('mediaModal').style.display = 'flex';
    }

    async function loadData() {
        try {
            // ดึง Banner
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const bRows = textB.split(/\r?\n/).slice(1);
            if(bRows[0]) {
                const bUrl = bRows[0].split(',')[0].replace(/"/g,'');
                if(bUrl && bUrl.startsWith('http')) {
                    const img = document.getElementById('bannerImg');
                    img.src = bUrl;
                    img.onload = () => img.style.display = 'block';
                }
            }

            // ดึงสินค้า
            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            const raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            dbAll = raw;
            dbRec = raw.filter(p => p[5] === 'แนะนำ');
            
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { console.error("Error loading data:", e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();

        const getPriceData = (p) => {
            const target = p[7] ? new Date(p[7]).getTime() : 0;
            const expired = target > 0 && target < now;
            return {
                sale: (expired || !p[4]) ? p[3] : p[4],
                old: (!expired && p[4]) ? p[3] : null
            };
        };

        // แนะนำ
        if(dbRec.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRec.map(p => {
                const pd = getPriceData(p);
                return `<div class="rec-card">
                    <div class="rec-media" onclick="openMedia('${p[1]}')">${createMediaHTML(p[1])}</div>
                    <div class="rec-price" onclick="openOrder('${p[0]}','${pd.sale}','${p[8]}')">฿${pd.sale}</div>
                </div>`;
            }).join('');
        } else { document.getElementById('rec-area').style.display = 'none'; }

        // ทั้งหมด
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (cur === 'all' || p[6] === cur));
        document.getElementById('main-list').innerHTML = filt.map(p => {
            const pd = getPriceData(p);
            return `<div class="card">
                <div class="media" onclick="openMedia('${p[1]}')">
                    ${p[7] ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}
                    ${createMediaHTML(p[1])}
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price-row">
                        <span class="price">฿${pd.sale}</span>
                        ${pd.old ? `<span class="price-old">฿${pd.old}</span>` : ''}
                    </div>
                    <div class="buy-btn" onclick="openOrder('${p[0]}','${pd.sale}','${p[8]}')">สั่งซื้อ</div>
                </div>
            </div>`;
        }).join('');

        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${cur === c[0] ? 'active' : ''}" onclick="cur='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        let shouldRefresh = false;
        document.querySelectorAll('.timer-badge').forEach(el => {
            const dist = new Date(el.dataset.time).getTime() - now;
            if (dist < 0) { 
                if(el.innerHTML !== "จบโปรโมชั่น") { el.innerHTML = "จบโปรโมชั่น"; el.style.background = "#444"; shouldRefresh = true; }
            } else {
                const h = String(Math.floor(dist / 3600000)).padStart(2, '0');
                const m = String(Math.floor((dist % 3600000) / 60000)).padStart(2, '0');
                const s = String(Math.floor((dist % 60000) / 1000)).padStart(2, '0');
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
        if(shouldRefresh) render(); 
    }

    function openOrder(name, price, shipping) {
        const s = parseFloat(shipping) || 0;
        const p = parseFloat(price) || 0;
        const total = p + s;
        document.getElementById('orderSummary').innerHTML = `
            <b style="color:var(--gold)">รายการ:</b> ${name}<br>
            <b>ราคา:</b> ฿${p.toLocaleString()}<br>
            <b>ค่าจัดส่ง:</b> ${s === 0 ? '<span style="color:var(--green)">ส่งฟรี</span>' : '฿' + s.toLocaleString()}<br>
            <hr style="border:0; border-top:1px solid #333; margin:12px 0;">
            <b style="font-size:20px;">ยอดสุทธิ: <span style="color:var(--gold)">฿${total.toLocaleString(undefined, {minimumFractionDigits: 2})}</span></b>
        `;
        document.getElementById('orderModal').style.display = 'flex';
    }

    loadData();
</script>
</body>
</html>
