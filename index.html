<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phaendin Rent</title>

<style>
body { font-family:sans-serif; margin:0; background:#f1f5f9;}
header { background:#0ea5e9; color:#fff; padding:15px; text-align:center;}
.container { padding:15px; max-width:500px; margin:auto;}

.card {
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 3px 6px rgba(0,0,0,0.1);
}

input, textarea {
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

button {
  width:100%;
  background:#0ea5e9;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:8px;
  margin-top:5px;
}

.delete {
  background:red;
}

img { width:100%; border-radius:10px; }
</style>
</head>

<body>

<header>
  <h2>🔄 Phaendin Rent</h2>
</header>

<div class="container">

<h3>📦 ลงของให้เช่า</h3>

<input id="owner" placeholder="ชื่อคุณ">
<input id="name" placeholder="ชื่อสินค้า">
<input id="price" placeholder="ราคา/วัน">
<input id="image" placeholder="ลิงก์รูปภาพ">
<textarea id="desc" placeholder="รายละเอียด"></textarea>
<input id="contact" placeholder="LINE / เบอร์">
<button onclick="addItem()">โพสต์สินค้า</button>

<hr>

<h3>🔍 สินค้าทั้งหมด</h3>
<div id="list"></div>

</div>

<script>
let items = JSON.parse(localStorage.getItem("items")) || [];

function addItem(){
  const owner = document.getElementById("owner").value;
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const image = document.getElementById("image").value;
  const desc = document.getElementById("desc").value;
  const contact = document.getElementById("contact").value;
  
  if(!owner || !name || !price){
    alert("กรอกให้ครบ");
    return;
  }

  items.unshift({owner,name,price,image,desc,contact});
  localStorage.setItem("items", JSON.stringify(items));

  render();

  document.querySelectorAll("input, textarea").forEach(el=>el.value="");
}

function deleteItem(i){
  items.splice(i,1);
  localStorage.setItem("items", JSON.stringify(items));
  render();
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  items.forEach((item,i)=>{
    list.innerHTML += `
      <div class="card">
        ${item.image ? `<img src="${item.image}">` : ""}
        <h3>${item.name}</h3>
        <p>${item.desc || ""}</p>
        <b>${item.price} บาท/วัน</b><br>
        <br><br>
        <small>👤 ${item.owner}</small><br>
        <small>📞 ${item.contact || "-"}</small><button onclick="contact('${item.owner}')">ติดต่อ</button>
        <button class="delete" onclick="deleteItem(${i})">ลบ</button>
      </div>
    `;
  });
}

render();
  function contact(owner){
  alert("ติดต่อเจ้าของ: " + owner + "\n(เพิ่ม LINE หรือเบอร์ในขั้นต่อไป)");
}
</script>

</body>
</html>
