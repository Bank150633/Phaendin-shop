<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; --footer-h: 65px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; padding-bottom: 150px; }

        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { text-align: center; padding: 10px 0; }
        .logo-img { height: 35px; }
        
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { height: 165px; display: flex; background: #151515; border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; position: relative; cursor: pointer; }
        .banner-left { width: 45%; background: #000; }
        .banner-left img, .banner-left video { width: 100%; height: 100%; object-fit: cover; }
        .banner-right { width: 55%; padding: 12px; display: flex; flex-direction: column; justify-content: center; }
        .banner-title { color: var(--gold); font-size: 18px; font-weight: 800; }
        .banner-timer { display: flex; gap: 4px; margin: 8px 0; }
        .time-box { background: var(--gold); color: #000; padding: 4px; border-radius: 4px; font-weight: 800; font-size: 13px; min-width: 28px; text-align: center; }

        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; font-family: 'Kanit'; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        main { margin-top: 340px; transition: 0.4s; }
        header.shrunk + main { margin-top: 140px; }
        .section-label { font-size: 13px; color: var(--gold); padding: 15px 12px 8px; font-weight: 600; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .media { width: 100%; aspect-ratio: 1/1; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .price { color: var(--gold); font-size: 18px; font-weight: 700; margin-top: auto; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; padding: 10px; border-radius: 8px; border: none; font-weight: bold; margin-top: 8px; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; padding: 10px; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 380px; padding: 20px; max-height: 90vh; overflow-y: auto; text-align: center; }
        .form-input { width: 100%; padding: 12px; border-radius: 8px; background: #222; border: 1px solid #444; color: #fff; margin-bottom: 10px; font-family: 'Kanit'; }
        .confirm-btn { background: var(--green); color: #fff; width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .confirm-btn:disabled { background: #444; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: var(--footer-h); background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2100; }
        .nav-link { color: #777; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container" id="bannerContent"></div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="status" style="text-align:center; padding:100px 0; color:#555;">กำลังโหลดข้อมูล...</div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-link active"><i class="fa-solid fa-house"></i><div>หน้าหลัก</div></a>
    <a href="javascript:void(0)" onclick="checkTracking()" class="nav-link"><i class="fa-solid fa-truck"></i><div>เช็คพัสดุ</div></a>
    <a href="https://m.me/PhaendinStore" target="_blank" class="nav-link"><i class="fa-solid fa-headset"></i><div>ติดต่อเรา</div></a>
</nav>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold); margin-bottom:15px;">สรุปยอดสั่งซื้อ</h3>
        <div id="summary" style="background:#000; padding:12px; border-radius:10px; text-align:left; margin-bottom:15px; font-size:14px;"></div>
        
        <div style="margin-bottom:15px;">
            <p style="font-size:12px; color:#aaa;">กสิกรไทย: xxx-x-x6762-x (วัชระ ชันสิน)</p>
            <img src="https://i.ibb.co/fVLb9p6B/004999092296200-20260224-144608.jpg" style="width:120px; border:2px solid #fff; border-radius:8px; margin-top:10px;">
        </div>

        <form id="orderForm">
            <input type="text" id="c_name" class="form-input" placeholder="ชื่อ-นามสกุล" required>
            <input type="tel" id="c_phone" class="form-input" placeholder="เบอร์โทรศัพท์" required>
            <textarea id="c_address" class="form-input" rows="2" placeholder="ที่อยู่จัดส่ง" required></textarea>
            
            <div style="border:1px dashed var(--gold); padding:10px; border-radius:8px; margin-bottom:15px; cursor:pointer;" onclick="document.getElementById('slip_input').click()">
                <p id="file_text" style="font-size:12px; color:var(--gold);">คลิกเพื่อแนบรูปสลิป</p>
                <img id="slip_preview" style="display:none; width:100%; margin-top:10px; border-radius:5px;">
            </div>
            <input type="file" id="slip_input" accept="image/*" style="display:none;" onchange="previewFile(this)">
            
            <button type="submit" id="submitBtn" class="confirm-btn">ยืนยันและส่งสลิป</button>
            <p onclick="document.getElementById('orderModal').style.display='none'" style="color:#777; margin-top:15px; cursor:pointer; font-size:13px;">ยกเลิก</p>
        </form>
    </div>
</div>

<script>
    // --- ตั้งค่า URL ตรงนี้ ---
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;
    const APPS_URL = "ใส่_Web_App_URL_ที่นี่"; 

    let dbAll = [], curCat = 'all', curOrder = {};

    async function init() {
        try {
            const res = await fetch(PROD_URL);
            const text = await res.text();
            // กรองเอาเฉพาะสินค้า (แถวที่มีลิงก์รูปภาพ) เพื่อไม่ให้ออเดอร์ลูกค้ามาโชว์
            dbAll = text.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0] && x[1].startsWith('http'));
            
            // ดึงข้อมูล Banner
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const b = textB.split(/\r?\n/).slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^**"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                document.getElementById('bannerContent').innerHTML = `
                    <div class="banner-slide">
                        <div class="banner-left"><img src="${b[0]}"></div>
                        <div class="banner-right">
                            <div class="banner-title">${b[1]}</div>
                            <div class="banner-timer">
                                <div class="time-box">00</div>:<div class="time-box">00</div>:<div class="time-box">00</div>
                            </div>
                            <div style="font-size:10px; background:#fff; color:#000; padding:4px 8px; border-radius:10px; width:fit-content;">ช้อปเลย</div>
                        </div>
                    </div>`;
            }

            document.getElementById('status').style.display = 'none';
            document.getElementById('main-label').style.display = 'block';
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (curCat === 'all' || p[6] === curCat));
        document.getElementById('main-list').innerHTML = filt.map(p => `
            <div class="card">
                <div class="media"><img src="${p[1]}"></div>
                <div class="info">
                    <div class="title" style="font-size:13px; font-weight:600;">${p[0]}</div>
                    <div class="price">฿${p[3]}</div>
                    <button class="buy-btn" onclick="openOrder('${p[0]}','${p[3]}')">สั่งซื้อ</button>
                </div>
            </div>
        `).join('');
        
        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${curCat === c[0] ? 'active' : ''}" onclick="curCat='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function openOrder(name, price) {
        curOrder = { name, price };
        document.getElementById('summary').innerHTML = `<b>รายการ:</b> ${name}<br><b>ยอดโอน:</b> <span style="color:var(--gold); font-size:18px;">฿${price}</span>`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function previewFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('slip_preview').src = e.target.result;
                document.getElementById('slip_preview').style.display = 'block';
                document.getElementById('file_text').innerText = "เลือกรูปแล้ว";
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const fileIn = document.getElementById('slip_input');
        if(fileIn.files.length === 0) return alert("กรุณาแนบสลิปครับ");

        btn.disabled = true;
        btn.innerText = "กำลังส่งข้อมูล...";

        const reader = new FileReader();
        reader.onload = async function() {
            const payload = {
                detail: `สินค้า: ${curOrder.name} | ราคา: ${curOrder.price}`,
                name: document.getElementById('c_name').value,
                phone: document.getElementById('c_phone').value,
                address: document.getElementById('c_address').value,
                file: reader.result.split(',')[1],
                mimeType: fileIn.files[0].type
            };
            try {
                const res = await fetch(APPS_URL, { method: "POST", body: new URLSearchParams(payload) });
                if(await res.text() === "Success") {
                    alert("✅ ส่งข้อมูลสำเร็จ! ข้อมูลถูกบันทึกใน Tab 'Orders' แล้ว");
                    location.reload();
                }
            } catch(err) { alert("เกิดข้อผิดพลาด"); btn.disabled = false; }
        };
        reader.readAsDataURL(fileIn.files[0]);
    });

    async function checkTracking() {
        const phone = prompt("กรุณากรอกเบอร์โทรศัพท์:");
        if (!phone) return;
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Tracking`);
        const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
        const found = rows.find(r => r[0] === phone);
        if(found) alert(`คุณ: ${found[1]}\nขนส่ง: ${found[2]}\nเลขพัสดุ: ${found[3]}`);
        else alert("ไม่พบข้อมูล");
    }

    init();
    window.onscroll = () => { window.scrollY > 40 ? document.getElementById("mainHeader").classList.add("shrunk") : document.getElementById("mainHeader").classList.remove("shrunk"); };
</script>
</body>
</html>
