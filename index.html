<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | THAI MODERN LUXURY</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;400;600&family=Niramit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            /* Thai Tone Palette */
            --thai-indigo: #1A2A44;    /* สีครามเข้ม (Deep Indigo) */
            --thai-gold: #C5A059;      /* สีทองดอกบวบ (Elegant Gold) */
            --thai-stone: #F2F0EB;     /* สีศิลาจืด (Warm Off-White) */
            --thai-clay: #4A3728;      /* สีกินปลี (Earth Brown) */
            --thai-accent: #D94436;    /* สีชาด (Thai Red - สำหรับปุ่ม CTA) */
            --shadow: 0 10px 30px rgba(26, 42, 68, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Niramit', 'Kanit', sans-serif; }
        body { background: var(--thai-stone); color: var(--thai-indigo); padding-bottom: 80px; }

        /* Header หรูหราแบบ Minimal Thai */
        header { 
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(242, 240, 235, 0.9); backdrop-filter: blur(20px); 
            z-index: 1000; border-bottom: 2px solid var(--thai-gold);
            display: flex; justify-content: center; align-items: center;
        }
        .logo-img { height: 45px; filter: sepia(0.2); }

        /* Search Bar ที่ดูแพง */
        .search-wrap { padding: 85px 20px 20px; }
        #search { 
            width: 100%; padding: 15px 20px 15px 50px; border-radius: 50px; 
            border: 1px solid var(--thai-gold); background: #fff; 
            color: var(--thai-indigo); font-size: 14px; outline: none;
            box-shadow: var(--shadow);
        }
        .search-icon { position: absolute; left: 40px; margin-top: 16px; color: var(--thai-gold); }

        /* Banner สไตล์ผ้าไทยประยุกต์ */
        .banner-box { padding: 0 20px; margin-bottom: 25px; }
        .bn-card { 
            border-radius: 30px; overflow: hidden; height: 220px; position: relative;
            box-shadow: var(--shadow); border: 1px solid rgba(197, 160, 89, 0.3);
        }
        .bn-img img { width: 100%; height: 100%; object-fit: cover; }
        .bn-overlay { 
            position: absolute; inset: 0; 
            background: linear-gradient(to right, rgba(26, 42, 68, 0.8), transparent); 
            display: flex; flex-direction: column; justify-content: center; padding: 30px;
        }
        .bn-title { color: var(--thai-gold); font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .bn-sub { color: #fff; font-size: 14px; opacity: 0.9; }

        /* Grid สินค้า - 3 คอลัมน์แบบสะอาดตา */
        .sec-title { padding: 0 25px 15px; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--thai-clay); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 15px; }
        
        .card { 
            background: #fff; border-radius: 20px; overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(197, 160, 89, 0.1);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:active { transform: scale(0.95); }
        .media-wrap { width: 100%; aspect-ratio: 1/1; overflow: hidden; }
        .media-wrap img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 10px 5px; text-align: center; }
        .p-name { font-size: 11px; font-weight: 500; color: var(--thai-clay); margin-bottom: 4px; height: 15px; overflow: hidden; }
        .p-price { font-size: 14px; font-weight: 700; color: var(--thai-indigo); }

        .buy-now { 
            width: 100%; padding: 12px 0; border: none; font-size: 12px; font-weight: 700; 
            background: var(--thai-indigo); color: var(--thai-gold); border-radius: 0 0 20px 20px;
            cursor: pointer; text-transform: uppercase;
        }

        /* Bottom Nav */
        nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px; 
            background: #fff; display: flex; align-items: center;
            border-top: 1px solid var(--thai-gold); box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }
        .nav-tab { flex: 1; text-align: center; color: var(--thai-clay); font-size: 10px; font-weight: 600; opacity: 0.6; }
        .nav-tab.active { color: var(--thai-indigo); opacity: 1; }
        .nav-tab i { font-size: 20px; display: block; margin-bottom: 5px; color: var(--thai-gold); }

        /* Modal หรูหรา */
        .modal-card { 
            background: var(--thai-stone); border-radius: 40px; border: 2px solid var(--thai-gold);
            padding: 30px; width: 90%; max-width: 400px;
        }
        .btn-confirm { 
            background: var(--thai-accent); color: #fff; padding: 15px; border-radius: 50px;
            border: none; width: 100%; font-size: 16px; font-weight: 700; margin-top: 20px;
            box-shadow: 0 10px 20px rgba(217, 68, 54, 0.3);
        }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img">
</header>

<div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="search" placeholder="ค้นพบสิ่งที่คู่ควรกับคุณ..." oninput="render()">
</div>

<div class="banner-box">
    <div class="bn-card">
        <div class="bn-img"><img src="https://i.ibb.co/689L6p1/banner.jpg"></div>
        <div class="bn-overlay">
            <div class="bn-title">เอกลักษณ์แห่งแผ่นดิน</div>
            <div class="bn-sub">คัดสรรความพิเศษเพื่อคุณโดยเฉพาะ</div>
        </div>
    </div>
</div>

<div class="sec-title">เครื่องคัดพิเศษ</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active"><i class="fa-solid fa-crown"></i>หน้าหลัก</div>
    <div class="nav-tab"><i class="fa-solid fa-scroll"></i>รายการ</div>
    <div class="nav-tab"><i class="fa-solid fa-leaf"></i>ช่วยเหลือ</div>
</nav>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    let db = [];

    async function init() {
        try {
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const pRaw = await resP.text();
            db = pRaw.split('\n').slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        document.getElementById('productGrid').innerHTML = db.filter(p => p[0].toLowerCase().includes(q)).map(p => `
            <div class="card">
                <div class="media-wrap"><img src="${p[1]}"></div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[3]||0).toLocaleString()}</div>
                </div>
                <button class="buy-now" onclick="alert('ระบบกำลังเปิดให้บริการ')">เลือกชม</button>
            </div>`).join('');
    }
    init();
</script>
</body>
</html>
