<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --pill: #222; --red: #ff4d4d; --green: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; padding-bottom: 100px; }

        /* --- Header & Search --- */
        header { position: fixed; top: 0; width: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; border-bottom: 1px solid #222; transition: 0.4s; }
        header.shrunk .banner-container { display: none; }
        .logo-row { display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .logo-img { height: 35px; border-radius: 4px; }
        .banner-container { padding: 0 12px 10px; }
        .banner-slide { position: relative; width: 100%; height: 140px; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid var(--gold); }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .banner-text { position: absolute; bottom: 10px; left: 15px; color: #fff; font-size: 14px; font-weight: 600; text-shadow: 2px 2px 4px #000; }
        .nav-container { padding: 0 12px 10px; }
        #search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 8px; outline: none; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .cat-item { font-size: 11px; color: #aaa; padding: 5px 15px; border-radius: 20px; background: var(--pill); white-space: nowrap; cursor: pointer; }
        .cat-item.active { color: #000; background: var(--gold); font-weight: 600; }

        /* --- Content Layout --- */
        main { margin-top: 310px; }
        header.shrunk + main { margin-top: 150px; }
        .section-label { font-size: 12px; color: var(--gold); padding: 15px 15px 8px; font-weight: 600; letter-spacing: 1px; }

        /* --- Recommended (Slider) --- */
        .rec-list { display: flex; gap: 10px; overflow-x: auto; padding: 0 12px 5px; scrollbar-width: none; }
        .rec-card { min-width: 120px; width: 120px; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid #222; background: #111; }
        .rec-media { width: 100%; aspect-ratio: 1/1; cursor: pointer; }
        .rec-media img { width: 100%; height: 100%; object-fit: cover; }
        .rec-price { position: absolute; bottom: 0; width: 100%; background: rgba(212, 175, 55, 0.95); color: #000; font-size: 11px; font-weight: bold; text-align: center; padding: 5px 0; }

        /* --- Product Grid --- */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; border: 1px solid #222; }
        .media { width: 100%; aspect-ratio: 1/1; cursor: pointer; position: relative; }
        .media img, .media video { width: 100%; height: 100%; object-fit: cover; }
        .timer-badge { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 9px; padding: 3px 6px; border-radius: 4px; font-weight: bold; z-index: 10; }
        .info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
        .title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin: 8px 0; margin-top: auto; }
        .price { color: var(--gold); font-size: 17px; font-weight: 700; }
        .price-old { color: #555; font-size: 11px; text-decoration: line-through; }
        .buy-btn { width: 100%; background: var(--gold); color: #000; text-align: center; font-size: 12px; font-weight: 700; padding: 8px; border-radius: 8px; cursor: pointer; }

        /* --- Sticky Footer (Fixed) --- */
        .footer-fixed { position: fixed; bottom: 20px; left: 5%; width: 90%; background: var(--green); color: white; padding: 14px; border-radius: 50px; text-align: center; font-weight: bold; z-index: 2000; box-shadow: 0 4px 20px rgba(0,0,0,0.8); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* --- Modals --- */
        .modal { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .order-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 90%; max-width: 350px; padding: 20px; text-align: center; }
        .summary-box { background: #000; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: left; border-left: 3px solid var(--gold); }
    </style>
</head>
<body>

<header id="mainHeader">
    <div class="logo-row"><img src="https://i.ibb.co/SX2bN2VV/1771066008674-2.jpg" class="logo-img"></div>
    <div class="banner-container">
        <div class="banner-slide">
            <img src="" id="bannerImg" style="display:none;">
            <div class="banner-text" id="bannerTxt">PHAENDIN STORE OFFICIAL</div>
        </div>
    </div>
    <div class="nav-container">
        <input type="text" id="search" placeholder="ค้นหาชื่อสินค้า..." oninput="render()">
        <div class="cat-bar" id="cats"></div>
    </div>
</header>

<main>
    <div id="rec-area" style="display:none;"><div class="section-label">✨ สินค้าแนะนำ</div><div class="rec-list" id="rec-list"></div></div>
    <div id="main-label" class="section-label" style="display:none;">📦 สินค้าทั้งหมด</div>
    <div class="grid" id="main-list"></div>
</main>

<div class="footer-fixed" onclick="document.getElementById('orderModal').style.display='flex'">
    💰 💳 แจ้งโอนเงิน / ยืนยันคำสั่งซื้อ
</div>

<div id="orderModal" class="modal">
    <div class="order-card">
        <h3 style="color:var(--gold)">สรุปยอดชำระ</h3>
        <div id="orderSummary" class="summary-box"></div>
        <a href="https://forms.gle/RnbG77r84NixsEaLA" style="display:block; background:var(--green); color:white; padding:12px; border-radius:8px; text-decoration:none; font-weight:bold;">ส่งหลักฐานการโอน</a>
        <p onclick="document.getElementById('orderModal').style.display='none'" style="margin-top:15px; color:#555; cursor:pointer;">ปิด</p>
    </div>
</div>

<script>
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const PROD_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv`;
    const BANN_URL = `https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`;

    let dbAll = [], dbRec = [], cur = 'all';

    async function load() {
        try {
            // ดึง Banner
            const resB = await fetch(BANN_URL);
            const textB = await resB.text();
            const b = textB.split(/\r?\n/).slice(1).map(r => r.split(',').map(v => v.replace(/"/g,'')));
            if(b[0] && b[0][0]) { 
                document.getElementById('bannerImg').src = b[0][0]; 
                document.getElementById('bannerImg').style.display = 'block';
                if(b[0][1]) document.getElementById('bannerTxt').innerText = b[0][1];
            }

            // ดึงสินค้า
            const resP = await fetch(PROD_URL);
            const textP = await resP.text();
            const raw = textP.split(/\r?\n/).slice(1).map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            
            dbAll = raw;
            dbRec = raw.filter(p => p[5] === 'แนะนำ');
            
            document.getElementById('main-label').style.display = 'block';
            render();
            setInterval(updateTimers, 1000);
        } catch(e) { console.error(e); }
    }

    function render() {
        const q = document.getElementById('search').value.toLowerCase();
        const now = new Date().getTime();

        const getPrices = (p) => {
            const target = p[7] ? new Date(p[7]).getTime() : 0;
            const expired = target > 0 && target < now;
            return {
                sale: (expired || !p[4]) ? p[3] : p[4],
                old: (!expired && p[4]) ? p[3] : null
            };
        };

        // แนะนำ
        if(dbRec.length > 0 && q === "") {
            document.getElementById('rec-area').style.display = 'block';
            document.getElementById('rec-list').innerHTML = dbRec.map(p => {
                const pr = getPrices(p);
                return `<div class="rec-card">
                    <div class="rec-media"><img src="${p[1]}"></div>
                    <div class="rec-price" onclick="openOrder('${p[0]}','${pr.sale}','${p[8]}')">฿${pr.sale}</div>
                </div>`;
            }).join('');
        }

        // ทั้งหมด
        const filt = dbAll.filter(p => p[0].toLowerCase().includes(q) && (cur === 'all' || p[6] === cur));
        document.getElementById('main-list').innerHTML = filt.map(p => {
            const pr = getPrices(p);
            return `<div class="card">
                <div class="media">
                    ${p[7] ? `<div class="timer-badge" data-time="${p[7]}">00:00:00</div>` : ''}
                    <img src="${p[1]}">
                </div>
                <div class="info">
                    <div class="title">${p[0]}</div>
                    <div class="price-row">
                        <span class="price">฿${pr.sale}</span>
                        ${pr.old ? `<span class="price-old">฿${pr.old}</span>` : ''}
                    </div>
                    <div class="buy-btn" onclick="openOrder('${p[0]}','${pr.sale}','${p[8]}')">สั่งซื้อ</div>
                </div>
            </div>`;
        }).join('');

        const cats = [['all','ทั้งหมด'],['1','อาหาร'],['2','ของใช้'],['3','แม่และเด็ก']];
        document.getElementById('cats').innerHTML = cats.map(c => `<span class="cat-item ${cur === c[0] ? 'active' : ''}" onclick="cur='${c[0]}';render()">${c[1]}</span>`).join('');
    }

    function updateTimers() {
        const now = new Date().getTime();
        document.querySelectorAll('.timer-badge').forEach(el => {
            const dist = new Date(el.dataset.time).getTime() - now;
            if (dist < 0) { el.innerHTML = "จบโปรโมชั่น"; el.style.background = "#444"; }
            else {
                const h = Math.floor(dist / 3600000);
                const m = Math.floor((dist % 3600000) / 60000);
                const s = Math.floor((dist % 60000) / 1000);
                el.innerHTML = `⏱️ ${h}:${m}:${s}`;
            }
        });
    }

    function openOrder(n, p, s) {
        const total = parseFloat(p) + (parseFloat(s) || 0);
        document.getElementById('orderSummary').innerHTML = `<b>สินค้า:</b> ${n}<br><b>ยอดที่ต้องโอน: <span style="color:var(--gold); font-size:20px;">฿${total}</span></b><br><small>(รวมค่าส่ง ${s || 0} บาท)</small>`;
        document.getElementById('orderModal').style.display = 'flex';
    }

    load();
    window.onscroll = () => { const h = document.getElementById("mainHeader"); window.scrollY > 40 ? h.classList.add("shrunk") : h.classList.remove("shrunk"); };
</script>
</body>
</html>
