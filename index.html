<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตู้เย็นทำอะไรดี? | PHAENDIN</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Kanit',sans-serif;
    background:#f5f7fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#d71920,#123c8c);
    color:white;
    padding:18px 16px;
    text-align:center;
}

.logo{
    font-size:25px;
    font-weight:700;
}

.logo span{
    color:#ffe500;
}

header p{
    margin-top:4px;
    font-size:14px;
    opacity:.95;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 14px 100px;
}

.hero{
    text-align:center;
    padding:20px 5px;
}

.hero h1{
    font-size:30px;
    font-weight:700;
}

.hero p{
    color:#666;
    margin-top:5px;
}

/* INPUT */

.input-box{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.input-title{
    font-size:18px;
    font-weight:600;
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:100px;
    resize:none;
    border:2px solid #e5e7eb;
    border-radius:14px;
    padding:13px;
    font-family:inherit;
    font-size:16px;
    outline:none;
}

textarea:focus{
    border-color:#123c8c;
}

.example{
    color:#777;
    font-size:13px;
    margin-top:7px;
}

button{
    border:none;
    font-family:inherit;
    cursor:pointer;
}

.find-btn{
    width:100%;
    margin-top:13px;
    padding:14px;
    border-radius:13px;
    background:#d71920;
    color:white;
    font-size:18px;
    font-weight:600;
}

.find-btn:hover{
    opacity:.9;
}

/* RESULTS */

.result-title{
    margin:25px 2px 12px;
    font-size:21px;
    font-weight:600;
}

.result-count{
    font-size:13px;
    color:#777;
    font-weight:400;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.food-img{
    height:145px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
}

.card-body{
    padding:13px;
}

.card h3{
    font-size:18px;
    margin-bottom:5px;
}

.match{
    font-size:13px;
    color:#16803c;
    background:#eaf8ef;
    display:inline-block;
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:8px;
}

.ingredients{
    color:#777;
    font-size:13px;
    line-height:1.5;
}

.cook-btn{
    width:100%;
    margin-top:10px;
    padding:9px;
    border-radius:10px;
    background:#123c8c;
    color:white;
    font-size:14px;
}

/* AD */

.ad{
    margin-top:25px;
    background:white;
    border:1px dashed #bbb;
    border-radius:14px;
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    font-size:13px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:99;
    padding:20px;
}

.modal-box{
    background:white;
    max-width:500px;
    margin:60px auto;
    border-radius:20px;
    padding:20px;
    max-height:80vh;
    overflow:auto;
}

.close{
    float:right;
    font-size:25px;
    cursor:pointer;
}

.modal h2{
    margin-bottom:10px;
}

.modal p{
    line-height:1.7;
    color:#555;
}

.steps{
    margin-top:15px;
}

.steps div{
    background:#f5f7fb;
    padding:10px;
    margin-bottom:7px;
    border-radius:10px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:30px 10px;
    color:#777;
}

/* MOBILE */

@media(max-width:500px){
    .hero h1{
        font-size:26px;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

    .food-img{
        height:160px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">PHAENDIN <span>FOOD</span></div>
    <p>มีอะไรในตู้เย็น บอกเรา เดี๋ยวช่วยคิดเมนูให้ 🍳</p>
</header>

<div class="container">

    <section class="hero">
        <h1>🥘 วันนี้ทำอะไรกินดี?</h1>
        <p>พิมพ์วัตถุดิบที่มีอยู่ในตู้เย็น</p>
    </section>

    <section class="input-box">

        <div class="input-title">
            🧊 ในตู้เย็นมีอะไรบ้าง?
        </div>

        <textarea
            id="ingredients"
            placeholder="เช่น ไข่, หมู, กระเทียม, พริก, หอมใหญ่"
        ></textarea>

        <div class="example">
            💡 ใส่หลายอย่างคั่นด้วยเครื่องหมาย , ได้เลย
        </div>

        <button class="find-btn" onclick="findMenu()">
            🔎 หาเมนูให้ฉัน
        </button>

    </section>

    <div id="results"></div>

    <!-- พื้นที่โฆษณา -->
    <div class="ad">
        พื้นที่โฆษณา
    </div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <span class="close" onclick="closeModal()">×</span>

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <div class="steps" id="modalSteps"></div>

    </div>

</div>


<script>

/* =====================================================
   ฐานข้อมูลเมนูเบื้องต้น
===================================================== */

const menus = [

{
    name:"กะเพราหมู",
    emoji:"🌶️",
    ingredients:["หมู","กระเทียม","พริก","ใบกะเพรา"],
    description:"เมนูง่ายๆ ใช้วัตถุดิบไม่เยอะ เหมาะกับวันที่อยากกินอะไรเร็วๆ",
    steps:[
        "โขลกกระเทียมกับพริก",
        "ตั้งกระทะใส่น้ำมัน",
        "ผัดกระเทียมและพริกให้หอม",
        "ใส่หมูลงไปผัดจนสุก",
        "ปรุงรสตามชอบ",
        "ใส่ใบกะเพราแล้วผัดอีกเล็กน้อย"
    ]
},

{
    name:"ไข่เจียว",
    emoji:"🍳",
    ingredients:["ไข่","น้ำมัน"],
    description:"เมนูพื้นฐาน ทำง่ายและใช้เวลาน้อย",
    steps:[
        "ตอกไข่ใส่ชาม",
        "ตีไข่ให้เข้ากัน",
        "ปรุงรสตามชอบ",
        "ตั้งกระทะใส่น้ำมัน",
        "เทไข่ลงทอดจนเหลืองกรอบ"
    ]
},

{
    name:"ข้าวผัดหมู",
    emoji:"🍚",
    ingredients:["ข้าว","หมู","ไข่","กระเทียม"],
    description:"ใช้ข้าวที่เหลือจากมื้อก่อนมาทำเป็นเมนูใหม่ได้",
    steps:[
        "ตั้งกระทะใส่น้ำมัน",
        "ผัดกระเทียมให้หอม",
        "ใส่หมูลงผัด",
        "ใส่ไข่แล้วยีให้พอสุก",
        "ใส่ข้าวลงผัด",
        "ปรุงรสตามชอบ"
    ]
},

{
    name:"ผัดผักรวม",
    emoji:"🥦",
    ingredients:["ผัก","กระเทียม","น้ำมัน"],
    description:"เหมาะสำหรับใช้ผักหลายชนิดที่เหลืออยู่ในตู้เย็น",
    steps:[
        "ล้างและหั่นผัก",
        "ตั้งกระทะใส่น้ำมัน",
        "ผัดกระเทียมให้หอม",
        "ใส่ผักลงไป",
        "ปรุงรส",
        "ผัดจนผักสุกตามชอบ"
    ]
},

{
    name:"ต้มจืดไข่",
    emoji:"🍲",
    ingredients:["ไข่","หมู","ผัก"],
    description:"เมนูซุปร้อนๆ ทำง่ายและกินได้ทั้งครอบครัว",
    steps:[
        "ต้มน้ำให้เดือด",
        "ใส่หมูลงไป",
        "ใส่ผัก",
        "ปรุงรส",
        "ตอกไข่ลงไป",
        "ต้มจนไข่สุก"
    ]
},

{
    name:"หมูทอดกระเทียม",
    emoji:"🥩",
    ingredients:["หมู","กระเทียม","น้ำมัน"],
    description:"เมนูง่ายๆ ที่เข้ากับข้าวสวยร้อนๆ",
    steps:[
        "หมักหมูกับเครื่องปรุง",
        "เจียวกระเทียมให้เหลือง",
        "นำกระเทียมพักไว้",
        "ทอดหมูจนสุก",
        "โรยกระเทียมเจียวก่อนเสิร์ฟ"
    ]
},

{
    name:"ผัดพริกแกงหมู",
    emoji:"🌶️",
    ingredients:["หมู","พริกแกง","ถั่วฝักยาว"],
    description:"เมนูรสจัดสำหรับคนชอบอาหารไทย",
    steps:[
        "ตั้งกระทะใส่น้ำมัน",
        "ผัดพริกแกงให้หอม",
        "ใส่หมูลงผัด",
        "ใส่ถั่วฝักยาว",
        "ปรุงรส",
        "ผัดจนทุกอย่างสุก"
    ]
},

{
    name:"ไข่ดาว",
    emoji:"🍳",
    ingredients:["ไข่","น้ำมัน"],
    description:"เมนูเร็วที่สุดสำหรับวันที่ไม่อยากทำอาหารเยอะ",
    steps:[
        "ตั้งกระทะใส่น้ำมัน",
        "ตอกไข่ลงกระทะ",
        "ทอดจนไข่ขาวสุก",
        "ตักใส่จาน"
    ]
}

];


/* =====================================================
   ค้นหาเมนู
===================================================== */

function findMenu(){

    const input =
        document.getElementById("ingredients")
        .value
        .toLowerCase()
        .trim();

    const results =
        document.getElementById("results");

    if(!input){

        results.innerHTML = `
            <div class="empty">
                🧊 ลองบอกเราก่อนว่าในตู้เย็นมีอะไร
            </div>
        `;

        return;
    }

    const userIngredients =
        input
        .split(",")
        .map(x => x.trim())
        .filter(x => x);

    const matchedMenus = menus
        .map(menu => {

            let matches = 0;

            menu.ingredients.forEach(item => {

                userIngredients.forEach(userItem => {

                    if(
                        userItem.includes(item) ||
                        item.includes(userItem)
                    ){
                        matches++;
                    }

                });

            });

            return {
                ...menu,
                matches:matches
            };

        })
        .filter(menu => menu.matches > 0)
        .sort((a,b) => b.matches - a.matches);


    if(matchedMenus.length === 0){

        results.innerHTML = `
            <div class="empty">
                😅 ยังหาเมนูที่ตรงไม่เจอ
                <br>
                ลองเพิ่มวัตถุดิบอีกนิด เช่น ไข่, หมู, ผัก
            </div>
        `;

        return;
    }


    let html = `

        <div class="result-title">
            🍽️ เมนูที่ทำได้
            <span class="result-count">
                พบ ${matchedMenus.length} เมนู
            </span>
        </div>

        <div class="menu-grid">
    `;


    matchedMenus.forEach(menu => {

        html += `

            <div class="card">

                <div class="food-img">
                    ${menu.emoji}
                </div>

                <div class="card-body">

                    <h3>${menu.name}</h3>

                    <div class="match">
                        ✓ ตรงกับ ${menu.matches} วัตถุดิบ
                    </div>

                    <div class="ingredients">
                        ใช้: ${menu.ingredients.join(", ")}
                    </div>

                    <button
                        class="cook-btn"
                        onclick="showRecipe('${menu.name}')"
                    >
                        👨‍🍳 ดูวิธีทำ
                    </button>

                </div>

            </div>

        `;

    });


    html += `</div>`;

    results.innerHTML = html;

}


/* =====================================================
   เปิดสูตร
===================================================== */

function showRecipe(name){

    const menu =
        menus.find(x => x.name === name);

    if(!menu) return;

    document.getElementById("modalTitle").innerText =
        menu.emoji + " " + menu.name;

    document.getElementById("modalDescription").innerText =
        menu.description;


    let stepsHTML = "";

    menu.steps.forEach((step,index) => {

        stepsHTML += `
            <div>
                <b>${index+1}.</b> ${step}
            </div>
        `;

    });

    document.getElementById("modalSteps").innerHTML =
        stepsHTML;

    document.getElementById("modal").style.display =
        "block";

}


function closeModal(){

    document.getElementById("modal").style.display =
        "none";

}


window.onclick = function(event){

    const modal =
        document.getElementById("modal");

    if(event.target === modal){

        modal.style.display = "none";

    }

}

</script>

</body>
</html>
