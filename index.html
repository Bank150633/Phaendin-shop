<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN | CURATED SELECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --thai-blue: #00247d; /* น้ำเงินธงชาติ */
            --thai-red: #d32f2f;  /* แดงธงชาติ */
            --white: #ffffff;
            --gold: #D4AF37; 
            --bg: #f4f4f4; /* ปรับพื้นหลังให้ออกขาวสว่างเพื่อให้สีน้ำเงินแดงเด่น */
            --card: #ffffff; 
            --text: #333333; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-top: 60px; padding-bottom: 60px; }

        header { 
            position: fixed; top: 0; width: 100%; 
            background: var(--thai-blue); 
            z-index: 1000; padding: 10px; 
            border-bottom: 3px solid var(--thai-red); 
            display: flex; justify-content: center; align-items: center; height: 60px; 
        }
        .logo-img { height: 40px; }

        /* ปุ่มเลือกการชำระเงินสไตล์ไทยประยุกต์ */
        .pay-toggle-container {
            display: flex; gap: 10px; margin: 15px 0;
        }
        .pay-btn {
            flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #ccc;
            background: #fff; cursor: pointer; font-weight: bold; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .pay-btn.active-blue { border-color: var(--thai-blue); background: #e3f2fd; color: var(--thai-blue); }
        .pay-btn.active-red { border-color: var(--thai-red); background: #ffebee; color: var(--thai-red); }

        /* กล่องข้อมูลผ่อน */
        #installmentBox {
            display: none; background: #fff; border: 1.5px solid var(--thai-blue);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .buy-now-btn {
            width: 100%; background: var(--thai-red); color: #fff; 
            padding: 15px; border: none; border-radius: 10px; 
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #b71c1c; transition: 0.2s;
        }
        .buy-now-btn:active { transform: translateY(3px); box-shadow: none; }
        .buy-now-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* สไตล์ฟอร์ม */
        .input-group { margin-bottom: 10px; }
        .input-slim { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 8px; font-size: 14px; outline: none; 
        }
        .input-slim:focus { border-color: var(--thai-blue); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; align-items: center; justify-content: center; padding: 10px; }
        .modal-card { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" class="logo-img">
</header>

<main id="productGrid" class="grid" style="padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></main>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h3 style="color: var(--thai-blue); text-align: center; margin-bottom: 15px;">🛒 ยืนยันการสั่งซื้อ</h3>
        
        <div id="orderSummary" style="background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 14px;"></div>

        <div class="pay-toggle-container">
            <div id="btnCash" class="pay-btn active-blue" onclick="setPayment('cash')">
                <i class="fa-solid fa-money-bill-1"></i>
                <span>ซื้อสด (ส่งฟรี)</span>
            </div>
            <div id="btnInstall" class="pay-btn" onclick="setPayment('installment')">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>ผ่อนไปใช้ไป</span>
            </div>
        </div>

        <div id="installmentBox">
            <h5 style="color: var(--thai-blue); margin-bottom: 8px;">📋 ตารางการผ่อน (3 งวด)</h5>
            <div id="planDetail" style="font-size: 13px; line-height: 1.8;"></div>
            <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button type="button" onclick="getLocation()" class="input-slim" style="background: #e3f2fd; color: #1976d2; border: 1px solid #1976d2;">📍 ปักหมุด GPS</button>
                <button type="button" onclick="document.getElementById('selfieIn').click()" class="input-slim" style="background: #fff3e0; color: #e65100; border: 1px solid #e65100;">📸 ถ่ายเซลฟี่</button>
            </div>
            <input type="hidden" id="userGPS">
            <input type="file" id="selfieIn" style="display:none" accept="image/*">
        </div>

        <div class="input-group">
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" class="input-slim" oninput="validateForm()">
        </div>
        <div class="input-group">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์ (10 หลัก)" class="input-slim" oninput="validateForm()">
        </div>
        <div class="input-group">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่งโดยละเอียด" class="input-slim" style="height: 70px;" oninput="validateForm()"></textarea>
        </div>

        <div id="lineBox" style="display:none; margin: 10px 0; padding: 10px; background: #e8f5e9; border-radius: 8px; border: 1px dashed #2e7d32;">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; cursor: pointer;">
                <input type="checkbox" id="lineAccept" onchange="validateForm()"> 
                <span><b>[บังคับ]</b> ยอมรับการแจ้งเตือนผ่าน Line OA</span>
            </label>
        </div>

        <button id="submitBtn" class="buy-now-btn" onclick="submitOrder()" disabled>ยืนยันการสั่งซื้อ</button>
        <p onclick="closeModal('orderModal')" style="text-align: center; color: #888; font-size: 12px; margin-top: 15px; cursor: pointer;">[ ยกเลิก ]</p>
    </div>
</div>

<script>
    let currentMode = 'cash';
    let activePrice = 0;

    // ระบบเลือกประเภทการชำระเงิน (สลับหน้าจอ)
    function setPayment(mode) {
        currentMode = mode;
        const instBox = document.getElementById('installmentBox');
        const lineBox = document.getElementById('lineBox');
        const btnCash = document.getElementById('btnCash');
        const btnInstall = document.getElementById('btnInstall');

        if (mode === 'cash') {
            instBox.style.display = 'none';
            lineBox.style.display = 'none'; // ซ่อนช่อง Line OA ทันที
            btnCash.classList.add('active-blue');
            btnInstall.classList.remove('active-red');
        } else {
            instBox.style.display = 'block';
            lineBox.style.display = 'block'; // โชว์ช่อง Line OA สำหรับคนผ่อน
            btnInstall.classList.add('active-red');
            btnCash.classList.remove('active-blue');
            calculateInstallment();
        }
        validateForm();
    }

    function calculateInstallment() {
        const totalWithFee = Math.round(activePrice * 1.2); // บวก 20%
        const perMonth = Math.round(totalWithFee / 3);
        document.getElementById('planDetail').innerHTML = `
            🔹 งวดที่ 1 (วันนี้): <b>฿${perMonth.toLocaleString()}</b><br>
            🔹 งวดที่ 2 (เดือนถัดไป): <b>฿${perMonth.toLocaleString()}</b><br>
            🔹 งวดที่ 3 (เดือนสุดท้าย): <b>฿${perMonth.toLocaleString()}</b><br>
            <small style="color:red">*รวมยอดผ่อนทั้งสิ้น ฿${totalWithFee.toLocaleString()}</small>
        `;
    }

    function validateForm() {
        const name = document.getElementById('cName').value.trim();
        const phone = document.getElementById('cPhone').value.trim();
        const addr = document.getElementById('cAddr').value.trim();
        const lineChecked = document.getElementById('lineAccept').checked;
        const btn = document.getElementById('submitBtn');

        let isValid = name.length > 3 && phone.length === 10 && addr.length > 10;
        
        if (currentMode === 'installment') {
            isValid = isValid && lineChecked; // ถ้าผ่อน ต้องติ๊ก Line ด้วย
        }

        btn.disabled = !isValid;
    }

    // ระบบ GPS
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('userGPS').value = `${pos.coords.latitude},${pos.coords.longitude}`;
                alert("✅ ปักหมุดตำแหน่งสำเร็จ!");
            });
        }
    }

    async function submitOrder() {
        const btn = document.getElementById('submitBtn');
        btn.innerText = "กำลังประมวลผล...";
        btn.disabled = true;

        // Logic ส่งข้อมูลเข้า App Script เดิมของพี่
        const formData = {
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            address: document.getElementById('cAddr').value,
            payType: currentMode === 'cash' ? 'ซื้อสด' : 'ผ่อนชำระ',
            gps: document.getElementById('userGPS').value
        };

        // แสดงผลสำเร็จ
        alert("✅ สั่งซื้อเรียบร้อย! ขอบคุณที่อุดหนุน Phaendin Store ครับ");
        location.reload();
    }

    // ฟังก์ชันเปิด Modal (จำลองจากระบบเดิมของพี่)
    function openOrder(name, price) {
        activePrice = price;
        document.getElementById('orderSummary').innerText = `สินค้า: ${name} | ราคา: ฿${price.toLocaleString()}`;
        document.getElementById('orderModal').style.display = 'flex';
        setPayment('cash');
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
