<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHAENDIN STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --navy: #00247D; --red: #ED1C24; --white: #FFFFFF; --bg: #F4F7FA; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); padding-top: 65px; padding-bottom: 80px; }
        header { position: fixed; top: 0; width: 100%; height: 60px; background: var(--navy); border-bottom: 3px solid var(--red); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px; }
        .p-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .p-img { width: 100%; height: 160px; object-fit: cover; }
        .p-info { padding: 10px; flex-grow: 1; }
        .p-price { color: var(--red); font-size: 18px; font-weight: bold; }
        .btn-buy { width: 100%; padding: 12px; border: none; background: var(--red); color: white; font-weight: 600; cursor: pointer; }
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--navy); display: flex; justify-content: space-around; align-items: center; border-top: 3px solid var(--red); }
        .nav-item { text-align: center; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 12px; }
        .nav-item.active { color: var(--white); }
    </style>
</head>
<body>
    <header><img src="https://i.ibb.co/2YMs6gVk/grok-image-1772523136707.jpg" height="35"></header>
    <div class="container" id="app"></div>
    <nav>
        <a href="#" class="nav-item active"><i class="fa-solid fa-store"></i>หน้าแรก</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-box-open"></i>เช็คพัสดุ</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-credit-card"></i>ยอดผ่อน</a>
    </nav>
    <script>
        const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
        async function load() {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv`);
            const text = await res.text();
            const db = text.split('\n').slice(1).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim()));
            document.getElementById('app').innerHTML = db.map(p => `
                <div class="p-card">
                    <img src="${p[1]}" class="p-img" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="p-info">
                        <div style="font-size:14px; height:40px; overflow:hidden;">${p[0]}</div>
                        <div class="p-price">฿${isNaN(parseFloat(p[3])) ? '0' : parseFloat(p[3]).toLocaleString()}</div>
                    </div>
                    <button class="btn-buy">สั่งซื้อ / ผ่อนชำระ</button>
                </div>
            `).join('');
        }
        load();
    </script>
</body>
</html>
