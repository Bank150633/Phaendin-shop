<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHAENDIN STORE | CINEMATIC V10</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-grad: linear-gradient(145deg, #f5d76e 0%, #d4af37 50%, #b8860b 100%);
            --bg: #0A0A0A; --card: #141414; --text: #FFFFFF; --text-dim: #BBBBBB; --input-bg: #1A1A1A; 
        }
        body.light-mode {
            --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; --text-dim: #636366; --input-bg: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-top: 60px; padding-bottom: 65px; transition: 0.3s; overflow-x: hidden; }

        /* Header - ปรับให้สูงขึ้นเล็กน้อยและดูสะอาดตา */
        header { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 12px 15px; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .header-wrap { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .brand-name { color: var(--gold); font-weight: 600; font-size: 16px; letter-spacing: 1px; }

        /* Banner - Cinematic Style (เพิ่มขอบจอหนัง) */
        .banner-box { padding: 10px 15px; margin-bottom: 5px; } /* เพิ่ม Padding รอบเพื่อให้เห็นขอบ */
        .bn-card { 
            position: relative; width: 100%; height: 160px; background: #000; overflow: hidden; 
            border-radius: 12px; /* ขอบมนเหมือนจอสมัยใหม่ */
            border-top: 4px solid #000; border-bottom: 4px solid #000; /* ขอบดำบน-ล่างแบบจอหนัง */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 10px rgba(212,175,55,0.1);
        }
        .bn-img { width: 100%; height: 100%; cursor: pointer; }
        .bn-img img, .bn-img video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        
        /* ข้อความบนแบนเนอร์ - จัดวางให้เหมือนซับไตเติ้ลหนัง */
        .bn-txt { 
            position: absolute; inset: 0; padding: 20px; display: flex; flex-direction: column; 
            justify-content: flex-end; align-items: center; text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%);
        }
        .bn-title { font-size: 16px; font-weight: 600; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .bn-timer { 
            display: flex; gap: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,0.6);
            padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .bn-btn { margin-top: 12px; background: var(--gold-grad); border: none; padding: 6px 20px; font-size: 11px; font-weight: 700; border-radius: 20px; color: #000; cursor: pointer; }

        /* ย้ายช่องค้นหาลงมาใต้แบนเนอร์แทน */
        .search-container { padding: 5px 15px 15px; max-width: 600px; margin: 0 auto; }
        .search-wrap { position: relative; width: 100%; }
        #search { width: 100%; padding: 10px 15px 10px 40px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.3); background: var(--card); color: var(--text); font-size: 13px; outline: none; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }

        /* Grid - 3 คอลัมน์ */
        .sec-title { padding: 10px 15px 5px; font-size: 13px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 15px 15px; }
        
        /* สินค้า */
        .card { background: var(--card); border: 1px solid rgba(212,175,55,0.1); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .media-wrap { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 8px 5px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; gap: 3px; }
        .p-name { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-desc { font-size: 9px; color: var(--text-dim); height: 22px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-size: 13px; font-weight: 700; color: #fff; margin-top: auto; }
        .buy-now { width: 100%; background: var(--gold-grad); color: #000; border: none; padding: 10px 0; font-weight: 700; font-size: 11px; cursor: pointer; }

        /* Nav */
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.95); display: flex; border-top: 1px solid rgba(212,175,55,0.2); z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); font-size: 10px; }
        .nav-tab.active { color: var(--gold); }
        .nav-tab i { font-size: 18px; margin-bottom: 4px; }

        /* Modal ทั่วไป */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: 0.3s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-card { background: #111; border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 320px; padding: 20px; }
    </style>
</head>
<body>

<header>
    <div class="header-wrap">
        <div class="brand-name">PHAENDIN STORE</div>
        <button class="theme-btn" onclick="toggleTheme()" style="background:none; color:var(--gold); border:none; font-size:18px;"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </div>
</header>

<div class="banner-box" id="banner"></div>

<div class="search-container">
    <div class="search-wrap">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="search" placeholder="ค้นหาเมนูอร่อย..." oninput="render()">
    </div>
</div>

<div class="sec-title"><i class="fa-solid fa-star"></i> แนะนำวันนี้</div>
<main class="grid" id="productGrid"></main>

<nav>
    <div class="nav-tab active" onclick="location.reload()"><i class="fa-solid fa-utensils"></i> หน้าแรก</div>
    <div class="nav-tab" onclick="checkShip()"><i class="fa-solid fa-box"></i> เช็คพัสดุ</div>
    <div class="nav-tab" onclick="openModal('contactModal')"><i class="fa-solid fa-phone"></i> ติดต่อ</div>
</nav>

<div id="contactModal" class="modal">
    <div class="modal-card" style="text-align:center;">
        <h3 style="color:var(--gold); margin-bottom:20px;">ติดต่อเรา</h3>
        <a href="tel:0944159031" style="display:block; background:#28a745; color:#fff; padding:12px; border-radius:10px; text-decoration:none; margin-bottom:10px;">โทรสายด่วน</a>
        <p onclick="closeModal('contactModal')" style="color:#666; cursor:pointer; margin-top:15px;">ปิด</p>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-card">
        <h4 style="color:var(--gold); text-align:center; margin-bottom:15px;">ยืนยันการสั่งซื้อ</h4>
        <div id="orderDetail" style="font-size:12px; background:#1a1a1a; padding:12px; border-radius:10px; margin-bottom:15px; border-left:4px solid var(--gold);"></div>
        <form id="orderForm">
            <input type="text" id="cName" placeholder="ชื่อ-นามสกุล" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; background:#222; border:1px solid #333; color:#fff;">
            <input type="tel" id="cPhone" placeholder="เบอร์โทรศัพท์" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; background:#222; border:1px solid #333; color:#fff;">
            <textarea id="cAddr" placeholder="ที่อยู่จัดส่ง" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; background:#222; border:1px solid #333; color:#fff; height:60px;"></textarea>
            <button type="submit" id="submitBtn" class="buy-now" style="border-radius:8px;">สั่งซื้อเลย</button>
            <p onclick="closeModal('orderModal')" style="text-align:center; color:#666; cursor:pointer; margin-top:15px;">ยกเลิก</p>
        </form>
    </div>
</div>

<script>
    // สคริปต์การทำงานคงเดิมจากเวอร์ชันที่แล้ว แต่ปรับแก้การแสดงผล Banner ให้ไม่มีคำว่า ค้นหา
    const S_ID = '14bgucoSdLmBEd3HeMGAmhb4bSwQ0JplYRvOWGbJsp2Y';
    const APPS_URL = 'https://script.google.com/macros/s/AKfycbw3qMiabmL5xQqU5rKcYuRapRSm_-aQvJ0EqKoCTX9dYXy1ongtzetK2jKvhhU0pU3gfw/exec';
    let db = [], activeP = {}, bannerEnd = null;

    async function init() {
        try {
            const resB = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=Banner`);
            const b = (await resB.text()).split('\n').slice(1)[0]?.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim());
            if(b) {
                bannerEnd = new Date(b[2]).getTime();
                document.getElementById('banner').innerHTML = `
                    <div class="bn-card">
                        <div class="bn-img">${renderMedia(b[0], true)}</div>
                        <div class="bn-txt">
                            <div class="bn-title">${b[1]}</div>
                            <div class="bn-timer">⏳ <span id="th">00</span>:<span id="tm">00</span>:<span id="ts">00</span></div>
                            <button class="bn-btn" onclick="openOrder('${b[1]}',0,0,'')">สั่งซื้อโปรโมชั่น</button>
                        </div>
                    </div>`;
                setInterval(tick, 1000);
            }
            const resP = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/export?format=csv&gid=0`);
            const rows = (await resP.text()).split('\n').slice(1);
            db = rows.map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').trim())).filter(x => x[0]);
            render();
        } catch(e) { console.error(e); }
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = db.filter(p => p[0].toLowerCase().includes(query));
        document.getElementById('productGrid').innerHTML = filtered.map(p => `
            <div class="card">
                <div class="media-wrap">${renderMedia(p[1], true)}</div>
                <div class="info">
                    <div class="p-name">${p[0]}</div>
                    <div class="p-price">฿${parseFloat(p[3]).toLocaleString()}</div>
                </div>
                <button class="buy-now" onclick="openOrder('${p[0]}','${p[3]}','${p[8]||0}','${p[9]||''}')">สั่งซื้อ</button>
            </div>`).join('');
    }

    function renderMedia(url, isMuted) {
        if(!url) return '';
        const isVid = url.match(/\.(mp4|webm|mov)$/i);
        return isVid ? `<video src="${url}" ${isMuted ? 'autoplay loop muted playsinline' : 'controls autoplay'}></video>` : `<img src="${url}">`;
    }

    function openOrder(n, p, s, optStr) {
        activeP = { name: n, basePrice: parseFloat(p), ship: parseFloat(s), currentPrice: parseFloat(p) };
        document.getElementById('orderDetail').innerHTML = `🛒 ${activeP.name}<br>💰 ยอดรวม: ฿${(activeP.currentPrice + activeP.ship).toLocaleString()}`;
        openModal('orderModal');
    }

    function tick() {
        if(!bannerEnd) return;
        const d = bannerEnd - Date.now();
        if(d > 0) {
            document.getElementById('th').innerText = Math.floor(d/3600000).toString().padStart(2,'0');
            document.getElementById('tm').innerText = Math.floor((d%3600000)/60000).toString().padStart(2,'0');
            document.getElementById('ts').innerText = Math.floor((d%60000)/1000).toString().padStart(2,'0');
        }
    }
    function openModal(id) { const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'),10); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none', 300); }
    init();
</script>
</body>
</html>
